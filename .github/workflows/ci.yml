name: CI

# Runs on pushes and on pull requests, including PRs from forks. It uses the `pull_request` event (never
# `pull_request_target`), needs no repository secrets and gets a read-only token, so fork PRs run safely.
# Actions are pinned to full commit SHAs (Dependabot keeps them current).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Runtime dependencies have no known vulnerabilities
        run: npm audit --omit=dev
      - name: Lockfile resolves only from registry.npmjs.org over HTTPS, with integrity hashes
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const bad = [];
            for (const [path, p] of Object.entries(lock.packages ?? {})) {
              if (!path || p.link) continue;
              if (!p.resolved || !p.resolved.startsWith("https://registry.npmjs.org/")) bad.push(`${path}: resolved ${p.resolved}`);
              if (!p.integrity || !p.integrity.startsWith("sha512-")) bad.push(`${path}: integrity ${p.integrity}`);
            }
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
            console.log("lockfile ok");
          '
      - name: Production dependencies are pinned to exact versions
        run: node -e 'const d = require("./package.json").dependencies; const loose = Object.entries(d).filter(([, v]) => !/^\d+\.\d+\.\d+$/.test(v)); if (loose.length) { console.error(loose); process.exit(1); }'
      - name: Typecheck
        run: npm run typecheck
      - name: Syntax check (node --check on every .mjs)
        run: node scripts/check-mjs.mjs
      - name: Generated files are in sync (endpoint pages, llms files, search index)
        run: npm run docs:check
      - name: Tests with coverage
        run: npx vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=lcov
        env:
          TZ: UTC
      - name: Node SDK tests (including the integration test against the real routes)
        run: npm test --prefix sdk/node
      - name: Smoke test (start, /v1/health, stop)
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          echo '{"server":{"port":4399},"dataDir":"'"$RUNNER_TEMP"'/smoke/data","logging":{"level":"warn"}}' > "$RUNNER_TEMP/smoke/bridge.config.json"
          node bin/mc-bridge.mjs start --config "$RUNNER_TEMP/smoke/bridge.config.json" &
          pid=$!
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4399/v1/health && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:4399/v1/health | grep -q '"status":"ok"'
          kill -TERM "$pid"
          wait "$pid" || true
      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  python-sdk:
    name: Python SDK ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"] # pyproject.toml declares 3.9 to 3.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci   # the Python tests run against the Node fake server, which needs `ws`
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install ./sdk/python
      - name: pytest
        run: python -m pytest sdk/python/tests -q

  # The whole suite with the clock moved forward: a test with a hidden date (a hard-coded expiry, a key that "expires in a
  # week") goes red here the week it is written, not months later for someone else. See scripts/test-future.mjs.
  future-clock:
    name: Tests with the clock 100 days ahead
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:future -- 100
        env:
          TZ: UTC
