name: Changelog

# A pull request that changes server/, docs/openapi.yaml or sdk/ needs a new line under "Unreleased" in CHANGELOG.md
# (scripts/changelog-check.mjs). Uses the `pull_request` event only, needs no secrets and has a read-only token.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Release note
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/changelog-check.mjs
