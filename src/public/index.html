<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Bridge — Mr. Chartist</title>
  <meta name="description" content="Unified multi-broker API bridge for the Mr. Chartist trading ecosystem — SEBI Registered RA" />
  <meta name="author" content="Rohit Singh (Mr. Chartist)" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌉</text></svg>" />
</head>
<body>
  <div class="app">

    <div class="sb-overlay" id="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <div class="sb-logo">MC</div>
        <div>
          <div class="sb-title">API Bridge</div>
          <div class="sb-sub">Mr. Chartist</div>
        </div>
      </div>

      <nav class="sb-nav">
        <div class="sb-section">
          <div class="sb-label">Overview</div>
          <a class="sb-item active" data-page="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
          </a>
          <a class="sb-item" data-page="health">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            Health Monitor
          </a>
        </div>

        <div class="sb-section">
          <div class="sb-label">Trading</div>
          <a class="sb-item" data-page="positions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
            Positions
          </a>
          <a class="sb-item" data-page="orders">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
            Order Book
          </a>
          <a class="sb-item" data-page="trades">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
            Trade Book
          </a>
          <a class="sb-item" data-page="holdings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
            Holdings
          </a>
          <a class="sb-item" data-page="funds">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
            Funds
          </a>
        </div>

        <div class="sb-section">
          <div class="sb-label">Market Data</div>
          <a class="sb-item" data-page="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            Symbol Search
          </a>
          <a class="sb-item" data-page="optionchain">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Option Chain
          </a>
          <a class="sb-item" data-page="websocket">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            WebSocket Test
          </a>
        </div>

        <div class="sb-section">
          <div class="sb-label">Developer</div>
          <a class="sb-item" data-page="api">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            API Explorer
          </a>
        </div>
      </nav>

      <div class="sb-foot">
        <div class="broker-pill">
          <span class="dot" id="brokerDot"></span>
          <span id="brokerName" style="color: var(--text-secondary);">Connecting...</span>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('on');">☰</button>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <span class="version-badge">v1.0.0</span>
        </div>
      </div>

      <div class="content" id="pageContainer"></div>
    </main>

  </div>

  <script src="/js/app.js"></script>
</body>
</html>
