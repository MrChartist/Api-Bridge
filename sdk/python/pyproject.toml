[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mrchartist-bridge"
version = "0.1.0"
description = "Python client for the Mr. Chartist API Bridge: market data, paper and live orders with idempotency keys, and live streams."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Mr. Chartist" }]
keywords = ["trading", "india", "broker", "nse", "market-data", "option-chain", "websocket", "sdk"]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MrChartist/api-bridge-v2"
Documentation = "https://github.com/MrChartist/api-bridge-v2/tree/main/sdk/python#readme"
Source = "https://github.com/MrChartist/api-bridge-v2"
Issues = "https://github.com/MrChartist/api-bridge-v2/issues"
Changelog = "https://github.com/MrChartist/api-bridge-v2/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["mrchartist_bridge"]

[tool.setuptools.package-data]
mrchartist_bridge = ["py.typed"]
