[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mrchartist-bridge"
version = "0.3.0"
description = "Python library for the Mr. Chartist API Bridge: typed market data with freshness labels, safe paper-first orders, live streams, asyncio, downloads, recordings, collections, events and pandas helpers. Standard library only (pandas and pyarrow are optional)."
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-MrChartist-EULA"
license-files = ["LICENSE"]
authors = [{ name = "Mr. Chartist" }]
keywords = ["trading", "india", "broker", "nse", "market-data", "option-chain", "websocket", "sdk", "paper-trading", "asyncio"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]

[project.optional-dependencies]
# The core needs nothing: HTTP, the WebSocket client and the asyncio client are all standard library.
pandas = ["pandas>=1.5"]
# Optional Parquet output (frames.to_parquet, history_all(...).to_parquet). Nothing else needs it.
parquet = ["pyarrow>=12"]
# Reserved names. Streaming (sync and asyncio) and AsyncBridge work without any extra today; these keep
# `pip install "mrchartist-bridge[stream]"` and `[async]` valid in scripts and requirements files.
stream = []
async = []
all = ["pandas>=1.5", "pyarrow>=12"]
dev = ["pytest>=7", "pandas>=1.5"]

[project.scripts]
mrchartist-bridge = "mrchartist_bridge.__main__:_cli"

[project.urls]
Homepage = "https://github.com/MrChartist/api-bridge-v2"
Documentation = "https://github.com/MrChartist/api-bridge-v2/tree/main/sdk/python#readme"
Source = "https://github.com/MrChartist/api-bridge-v2"
Issues = "https://github.com/MrChartist/api-bridge-v2/issues"
Changelog = "https://github.com/MrChartist/api-bridge-v2/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["mrchartist_bridge"]

[tool.setuptools.package-data]
mrchartist_bridge = ["py.typed"]

[tool.pytest.ini_options]
markers = [
  "integration: runs against a real demo-mode Bridge started as a Node subprocess (skipped when Node or the Bridge is not available)",
]
