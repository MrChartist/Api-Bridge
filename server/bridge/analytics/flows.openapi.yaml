  /v1/analytics/fii-dii:
    get:
      tags: [Analytics]
      operationId: getAnalyticsFiiDii
      summary: FII and DII cash-market buy, sell and net (INR crore), rolling sums and net-flow streak
      description: From the NSE public site (meta.source is "nse", meta.fetchedAt is the fetch time). NSE publishes one session per call, so history builds up in the Bridge; meta.available says how many sessions it holds. Cached for five minutes.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: days, in: query, description: Sessions to return, newest first., schema: { type: integer, minimum: 1, maximum: 60, default: 10 } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
