  /v1/analytics/expiry-day:
    get:
      tags: [Analytics]
      operationId: getAnalyticsExpiryDay
      summary: Expiry-day digest (time to expiry, ATM straddle, max pain, OI walls, gamma regime, flags)
      description: Uses the nearest upcoming expiry unless expiry is given. Time to expiry counts to 15:30 IST on the expiry date.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, schema: { type: string, format: date } }
        - { name: strikes, in: query, description: Strikes on each side of ATM., schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: maxPainPct, in: query, description: Flag when spot is this percent or more away from max pain (default 0.5)., schema: { type: number, minimum: 0 } }
        - { name: decayPct, in: query, description: Flag when the ATM straddle has lost this percent of its day-open price (default 50)., schema: { type: number, minimum: 0, maximum: 100 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/time-machine:
    get:
      tags: [Analytics]
      operationId: getAnalyticsTimeMachine
      summary: Replay helper, historical candles with the ATM strike and move per bar
      description: Historical option chains are not stored, so premiums, OI and Greeks are not returned for past bars; the response lists this under limitations.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: symbol, in: query, required: true, schema: { type: string }, example: "NSE:NIFTY" }
        - { name: interval, in: query, required: true, schema: { $ref: "#/components/schemas/Interval" } }
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: step, in: query, description: Strike spacing used to find the ATM strike (default by underlying)., schema: { type: number, minimum: 0.01 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
