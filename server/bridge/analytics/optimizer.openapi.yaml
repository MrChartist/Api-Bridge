  /v1/analytics/optimizer:
    get:
      tags: [Analytics]
      operationId: getAnalyticsOptimizer
      summary: Best option strategies for a market view, by grid search on the live chain
      description: >-
        Tries every strategy template that fits the view over strike offsets and widths (at most 2,000 candidates) and returns
        the top N with net credit or debit, max profit and loss, break-evens, probability of profit, expected value, a margin-light
        capital estimate (max loss based; not SPAN margin) and a plain-language rationale. Model: lognormal expiry price with zero
        drift and flat ATM implied volatility, payoff integrated numerically over a fixed 801-point grid of plus or minus 5 sigma;
        a screening model, not a forecast. Lots are 1 unless capital is given, then sized to fit capital (and maxLoss).
        Unbounded-risk strategies are excluded when maxLoss is set. Read-only; places no orders.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: view, in: query, required: true, schema: { type: string, enum: [bullish, bearish, neutral, volatile] } }
        - { name: maxLoss, in: query, description: Largest acceptable loss in rupees on the sized position., schema: { type: number, exclusiveMinimum: 0 } }
        - { name: minPop, in: query, description: Smallest acceptable probability of profit, in percent., schema: { type: number, minimum: 0, maximum: 100 } }
        - { name: capital, in: query, description: Capital in rupees; sizes the lots and drops strategies that do not fit., schema: { type: number, exclusiveMinimum: 0 } }
        - { name: objective, in: query, schema: { type: string, enum: [expectedValue, popAdjusted, riskReward], default: expectedValue } }
        - { name: top, in: query, description: Strategies to return., schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
