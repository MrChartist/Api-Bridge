  /v1/analytics/oi-change:
    get:
      tags: [Analytics]
      operationId: getAnalyticsOiChange
      summary: OI change by strike over a window, with build-up classification
      description: >-
        Compares the newest in-memory chain snapshot with the one about `windowMin` minutes earlier (history builds up as this route
        and oi-spurts are called; it is lost on restart). Each strike and side is classed long build-up, short build-up, long unwinding or
        short covering from the option price change against the OI change.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: windowMin, in: query, description: Window in minutes (default 15)., schema: { type: number, minimum: 1, maximum: 1440 } }
        - { name: top, in: query, description: Keep only the biggest absolute OI changes., schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: strikes, in: query, description: Strikes on each side of ATM., schema: { type: integer, minimum: 1, maximum: 100 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/oi-spurts:
    get:
      tags: [Analytics]
      operationId: getAnalyticsOiSpurts
      summary: Strikes whose OI jumped most against a rolling baseline
      description: >-
        Needs at least two snapshots. `multiple` is the newest jump divided by the mean absolute jump of earlier intervals in the
        lookback (null while there is no baseline).
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: lookbackMin, in: query, description: Baseline lookback in minutes (default 60)., schema: { type: number, minimum: 1, maximum: 1440 } }
        - { name: minChangePct, in: query, description: Smallest percent OI jump that counts (default 5)., schema: { type: number, minimum: 0 } }
        - { name: top, in: query, description: Rows to return (default 10)., schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: strikes, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
