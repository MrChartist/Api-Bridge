<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge Live Chart</title>
<meta name="description" content="Example: a live candlestick chart from the Mr. Chartist API Bridge UDF datafeed and WebSocket stream, drawn with TradingView Lightweight Charts.">
<style>
  :root {
    --bg: #ffffff; --fg: #1d2330; --muted: #5b6475; --line: #e3e6ec; --accent: #2962ff; --up: #089981; --down: #f23645; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #131722; --fg: #d1d4dc; --muted: #8b93a7; --line: #2a2e39; --accent: #5b8cff; --err: #ff8a80; }
  }
  :root[data-theme="dark"] { --bg: #131722; --fg: #d1d4dc; --muted: #8b93a7; --line: #2a2e39; --accent: #5b8cff; --err: #ff8a80; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  input, select, button { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; }
  input[type="password"] { width: 16em; }
  #symbol { width: 18em; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  #status { padding: 6px 16px; font-size: 12px; color: var(--muted); min-height: 1.6em; }
  #status.error { color: var(--err); }
  #chart { height: calc(100vh - 170px); min-height: 320px; margin: 0 16px; }
  footer { padding: 8px 16px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--accent); }
  @media (max-width: 600px) { input[type="password"], #symbol { width: 100%; } label { flex: 1 1 100%; } }
</style>
</head>
<body>
<header>
  <label>Bridge URL <input id="base" value="http://127.0.0.1:4300" autocomplete="off"></label>
  <label>API key (read scope) <input id="key" type="password" autocomplete="off" placeholder="mcb_..."></label>
  <label>Symbol <input id="symbol" value="NSE:NIFTY" autocomplete="off"></label>
  <label>Resolution
    <select id="resolution">
      <option value="1">1 min</option><option value="5" selected>5 min</option><option value="15">15 min</option>
      <option value="60">1 hour</option><option value="1D">1 day</option><option value="1W">1 week</option>
    </select>
  </label>
  <button id="load" type="button">Load</button>
</header>
<div id="status" role="status" aria-live="polite"></div>
<div id="chart"></div>
<footer>
  Charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">TradingView</a>
  Lightweight Charts™ (Apache License 2.0). Data from your own Mr. Chartist API Bridge. Read-only: this page cannot
  place orders.
</footer>

<!-- Pinned version with a Subresource Integrity hash: this page holds your API key, so the browser refuses the script
     if the CDN ever serves different bytes. The standalone build exposes window.LightweightCharts. -->
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK" crossorigin="anonymous"></script>
<script>
/*
 * Mr. Chartist API Bridge — Lightweight Charts example.
 *
 * Serve this file from an origin on the Bridge's CORS allowlist (bridge.config.json "cors.allowedOrigins"; the example
 * config allows http://localhost:5180 for this page; 5173 is Vite's default), for instance:
 *   python -m http.server 5180 --bind 127.0.0.1   then open   http://localhost:5180/lightweight-charts.html
 * Opening it as file:// will be refused by the Bridge.
 *
 * Flow: /udf/symbols (price format) -> /udf/history (countback bars) -> POST /v1/stream/token -> WebSocket
 * /v1/stream?token=... and subscribe in "ltp" mode; each tick updates the last bar. The key is kept in memory and in
 * this tab's sessionStorage (gone when the tab closes); it is sent in a header, never in a URL. The stream token in
 * the WebSocket URL is single-use and short-lived. All text from the server is written with textContent, never as HTML.
 */
(function () {
  "use strict";
  var IST = 19800; // Lightweight Charts draws UTC; shift intraday bars so the axis reads IST.
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status");
  var chart, candles, volume, ws, reconnectTimer, generation = 0;
  var current = null; // { ticker, resolution, minutes, daily, last }

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
  }

  try { $("key").value = sessionStorage.getItem("mcb.key") || ""; } catch (e) { /* storage blocked */ }

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function makeChart() {
    if (chart) chart.remove();
    chart = LightweightCharts.createChart($("chart"), {
      autoSize: true,
      layout: { background: { color: css("--bg") }, textColor: css("--fg"), attributionLogo: true },
      grid: { vertLines: { color: css("--line") }, horzLines: { color: css("--line") } },
      timeScale: { timeVisible: true, secondsVisible: false },
    });
    candles = chart.addCandlestickSeries({ upColor: css("--up"), downColor: css("--down"), borderVisible: false, wickUpColor: css("--up"), wickDownColor: css("--down") });
    volume = chart.addHistogramSeries({ priceScaleId: "vol", priceFormat: { type: "volume" }, color: "rgba(120,123,134,0.35)" });
    chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
  }

  function base() { return $("base").value.trim().replace(/\/+$/, ""); }

  async function api(path, init) {
    var res = await fetch(base() + path, Object.assign({ headers: { Authorization: "Bearer " + $("key").value.trim() } }, init || {}));
    var body = null;
    try { body = await res.json(); } catch (e) { /* not JSON */ }
    if (!res.ok || (body && body.s === "error")) {
      var msg = body && (body.errmsg || body.detail || body.title) ? (body.errmsg || body.detail || body.title) : "HTTP " + res.status;
      var err = new Error(msg);
      err.code = body && body.code;
      throw err;
    }
    return body;
  }

  function displayTime(t, daily) { return daily ? t : t + IST; }

  async function load() {
    var my = ++generation;
    closeStream();
    try { sessionStorage.setItem("mcb.key", $("key").value.trim()); } catch (e) { /* ignore */ }
    var resolution = $("resolution").value;
    var daily = /[DWM]$/.test(resolution);
    setStatus("Loading…");
    makeChart();
    try {
      var info = await api("/udf/symbols?symbol=" + encodeURIComponent($("symbol").value.trim()));
      var precision = Math.round(Math.log10(info.pricescale));
      candles.applyOptions({ priceFormat: { type: "price", precision: precision, minMove: info.minmov / info.pricescale } });
      var now = Math.floor(Date.now() / 1000);
      var h = await api("/udf/history?symbol=" + encodeURIComponent(info.ticker) + "&resolution=" + encodeURIComponent(resolution) + "&to=" + (now + 60) + "&countback=300");
      if (my !== generation) return;
      var bars = [], vols = [];
      if (h.s === "ok") {
        for (var i = 0; i < h.t.length; i += 1) {
          var t = displayTime(h.t[i], daily);
          bars.push({ time: t, open: h.o[i], high: h.h[i], low: h.l[i], close: h.c[i] });
          vols.push({ time: t, value: h.v[i] });
        }
      }
      candles.setData(bars);
      volume.setData(info.visible_plots_set === "ohlc" ? [] : vols);
      chart.timeScale().fitContent();
      current = { ticker: info.ticker, daily: daily, minutes: daily ? 0 : Number(resolution), last: bars.length ? bars[bars.length - 1] : null, sessionOpen: info.exchange === "MCX" || info.exchange === "CDS" ? 540 : 555 };
      setStatus(info.ticker + " · " + info.description + " · " + bars.length + " bars · connecting live feed…");
      openStream(my);
    } catch (e) {
      if (my === generation) setStatus((e.code ? e.code + ": " : "") + e.message, true);
    }
  }

  /** Bar open (UTC display seconds) for a tick time, aligned to the session open like the Bridge's own candles. */
  function bucketOf(tickSec) {
    if (current.daily) return current.last ? current.last.time : null; // live ticks extend today's daily bar only
    var local = tickSec + IST;
    var day = Math.floor(local / 86400) * 86400;
    var minute = Math.floor((local - day) / 60);
    var step = current.minutes;
    var open = current.sessionOpen;
    var start = minute >= open ? open + Math.floor((minute - open) / step) * step : Math.floor(minute / step) * step;
    return day + start * 60;
  }

  function onTick(msg) {
    if (!current || msg.symbol !== current.ticker || typeof msg.ltp !== "number") return;
    var ts = msg.exchangeTs || msg.receivedAt || Date.now();
    var sec = ts > 1e11 ? Math.floor(ts / 1000) : ts;
    var time = bucketOf(sec);
    if (time === null) return;
    var last = current.last;
    var bar = last && last.time === time
      ? { time: time, open: last.open, high: Math.max(last.high, msg.ltp), low: Math.min(last.low, msg.ltp), close: msg.ltp }
      : (last && time < last.time ? null : { time: time, open: msg.ltp, high: msg.ltp, low: msg.ltp, close: msg.ltp });
    if (!bar) return;
    candles.update(bar);
    current.last = bar;
  }

  async function openStream(my, attempt) {
    attempt = attempt || 0;
    try {
      var tok = await api("/v1/stream/token", { method: "POST" });
      if (my !== generation) return;
      var url = base().replace(/^http/, "ws") + "/v1/stream?token=" + encodeURIComponent(tok.data.token);
      ws = new WebSocket(url);
      ws.onopen = function () {
        attempt = 0;
        ws.send(JSON.stringify({ op: "subscribe", symbols: [current.ticker], mode: "ltp", id: "chart" }));
        setStatus(current.ticker + " · live");
      };
      ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.type === "tick") onTick(msg);
        else if (msg.type === "snapshot" && Array.isArray(msg.ticks)) msg.ticks.forEach(onTick);
        else if (msg.type === "error") setStatus((msg.code || "error") + ": " + (msg.message || ""), true);
        else if (msg.type === "go_away") setStatus("Bridge restarting; reconnecting…");
      };
      ws.onclose = function () {
        if (my !== generation) return;
        var wait = Math.min(30000, 1000 * Math.pow(2, attempt));
        setStatus(current.ticker + " · feed disconnected, retrying in " + Math.round(wait / 1000) + " s");
        reconnectTimer = setTimeout(function () { openStream(my, attempt + 1); }, wait);
      };
    } catch (e) {
      if (my !== generation) return;
      setStatus("Live feed unavailable (" + (e.code || e.message) + "). Showing history only.", true);
    }
  }

  function closeStream() {
    clearTimeout(reconnectTimer);
    if (ws) { ws.onclose = null; try { ws.close(); } catch (e) { /* ignore */ } ws = null; }
  }

  $("load").addEventListener("click", load);
  $("symbol").addEventListener("keydown", function (e) { if (e.key === "Enter") load(); });
  if (!window.LightweightCharts) setStatus("Could not load Lightweight Charts from unpkg.com.", true);
  else setStatus("Enter your read key and press Load.");
})();
</script>
</body>
</html>
