  /v1/analytics/events:
    get:
      tags: [Analytics]
      operationId: getAnalyticsEvents
      summary: NSE corporate events, board meetings and results calendar grouped by day
      description: From the NSE public site (meta.source is "nse"). Looks forward from today for the given number of days; each event has purpose and description. Cached for five minutes per query.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: symbol, in: query, description: NSE ticker., schema: { type: string, maxLength: 20 } }
        - { name: days, in: query, description: Calendar days ahead., schema: { type: integer, minimum: 1, maximum: 60, default: 14 } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/screener:
    get:
      tags: [Analytics]
      operationId: getAnalyticsScreener
      summary: Contract screener. Filter and sort every option contract in up to five chains, with premium traded, moneyness, breakeven, probability ITM, theta percent, spread and a liquidity flag
      description: |
        Delta filters use the absolute delta. `minPremium` and `maxPremium` bound the option price (ltp, INR per unit).
        `sort=premium` orders by premium traded (ltp x volume x lot size, INR); `sort=theta` orders by daily theta as a percent of premium.
        Contracts missing a field never pass a filter on it and sort last. The response reports `scanned`, `matched` and `returned`;
        an underlying that fails to load is listed in `errors` and the others are still screened.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlyings, in: query, required: true, description: One to five comma-separated underlyings., schema: { type: string, example: "NIFTY,BANKNIFTY" } }
        - { name: expiry, in: query, description: YYYY-MM-DD. Default is each underlying's nearest upcoming expiry., schema: { type: string, format: date } }
        - { name: type, in: query, schema: { type: string, enum: [call, put, both], default: both } }
        - { name: minDelta, in: query, description: Minimum absolute delta., schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: maxDelta, in: query, description: Maximum absolute delta., schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: minIv, in: query, description: Minimum IV in percent., schema: { type: number, minimum: 0, maximum: 1000 } }
        - { name: maxIv, in: query, description: Maximum IV in percent., schema: { type: number, minimum: 0, maximum: 1000 } }
        - { name: minOi, in: query, schema: { type: number, minimum: 0 } }
        - { name: minVolume, in: query, schema: { type: number, minimum: 0 } }
        - { name: minPremium, in: query, description: Minimum option price in INR., schema: { type: number, minimum: 0 } }
        - { name: maxPremium, in: query, description: Maximum option price in INR., schema: { type: number, minimum: 0 } }
        - { name: minDte, in: query, description: Minimum days to expiry., schema: { type: number, minimum: 0, maximum: 3650 } }
        - { name: maxDte, in: query, description: Maximum days to expiry., schema: { type: number, minimum: 0, maximum: 3650 } }
        - { name: maxSpreadPct, in: query, description: Maximum bid-ask spread as a percent of mid., schema: { type: number, minimum: 0 } }
        - { name: moneyness, in: query, schema: { type: string, enum: [itm, atm, otm, any], default: any } }
        - { name: sort, in: query, schema: { type: string, enum: [oi, volume, iv, delta, premium, theta, ltp, spread], default: oi } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/screener/presets:
    get:
      tags: [Analytics]
      operationId: getAnalyticsScreenerPresets
      summary: Six named screener presets (high-IV puts, liquid ATM weeklies, cheap OTM lottery, high-theta sellers, big OI walls, tight spreads) as ready-made query strings
      x-stream: S15
      x-scope: read
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/backtest:
    post:
      tags: [Analytics]
      operationId: postAnalyticsBacktest
      summary: Replay a scanner-language entry (and optional exit) condition over historical candles
      description: |
        Signals are read on the bar close and filled at the next bar open (no lookahead). One position at a time, long or
        short, with optional stop loss, target and maximum bars in trade. Fees and slippage apply to every fill. Returns the
        trades, the equity curve and statistics (total return, CAGR, win rate, profit factor, expectancy, maximum drawdown with
        dates, daily Sharpe, exposure, best and worst trade) next to a buy-and-hold comparison. `data.method` spells out every
        fill, fee and Sharpe assumption. Past performance is not predictive. Limits: 5000 bars, 2000 trades; conditions follow
        the scanner language and its length and complexity caps. Read-only: nothing here places an order.
      x-stream: S15
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [symbol, entry]
              properties:
                symbol: { type: string, example: "NSE:RELIANCE" }
                interval: { $ref: "#/components/schemas/Interval" }
                from: { type: string, format: date, description: "First day (YYYY-MM-DD). Not with countback." }
                to: { type: string, format: date, description: "Last day (YYYY-MM-DD). Needs from or countback." }
                countback: { type: integer, minimum: 2, maximum: 5000, description: "Bars to fetch, ending at to (default now). Default 500 when no range is given." }
                entry: { type: string, maxLength: 1000, example: "ema(20) crosses above ema(50)" }
                exit: { type: string, maxLength: 1000, example: "ema(20) crosses below ema(50)" }
                stopLossPct: { type: number, exclusiveMinimum: 0, maximum: 100 }
                targetPct: { type: number, exclusiveMinimum: 0, maximum: 1000 }
                maxBarsInTrade: { type: integer, minimum: 1, maximum: 5000 }
                side: { type: string, enum: [long, short], default: long }
                initialCapital: { type: number, exclusiveMinimum: 0, maximum: 1000000000000, default: 100000 }
                quantity: { type: integer, minimum: 1, description: "Units per trade. Not with capitalPct." }
                capitalPct: { type: number, exclusiveMinimum: 0, maximum: 100, description: "Share of current equity per trade (default 100). Not with quantity." }
                feesPct: { type: number, minimum: 0, maximum: 5, default: 0.05, description: "Percent of notional on each fill." }
                slippagePct: { type: number, minimum: 0, maximum: 5, default: 0.05, description: "Percent against you on each fill." }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/backtest/examples:
    get:
      tags: [Analytics]
      operationId: getAnalyticsBacktestExamples
      summary: Five ready-made backtest request bodies (EMA cross, RSI mean reversion, 20-day breakout, Supertrend short, Bollinger bounce)
      x-stream: S15
      x-scope: read
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/participants:
    get:
      tags: [Analytics]
      operationId: getAnalyticsParticipants
      summary: Alias of /v1/participants/oi in PR 17's shape: fII, DII, Pro and Client F&O open interest by participant, with day-on-day change and sentiment
      description: >-
        Per session and participant, index futures, index options (with call and put legs), stock futures and stock options,
        each as long, short, net, long/short ratio and long percent, plus the change from the previous session and a derived
        net-position sentiment (strongly_bullish to strongly_bearish; a positioning read, not a forecast). Source is NSE's daily
        participant-wise OI file (fao_participant_oi_ddmmyyyy.csv on nsearchives.nseindia.com). The URL pattern and column layout
        are assumed and unverified without network access; a changed shape returns UPSTREAM_ERROR. NSE publishes after the close,
        so the newest session may be the previous trading day. The Bridge accumulates history (newest 250 sessions, saved in its
        data folder); meta.available says how many it holds and meta.stale is true when a refresh failed and cached data was served.
        Cached for five minutes.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: days, in: query, description: Sessions to return, newest first., schema: { type: integer, minimum: 1, maximum: 60, default: 10 } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/optimizer:
    get:
      tags: [Analytics]
      operationId: getAnalyticsOptimizer
      summary: Best option strategies for a market view, by grid search on the live chain
      description: >-
        Tries every strategy template that fits the view over strike offsets and widths (at most 2,000 candidates) and returns
        the top N with net credit or debit, max profit and loss, break-evens, probability of profit, expected value, a margin-light
        capital estimate (max loss based; not SPAN margin) and a plain-language rationale. Model: lognormal expiry price with zero
        drift and flat ATM implied volatility, payoff integrated numerically over a fixed 801-point grid of plus or minus 5 sigma;
        a screening model, not a forecast. Lots are 1 unless capital is given, then sized to fit capital (and maxLoss).
        Unbounded-risk strategies are excluded when maxLoss is set. Read-only; places no orders.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: view, in: query, required: true, schema: { type: string, enum: [bullish, bearish, neutral, volatile] } }
        - { name: maxLoss, in: query, description: Largest acceptable loss in rupees on the sized position., schema: { type: number, exclusiveMinimum: 0 } }
        - { name: minPop, in: query, description: Smallest acceptable probability of profit, in percent., schema: { type: number, minimum: 0, maximum: 100 } }
        - { name: capital, in: query, description: Capital in rupees; sizes the lots and drops strategies that do not fit., schema: { type: number, exclusiveMinimum: 0 } }
        - { name: objective, in: query, schema: { type: string, enum: [expectedValue, popAdjusted, riskReward], default: expectedValue } }
        - { name: top, in: query, description: Strategies to return., schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/watchlists:
    get:
      tags: [Analytics]
      operationId: listAnalyticsWatchlists
      summary: Alias of /v1/watchlists: the caller's watchlists (every list on this Bridge, as an array)
      x-stream: S29
      x-scope: read
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Analytics]
      operationId: createAnalyticsWatchlist
      summary: Alias of /v1/watchlists: create a watchlist (up to 100 symbols, 20 lists)
      x-stream: S29
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                symbols: { type: array, maxItems: 100, items: { type: string, example: "NSE:RELIANCE" } }
      responses:
        "201": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/watchlists/{listId}:
    put:
      tags: [Analytics]
      operationId: updateAnalyticsWatchlist
      summary: Alias of /v1/watchlists/{listId}: rename a watchlist, replace its symbols, or add and remove some
      description: Give name, symbols, or add and remove. symbols replaces the list and cannot be combined with add or remove.
      x-stream: S29
      x-scope: read
      parameters:
        - { name: listId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                symbols: { type: array, maxItems: 100, items: { type: string } }
                add: { type: array, maxItems: 100, items: { type: string } }
                remove: { type: array, maxItems: 100, items: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Analytics]
      operationId: deleteAnalyticsWatchlist
      summary: Alias of /v1/watchlists/{listId}: delete a watchlist
      x-stream: S29
      x-scope: read
      parameters:
        - { name: listId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/watchlists/{listId}/quotes:
    get:
      tags: [Analytics]
      operationId: getAnalyticsWatchlistQuotes
      summary: Alias of /v1/watchlists/{listId}/quotes: live quotes for a watchlist (ltp, change, changePct, volume, oi, dayHigh, dayLow)
      description: Symbols that could not be quoted are listed in errors and never fail the call; meta carries the stalest item's freshness.
      x-stream: S29
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
        - { name: listId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/markets/indices:
    get:
      tags: [Analytics]
      operationId: getAnalyticsMarketsIndices
      summary: Index strip with India VIX and the day-range position
      description: "Every index the instrument master knows (NIFTY, BANKNIFTY, FINNIFTY, MIDCPNIFTY, SENSEX, INDIA VIX and more, at most 60) from ONE batched quote call. Each item has ltp, change, changePct, dayHigh, dayLow and rangePosition (0 to 1). Cost: 1 quote call; no candles."
      x-stream: S15
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/markets/movers:
    get:
      tags: [Analytics]
      operationId: getAnalyticsMarketsMovers
      summary: Top movers over one batched quote pass
      description: "Gainers, losers, volume, turnover or open interest over the FNO or NIFTY50 universe, sorted on the server. The quote pass is cached for 15 seconds and shared by all clients, so concurrent calls join one pass. Cash quotes carry no open interest, so by=oi can be empty. Cost: 0 to 2 quote calls (200 symbols per call); no candles."
      x-stream: S15
      x-scope: read
      parameters:
        - { name: universe, in: query, schema: { type: string, enum: [FNO, NIFTY50], default: FNO } }
        - { name: by, in: query, schema: { type: string, enum: [gainers, losers, volume, turnover, oi], default: gainers } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/markets/sectors:
    get:
      tags: [Analytics]
      operationId: getAnalyticsMarketsSectors
      summary: Sector index heatmap for 1D, 1W or 1M
      description: "NIFTY sector indices ranked by change. 1d comes from one quote call; 1w and 1m use daily candles (background priority, up to 12 reads, cached for the IST day). drill=KEY adds the changePct of that sector's NIFTY 50 constituents from the shared quote snapshot. Cost: 1 quote call, plus up to 12 cached candle reads for 1w and 1m, plus a shared snapshot when drilling."
      x-stream: S15
      x-scope: read
      parameters:
        - { name: tf, in: query, schema: { type: string, enum: [1d, 1w, 1m], default: 1d } }
        - { name: drill, in: query, description: "Sector key such as BANK, IT, AUTO, FMCG, PHARMA, METAL, ENERGY, REALTY, PSUBANK, PVTBANK, FINSERV or MEDIA.", schema: { type: string, maxLength: 12 } }
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/markets/breadth:
    get:
      tags: [Analytics]
      operationId: getAnalyticsMarketsBreadth
      summary: Advance/decline now and the cached daily breadth
      description: "advanceDecline comes from the shared quote snapshot. The rest (new 52-week highs and lows, percent above the 20, 50 and 200 day averages, advance/decline line) is computed by a background job over daily candles of the FNO universe, cached for the day and saved to disk. status is pending, ready or partial; computedAt says when. Starting the job is POST /v1/analytics/markets/breadth/refresh. Cost: 0 to 2 quote calls; reading never makes candle calls."
      x-stream: S15
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/markets/breadth/refresh:
    post:
      tags: [Analytics]
      operationId: refreshAnalyticsMarketsBreadth
      summary: Start the breadth job without waiting for it
      description: "Starts the background breadth job and answers 202 at once. Answers 200 with started false when a job is already running or a complete result is under 30 minutes old. Cost: none now; the job reads up to 250 cached daily-candle series at background priority, 3 at a time."
      x-stream: S15
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "202": { $ref: "#/components/responses/AnalyticsResult" }
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/markets/rotation:
    get:
      tags: [Analytics]
      operationId: getAnalyticsMarketsRotation
      summary: Relative rotation of sectors against NIFTY
      description: "A labelled proxy for relative rotation (the official formula is closed): RS-Ratio and RS-Momentum are 100 plus a rolling z-score of the smoothed relative strength and of its rate of change. Each item has a quadrant (leading, weakening, lagging, improving) and a tail of earlier points. Cost: up to 13 cached daily-candle reads at background priority; no quotes."
      x-stream: S15
      x-scope: read
      parameters:
        - { name: tf, in: query, schema: { type: string, enum: [1d, 1w], default: 1w } }
        - { name: tail, in: query, description: Earlier points to return per sector., schema: { type: integer, minimum: 0, maximum: 12, default: 5 } }
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/markets/correlation:
    get:
      tags: [Analytics]
      operationId: getAnalyticsMarketsCorrelation
      summary: Correlation matrix of daily returns
      description: "Pearson correlation of daily log returns, pairwise on common dates, for NIFTY50 or a comma-separated list of 2 to 60 symbols, with the most and least correlated pairs. A pair with fewer than 20 shared days, or a flat series, is null. Cost: up to 60 cached daily-candle reads at background priority; no quotes."
      x-stream: S15
      x-scope: read
      parameters:
        - { name: universe, in: query, description: "NIFTY50 or comma-separated symbols (at most 60).", schema: { type: string, default: NIFTY50 } }
        - { name: days, in: query, schema: { type: integer, enum: [60, 120, 250], default: 120 } }
        - { name: pairs, in: query, description: Pairs in each of the most and least correlated lists., schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/fields/search:
    get:
      tags: [Analytics]
      operationId: searchFields
      summary: Search the field catalogue by id, alias or description
      x-stream: S15
      x-scope: read
      parameters:
        - { name: q, in: query, description: "Words to look for, for example open interest. Empty lists the catalogue.", schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, enum: [price, volume, derivatives, greeks, volatility, analytics, reference] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/fields:
    get:
      tags: [Analytics]
      operationId: getFields
      summary: Symbol by field grid in one batched read (BDP)
      description: |
        Up to 50 symbols by 20 fields. Quotes are read in one marketData call and option chains once per underlying and
        expiry. A field that does not apply to a symbol, or that could not be read, is null with an entry in `errors`
        (symbol, field, code, message); the call itself still succeeds. `override` changes iv, Greeks and the chain
        fields: expiry picks another expiry, rate re-solves iv and Greeks at that percent rate.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: symbols, in: query, required: true, description: "Comma-separated canonical symbols, at most 50.", schema: { type: string } }
        - { name: fields, in: query, required: true, description: "Comma-separated field ids or aliases, at most 20.", schema: { type: string } }
        - { name: override, in: query, description: "For example expiry:2026-11-27,rate:6.5.", schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/fields/history:
    get:
      tags: [Analytics]
      operationId: getFieldsHistory
      summary: Daily history by field with period aggregation (BDH)
      description: |
        Up to 10 symbols and about ten years of days. period W and M aggregate daily bars (open of the first, high and
        low across, close of the last, volume summed). fill=prev adds a row for every calendar period with no bar,
        carrying prices and open interest forward with volume 0 and filled true.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: symbols, in: query, required: true, schema: { type: string } }
        - { name: fields, in: query, description: "open, high, low, close, prev_close, change, change_pct, volume, oi. Default close.", schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, description: Defaults to today (IST)., schema: { type: string, format: date } }
        - { name: period, in: query, schema: { type: string, enum: [D, W, M], default: D } }
        - { name: fill, in: query, schema: { type: string, enum: [none, prev], default: none } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/fields/bulk:
    get:
      tags: [Analytics]
      operationId: getFieldsBulk
      summary: Bulk data for an underlying, the option chain or its expiries (BDS)
      x-stream: S15
      x-scope: read
      parameters:
        - { name: symbol, in: query, required: true, description: "Underlying, for example NIFTY or NSE:NIFTY.", schema: { type: string, maxLength: 40 } }
        - { name: field, in: query, required: true, schema: { type: string, enum: [CHAIN, EXPIRIES] } }
        - { name: expiry, in: query, description: Required for CHAIN., schema: { type: string, format: date } }
        - { name: strikes, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: greeks, in: query, schema: { type: boolean, default: true } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/batch:
    post:
      tags: [Analytics]
      operationId: postBatch
      summary: Up to 20 read requests in one call
      description: |
        Each item runs through the route's own handler. Allowed paths are GET /v1/fields, /v1/fields/search,
        /v1/fields/history, /v1/fields/bulk, /v1/quotes, /v1/ltp and /v1/analytics/{oi,gex,skew,surface,basis,greeks};
        any other path answers status 400 or 404 for that item only. The outer call is 200 whenever the envelope is valid.
      x-stream: S15
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests]
              properties:
                requests:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [id, path]
                    properties:
                      id: { type: string, minLength: 1, maxLength: 64 }
                      path: { type: string, example: /v1/fields }
                      query: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/risk/scenario:
    post:
      tags: [Analytics]
      operationId: postAnalyticsRiskScenario
      summary: Full-reprice P&L grid over spot, IV and days, for the book and per underlying
      description: Black-Scholes full reprice for every cell of spotShocksPct x ivShocksPts x daysForward (at most 400 cells), with a delta-gamma-vega-theta Taylor approximation and its error per cell. Send exactly one of account (reads the positions through the orders service) or positions (explicit legs, units not lots). P&L is against the Black-Scholes model price at the current spot, IV and time, so the zero cell is 0. Shocks are parallel across underlyings, IV shocks are absolute vol points, futures and cash legs move one for one with spot. Options with no usable IV or price, and expired legs, are listed under skipped. Read-only; nothing is ordered.
      x-stream: S15
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account: { type: string }
                mode: { type: string, enum: [paper, live] }
                positions:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [symbol, netQty]
                    properties:
                      symbol: { type: string, example: "NFO:NIFTY-2026-11-24-25000-CE" }
                      netQty: { type: integer, description: Signed units. Negative is short. }
                      price: { type: number }
                      spot: { type: number }
                      ivPct: { type: number }
                spotShocksPct: { type: array, maxItems: 41, items: { type: number, minimum: -99, maximum: 100 }, example: [-5, -2.5, 0, 2.5, 5] }
                ivShocksPts: { type: array, maxItems: 41, items: { type: number, minimum: -100, maximum: 100 }, example: [-5, 0, 5] }
                daysForward: { type: array, maxItems: 41, items: { type: number, minimum: 0, maximum: 365 }, example: [0, 1, 3] }
                maxCells: { type: integer, minimum: 1, maximum: 400, default: 400 }
                ratePct: { type: number, minimum: 0, maximum: 100, description: Risk-free rate in percent (default 6.5). }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/risk/exposure:
    get:
      tags: [Analytics]
      operationId: getAnalyticsRiskExposure
      summary: Gross, net, long and short notional and delta-adjusted exposure
      description: Notional is the absolute quantity times the underlying price. Delta-adjusted exposure is quantity times delta times underlying price, per underlying and in total. Funds, used margin and total balance are returned exactly as the account reports them; when the adapter cannot supply them funds is null with a note, and nothing is estimated (no SPAN or exposure margin is computed).
      x-stream: S15
      x-scope: read
      parameters:
        - { name: account, in: query, required: true, description: Account id from your config., schema: { type: string }, example: paper }
        - { name: mode, in: query, schema: { type: string, enum: [paper, live] } }
        - { name: includeHoldings, in: query, description: Also count equity holdings., schema: { type: boolean, default: false } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/risk/concentration:
    get:
      tags: [Analytics]
      operationId: getAnalyticsRiskConcentration
      summary: Top-N position weights, underlying and sector share, HHI
      description: Weights are shares of gross notional. HHI is the sum of squared underlying weights (1 means one underlying). Sectors come from a small static map; names it does not know are Unclassified.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: account, in: query, required: true, description: Account id from your config., schema: { type: string }, example: paper }
        - { name: top, in: query, description: How many top positions to list., schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
        - { name: mode, in: query, schema: { type: string, enum: [paper, live] } }
        - { name: includeHoldings, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/risk/var:
    get:
      tags: [Analytics]
      operationId: getAnalyticsRiskVar
      summary: 1-day historical-simulation VaR and expected shortfall (an estimate)
      description: Reprices the book fully for each past daily return of its underlyings (spot only, IV and time held, aligned by IST date). Falls back to delta-normal when fewer than 30 aligned days exist, and says so in method and note. The delta-normal figure is also returned as a cross-check. Underlyings without enough history are listed and left out. This is an estimate from past moves, not a limit. The historical simulation adds `distribution` (24 equal-width bins of the simulated one-day P&Ls, { from, to, count }) and `bestDayPnl`. A paper account reads chains and candles through the data accounts.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: account, in: query, required: true, description: Account id from your config., schema: { type: string }, example: paper }
        - { name: days, in: query, description: Daily-candle lookback., schema: { type: integer, minimum: 30, maximum: 1000, default: 250 } }
        - { name: confidence, in: query, schema: { type: integer, enum: [95, 99], default: 95 } }
        - { name: method, in: query, schema: { type: string, enum: [auto, historical, delta-normal], default: auto } }
        - { name: mode, in: query, schema: { type: string, enum: [paper, live] } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/risk/whatif:
    post:
      tags: [Analytics]
      operationId: postAnalyticsRiskWhatif
      summary: Exposure, concentration and VaR before and after a hypothetical position (plan only)
      description: Adds order-like legs to the account's current book and compares exposure, concentration and VaR. Nothing is sent or placed; margin for the added legs is not computed (the adapters expose funds, not a margin calculator), so requiredForAdd is null.
      x-stream: S15
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, add]
              properties:
                account: { type: string }
                mode: { type: string, enum: [paper, live] }
                add:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [symbol, side, quantity]
                    properties:
                      symbol: { type: string }
                      side: { type: string, enum: [BUY, SELL] }
                      quantity: { type: integer, minimum: 1, description: Units, not lots. }
                      price: { type: number }
                days: { type: integer, minimum: 30, maximum: 1000, default: 250 }
                confidence: { type: integer, enum: [95, 99], default: 95 }
                topN: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/risk/tca:
    get:
      tags: [Analytics]
      operationId: getAnalyticsRiskTca
      summary: Transaction cost analysis from paper fills (slippage vs limit, fees, fill latency)
      description: Joins paper trades to their orders. Slippage is measured against the order's limit price only, because the paper store does not record an arrival price; market orders are not measured. Fees are the single brokerage figure per trade. Latency is fill time minus order placement time. The unavailable list states every field the store lacks (arrival price, bid and ask at fill, post-fill price, charge breakdown, partial fills).
      x-stream: S15
      x-scope: read
      parameters:
        - { name: account, in: query, required: true, description: A paper account id., schema: { type: string }, example: paper }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/forward-curve:
    get:
      tags: [Analytics]
      operationId: getAnalyticsForwardCurve
      summary: Implied forward, carry and dividend yield per expiry from put-call parity
      description: F = K + (C - P) e^{rT}, averaged over up to three strikes nearest spot that have both legs priced (mid when bid and ask exist, else LTP). Carry is ln(F/S)/T annualised and implied dividend yield is the rate minus carry. An expiry with thin data or under half a day left returns forward null with a reason.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 }, example: NIFTY }
        - { name: expiries, in: query, description: How many upcoming expiries., schema: { type: integer, minimum: 1, maximum: 12, default: 6 } }
        - { name: ratePct, in: query, description: Risk-free rate in percent (default 6.5)., schema: { type: number, minimum: 0, maximum: 100 } }
        - { name: account, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/rr-bf:
    get:
      tags: [Analytics]
      operationId: getAnalyticsRrBf
      summary: Risk reversal and butterfly at 25 and 10 delta (and one more)
      description: Rebuilds the smile in call-delta space from the OTM legs and interpolates linearly, never extrapolating. RR is IV of the call minus IV of the put at that delta; BF is the average of the two minus ATM IV. Everything is null, with a reason, when the smile has fewer than five usable points or does not reach that delta on both wings.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 }, example: NIFTY }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date }, example: "2026-11-24" }
        - { name: delta, in: query, description: Delta to report as requested; 25 and 10 are always included., schema: { type: integer, minimum: 1, maximum: 49, default: 25 } }
        - { name: account, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/vol-cone:
    get:
      tags: [Analytics]
      operationId: getAnalyticsVolCone
      summary: HV percentiles by tenor, current vs cone, VRP against ATM IV, forward vol between expiries
      description: Rolling close-to-close HV (annualised, percent) for 10, 20, 30, 60 and 90 day tenors with min, 5th, 25th, 50th, 75th, 95th percentile and max, the current value and its percentile. VRP is the nearest ATM IV (at least 3 days left) minus the HV of the closest tenor. Forward vol between consecutive expiries is sqrt((s2^2 T2 - s1^2 T1) / (T2 - T1)), null when total variance falls with maturity. A tenor with fewer than 20 rolling windows has null percentiles.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 }, example: NIFTY }
        - { name: days, in: query, description: Daily-candle lookback., schema: { type: integer, minimum: 120, maximum: 1500, default: 500 } }
        - { name: expiries, in: query, description: How many expiries for the term and forward vol., schema: { type: integer, minimum: 1, maximum: 6, default: 4 } }
        - { name: account, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/event-vol:
    get:
      tags: [Analytics]
      operationId: getAnalyticsEventVol
      summary: Implied event move from total-variance differences around a date
      description: With E1 the last expiry before the event and E2 the first on or after it (event time taken as 09:15 IST), event variance is s2^2 T2 - s1^2 T1 - sigma_b^2 (T2 - T1), where sigma_b is the pre-event ATM IV unless baselineVolPct is sent. With no pre-event expiry the baseline is HV20. The implied 1-sigma move is its square root as a percent of spot. Null, with a reason, when there is no premium above the baseline or no expiry after the event.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 }, example: NIFTY }
        - { name: event, in: query, required: true, description: A future date within 400 days., schema: { type: string, format: date }, example: "2026-12-04" }
        - { name: baselineVolPct, in: query, description: Override the baseline vol in percent., schema: { type: number, minimum: 1, maximum: 300 } }
        - { name: account, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/news/regulatory:
    get:
      tags: [Analytics]
      operationId: getAnalyticsNewsRegulatory
      summary: SEBI and RBI regulatory wire, deduplicated and tagged (fno, margin, lot-size, circular, expiry)
      description: From the SEBI combined RSS and the RBI press release, notification and speech RSS feeds. Parsed without entity expansion; a DOCTYPE, ENTITY, oversize or non-feed response is an upstream error. Cached ten minutes, stale copy served if a refresh fails; meta.failedFeeds lists feeds that failed. Endpoints are unverified (assumed URLs, see ENDPOINTS in newsFeeds.mjs). Personal, local use only. meta carries source, fetchedAt, stale and note.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [sebi, rbi, all], default: all } }
        - { name: days, in: query, description: Look-back window in days., schema: { type: integer, minimum: 1, maximum: 90, default: 7 } }
        - { name: q, in: query, description: Keywords; every word must appear (case-insensitive)., schema: { type: string, maxLength: 100 } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/news/announcements:
    get:
      tags: [Analytics]
      operationId: getAnalyticsNewsAnnouncements
      summary: NSE corporate announcements, deduplicated by attachment id
      description: From NSE's public corporate-announcements API through the cookie-primed client. Cached five minutes. Endpoints are unverified (assumed URLs, see ENDPOINTS in newsFeeds.mjs). Personal, local use only. meta carries source, fetchedAt, stale and note.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: symbol, in: query, schema: { type: string, maxLength: 20 } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 3 } }
        - { name: q, in: query, description: Keywords; every word must appear (case-insensitive)., schema: { type: string, maxLength: 100 } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/calendar/central-banks:
    get:
      tags: [Analytics]
      operationId: getAnalyticsCalendarCentralBanks
      summary: Upcoming central-bank decision dates with a day countdown
      description: Curated by hand (RBI MPC, US FOMC, ECB), not fetched; verify against the official calendar. Dates the author was unsure of are omitted, so a missing meeting does not mean none exists. daysUntil is computed from the Bridge clock in IST. Endpoints are unverified (assumed URLs, see ENDPOINTS in newsFeeds.mjs). Personal, local use only. meta carries source, fetchedAt, stale and note.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: bank, in: query, schema: { type: string, enum: [RBI, FOMC, ECB] } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 400, default: 365 } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/calendar/fno-ban:
    get:
      tags: [Analytics]
      operationId: getAnalyticsCalendarFnoBan
      summary: NSE F&O securities in ban, with entries and exits versus the previously saved list
      description: From NSE's fo_secban.csv. The previous list is kept in the Bridge data folder, so the first call is a baseline (baseline true, no entries or exits). Cached fifteen minutes. Endpoints are unverified (assumed URLs, see ENDPOINTS in newsFeeds.mjs). Personal, local use only. meta carries source, fetchedAt, stale and note.
      x-stream: S15
      x-scope: read
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/calendar/timeline:
    get:
      tags: [Analytics]
      operationId: getAnalyticsCalendarTimeline
      summary: Events, central-bank dates and option expiries merged into one dated list
      description: Merges NSE event-calendar rows, curated central-bank dates and expiries from market data for the given underlyings. A source that fails is reported under meta.sources and does not fail the call. Endpoints are unverified (assumed URLs, see ENDPOINTS in newsFeeds.mjs). Personal, local use only. meta carries source, fetchedAt, stale and note.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 14 } }
        - { name: underlyings, in: query, description: Up to five comma-separated underlyings for expiry dates., schema: { type: string, default: NIFTY } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Bridge API key: `mcb_<keyId>_<secret>`."
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Only on /xl/*, only for read-only keys created with --allow-query.

  headers:
    IdempotencyReplayed:
      description: "`true` when this response is the stored result of an earlier request with the same Idempotency-Key."
      schema: { type: string, enum: ["true"] }
    RateLimit:
      description: Remaining client budget (IETF RateLimit header draft).
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  parameters:
    StrategyId:
      name: strategyId
      in: path
      required: true
      description: The file name without .py, lowercase, with - as _.
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9_]{0,31}$" }
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AccountId" }
    AccountQuery:
      name: account
      in: query
      required: true
      schema: { $ref: "#/components/schemas/AccountId" }
    AccountQueryOptional:
      name: account
      in: query
      description: Pin the request to this account. Without it, market data may be served from any of your accounts that allow pooling.
      schema: { $ref: "#/components/schemas/AccountId" }
    ModeQuery:
      name: mode
      in: query
      description: "`paper` reads the account's paper book; `live` the broker's (default for portfolio reads)."
      schema: { type: string, enum: [paper, live], default: live }
    Symbols:
      name: symbols
      in: query
      required: true
      description: Comma-separated symbols (up to 200).
      schema: { type: string, maxLength: 8000 }
    SymbolQuery:
      name: symbol
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Symbol" }
    Backup:
      name: backup
      in: query
      description: >-
        Unpinned reads only. true lets a read that no broker account can answer fall back to the free backup sources
        (Yahoo Finance, NSE website; freshness.source "backup", delayed); false never does. Default from config
        (backup.enabled and backup.autoFallback).
      schema: { type: boolean }
    MaxAge:
      name: maxAgeMs
      in: query
      description: Oldest data you accept, in ms. 0 forces a live read (still within rate limits). Default depends on the endpoint (LTP 1000, quotes 2000, chain 3000).
      schema: { type: integer, minimum: 0, maximum: 3600000 }
    Swr:
      name: swr
      in: query
      description: Stale-while-revalidate. When only an older cached value exists (inside market.stale.maxStaleMs), answer with it at once, labelled `freshness.stale` and `freshness.revalidating`, and refresh it in the background (one refresh however many readers ask).
      schema: { type: boolean, default: false }
    ReadPriority:
      name: priority
      in: query
      description: "`background` for a prefetch: it waits behind every interactive read, and a read for the same thing joins it and raises its priority. Reads never run at order priority."
      schema: { type: string, enum: [interactive, background], default: interactive }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `meta.nextCursor`.
      schema: { type: string, maxLength: 512 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Your unique id for this write (UUID recommended). A retry with the same key and the same body returns the first
        result with `Idempotency-Replayed: true`; a different body is refused with 409 IDEMPOTENCY_KEY_REUSED; a retry
        while the first is still running gets 409 IDEMPOTENCY_IN_PROGRESS. Keys are kept until the end of the IST
        trading day and at least 24 hours. For POST /v1/orders, `clientOrderId` in the body works the same way when the
        header is absent.
      schema: { type: string, minLength: 8, maxLength: 255, pattern: "^[A-Za-z0-9_.:-]+$" }

  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit: { $ref: "#/components/headers/RateLimit" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    AnalyticsResult:
      description: Computed analytics. `data` is specific to the route; chain-based routes add `meta.freshness`.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { type: object, additionalProperties: true }
              errors: { type: array, items: { type: object, additionalProperties: true } }
              meta: { $ref: "#/components/schemas/Meta" }
    StrategyResult:
      description: A strategy answer (docs/STRATEGIES-PYTHON.md). `data` depends on the route.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { type: object, additionalProperties: true }
              meta: { $ref: "#/components/schemas/Meta" }
  schemas:
    TriggerLegInput:
      type: object
      required: [trigger, order]
      properties:
        trigger: { type: number, exclusiveMinimum: 0 }
        op: { type: string, enum: [above, below], description: "Default: the side of the price now that the trigger is on." }
        role: { type: string, enum: [entry, stop, target] }
        trail: { type: [object, "null"], properties: { points: { type: number }, pct: { type: number, maximum: 50 } } }
        order:
          type: object
          required: [side]
          properties:
            side: { type: string, enum: [BUY, SELL] }
            quantity: { type: integer, minimum: 1 }
            lots: { type: integer, minimum: 1 }
            orderType: { type: string, enum: [LIMIT, MARKET], default: MARKET }
            price: { type: number }
    TriggerInput:
      type: object
      required: [account, symbol, product, legs]
      properties:
        account: { type: string }
        symbol: { type: string }
        product: { type: string, enum: [INTRADAY, MARGIN, CNC, MTF] }
        type: { type: string, enum: [single, oco] }
        origin: { type: string, enum: [gtt, bracket, position, amo], default: gtt, description: "amo: an after-market order, one leg without a trigger, held on this Bridge and sent at 09:15 IST on the next trading day through every check." }
        parentOrderId: { type: string, description: "bracket: the entry order, which must exist and be in the same mode as the bracket (else VALIDATION_FAILED). The exits arm when it fills; if it ends part filled (cancelled or expired after a partial fill) they arm for the filled quantity, reduce-only; with nothing filled they are cancelled." }
        mode: { type: string, enum: [paper, live], default: paper }
        name: { type: string, maxLength: 80 }
        expiresAt: { type: string, format: date-time }
        legs: { type: array, minItems: 1, maxItems: 2, items: { $ref: "#/components/schemas/TriggerLegInput" } }
    Trigger:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        account: { type: string }
        symbol: { type: string }
        product: { type: string }
        mode: { type: string, enum: [paper, live] }
        type: { type: string, enum: [single, oco] }
        origin: { type: string, enum: [gtt, bracket, position, amo] }
        openAt: { type: string, description: "amo: when it goes out (09:15 IST on the next trading day)." }
        held: { type: string, enum: [bridge, broker], description: "amo: held on this Bridge (it must be running at 09:15) or queued at the broker." }
        reduceOnly: { type: boolean }
        status: { type: string, enum: [waiting, active, firing, triggered, cancelled, failed, expired] }
        legs: { type: array, items: { type: object, additionalProperties: true } }
        expiresAt: { type: string }
        convertedFrom: { type: string, description: "The trigger this one was split from when part of its position was converted to another product." }
        lastLtp: { type: [number, "null"] }
        result: { type: [object, "null"], additionalProperties: true, description: "orderId, status, code and message once it fired, failed or was cancelled." }
        warnings: { type: array, items: { type: string } }
    PaperDailyPnl:
      type: object
      required: [day, at, source, equity, pnl]
      properties:
        day: { type: string, format: date }
        at: { type: string, description: When the row was taken (IST, +05:30). }
        source: { type: string, enum: [eod, manual] }
        equity: { type: number }
        realised: { type: number }
        unrealised: { type: number }
        charges: { type: number }
        pnl: { type: number, description: The day's change in equity (from the previous row, or the starting capital after a reset). }
        usedMargin: { type: [number, "null"] }
        openPositions: { type: integer }
    SnapshotUnits:
      type: object
      properties:
        oi: { type: string, const: units }
        volume: { type: string, const: units }
        iv: { type: string, const: percent }
        price: { type: string, const: INR }
        age: { type: string, const: ms }
    SnapshotSide:
      type: object
      description: Arrays aligned to `strikes`; only the requested fields are present; null = no value.
      additionalProperties:
        type: array
        items: { type: [number, "null"] }
    OptionSnapshot:
      type: object
      required: [slot, ts, source, quality, partial, strikes, ce, pe]
      properties:
        slot: { type: string, format: date-time }
        ts: { type: string, format: date-time }
        source: { type: string, enum: [stream, rest, nse-backup, backfill], description: "Open enum." }
        accountId: { type: [string, "null"] }
        broker: { type: [string, "null"] }
        accounts: { type: [object, "null"], additionalProperties: { type: integer } }
        quality: { type: string, enum: [live, demo, demo-backfill, suspect-holiday], description: "Open enum." }
        partial: { type: boolean }
        missingLegs: { type: integer }
        oiUnitVerified: { type: boolean }
        lotSize: { type: [integer, "null"] }
        spot: { type: [number, "null"] }
        forward: { type: [number, "null"] }
        atm: { type: [number, "null"] }
        straddle: { type: [number, "null"] }
        rate: { type: [number, "null"], description: "Decimal." }
        t: { type: [number, "null"], description: "Years." }
        model: { type: string }
        strikes: { type: array, items: { type: number } }
        ce: { $ref: "#/components/schemas/SnapshotSide" }
        pe: { $ref: "#/components/schemas/SnapshotSide" }
    SnapshotGap:
      type: object
      required: [from, to, slots, reason]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        slots: { type: integer }
        minutes: { type: integer, description: "Minutes the gap stands for (slots times each slot's cadence)." }
        reason: { type: string, enum: [stream-down, budget, broker-error, session-expired, not-subscribed-yet, bridge-down, disk-full, paused], description: "Open enum." }
        detail: { type: [string, "null"] }
    OptionSnapshotPage:
      type: object
      required: [underlying, expiry, units, fields, snapshots, gaps, coverage]
      properties:
        underlying: { type: string }
        expiry: { type: string, format: date }
        exchange: { type: [string, "null"] }
        units: { $ref: "#/components/schemas/SnapshotUnits" }
        fields: { type: array, items: { type: string } }
        snapshots: { type: array, items: { $ref: "#/components/schemas/OptionSnapshot" } }
        gaps: { type: array, items: { $ref: "#/components/schemas/SnapshotGap" } }
        coverage:
          type: object
          properties:
            expectedSlots: { type: integer }
            recordedSlots: { type: integer }
            gapSlots: { type: integer }
            partialSlots: { type: integer }
            firstSlot: { type: [string, "null"], format: date-time }
            lastSlot: { type: [string, "null"], format: date-time }
        unavailable:
          type: [object, "null"]
          properties:
            reason: { type: string, enum: [not-in-plan, not-recorded-yet, refused] }
            detail: { type: string }
        method: { type: object, additionalProperties: { type: string } }
        nextCursor: { type: [string, "null"] }
    OptionDailyRow:
      type: object
      required: [date, underlying, expiry, quality]
      properties:
        date: { type: string, format: date }
        underlying: { type: string }
        expiry: { type: string, format: date }
        asOf: { type: string, format: date-time }
        source: { type: string }
        quality: { type: string }
        spot: { type: [number, "null"] }
        forward: { type: [number, "null"] }
        atm: { type: [number, "null"] }
        straddle: { type: [number, "null"] }
        pcrOi: { type: [number, "null"] }
        pcrVolume: { type: [number, "null"] }
        maxPain: { type: [number, "null"] }
        strikesCovered: { type: integer }
        largestCallOi: { type: [object, "null"], description: "Strike with the largest call OI (not P1-8's gamma Call Wall).", properties: { strike: { type: number }, oi: { type: integer } } }
        largestPutOi: { type: [object, "null"], description: "Strike with the largest put OI (not P1-8's gamma Put Wall).", properties: { strike: { type: number }, oi: { type: integer } } }
        ceOi: { type: [integer, "null"] }
        peOi: { type: [integer, "null"] }
        topAdds: { type: array, items: { type: object, properties: { strike: { type: number }, right: { type: string, enum: [CE, PE] }, dOi: { type: integer } } } }
        topCuts: { type: array, items: { type: object, properties: { strike: { type: number }, right: { type: string, enum: [CE, PE] }, dOi: { type: integer } } } }
        dOiBasis: { type: string, enum: [prev-recorded, broker-prev-close, none] }
        future: { type: [object, "null"], properties: { expiry: { type: string, format: date }, ltp: { type: number }, oi: { type: [integer, "null"] }, basis: { type: number }, basisAnnPct: { type: [number, "null"] }, rolloverPct: { type: [number, "null"] } } }
        slots: { type: integer }
        gapSlots: { type: integer }
        partialSlots: { type: integer }
        gex: { type: "null", description: "Reserved for P1-8." }
        zeroGamma: { type: "null", description: "Reserved for P1-8." }
    RecorderConfig:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        account: { type: [string, "null"] }
        indices: { type: array, items: { type: string }, maxItems: 12 }
        indexExpiries: { type: integer, minimum: 1, maximum: 4 }
        indexStrikes: { type: integer, minimum: 1, maximum: 60 }
        stocks: { type: array, items: { type: string }, maxItems: 200 }
        stockExpiries: { type: integer, minimum: 1, maximum: 2 }
        stockStrikes: { type: integer, minimum: 1, maximum: 30 }
        stockEveryMinutes: { type: integer, enum: [5, 10, 15] }
        sources: { type: object, properties: { stream: { type: boolean }, rest: { type: boolean }, nseBackup: { type: boolean } } }
        budgetShare: { type: number, minimum: 0.05, maximum: 0.5 }
        streamShare: { type: number, minimum: 0.1, maximum: 0.9 }
        strikeBuffer: { type: integer, minimum: 0, maximum: 10 }
        allowSingleTokenRest: { type: boolean }
        retentionDays: { type: integer, minimum: 7, maximum: 3650 }
        maxDiskMb: { type: integer, minimum: 100 }
        recordSpecialSessions: { type: boolean }
        dailyAt: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        slotOffsetMs: { type: integer, minimum: 0, maximum: 30000 }
        restSpreadMs: { type: integer, minimum: 0, maximum: 55000 }
        demo: { type: object, properties: { alwaysOpen: { type: boolean }, backfillDays: { type: integer, minimum: 0, maximum: 5 } } }
    RecorderPlanResult:
      type: object
      required: [ok, message, plan]
      properties:
        ok: { type: boolean }
        message: { type: string }
        plan: { type: object }
        budget: { type: object }
        capacity: { type: object }
    RecorderStatus:
      type: object
      required: [state, demo, session, plan, today, disk, coverage, sources, warnings]
      properties:
        state: { type: string, enum: [recording, idle-closed, paused, not-configured, degraded, holiday-suspected, disk-full, error], description: "Open enum." }
        stateDetail: { type: string }
        demo: { type: boolean }
        account: { type: [object, "null"] }
        session: { type: object }
        plan: { type: object }
        budget: { type: object }
        today: { type: object }
        disk: { type: object }
        coverage:
          type: array
          description: "One row per planned chain today. *Slots counts records; *Minutes weighs each slot by its cadence (a 5-minute chain's slot is 5 minutes); everyMinutesNow is the cadence in force now (the demo's always-open clock uses 5 minutes outside 09:15-15:30)."
          items:
            type: object
            properties:
              underlying: { type: string }
              expiry: { type: string, format: date }
              everyMinutes: { type: integer }
              everyMinutesNow: { type: integer }
              firstSlot: { type: [string, "null"], format: date-time }
              expectedSlots: { type: integer }
              recordedSlots: { type: integer }
              gapSlots: { type: integer }
              expectedMinutes: { type: integer }
              recordedMinutes: { type: integer }
              gapMinutes: { type: integer }
              gaps: { type: array, items: { $ref: "#/components/schemas/SnapshotGap" } }
        sources: { type: object }
        oiUnits: { type: object }
        holidaySuspected: { type: [object, "null"], description: "Set when today looked like an unlisted holiday (flat first six minutes, no volume)." }
        backfill: { type: [object, "null"], description: "Demo mode only: the synthetic back-fill." }
        settings: { type: object, description: "The recorder settings in use (RecorderConfig shape)." }
        warnings: { type: array, items: { type: string } }
        feasibility:
          type: array
          description: "Only with ?feasibility=true: one row per broker (default settings), the same words as the table in docs/guides/recorder.md."
          items:
            type: object
            properties:
              broker: { type: string }
              label: { type: string }
              feed: { type: string }
              rest: { type: string }
              indices: { type: string }
              stocks: { type: string }
              restAllowed: { type: boolean }
              indexByStream: { type: integer }
              indexByRest: { type: integer }
              indexRefused: { type: integer }
              stocksTotal: { type: integer }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: "Human text. Do not parse it." }
        code: { $ref: "#/components/schemas/ErrorCode" }
        retryable: { type: boolean, description: "Safe to send exactly this request again (after Retry-After)." }
        requestId: { type: string }
        retryAfterMs: { type: integer }
        broker:
          type: object
          description: The broker's own error, when one caused this.
          properties:
            id: { type: string }
            code: { type: string }
            message: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
        canCarry:
          type: object
          description: "CAPACITY_EXCEEDED only (PUT /v1/options/recorder/config): the underlyings the data account can carry."
          properties:
            indices: { type: array, items: { type: string } }
            stocks: { type: array, items: { type: string } }
        refused:
          type: array
          description: "CAPACITY_EXCEEDED only: the chains refused for capacity, with the reason."
          items: { type: object }
    ErrorCode:
      type: string
      description: Stable codes; new ones may be added. Source of truth server/bridge/core/errors.mjs.
      enum:
        - VALIDATION_FAILED
        - INVALID_JSON
        - UNAUTHENTICATED
        - SCOPE_REQUIRED
        - ACCOUNT_FORBIDDEN
        - HOST_NOT_ALLOWED
        - ORIGIN_NOT_ALLOWED
        - LOOPBACK_ONLY
        - NOT_FOUND
        - ACCOUNT_NOT_FOUND
        - SYMBOL_NOT_FOUND
        - ORDER_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - DUPLICATE_CLIENT_ORDER_ID
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CAPABILITY_UNSUPPORTED
        - INVALID_ORDER
        - SESSION_EXPIRED
        - CONFIRMATION_REQUIRED
        - CAPACITY_EXCEEDED
        - ALERT_LIMIT
        - STATE_CONFLICT
        - PAPER_ONLY
        - ORDER_GATE_CLOSED
        - DAILY_LIMIT_REACHED
        - MARKET_CLOSED
        - KILL_SWITCH_ACTIVE
        - CANNOT_TRADE
        - AUTOMATION_NOT_ALLOWED
        - RATE_LIMITED
        - ORDER_RATE_LIMITED
        - UPSTREAM_RATE_LIMITED
        - SUBSCRIPTION_LIMIT
        - INTERNAL
        - NOT_IMPLEMENTED
        - UPSTREAM_ERROR
        - BROKER_UNAVAILABLE
        - UPSTREAM_TIMEOUT
        - OUTCOME_UNKNOWN
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
        nextCursor: { type: [string, "null"], description: "Present on list endpoints; null on the last page." }
        accountId: { type: [string, "null"] }
        mode: { type: string, enum: [paper, live] }
        freshness: { $ref: "#/components/schemas/Freshness" }
        demo: { type: boolean, description: "Demo mode only: true. The data is generated sample data, not live market data (every response also carries the header X-MCB-Data: demo)." }
        dataNotice: { type: string, description: "Demo mode only: a plain sentence saying so." }
    ItemError:
      type: object
      required: [code, message]
      properties:
        symbol: { type: string }
        orderId: { type: string }
        input: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
    Health:
      type: object
      required: [status, version, apiVersion]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        apiVersion: { type: string }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer }
        demo: { type: boolean, description: "Present and true only in demo mode (sample data, no real broker)." }
        dataNotice: { type: string, description: "In demo mode: a plain sentence saying the data is sample data." }
        services:
          type: object
          additionalProperties: { type: string, enum: [ready, not_built] }
        startup:
          type: object
          description: >-
            Present only while the Bridge is starting and holds positions, funds, orders, trades and the book (at most
            20 s) until its start-up jobs finish (in demo mode, the demo book seed), so no client reads a partial book.
            Each job's progress lets a page show it instead of a silent wait. Absent once those reads answer.
          required: [ready, jobs]
          properties:
            ready: { type: boolean, enum: [false] }
            jobs:
              type: array
              items:
                type: object
                required: [name, done, total]
                properties:
                  name: { type: string, description: 'For example "demo book seed".' }
                  done: { type: [integer, "null"], description: "Steps done (seeded legs), null until the job reports." }
                  total: { type: [integer, "null"], description: "Steps in all, null until known." }
    MetaInfo:
      type: object
      required: [bridgeVersion, apiVersion, brokers, modules, routes]
      properties:
        bridgeVersion: { type: string }
        apiVersion: { type: string }
        brokerContractVersion: { type: integer }
        brokers: { type: array, items: { type: string } }
        modules:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              stream: { type: string }
        routes:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              path: { type: string }
              scope: { type: [string, "null"] }
              auth: { type: string }

    Symbol:
      type: string
      maxLength: 64
      description: Canonical Bridge symbol (see the introduction). Inputs may use accepted aliases.
      examples: ["NSE:RELIANCE", "NSE:NIFTY", "NFO:NIFTY-2026-10-27-FUT", "NFO:NIFTY-2026-10-27-25000-CE"]
    SymbolFormatName:
      type: string
      enum: [auto, canonical, chart, compact, broker]
      default: auto
    Exchange:
      type: string
      enum: [NSE, BSE, NFO, BFO, MCX, CDS]
    InstrumentKind:
      type: string
      enum: [INDEX, EQ, FUT, OPT]
    Interval:
      type: string
      enum: ["1m", "3m", "5m", "10m", "15m", "30m", "60m", "1d", "1w", "1M"]
    StreamMode:
      type: string
      enum: [ltp, quote, depth]
      default: ltp
    AccountId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,31}$"
    ClientOrderId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
      description: Your own id for an order, unique per account per IST day. The Bridge maps it to the broker's shorter tag field itself.
    CompatReply:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [success, error] }
        message: { type: string }
        mode: { type: string, enum: [analyze], description: "Present while analyzer (paper) mode is on." }
        data: {}
        orderid: { type: [string, "null"] }
      additionalProperties: true
    ScanRequest:
      type: object
      required: [condition]
      description: Give universe or symbols (not both).
      properties:
        name: { type: string, maxLength: 80 }
        universe: { type: string, description: "FNO, NIFTY50, INDICES or a name from scanner.universes" }
        symbols: { type: array, items: { type: string }, maxItems: 5000 }
        interval: { type: string, enum: ["1m", "3m", "5m", "10m", "15m", "30m", "60m", "1d", "1w", "1M", "live"], default: "1d", description: "live: daily bars with today's bar live at the end, plus the facts (OI change, PCR, IV rank, MWPL ...; GET /v1/scanner/library lists them)." }
        lookback: { type: integer, minimum: 2, maximum: 5000, description: "Bars per symbol; default from the condition" }
        condition: { type: string, maxLength: 1000, example: "rsi(14) > 60 and close crosses above ema(20)" }
        columns: { type: array, maxItems: 12, items: { type: string }, example: ["rsi(14)", "close / sma(200) - 1"] }
        sort:
          type: object
          properties:
            by: { type: string }
            order: { type: string, enum: [asc, desc], default: desc }
        limit: { type: integer, minimum: 1, maximum: 5000 }
        source: { type: string, enum: [auto, broker, backup], default: auto }
    SavedScanRequest:
      type: object
      required: [name, request]
      properties:
        name: { type: string, maxLength: 80 }
        request: { $ref: "#/components/schemas/ScanRequest" }
        everyMinutes: { type: integer, minimum: 1, maximum: 1440, nullable: true }
        marketHoursOnly: { type: boolean, default: true }
        atClose: { type: boolean, default: false, description: "Run once after the close (15:31 IST) on trading days." }
        notify: { type: boolean, default: true, description: "Send scan.alert to the notification targets." }
        builder: { type: object, nullable: true, description: "The builder model, so the scan reopens in the builder." }
        libraryId: { type: string, nullable: true }
        columns: { type: array, maxItems: 20, items: { type: string } }
    SavedScanPatch:
      type: object
      description: Any of the SavedScanRequest fields.
      properties:
        name: { type: string, maxLength: 80 }
        request: { $ref: "#/components/schemas/ScanRequest" }
        everyMinutes: { type: integer, minimum: 1, maximum: 1440, nullable: true }
        marketHoursOnly: { type: boolean }
        atClose: { type: boolean }
        notify: { type: boolean }
        builder: { type: object, nullable: true }
        libraryId: { type: string, nullable: true }
        columns: { type: array, maxItems: 20, items: { type: string } }

    Freshness:
      type: object
      required: [source, asOf, ageMs, stale]
      properties:
        source:
          type: string
          enum: [stream, cache, broker, paper, backup]
          description: backup = a free public source (named in provider) used because no broker account could answer; may be delayed.
        asOf: { type: string, format: date-time }
        ageMs: { type: integer, minimum: 0 }
        stale: { type: boolean }
        accountId: { type: [string, "null"], description: "Account whose connection supplied the data." }
        broker: { type: [string, "null"] }
        provider: { type: string, enum: [yahoo, nse], description: "Only for source backup: which public source supplied it." }
        revalidating: { type: boolean, description: "Only with ?swr=true: this older value was answered at once and a refresh is running behind it." }
        quiet:
          type: object
          description: "Stream-first option chains only: legs whose last tick is older than the freshness target, used because nothing traded (live subscription, feed ticking now, tick from the current connection, at most market.quietLegMaxAgeMs old). Each such leg carries tickAgeMs. asOf and ageMs describe the live legs and the spot."
          properties:
            legs: { type: integer, minimum: 1 }
            oldestTickAgeMs: { type: integer, minimum: 0 }
            maxAgeMs: { type: integer, minimum: 0 }

    BrokerInfo:
      type: object
      required: [id, name, authKind, capabilities, verified]
      properties:
        id: { type: string }
        name: { type: string }
        authKind: { type: string, enum: [apiKeyToken, oauthRedirect, requestTokenExchange, sessionLogin] }
        capabilities: { type: array, items: { type: string } }
        verified: { type: boolean, description: "Checked end to end against a live account." }
        credentialFields: { type: array, items: { type: string }, description: "Keys to send in SessionConnectRequest.values." }
        loginFields:
          type: array
          description: "sessionLogin brokers only: keys to send in SessionConnectRequest.secrets (used once, never stored)."
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              kind: { type: string, enum: [secret, totp] }
        tokenExpiry: { type: [string, "null"], description: "When the broker's session usually ends, as the broker documents it." }
        loginUrl:
          type: string
          description: "The broker's own login page, with {field} placeholders that are all credentialFields (e.g. {apiKey}). Only for brokers that declare one."
        policy: { $ref: "#/components/schemas/BrokerPolicy" }
    BrokerPolicy:
      type: object
      properties:
        limits:
          type: object
          additionalProperties:
            type: object
            properties:
              perSecond: { type: number }
              perMinute: { type: number }
              perDay: { type: number }
              verified: { type: boolean }
              source: { type: string, format: uri }
        maxQuoteBatch: { type: integer }
        feed:
          type: object
          properties:
            maxConnections: { type: [integer, "null"] }
            maxSubscriptions: { type: [integer, "null"] }
        pooling: { type: string, enum: [allowed, not-allowed, unknown] }
        maxModificationsPerOrder: { type: [integer, "null"] }
    SessionState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [connected, expired, missing, error, checking] }
        expiresAt: { type: [string, "null"], format: date-time }
        checkedAt: { type: [string, "null"], format: date-time }
        message: { type: [string, "null"] }
    AccountSummary:
      type: object
      required: [id, broker, label, enabled, session, liveAllowedByConfig, pooling, capabilities]
      properties:
        id: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        session: { $ref: "#/components/schemas/SessionState" }
        liveAllowedByConfig: { type: boolean }
        pooling: { type: boolean, description: "This account's market-data budget may serve requests that did not name an account." }
        capabilities: { type: array, items: { type: string } }
        authKind: { type: [string, "null"] }
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [broker]
      properties:
        broker: { type: string, description: "An adapter id from GET /v1/brokers, or paper." }
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,31}$", description: "Optional; the Bridge picks one when it is left out." }
        label: { type: string, maxLength: 60, description: "A name you will recognise. Optional." }
        leaveDemo: { type: boolean, description: "Demo mode only: also remove `\"demo\": true` from the config file, so the next start is normal." }

    SessionConnectRequest:
      type: object
      additionalProperties: false
      properties:
        values:
          type: object
          description: Non-secret fields the broker needs (apiKey, clientId, accessToken ...). Stored encrypted.
          additionalProperties: { type: string, maxLength: 4096 }
        secrets:
          type: object
          description: Password/PIN and the current TOTP code for session-login brokers. Used once, never stored.
          additionalProperties: { type: string, maxLength: 256 }

    KeyRecord:
      type: object
      required: [id, label, scopes, accounts, createdAt]
      properties:
        id: { type: string }
        label: { type: string }
        scopes: { type: array, items: { type: string, enum: [read, paper, live, admin] } }
        accounts:
          oneOf:
            - { type: string, const: "*" }
            - { type: array, items: { $ref: "#/components/schemas/AccountId" } }
        allowQuery: { type: boolean }
        clientKind: { type: string, enum: [script, excel, mcp, ui, other] }
        purpose:
          type: string
          enum: [strategy-run]
          description: Set by the Bridge only, never from a request. strategy-run is a Python strategy's per-run key (revoked when the run ends and at every start); it cannot set triggers.
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    CancelAllOpenOrder:
      type: object
      required: [orderId, accountId, mode, external]
      properties:
        orderId: { type: string, description: "The Bridge order id, or the broker's order id for one placed outside the Bridge." }
        accountId: { type: string }
        mode: { type: string, enum: [paper, live] }
        symbol: { type: string }
        side: { type: [string, "null"] }
        quantity: { type: [integer, "null"] }
        status: { type: string }
        external: { type: boolean }
    KeyCreateRequest:
      type: object
      required: [label, scopes]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        scopes: { type: array, minItems: 1, items: { type: string, enum: [read, paper, live, admin] } }
        accounts:
          oneOf:
            - { type: string, const: "*" }
            - { type: array, minItems: 1, items: { $ref: "#/components/schemas/AccountId" } }
        expiresAt: { type: [string, "null"], format: date-time }
        allowQuery: { type: boolean, default: false, description: "Allow ?key= use. Only for keys whose only scope is read." }
        clientKind: { type: string, enum: [script, excel, mcp, ui, other] }
    KeyCreated:
      type: object
      required: [key, record]
      properties:
        key: { type: string, description: "Shown once." }
        record: { $ref: "#/components/schemas/KeyRecord" }

    Instrument:
      type: object
      required: [symbol, exchange, kind, underlying, lotSize, tickSize]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        exchange: { $ref: "#/components/schemas/Exchange" }
        kind: { $ref: "#/components/schemas/InstrumentKind" }
        underlying: { type: string }
        name: { type: [string, "null"] }
        expiry: { type: [string, "null"], format: date }
        strike: { type: [number, "null"] }
        right: { type: [string, "null"], enum: [CE, PE, null] }
        lotSize: { type: integer, minimum: 1 }
        tickSize: { type: number, exclusiveMinimum: 0 }
        freezeQty: { type: [integer, "null"] }
        freezeQtySource:
          type: [string, "null"]
          enum: [master, exchange-list, null]
          description: Where freezeQty came from. "exchange-list" is the Bridge's dated list and is marked needs-verification.
        isin: { type: [string, "null"] }
        refs:
          type: object
          description: Present with include=refs. Keyed by broker id.
          additionalProperties:
            type: object
            properties:
              token: { type: string }
              exchange: { type: string }
              tradingSymbol: { type: [string, "null"] }
    ConvertRequest:
      type: object
      required: [input]
      additionalProperties: false
      properties:
        input: { type: string, maxLength: 64 }
        from: { $ref: "#/components/schemas/SymbolFormatName" }
        exchange: { type: string, maxLength: 12 }
        broker: { type: string }
    ConvertResult:
      type: object
      required: [input, canonical, aliases]
      properties:
        input: { type: string }
        canonical: { $ref: "#/components/schemas/Symbol" }
        aliases:
          type: object
          description: "chart (chart ticker such as NSE:NIFTY1!), compact (symbol and exchange) and, when a broker is given or connected, broker:<id>."
          additionalProperties: { type: [string, "null"] }

    LtpItem:
      type: object
      required: [symbol, ltp, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: number }
        freshness: { $ref: "#/components/schemas/Freshness" }
    QuoteItem:
      type: object
      required: [symbol, ltp, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: number }
        open: { type: [number, "null"] }
        high: { type: [number, "null"] }
        low: { type: [number, "null"] }
        close: { type: [number, "null"], description: "Previous close." }
        change: { type: [number, "null"] }
        changePct: { type: [number, "null"] }
        volume: { type: [number, "null"] }
        oi: { type: [number, "null"] }
        bid: { type: [number, "null"] }
        ask: { type: [number, "null"] }
        bidQty: { type: [number, "null"] }
        askQty: { type: [number, "null"] }
        freshness: { $ref: "#/components/schemas/Freshness" }
    DepthLevel:
      type: object
      required: [price, qty]
      properties:
        price: { type: number }
        qty: { type: number }
        orders: { type: [integer, "null"] }
    DepthItem:
      type: object
      required: [symbol, bids, asks, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        bids: { type: array, items: { $ref: "#/components/schemas/DepthLevel" } }
        asks: { type: array, items: { $ref: "#/components/schemas/DepthLevel" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Candle:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time: { type: integer, description: "Bar open time, epoch seconds." }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
        oi: { type: number }
    HistoryResult:
      type: object
      required: [symbol, interval, candles, freshness, partial]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        interval: { $ref: "#/components/schemas/Interval" }
        candles: { type: array, items: { $ref: "#/components/schemas/Candle" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
        partial: { type: boolean, description: "True when the broker could not supply the whole range (history depth limits)." }
    ChainLeg:
      type: object
      required: [symbol]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: [number, "null"] }
        bid: { type: [number, "null"] }
        ask: { type: [number, "null"] }
        oi: { type: [number, "null"] }
        oiChange: { type: [number, "null"] }
        volume: { type: [number, "null"] }
        iv: { type: [number, "null"], description: "Percent." }
        close: { type: [number, "null"], description: "Previous session's close, when the broker sends it." }
        change: { type: [number, "null"], description: "ltp - close; null without a close." }
        delta: { type: [number, "null"] }
        gamma: { type: [number, "null"] }
        theta: { type: [number, "null"] }
        vega: { type: [number, "null"] }
        greeksSource: { type: [string, "null"], enum: [broker, computed, null] }
        oiChangeBasis:
          type: [string, "null"]
          enum: [broker, recorder, day-baseline, null]
          description: >-
            Option sweep chains only: where oiChange came from. broker = the broker chain's own change; recorder = OI now
            minus the last OI recorded on the previous trading day; day-baseline = OI now minus the first OI seen today
            (oiChangeSince says when); null = unknown.
        oiChangeSince: { type: string, description: "day-baseline only: IST HH:MM of the baseline." }
        brokerIv: { type: [number, "null"], description: "The broker's own IV (percent), when it sent one and ivModel=b76-forward recomputed iv." }
        tickAgeMs: { type: integer, minimum: 0, description: "Stream-first chains only, on a quiet leg (freshness.quiet): how old its last tick is. The figures are its last trade; no tick on a live subscription means no trade since." }
        ivReason:
          type: [string, "null"]
          enum: [SETTLING, NOQUOTE, TICK, INTRINSIC, RANGE, SETTLED, NOFORWARD, null]
          description: >-
            ivModel=b76-forward only: why iv is null. SETTLING = expiry day inside the settlement window and the price within
            2 ticks of intrinsic on the forward; NOQUOTE = no usable price; TICK = price at or below one tick; INTRINSIC = at
            or below discounted intrinsic; RANGE = solved IV outside 1-300 %; SETTLED = past the settlement; NOFORWARD = no
            forward. Null when the IV solved.
    FnoBan:
      description: Ban band of a stock (null for indices).
      oneOf:
        - type: object
          required: [inBan]
          properties:
            inBan: { type: boolean }
            mwplPct: { type: [number, "null"] }
            band: { type: [string, "null"], enum: [ban, high, normal, null] }
            forDate: { type: [string, "null"], format: date }
            asOf: { type: [string, "null"] }
            source: { type: string, enum: [demo-override] }
        - type: object
          required: [available, reason]
          properties:
            available: { type: boolean, const: false }
            reason: { type: string }
    FnoUnderlying:
      type: object
      required: [underlying, kind, exchange, spot, settlement]
      properties:
        underlying: { type: string }
        name: { type: string }
        kind: { type: string, enum: [index, stock] }
        exchange: { type: string, enum: [NFO, BFO] }
        spot: { type: string, description: "The cash or index symbol that prices it." }
        settlement: { type: string, enum: [cash, physical] }
        lot: { type: [integer, "null"] }
        nextLot: { type: [object, "null"], properties: { lot: { type: [integer, "null"] }, from: { type: [string, "null"] } } }
        tickSize: { type: [number, "null"] }
        strikeStep: { type: [number, "null"], description: "Inferred from listed strikes." }
        freezeQty: { type: [integer, "null"] }
        weekly: { type: boolean }
        ban: { oneOf: [{ $ref: "#/components/schemas/FnoBan" }, { type: "null" }] }
        events: { type: integer }
        nonStandard: { type: boolean }
        sweep: { type: object, properties: { covered: { type: boolean }, method: { type: [string, "null"] }, limitedReason: { type: [string, "null"] } } }
        quote: { type: [object, "null"], properties: { ltp: { type: [number, "null"] }, changePct: { type: [number, "null"] } } }
    FnoUnderlyingList:
      type: object
      required: [asOf, source, counts, items]
      properties:
        asOf: { type: string }
        source: { type: object, properties: { universe: { type: string }, knownSince: { type: [string, "null"] }, masters: { type: array, items: { type: string } }, note: { type: string } } }
        counts: { type: object, properties: { index: { type: integer }, stock: { type: integer }, inBan: { type: integer }, missingAtBroker: { type: integer } } }
        items: { type: array, items: { $ref: "#/components/schemas/FnoUnderlying" } }
        quotes: { type: object, properties: { loaded: { type: boolean }, reason: { type: string } } }
    FnoUnderlyingDetail:
      allOf:
        - $ref: "#/components/schemas/FnoUnderlying"
        - type: object
          properties:
            expiries:
              type: array
              items: { type: object, properties: { date: { type: string, format: date }, kind: { type: [string, "null"] }, lot: { type: [integer, "null"] }, shifted: { type: boolean }, ruleDate: { type: string }, strikeStep: { type: [number, "null"] }, strikes: { type: integer }, tickSize: { type: [number, "null"] } } }
            deliveryMargin: { type: object, description: "Schedule for the nearest expiry (stocks), or { available false, reason INDEX_CASH_SETTLED }." }
            settlementPrice: { type: object, properties: { method: { type: string }, window: { type: string } } }
            nonStandardContracts: { type: array, items: { type: object, properties: { symbol: { type: string }, lot: { type: integer }, reason: { type: string } } } }
            rules: { type: array, items: { type: string } }
    ExpiryCostsRequest:
      type: object
      required: [underlying, legs]
      additionalProperties: false
      properties:
        underlying: { type: string, maxLength: 30 }
        asOf: { type: string, format: date }
        spot: { type: number, exclusiveMinimum: 0 }
        varElmPct: { type: number, minimum: 1, maximum: 100, description: "Your broker's VaR + ELM rate in percent; unlocks the indicative rupee delivery margin." }
        account: { type: string, maxLength: 64 }
        legs:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: object
            required: [symbol, qty]
            additionalProperties: false
            properties:
              symbol: { $ref: "#/components/schemas/Symbol" }
              qty: { type: integer, description: "Signed units: + long, − short." }
              bid: { type: number, minimum: 0 }
              ask: { type: number, minimum: 0 }
    ExpiryCostsLeg:
      type: object
      properties:
        symbol: { type: string }
        qty: { type: integer }
        moneyness: { type: [string, "null"], enum: [ITM, CTM, OTM, null], description: "CTM is the Bridge's display band (closeToMoneyStrikes steps), not an exchange definition." }
        intrinsic: { type: [number, "null"] }
        obligation: { type: [object, "null"], properties: { kind: { type: string, enum: [receive-shares, deliver-shares] }, shares: { type: integer }, cash: { type: number }, text: { type: string } } }
        deliveryMargin: { type: [object, "null"], properties: { pct: { type: [number, "null"] }, indicative: { type: [number, "null"] }, basis: { type: [string, "null"] }, inWindow: { type: boolean } } }
        settle: { type: [object, "null"], properties: { total: { type: number }, lines: { type: array, items: { type: object, properties: { key: { type: string }, value: { type: number } } } }, excluded: { type: array, items: { type: string } } } }
        squareOff: { type: [object, "null"], properties: { price: { type: [number, "null"] }, side: { type: string, enum: [BUY, SELL] }, total: { type: [number, "null"] }, premium: { type: [number, "null"] }, lines: { type: array, items: { type: object } } } }
        difference: { type: [number, "null"] }
        covered: { type: [boolean, "null"] }
        underlying: { type: string }
    ExpiryCostsResult:
      type: object
      required: [asOf, legs, notes]
      properties:
        asOf: { type: string, format: date }
        day: { type: [string, "null"], description: "E-n (trading days to the expiry) or E." }
        inWindow: { type: boolean }
        settlement: { type: string, enum: [cash, physical] }
        spot: { type: [number, "null"] }
        strikeStep: { type: [number, "null"] }
        rates: { type: object, properties: { asOf: { type: [string, "null"] }, verified: { type: boolean }, source: { type: string } } }
        legs: { type: array, items: { $ref: "#/components/schemas/ExpiryCostsLeg" } }
        notes: { type: array, items: { type: string } }
    SweepRequest:
      type: object
      additionalProperties: false
      properties:
        underlyings:
          oneOf:
            - { type: string, enum: [indices, stocks, indices+stocks] }
            - { type: array, maxItems: 500, items: { type: string, maxLength: 30 } }
        stocks:
          oneOf:
            - { type: string, enum: [all, optIn] }
            - { type: array, maxItems: 1000, items: { type: string, maxLength: 30 } }
        force: { type: boolean }
        method: { type: string, enum: [auto, chain, quotes] }
    SweepPlan:
      type: object
      properties:
        account: { type: object, properties: { id: { type: string }, broker: { type: string } } }
        fits: { type: boolean }
        limited: { type: boolean }
        groups:
          type: array
          items: { type: object, properties: { kind: { type: string, enum: [index, stock] }, method: { type: string, enum: [chain, quotes] }, keys: { type: integer }, stocks: { type: integer }, calls: { type: integer }, class: { type: string }, ratePerMin: { type: number }, minutes: { type: number } } }
        minutes: { type: number }
        hv: { type: object, properties: { calls: { type: integer }, source: { type: string }, minutes: { type: number } } }
        autoIntervalSec: { type: integer }
        maxStocksThatFit: { type: integer }
        message: { type: string }
        quotesVerified: { type: boolean }
        basis: { type: string }
    SweepJob:
      type: object
      required: [id, status, progress]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, done, partial, cancelled, failed, interrupted] }
        requestedBy: { type: string }
        startedAt: { type: string }
        finishedAt: { type: [string, "null"] }
        plan: { $ref: "#/components/schemas/SweepPlan" }
        progress:
          type: object
          properties:
            total: { type: integer }
            done: { type: integer }
            failed: { type: integer }
            phase: { type: [string, "null"], enum: [queued, spots, index-chains, stock-chains, hv, null] }
            current: { type: [string, "null"] }
            etaSeconds: { type: [integer, "null"] }
            calls: { type: object, additionalProperties: { type: integer } }
            hv: { type: object, properties: { done: { type: integer }, total: { type: integer } } }
        cursor: { type: integer }
        durationMs: { type: [integer, "null"] }
        joined: { type: boolean }
        reused: { type: boolean }
        lease: { type: object, properties: { until: { type: [string, "null"] } } }
    SweepChainsPage:
      type: object
      required: [items, nextCursor, done]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              seq: { type: integer }
              at: { type: string }
              method: { type: string, enum: [chain, quotes] }
              chain: { $ref: "#/components/schemas/OptionChain" }
        nextCursor: { type: integer }
        done: { type: boolean }
        hv: { type: object, additionalProperties: { type: number }, description: "HV20 (percent) per underlying; on the last page only." }
    SweepSettings:
      type: object
      properties:
        optIn: { type: array, items: { type: string } }
        setAt: { type: [string, "null"] }
        setBy: { type: [string, "null"] }
        background: { type: boolean }
        leaseSeconds: { type: integer }
        persisted: { type: boolean }
    OptionChain:
      type: object
      required: [underlying, expiry, rows, freshness]
      properties:
        underlying: { type: string }
        expiry: { type: string, format: date }
        underlyingLtp: { type: [number, "null"] }
        atmStrike: { type: [number, "null"] }
        lotSize: { type: [integer, "null"] }
        underlyingKind: { type: [string, "null"], enum: [index, stock, null], description: "From the master (OPTSTK vs OPTIDX: the spot row's kind)." }
        settlement: { type: [string, "null"], enum: [cash, physical, null], description: "physical for stock derivatives, cash for index derivatives." }
        strikeStep: { type: [number, "null"], description: "Most common gap between listed strikes of this expiry (inferred); null with fewer than 3 strikes." }
        tickSize: { type: [number, "null"], description: "Largest option tick size of this expiry in the master." }
        rows:
          type: array
          items:
            type: object
            required: [strike]
            properties:
              strike: { type: number }
              ce: { oneOf: [{ $ref: "#/components/schemas/ChainLeg" }, { type: "null" }] }
              pe: { oneOf: [{ $ref: "#/components/schemas/ChainLeg" }, { type: "null" }] }
        freshness: { $ref: "#/components/schemas/Freshness" }
        pricing: { $ref: "#/components/schemas/ChainPricing" }
    VolUnavailable:
      type: object
      required: [available, reason]
      properties:
        underlying: { type: string }
        available: { type: boolean, const: false }
        reason: { type: string, description: "Open enum: NOT_TRACKED, NO_HISTORY, COLLECTING, SOURCE_OFF, NO_CHAIN, NO_DATA_ACCOUNT, NOT_LISTED_IN_DEMO." }
    VolData:
      type: object
      description: Shapes in docs/spec/p1-03-pricing-vol.md §3.4–3.8; the full schemas land with the handlers (P1-3b/P1-3c).
      additionalProperties: true
    VolClockPart:
      type: object
      properties:
        date: { type: string, format: date }
        kind: { type: string, enum: [gap, session] }
        units: { type: number }
    VolClockResult:
      type: object
      properties:
        expiry: { type: string, format: date }
        T: { type: [number, "null"], description: "Years on the configured clock." }
        units: { type: [number, "null"], description: "Trading-day units (calendar days in calendar mode)." }
        Tcal: { type: [number, "null"], description: "Calendar years (ACT/365) to the expiry close." }
        Ttd: { type: [number, "null"], description: "Trading-day years (/252)." }
        parts: { type: array, items: { $ref: "#/components/schemas/VolClockPart" } }
    VolClock:
      type: object
      properties:
        underlying: { type: string }
        exchange: { type: string }
        at: { type: string, format: date-time }
        settings: { type: object, additionalProperties: true }
        rate: { type: object, additionalProperties: true }
        holidays:
          type: array
          description: Holidays in [at, at + 400 days] for the underlying's exchange; the dashboard builds its client clock from them.
          items:
            type: object
            required: [date, label, verified]
            properties:
              date: { type: string, format: date }
              label: { type: [string, "null"] }
              verified: { type: boolean }
        expiries: { type: array, items: { $ref: "#/components/schemas/VolClockResult" } }
    VolCaptureRequest:
      type: object
      additionalProperties: false
      properties:
        underlyings: { type: array, maxItems: 50, items: { type: string, maxLength: 30 } }
        replace: { type: boolean, default: false }
    VolBackfillRequest:
      type: object
      additionalProperties: false
      properties:
        sources: { type: array, items: { type: string, enum: [nse, bse, vix] } }
        from: { type: string, format: date }
        to: { type: string, format: date }
        underlyings: { type: array, maxItems: 50, items: { type: string, maxLength: 30 } }
    ChainPricing:
      type: object
      description: How every leg's IV and Greeks were computed (present with ivModel=b76-forward).
      properties:
        model: { type: string, const: black76-parity-forward }
        ivModel: { type: string, const: b76-forward }
        priceBasis: { type: string, const: mid }
        forward: { type: [number, "null"] }
        forwardSource: { type: [string, "null"], enum: [parity, spot, null] }
        forwardStrikes: { type: integer }
        rate:
          type: object
          properties:
            value: { type: number }
            quality: { type: [string, "null"] }
        clock:
          type: object
          properties:
            version: { type: string }
            mode: { type: string, enum: [weighted, trading, calendar] }
            T: { type: number, description: "Years on the vol-time clock (used inside sigma times root T)." }
            units: { type: number }
            Tcal: { type: number, description: "Calendar years (interest and discounting)." }
            yearBasis: { type: number, description: "Clock units a year; theta is per one unit." }
    StreamStats:
      type: object
      properties:
        clients: { type: integer }
        symbols: { type: integer }
        upstreams:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              broker: { type: string }
              connected: { type: boolean }
              subscriptions: { type: integer }
              limit: { type: [integer, "null"] }
              state: { type: string, enum: [up, stale, down] }
              detail: { type: [string, "null"] }
              reason: { type: [string, "null"] }
              modes: { type: object, additionalProperties: { type: integer } }
              reconnects: { type: integer }
              ticks: { type: integer }
              lastTickAt: { type: [string, "null"], format: date-time }
        downstream:
          type: object
          properties:
            connections: { type: integer }
            maxConnections: { type: integer }
            ws: { type: integer }
            sse: { type: integer }
            queued: { type: integer }
            conflatedTicks: { type: integer }
            slowDisconnects: { type: integer }
            opened: { type: integer }

    Position:
      type: object
      required: [symbol, product, netQty, avgPrice, pnl]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF, CO, BO] }
        netQty: { type: number }
        avgPrice: { type: number }
        ltp: { type: [number, "null"] }
        pnl: { type: number }
        realisedPnl: { type: [number, "null"] }
        unrealisedPnl: { type: [number, "null"] }
        charges: { type: [number, "null"], description: Paper accounts only; estimated brokerage and taxes. }
    Holding:
      type: object
      required: [symbol, qty, avgPrice]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        isin: { type: [string, "null"] }
        qty: { type: number }
        avgPrice: { type: number }
        ltp: { type: [number, "null"] }
        pnl: { type: [number, "null"] }
    Funds:
      type: object
      required: [availableCash, usedMargin]
      properties:
        availableCash: { type: number }
        usedMargin: { type: number }
        totalBalance: { type: [number, "null"] }
        collateral: { type: [number, "null"] }
        withdrawable: { type: [number, "null"] }
        realisedPnl: { type: [number, "null"] }
        unrealisedPnl: { type: [number, "null"] }

    OrderStatus:
      type: string
      enum: [pending, open, trigger_pending, partially_filled, filled, cancelled, rejected, expired, outcome_unknown]
    OrderRequest:
      type: object
      required: [account, symbol, side, product, orderType]
      additionalProperties: false
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer, minimum: 1, description: "Units; must be a multiple of the lot size. Send this or lots." }
        lots: { type: integer, minimum: 1 }
        lotSizeConfirmed: { type: integer, minimum: 1, description: "The lot size (units per lot) the caller has checked; used only when reference lot data is stale or conflicts with the master (preview check LOT_SIZE_STALE)." }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF], description: "No default." }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M], description: "No default." }
        price: { type: number, exclusiveMinimum: 0, description: "Required for LIMIT and SL." }
        triggerPrice: { type: number, exclusiveMinimum: 0, description: "Required for SL and SL-M." }
        validity: { type: string, enum: [DAY, IOC], default: DAY }
        marketProtectionPct: { type: number, exclusiveMinimum: 0, maximum: 10, description: "For MARKET and SL-M; defaults to the configured value." }
        disclosedQuantity: { type: integer, minimum: 0 }
        mode: { type: string, enum: [paper, live], default: paper }
        clientOrderId: { $ref: "#/components/schemas/ClientOrderId" }
        tag: { type: string, pattern: "^[A-Za-z0-9_-]{1,20}$", description: "Strategy label, kept in the audit log and sent to the broker where supported." }
        algoId: { type: string, maxLength: 32, description: "Exchange algo id for a registered strategy, where the broker accepts one." }
        confirmToken: { type: string, description: "From a human confirmation (required for orders prepared by AI assistants)." }
      oneOf:
        - required: [quantity]
          not: { required: [lots] }
        - required: [lots]
          not: { required: [quantity] }
    OrderChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        quantity: { type: integer, minimum: 1 }
        price: { type: number, exclusiveMinimum: 0 }
        triggerPrice: { type: number, exclusiveMinimum: 0 }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
        validity: { type: string, enum: [DAY, IOC] }
    OrderLeg:
      type: object
      required: [quantity, status]
      properties:
        brokerOrderId: { type: [string, "null"] }
        quantity: { type: integer }
        status: { $ref: "#/components/schemas/OrderStatus" }
        error:
          oneOf:
            - type: "null"
            - type: object
              properties:
                code: { type: string }
                message: { type: string }
    OrderResult:
      type: object
      required: [orderId, accountId, broker, mode, symbol, side, quantity, filledQuantity, orderType, product, status, legs, placedAt, updatedAt]
      properties:
        orderId: { type: string, description: "Bridge id: ord_... for live, PAPER-... for paper." }
        clientOrderId: { type: [string, "null"] }
        accountId: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        mode: { type: string, enum: [paper, live] }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer }
        filledQuantity: { type: integer }
        avgPrice: { type: [number, "null"] }
        price: { type: [number, "null"] }
        triggerPrice: { type: [number, "null"] }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF] }
        validity: { type: string, enum: [DAY, IOC] }
        status: { $ref: "#/components/schemas/OrderStatus" }
        brokerStatus: { type: [string, "null"], description: "The broker's own status text." }
        statusMessage: { type: [string, "null"] }
        legs:
          type: array
          description: One leg per broker order (orders above the freeze quantity are sliced).
          items: { $ref: "#/components/schemas/OrderLeg" }
        source: { type: string, enum: [rest, webhook, mcp, cli, system], description: '"system" is used for automatic intraday square-off of paper positions.' }
        tag: { type: [string, "null"] }
        placedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Check:
      type: object
      required: [code, message, severity]
      properties:
        code:
          type: string
          description: >-
            An open set. Codes include the error codes, SAFETY_WARNING, LOT_SIZE_STALE, and (p1-06) FNO_BAN (block: an
            opening order in a stock derivative in the F&O ban period; closing orders pass), FNO_BAN_UNCONFIRMED (warn:
            positions could not be read, the broker decides), BAN_DATA_UNAVAILABLE (warn: no ban list loaded) and
            PHYSICAL_SETTLEMENT (warn: from E-4, an opening order in an ITM or close-to-money stock option).
        message: { type: string }
        severity: { type: string, enum: [block, warn] }
    PreviewResult:
      type: object
      required: [ok, mode, checks, requiresHumanConfirmation]
      properties:
        ok: { type: boolean }
        mode: { type: string, enum: [paper, live] }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        margin:
          description: >-
            The margin this order would block. Paper orders (a paper account, or any account in paper mode): the paper
            engine's own model on the exposure the order adds (a quantity that closes a held position blocks nothing),
            the same figure its fill will use. Live orders: null (the broker decides). Each leg of a basket is sized
            alone, with no hedge benefit.
          oneOf:
            - type: object
              required: [required, source]
              properties:
                required: { type: [number, "null"], description: "Rupees." }
                source: { type: [string, "null"], enum: [paper-model, null] }
            - type: "null"
        resolved: { oneOf: [{ $ref: "#/components/schemas/Instrument" }, { type: "null" }] }
        quantity: { type: [integer, "null"] }
        estimatedValue: { type: [number, "null"] }
        ltp: { type: [number, "null"] }
        confirmToken: { type: [string, "null"] }
        confirmExpiresAt: { type: [string, "null"], format: date-time }
        requiresHumanConfirmation: { type: boolean }
        ticketId: { type: [string, "null"], description: "Set when a human must confirm; the ticket appears in GET /v1/tickets (the dashboard's Pending confirmations panel)." }
    Ticket:
      type: object
      required: [ticketId, order, source, checks, createdAt, expiresAt]
      properties:
        ticketId: { type: string }
        order: { $ref: "#/components/schemas/OrderRequest" }
        source: { type: string, enum: [mcp, webhook, rest] }
        client: { type: string, description: "Key label or hook label that prepared it." }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        estimatedValue: { type: [number, "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Trade:
      type: object
      required: [tradeId, orderId, symbol, side, qty, price]
      properties:
        tradeId: { type: string }
        orderId: { type: string }
        accountId: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live] }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        qty: { type: number }
        price: { type: number }
        product: { type: [string, "null"] }
        charges: { type: [number, "null"] }
        tradedAt: { type: [string, "null"], format: date-time }
    PaperAccount:
      type: object
      required: [accountId, startingCapital, funds]
      properties:
        accountId: { $ref: "#/components/schemas/AccountId" }
        startingCapital: { type: number }
        createdAt: { type: string, format: date-time }
        resetAt: { type: [string, "null"], format: date-time }
        ordersToday: { type: integer }
        funds: { $ref: "#/components/schemas/Funds" }
        fillModel: { type: string, description: "Short description of how paper fills are simulated." }

    LimitsReport:
      type: object
      properties:
        safety:
          type: object
          description: Effective safety limits per account (the stricter of global and account values).
          additionalProperties:
            type: object
            properties:
              dailyMaxOrders: { type: integer }
              dailyMaxLoss: { type: number }
              maxOrderValue: { type: number }
              maxLotsPerOrder: { type: integer }
              orderRatePerSecond: { type: number }
        brokers:
          type: object
          additionalProperties: { $ref: "#/components/schemas/BrokerPolicy" }
        client:
          type: object
          description: This key's own request budget.
          properties:
            perSecond: { type: number }
            remaining: { type: number }
    UsageReport:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              broker: { type: string }
              classes:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    used: { type: number }
                    limit: { type: number }
                    queued: { type: integer }
                    resetMs: { type: integer }
        savings:
          type: object
          description: Broker calls avoided today.
          properties:
            servedFromStream: { type: integer }
            servedFromCache: { type: integer }
            coalesced: { type: integer }
            batched: { type: integer }
    KillSwitchState:
      type: object
      required: [engaged]
      properties:
        engaged: { type: boolean }
        reason: { type: [string, "null"] }
        by: { type: [string, "null"] }
        at: { type: [string, "null"], format: date-time }
    SafetyStatus:
      type: object
      required: [killSwitch, liveTrading]
      properties:
        killSwitch: { $ref: "#/components/schemas/KillSwitchState" }
        liveTrading: { type: boolean, description: "Global config switch." }
        accounts:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              liveAllowedByConfig: { type: boolean }
              ordersToday: { type: integer }
              realisedPnlToday: { type: number }
              limits: { type: object }
    ReadinessState:
      type: string
      description: "Account trading readiness. Open enum: new values may be added."
      enum: [ready, warn, cannot_trade, paper_only, unknown]
    ReadinessReason:
      type: object
      required: [check, code, severity, message]
      properties:
        check: { type: string, examples: [session, egress, orderRate, dailyOrders, dailyLoss, killSwitch, live, readiness] }
        code:
          type: string
          description: >-
            Open list: LIVE_OFF, SESSION_EXPIRED, SESSION_MISSING, SESSION_ERROR, SESSION_REJECTED, SESSION_EXPIRES_SOON,
            PROBE_FAILED, IP_MISMATCH, IP_NOT_REGISTERED, IP_INVALID_CONFIG, IP_FAMILY_DIFFERS, IP_UNCHECKED,
            IP_LOOKUP_FAILED, CLOCK_SKEW, RATE_CAP_REACHED, BROKER_ORDER_BACKOFF, DAILY_ORDERS_LOW, DAILY_ORDERS_EXHAUSTED,
            DAILY_LOSS_NEAR, DAILY_LOSS_REACHED, KILL_SWITCH, STALE.
        severity: { type: string, enum: [warn, fail] }
        message: { type: string }
    ReadinessCheck:
      type: object
      required: [status]
      additionalProperties: true
      properties:
        status: { type: string, enum: [pass, warn, fail, unknown, n/a] }
    ReadinessAutomation:
      type: object
      required: [id, kind, label, mode, state]
      properties:
        id: { type: string }
        kind: { type: string, examples: [webhook, guard, alert, sample] }
        label: { type: string }
        mode: { type: string, enum: [paper, live] }
        state: { $ref: "#/components/schemas/ReadinessState" }
    AccountReadiness:
      type: object
      required: [accountId, broker, state, reasons, checks, live, simulated, stale]
      properties:
        accountId: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        brokerName: { type: string }
        label: { type: [string, "null"] }
        simulated: { type: boolean, description: "Demo mode: a simulated live account (no real broker)." }
        live:
          type: object
          properties:
            globalLiveTrading: { type: [boolean, string] }
            accountLiveEnabled: { type: [boolean, string] }
            allowedByConfig: { type: boolean }
        state: { $ref: "#/components/schemas/ReadinessState" }
        since: { type: [string, "null"], format: date-time }
        checkedAt: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        reasons: { type: array, items: { $ref: "#/components/schemas/ReadinessReason" } }
        checks:
          type: object
          properties:
            session: { $ref: "#/components/schemas/ReadinessCheck" }
            egress: { $ref: "#/components/schemas/ReadinessCheck" }
            orderRate: { $ref: "#/components/schemas/ReadinessCheck" }
            dailyOrders: { $ref: "#/components/schemas/ReadinessCheck" }
            dailyLoss: { $ref: "#/components/schemas/ReadinessCheck" }
            killSwitch: { $ref: "#/components/schemas/ReadinessCheck" }
        automations: { type: array, items: { $ref: "#/components/schemas/ReadinessAutomation" } }
    HolderTag:
      type: object
      additionalProperties: false
      required: [relationship]
      properties:
        relationship: { type: string, enum: [self, spouse, dependent-child, dependent-parent, huf, other], description: "Closed in this version; read it as open (new values may be added)." }
        label: { type: string, maxLength: 40 }
    BookHolder:
      type: object
      required: [holder, label, relationship, inFamily, accounts]
      properties:
        holder: { type: string }
        label: { type: string }
        relationship: { type: [string, "null"], description: "null: no tag (outside the family until tagged)" }
        inFamily: { type: boolean }
        source: { type: [string, "null"], enum: [config, file, default, null] }
        locked: { type: boolean, description: "Set in bridge.config.json (book.holders); read-only here." }
        accounts: { type: array, items: { type: string }, description: "Account ids this key may see." }
        accountCount: { type: integer }
    BookHolders:
      type: object
      required: [family, relationships, holders]
      properties:
        family: { type: object, properties: { name: { type: string }, relationships: { type: array, items: { type: string } } } }
        relationships: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string }, inFamily: { type: boolean } } } }
        untaggedHolder: { type: string }
        holders: { type: array, items: { $ref: "#/components/schemas/BookHolder" } }
        note: { type: string }
    BookLeg:
      type: object
      required: [account, symbol, q]
      properties:
        account: { type: string, description: "The leg's own account; every exit goes here." }
        symbol: { type: string }
        kind: { type: string, enum: [OPT, FUT] }
        q: { type: number, description: "Signed units (negative = short)." }
        avg: { type: [number, "null"] }
        mark: { type: [number, "null"] }
        markSource: { type: [string, "null"], description: "mid | ltp | position" }
        pnl: { type: [number, "null"] }
        iv: { type: [number, "null"], description: "Percent, solved from the mark on the forward." }
        greeks: { type: [object, "null"], description: "Per unit: delta, gamma, theta (₹ per day), vega (₹ per vol point)." }
        guarded: { type: array, items: { type: string }, description: "Guard ids watching this leg." }
    Book:
      type: object
      required: [view, asOf, holders, outsideFamily, method, disclaimer]
      description: >-
        docs/spec/p1-12-guard-participants.md §4.3.1. holders[]: { holder, label, relationship, inFamily, priceSource,
        accounts[] (account, broker, label, mode, tags, positions, pnl, margin { used, available, asOf, source }, error),
        underlyings[] (underlying, spot, lot, greeks { delta, deltaLots, rupeeDelta, gamma, theta, vega, missing } | null,
        legs[] BookLeg), totals { pnl, theta, vega, rupeeDelta, marginUsed, marginAvailable } }. family (view=family):
        { name, relationships, holders, totals { pnl, realised, unrealised, theta, vega, rupeeDelta, marginUsed,
        marginAvailable, accounts, partial }, notes }.
      properties:
        view: { type: string, enum: [holders, family] }
        asOf: { type: string, format: date-time }
        family: { type: [object, "null"] }
        holders: { type: array, items: { type: object } }
        outsideFamily: { type: array, items: { type: object, properties: { holder: { type: string }, label: { type: string }, relationship: { type: [string, "null"] }, accounts: { type: integer }, note: { type: string } } } }
        partial: { type: boolean }
        method: { type: string }
        disclaimer: { type: string }
    Readiness:
      type: object
      required: [overall, summary, accounts, paperOnly, method]
      properties:
        overall: { $ref: "#/components/schemas/ReadinessState" }
        summary: { type: string, examples: ["1 of 2 live accounts cannot trade"] }
        checkedAt: { type: [string, "null"], format: date-time }
        disabled: { type: boolean, description: "readiness.enabled is false." }
        accounts: { type: array, items: { $ref: "#/components/schemas/AccountReadiness" } }
        paperOnly: { type: boolean }
        egress:
          type: object
          description: ip and seenBy only for callers on this computer or with the admin scope.
          properties:
            mode: { type: string, enum: [off, lookup, manual] }
            checkedAt: { type: [string, "null"], format: date-time }
            family: { type: [string, "null"], enum: [ipv4, ipv6, null] }
            seenBy: { type: [string, "null"] }
            ip: { type: [string, "null"] }
            clockSkewMs: { type: [integer, "null"] }
            lastError: { type: [string, "null"] }
        schedule: { type: object, additionalProperties: true }
        automations:
          type: object
          properties:
            total: { type: integer }
            live: { type: integer }
            cannotTrade: { type: integer }
        notifications:
          type: object
          properties:
            targetsListening: { type: array, items: { type: string } }
            warning: { type: [string, "null"] }
            demoOff: { type: boolean }
        method: { type: string }
    ReadinessTransition:
      type: object
      required: [at, accountId, from, to, codes]
      properties:
        at: { type: string, format: date-time }
        accountId: { $ref: "#/components/schemas/AccountId" }
        from: { $ref: "#/components/schemas/ReadinessState" }
        to: { $ref: "#/components/schemas/ReadinessState" }
        codes: { type: array, items: { type: string } }
    AuditRecord:
      type: object
      required: [seq, at, type, actor, source, hash, prevHash]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        type: { type: string, examples: [order.placed, order.refused, key.created, kill_switch.engaged, account.connected] }
        actor:
          type: object
          properties:
            kind: { type: string }
            id: { type: string }
        source: { type: string }
        accountId: { type: [string, "null"] }
        requestId: { type: [string, "null"] }
        data: { type: object }
        prevHash: { type: string }
        hash: { type: string }

    Hook:
      type: object
      required: [id, source, label, account, mode, createdAt]
      properties:
        id: { type: string }
        source: { type: string, enum: [generic, chartink, gocharting] }
        label: { type: string }
        account: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live] }
        requireConfirmation: { type: boolean }
        allowedSymbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        maxLotsPerSignal: { type: integer }
        side: { type: [string, "null"], enum: [BUY, SELL, null] }
        product: { type: [string, "null"], enum: [CNC, INTRADAY, MARGIN, null] }
        orderType: { type: string, enum: [LIMIT, MARKET] }
        allowSourceIps: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        lastSignalAt: { type: [string, "null"], format: date-time }
        readiness:
          description: "Live hooks: the readiness state of the hook's account (orders are refused with CANNOT_TRADE while it is cannot_trade). null for paper hooks."
          oneOf:
            - { $ref: "#/components/schemas/ReadinessState" }
            - { type: "null" }
    HookCreate:
      type: object
      required: [source, label, account]
      additionalProperties: false
      properties:
        source: { type: string, enum: [generic, chartink, gocharting] }
        label: { type: string, minLength: 1, maxLength: 60 }
        account: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live], default: paper }
        requireConfirmation: { type: boolean, default: false }
        allowedSymbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        maxLotsPerSignal: { type: integer, minimum: 1, default: 1 }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN] }
        orderType: { type: string, enum: [LIMIT, MARKET], default: LIMIT }
        side: { type: string, enum: [BUY, SELL], description: "Fix the side for every signal (needed for ChartInk, whose alerts carry no side)." }
        allowSourceIps: { type: array, items: { type: string }, description: "Optional allowlist of sender IP addresses or IPv4 CIDR blocks." }
        acknowledgeUnsignedLive: { type: boolean, default: false, description: "Live mode on an unsigned source (chartink, gocharting) needs allowSourceIps, requireConfirmation or this acknowledgement." }
    RefMeta:
      type: object
      properties:
        source: { type: [string, "null"] }
