        - { name: expiries, in: query, description: How many upcoming expiries (default 3)., schema: { type: integer, minimum: 1, maximum: 6 } }
        - { name: strikes, in: query, description: Strikes each side of ATM (default 10)., schema: { type: integer, minimum: 1, maximum: 100 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
