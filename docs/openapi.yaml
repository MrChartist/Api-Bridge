          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DownloadJob" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/downloads/{downloadId}/files:
    get:
      tags: [Data downloads]
      operationId: listDownloadFiles
      summary: The files of a job, as listed in its manifest
      x-module: downloads
      x-scope: read
      parameters:
        - name: downloadId
          in: path
          required: true
          schema: { type: string, pattern: "^dl_[0-9a-f]{12}$" }
      responses:
        "200":
          description: The files (name, symbol, interval, rows, bytes, first and last bar, sha256).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
