  /v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Orders (newest first)
      x-stream: S7
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/ModeQuery"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/OrderResult" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place an order (paper unless you ask for live)
      description: |
        Every order passes the safety checks. Live needs a `live` key, an account enabled for live trading in the config
        file and `"mode": "live"` in the body; orders from AI assistants also need a `confirmToken` from a human
        confirmation. `quantity` is in units and must be a multiple of the lot size; or send `lots`. There is no default
        product or order type. MARKET and SL-M orders get market protection (or are refused) as configured.
      x-stream: S7
      x-scope: paper
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderRequest" }
      responses:
        "201":
          description: Accepted by the paper engine or the broker. `status` may still be pending.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/OrderResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

