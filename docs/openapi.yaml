  /v1/journal:
    get:
      tags: [Journal]
      operationId: getJournal
      summary: Trades from every fill, grouped by strategy group, with daily P&L and stats
      description: >-
        Fills of the paper engine and, for broker accounts, of the broker's trade book, on the accounts this key may use
        (or one with ?account=). Fills on one account, underlying and expiry form a trade that opens when that group goes
        from flat to holding something and closes when every leg is flat again; P&L of a closed trade is sell value less
        buy value less charges, an open one is marked to the last price. `daily` is the paper engine's daily P&L summed per
        day. Demo mode adds sample history marked `sample`. The grouping and stats are dashboard/journal-core.js.
      x-stream: S28
      x-scope: read
      parameters:
        - name: account
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The journal.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [trades, daily, stats, accounts]
                    properties:
                      trades:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            account: { type: string }
                            underlying: { type: string }
                            expiry: { type: [string, "null"] }
                            structure: { type: string }
                            status: { type: string, enum: [open, closed] }
                            openedAt: { type: number, description: Epoch ms of the first fill. }
                            closedAt: { type: [number, "null"] }
                            fills: { type: integer }
                            charges: { type: number }
                            pnl: { type: [number, "null"] }
                            tags: { type: array, items: { type: string } }
                            notes: { type: string }
                            setup: { type: string }
                            sample: { type: boolean }
                      daily: { type: array, items: { type: object, properties: { day: { type: string }, pnl: { type: number }, accounts: { type: integer } } } }
                      dailyByAccount: { type: object, additionalProperties: { type: array, items: { $ref: "#/components/schemas/PaperDailyPnl" } } }
                      stats: { type: object, additionalProperties: true }
                      accounts: { type: array, items: { type: string } }
                      problems: { type: array, items: { type: object, properties: { account: { type: string }, message: { type: string } } } }
                      demo: { type: boolean }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/journal/trades/{tradeId}:
