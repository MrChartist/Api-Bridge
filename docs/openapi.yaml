      summary: FII and DII cash-market buy, sell and net (INR crore), rolling sums and net-flow streak
      description: From the NSE public site (meta.source is "nse", meta.fetchedAt is the fetch time). NSE publishes one session per call, so the Bridge accumulates history (newest 250 sessions, saved in its data folder and kept across restarts); meta.available says how many sessions it holds, persisted plus fetched. Cached for five minutes.
      x-stream: S15
