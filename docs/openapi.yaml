      x-stream: S5
      x-scope: read
      parameters:
        - name: underlying
          in: query
          required: true
          description: NIFTY, BANKNIFTY, FINNIFTY, MIDCPNIFTY, SENSEX, BANKEX or a stock symbol.
          schema: { type: string, maxLength: 30 }
        - name: exchange
          in: query
          schema: { type: string, enum: [NFO, BFO, MCX, CDS] }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
      responses:
        "200":
          description: ISO dates, ascending.
          content:
            application/json:
              schema:
                type: object
