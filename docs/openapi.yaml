            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                tags: { type: array, maxItems: 20, items: { type: string, maxLength: 32 } }
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DownloadJob" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Data downloads]
      operationId: deleteDownload
      summary: Delete a job and its files
      description: >-
        This computer only, admin key. Stops the job if it runs and removes its folder with the files and the manifest. The
        files of a dataset are never removed by this call; delete the dataset instead.
      x-module: downloads
      x-scope: admin
      x-loopback-only: true
      responses:
        "204": { description: Deleted. }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/downloads/{downloadId}/pause:
    post:
      tags: [Data downloads]
      operationId: pauseDownload
