openapi: 3.1.0
info:
  title: Mr. Chartist API Bridge
  version: 1.0.0-draft.1
  summary: One local API for all your Indian broker accounts.
  description: |
    The Bridge runs on your own computer (default `http://127.0.0.1:4300`) and holds your connections to several
    brokers and accounts at once. Web apps, webhook alerts (ChartInk, GoCharting, signed scripts), Python and Node scripts, Excel,
    Google Sheets and AI assistants all share those connections through this API, so the broker sees one well-behaved
    client instead of many.

    ## Authentication
    Every route except `/v1/health`, `/openapi.yaml`, inbound webhooks and the streaming endpoints needs a Bridge API
    key: `Authorization: Bearer mcb_<keyId>_<secret>` (or `X-API-Key`). Keys are created with `mc-bridge keys create`
    and carry scopes:

    | Scope | Allows |
    |---|---|
    | `read` | market data, instruments, accounts, portfolio, orders list, limits |
    | `paper` | `read` + paper orders |
    | `live` | `paper` + live orders, only on accounts enabled for live trading in `bridge.config.json`, and only when the request says `"mode": "live"` |
    | `admin` | `read` + keys, audit log, kill-switch release, broker sessions; from this computer only |

    Keys may also be limited to some accounts. `?key=` in the URL is accepted only on `/xl/*`, and only for
    read-only keys created with `--allow-query` (Excel `WEBSERVICE` and AmiBroker cannot send headers).
    Streaming endpoints take a short-lived `?token=` from `POST /v1/stream/token`, or an Authorization header.

    ## Symbols
    One canonical, reversible format for every broker:

    | Instrument | Example |
    |---|---|
    | Equity | `NSE:RELIANCE`, `NSE:BAJAJ-AUTO`, `NSE:M&M` |
    | Index | `NSE:NIFTY`, `BSE:SENSEX` |
    | Future | `NFO:NIFTY-2026-10-27-FUT`, `MCX:CRUDEOIL-2026-11-19-FUT` |
    | Option | `NFO:NIFTY-2026-10-27-25000-CE`, `BFO:SENSEX-2026-10-30-82500-PE`, `NFO:VEDL-2026-10-27-292.5-CE` |

    `EXCHANGE:UNDERLYING[-YYYY-MM-DD(-FUT | -STRIKE-CE | -STRIKE-PE)]`. Exchange codes are NSE and BSE (cash and
    indices), NFO and BFO (equity derivatives), MCX and CDS. The ISO expiry removes the ambiguity of exchange trading
    symbols (weekly codes, DDMMMYY vs YYMDD), the suffix is parsed from the right so hyphens in names are safe, and no
    lookup is needed to read it. Inputs are lenient (case, `NSE:` for derivatives, chart tickers such as
    `NSE:NIFTY1!`, compact symbols with an exchange); responses always use the canonical form. Convert with
    `/v1/symbols/convert`.

    ## Responses, freshness and errors
    JSON responses under `/v1` are `{ "data": ..., "meta": { "requestId": ..., ... } }`. Every market-data item carries
    `freshness` (`source`: stream, cache, broker, paper, backup or plugin; `asOf`; `ageMs`; `stale`; which account served
    it; and how current the data is: `class` realtime, delayed or eod, `delaySec`, `official`, `confidence`, `flags`), so you
    always know how old a number is and where it came from. Errors are RFC 9457 `application/problem+json` with a stable `code` and a
    `retryable` flag. Times are ISO-8601 with the IST offset (`+05:30`) unless an endpoint says otherwise; candle times
    are epoch seconds. List endpoints are paginated with `limit` and an opaque `cursor` (`meta.nextCursor`).

    ## Data sources
    Real-time data and option chains come from your own broker accounts. Optional free sources and plugins (see
    `/v1/sources`) add history, cross-checks and graceful fallback; their answers are labelled `delayed` or `eod`, never
    blended into a real-time answer, and orders, risk checks, paper fills and alerts (`purpose` = `order`, `risk`, `paper`,
    `alert`) accept only real-time data. Guide: docs/guides/sources.md. Developers: docs/source-contract.md.

    ## Rate limits
    The Bridge never exceeds a broker's documented limit. It serves from live streams first, then a short freshness
    cache, then batches and coalesces broker calls, with orders always ahead of reads. Your own per-key limit is shown in
    `RateLimit` and `RateLimit-Policy` headers (IETF draft; syntax may change). On 429, wait `Retry-After` seconds. A
    refusal also says which limit tripped: `scope` (`client`, `upstream`, `queue`, `consumer-cap`), `retryAfterMs` and
    `limit` in the problem body; clients should read those, not `detail`. Each key has its own quota and fair-queue
    weight (`/v1/quotas`), and `GET /v1/limits?explain=1` shows the shared pools and each consumer's share.

    ## Orders and safety
    Paper mode is the default. A live order needs: `safety.liveTrading` and the account's `live.enabled` in the config
    file, a `live` key, the request source allowed for that account, `"mode": "live"` in the request, and every safety
    check (kill switch, order-rate cap default 5/s per account, daily order and loss limits, value and lot caps, price
    band, market-order protection). Send an `Idempotency-Key` with every order write; a retry with the same key returns
    the first result. A write that times out returns `OUTCOME_UNKNOWN`: check the order book before sending it again.

    ## Demo mode
    `mc-bridge start --demo` serves generated sample data from a demo adapter with no broker connected and live
    trading off. Operations marked `x-demo-only: true` (under `/v1/demo/`) exist only in demo mode; a Bridge with real
    accounts answers them with 404.

    Personal use only: broker data terms generally forbid passing market data to other people.
  contact:
    name: Investology (Mr. Chartist)
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:4300
    description: Local Bridge (default)
security:
  - bearerAuth: []
  - apiKeyHeader: []
tags:
  - name: System
    description: Health, versions and this document.
  - name: Accounts
    description: Your broker accounts, sessions and broker capabilities.
  - name: Keys
    description: Bridge API keys and their scopes.
  - name: Instruments
    description: Instrument search, resolution and symbol conversion.
  - name: Market data
    description: Quotes, LTP, depth, history, expiries and option chains, served streaming-first within broker limits.
  - name: Streaming
    description: WebSocket and SSE live data.
  - name: Portfolio
    description: Positions, holdings and funds per account.
  - name: Orders
    description: Paper and live orders with idempotency and safety checks.
  - name: Paper
    description: The paper-trading engine.
  - name: Limits
    description: Broker limits, budgets and usage.
  - name: Sources
    description: Where market data comes from besides your broker accounts (free providers, plugins), with honest labels, terms, health and a routing trace.
  - name: Pooling
    description: Spreading read-only market data over your own accounts of one holder. Off until you accept a notice; orders never pool.
  - name: Quotas
    description: Per-key request quotas and fair-queue weights.
  - name: Safety
    description: Kill switch, safety counters and the audit log.
  - name: Readiness
    description: "Whether each live account can trade now: session, static IP, order headroom, kill switch."
  - name: Spreadsheets
    description: Plain-text and CSV endpoints for Excel, Google Sheets and AmiBroker.
  - name: Webhooks
    description: Inbound alerts from ChartInk, GoCharting and signed senders.
  - name: AI (MCP)
    description: Model Context Protocol endpoint for AI assistants.
  - name: Compat REST
    description: >-
      Endpoints in the common apikey-in-body style (POST JSON, `apikey` in the body, { status, ... } replies) so SDKs and add-ins written for that style work
      against the Bridge. Same services, limits and safety as /v1; orders are paper while analyzer mode is on.
paths:
  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness check
      description: No key needed. Callers on this computer also see which services are built.
      x-module: core
      security: []
      responses:
        "200":
          description: The Bridge is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /:
    get:
      tags: [System]
      operationId: getRoot
      summary: Redirect to the local dashboard
      x-module: core
      x-loopback-only: true
      security: []
      responses:
        "302":
          description: Redirect to /dashboard.

  /dashboard:
    get:
      tags: [System]
      operationId: getDashboard
      summary: Local dashboard (HTML; this computer only)
      description: Welcome checklist, accounts and the broker directory, a test console, live rate-limit usage, orders and pending confirmations, the kill switch, API keys, integration snippets and the request and audit logs. The page asks for an API key and keeps it in the browser tab only.
      x-module: core
      x-loopback-only: true
      security: []
      responses:
        "200":
          description: The dashboard page.
          content:
            text/html:
              schema: { type: string }

  /dashboard/{file}:
    get:
      tags: [System]
      operationId: getDashboardAsset
      summary: Dashboard scripts, stylesheet and logo
      x-module: core
      x-loopback-only: true
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string, enum: [index.html, app.js, views.js, snippets.js, app.css, logo.svg] }
      responses:
        "200":
          description: The file.
        "404": { $ref: "#/components/responses/Problem" }

  /v1/meta:
    get:
      tags: [System]
      operationId: getMeta
      summary: Versions, brokers, modules and routes
      x-module: core
      x-scope: read
      responses:
        "200":
          description: Meta information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetaInfo" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/requests:
    get:
      tags: [System]
      operationId: listRecentRequests
      summary: Recent requests to this Bridge (newest first)
      description: The last 200 requests, kept in memory only (method, path without the query string, status, time taken, key id). Requests the dashboard makes for itself carry client "dashboard". Webhook paths are shown as their pattern, never with their token. A market-data read that returned something also carries `route`, a short record of what answered it.
      x-module: core
      x-scope: admin
      x-loopback-only: true
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Recent requests.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        at: { type: string, format: date-time }
                        method: { type: string }
                        path: { type: string }
                        status: { type: integer }
                        ms: { type: integer }
                        keyId: { type: [string, "null"] }
                        client: { type: [string, "null"] }
                        requestId: { type: string }
                        route: { $ref: "#/components/schemas/RequestRoute" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenApi
      summary: This document
      x-module: core
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 YAML.
          content:
            application/yaml:
              schema: { type: string }

  /v1/brokers:
    get:
      tags: [Accounts]
      operationId: listBrokers
      summary: Supported brokers and what each can do
      description: Capabilities come from each adapter's declared contract; limits from the Bridge's broker policy table (each number marked verified or not).
      x-module: accounts
      x-scope: read
      responses:
        "200":
          description: All broker adapters.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/BrokerInfo" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Your configured accounts and their session state
      description: Only accounts this key may use are listed. Never includes credentials.
      x-module: accounts
      x-scope: read
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AccountSummary" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Accounts]
      operationId: addAccount
      summary: Add a broker or paper account (saved to the config file, usable at once)
      description: |
        Adds the account to the config file the Bridge loaded (or creates the per-user bridge.config.json when it started
        without one), keeping the file's other content, and starts using it without a restart. New accounts are always
        paper only: live trading is turned on only by editing the config file. Without `id` the Bridge picks
        `<broker>-main`, then `<broker>-2` ... (`paper`, `paper-2` ... for paper accounts). Log in afterwards with
        POST /v1/accounts/{accountId}/session. Admin scope with an admin key that may use every account, this computer
        only. Audited as `account.added`.

        Demo mode saves a real broker's account for the next normal start instead (`savedForLater: true`,
        `account: null`): the same paper-only entry is written to the file, nothing is loaded and no broker is
        contacted. `leaveDemo: true` also removes `"demo": true` from the file. Paper accounts are refused in demo mode
        (it has its own), and so is everything when the demo dashboard is served to other computers.
      x-module: accounts
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreateRequest" }
      responses:
        "201":
          description: The account was saved. `restartNeeded` is true only when it could not be loaded into the running Bridge.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [account, restartNeeded, configFile]
                    properties:
                      account:
                        oneOf:
                          - $ref: "#/components/schemas/AccountSummary"
                          - type: "null"
                      restartNeeded: { type: boolean }
                      configFile: { type: string, description: "The config file the account was saved to." }
                      savedForLater: { type: boolean, description: "Demo mode: saved to the file only, loaded on the next normal start." }
                      savedId: { type: string, description: "Demo mode: the id the saved account will have." }
                      demoWasInFile: { type: boolean, description: "Demo mode: the file itself turns demo mode on." }
                      demoTurnedOff: { type: boolean, description: "Demo mode: `demo` was removed from the file (leaveDemo)." }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountIdPath"
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: One account
      x-module: accounts
      x-scope: read
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/AccountSummary" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Accounts]
      operationId: removeAccount
      summary: Remove an account (from the config file and the running Bridge)
      description: |
        For an account added by mistake. Removes it from the config file and the running Bridge and deletes its saved
        keys and session from the encrypted store; its paper-trading history stays in the data folder. Refuses an
        account with live trading set up in the config file (remove those in the file, on purpose) and the last paper
        account. Admin scope with an admin key that may use every account, this computer only. Refused in demo mode.
        Audited as `account.removed`.
      x-module: accounts
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: The account was removed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [id, removed, savedKeysDeleted, restartNeeded]
                    properties:
                      id: { type: string }
                      removed: { type: boolean }
                      savedKeysDeleted: { type: boolean }
                      restartNeeded: { type: boolean }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/accounts/{accountId}/session:
    parameters:
      - $ref: "#/components/parameters/AccountIdPath"
    post:
      tags: [Accounts]
      operationId: connectAccount
      summary: Connect or log in to the broker
      description: |
        Saves the non-secret values (API key, client id, access token) encrypted at rest, then logs in where the broker
        needs it. For session-login brokers send the password/PIN and the current 6-digit TOTP code in `secrets`: they
        are used once for the broker login and never stored, cached or logged. Admin scope, this computer only.
      x-module: accounts
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionConnectRequest" }
      responses:
        "200":
          description: New session state.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SessionState" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Accounts]
      operationId: disconnectAccount
      summary: Forget the broker session (saved keys stay)
      x-module: accounts
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: Session state after logout.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SessionState" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/accounts/{accountId}/test:
    parameters:
      - $ref: "#/components/parameters/AccountIdPath"
    post:
      tags: [Accounts]
      operationId: testAccount
      summary: Make one cheap authenticated broker call
      x-module: accounts
      x-scope: read
      responses:
        "200":
          description: Result of the test call.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [ok, message]
                    properties:
                      ok: { type: boolean }
                      message: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/keys:
    get:
      tags: [Keys]
      operationId: listKeys
      summary: List API keys (never the key itself)
      description: An admin key limited to some accounts lists only keys limited to those same accounts.
      x-module: auth
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/KeyRecord" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Keys]
      operationId: createKey
      summary: Create an API key
      description: The key is in the response once and cannot be shown again; only a scrypt hash is stored.
      x-module: auth
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCreateRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/KeyCreated" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/keys/{keyId}:
    parameters:
      - name: keyId
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9]{10}$" }
    delete:
      tags: [Keys]
      operationId: revokeKey
      summary: Revoke a key (takes effect immediately)
      description: An admin key limited to some accounts can revoke only keys limited to those accounts; any other key answers 404, as an unknown id does.
      x-module: auth
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: The revoked key.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/KeyRecord" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/stream/token:
    post:
      tags: [Streaming]
      operationId: createStreamToken
      summary: Short-lived token for WebSocket and SSE URLs
      description: Use it as `?token=` on `/v1/stream` or `/v1/stream/sse` so your API key never appears in a URL or a log. Valid for 60 seconds to connect; the connection then lives on with the key's scopes.
      x-module: auth
      x-scope: read
      responses:
        "200":
          description: Token.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [token, expiresAt]
                    properties:
                      token: { type: string }
                      expiresAt: { type: string, format: date-time }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sign-in:
    post:
      tags: [Keys]
      operationId: signIn
      summary: Exchange a one-time sign-in code for a dashboard key
      description: |
        Used by the dashboard when it is opened from `mc-bridge start --open` or `mc-bridge open`, whose link carries a
        one-time code in the URL fragment (`/dashboard#signin=<code>`, never sent to the server in a URL). The code is
        valid for 10 minutes and works once; only its SHA-256 hash is stored. A valid code creates a new admin key
        (scopes admin and paper, all accounts, label "Dashboard sign-in") that expires in 30 days; audited `key.created`.
        A wrong, expired or used code gets one generic 401. After 20 failed attempts in a minute the route answers 429
        for the rest of that minute. No API key needed; this computer only.
      x-module: auth
      x-loopback-only: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: "The code from the sign-in link." }
      responses:
        "201":
          description: Signed in. The key is shown once.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/KeyCreated" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/limits:
    get:
      tags: [Limits]
      operationId: getLimits
      summary: Broker limits, safety limits and current budgets per account
      description: With `explain=1` the report also says why a request may have been slow or refused, in numbers instead of log lines (`pools`, `consumers`).
      x-module: ratelimit
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/AccountQueryOptional"
        - name: explain
          in: query
          description: "`1` or `true` adds `pools` (the shared bucket groups: spare budget, ceiling and back-off) and `consumers` (queued, in-flight and fair share per consumer)."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Limits report.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/LimitsReport" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/usage:
    get:
      tags: [Limits]
      operationId: getUsage
      summary: How much of each budget is used, queued and saved by streaming, caching and coalescing
      description: |
        Per account and endpoint class: the binding window, every window (`windows`: this second, this minute, today) and
        today's counters. `series=1` adds each account's calls per second over the last two minutes (`series`).
        `view=budget` answers the dashboard's budget summary instead (the `budget` stream message). Admin keys also get
        `consumers`: today's broker calls and saved calls per dashboard page, API key label, MCP, compat and background job.
      x-module: ratelimit
      x-scope: read
      parameters:
        - name: series
          in: query
          schema: { type: boolean, default: false }
        - name: view
          in: query
          schema: { type: string, enum: [budget] }
      responses:
        "200":
          description: Usage report.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/UsageReport" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources:
    get:
      tags: [Sources]
      operationId: listSources
      summary: Data sources, what each one is, and whether it is on
      description: |
        Every place the Bridge can read market data from: your broker accounts (`kind: broker`, always first for
        real-time data), the built-in free providers, and plugins you granted. Each row says how current its data is
        (`class`, `delaySec`), whether it is `official`, what it may be asked (`capabilities`), the vendor's documented
        `limits`, how much of them the Bridge used (`usage`), its `health`, and the terms you accept by turning it on.
        API keys of sources that need one are never returned; `configured` only says whether one is stored.
      x-module: sources
      x-scope: read
      responses:
        "200":
          description: Sources.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DataSource" } }
                  meta:
                    allOf:
                      - { $ref: "#/components/schemas/Meta" }
                      - type: object
                        properties:
                          notice: { type: string, description: "What the Bridge says about sources other than your own broker accounts." }
                          autoFallback: { type: boolean, description: "True when a read no broker account can answer may go to an enabled source without being asked (the saved switch, else config `sources.autoFallback`). When false, a source is used only for a read that asks for `backup=true`." }
                          autoFallbackSource: { type: string, enum: [setting, config, default], description: "Where `autoFallback` comes from: `setting` (the switch in the dashboard or `PATCH /v1/sources/settings`), `config` (`sources.autoFallback` in the configuration file) or `default` (off)." }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources/trace:
    get:
      tags: [Sources]
      operationId: traceSources
      summary: Why a read would be served by one source and not another (dry run)
      description: |
        Runs the router's decision for a read and explains it: every candidate (your pooled broker accounts and the
        enabled sources), with the verdict (`chosen`, `fallback` or `skipped`), the reason, the score and the spare
        budget. Nothing is fetched and no upstream call is made, so it costs no quota. `class` is the data class the
        answer would carry.
      x-module: sources
      x-scope: read
      parameters:
        - name: capability
          in: query
          required: true
          schema: { $ref: "#/components/schemas/SourceCapability" }
        - name: symbols
          in: query
          required: true
          description: Comma-separated symbols (for expiries and option chains, the underlying).
          schema: { type: string, maxLength: 8000 }
        - $ref: "#/components/parameters/Purpose"
        - name: maxAgeMs
          in: query
          description: The oldest data the caller would accept, in ms. A delayed or end-of-day source whose delay is longer cannot answer.
          schema: { type: integer, minimum: 0, maximum: 3600000 }
      responses:
        "200":
          description: The routing decision.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/RoutingTrace" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources/settings:
    patch:
      tags: [Sources]
      operationId: updateSourcesSettings
      summary: Use free sources automatically when your brokers cannot answer
      description: |
        `autoFallback: true` lets a read that no broker account can answer go to a source you turned on, without the
        read asking for `backup=true`. It applies to display and analysis reads only; orders, risk checks, paper fills
        and alerts never use it, and every answer is labelled with its data class and delay. The choice is saved in the
        Bridge's data folder and wins over `sources.autoFallback` in the configuration file. Changes are audited
        (`sources.setting_changed`). Only from this computer.
      x-module: sources
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourcesSettingsUpdate" }
      responses:
        "200":
          description: The setting as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SourcesSettings" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources/{id}:
    patch:
      tags: [Sources]
      operationId: updateSource
      summary: Turn a source on or off
      description: |
        `enabled: true` turns a source on. An `opt-in` source (unofficial or terms-sensitive) also needs `acknowledge`
        equal to its `noticeVersion`, which records that you read the notice; a `byok` source needs its key stored
        first (`PUT /v1/sources/{id}/config`). A stale or missing acknowledgement is refused. `enabled: false`
        turns it off at once. Your broker accounts (`builtin`) cannot be switched off here.
      x-module: sources
      x-scope: admin
      x-loopback-only: true
      parameters:
        - $ref: "#/components/parameters/SourceIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceUpdate" }
      responses:
        "200":
          description: The source as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DataSource" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources/{id}/config:
    put:
      tags: [Sources]
      operationId: configureSource
      summary: Store the API key of a source that needs one
      description: |
        The key goes into the encrypted secrets store under `source:<id>` and is never returned, logged or put in the
        configuration file. Only from this computer.
