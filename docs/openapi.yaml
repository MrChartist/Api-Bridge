      tags: [Accounts]
      operationId: testAccount
      summary: Make one cheap authenticated broker call
      x-module: accounts
      x-scope: read
      responses:
        "200":
          description: Result of the test call.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [ok, message]
                    properties:
                      ok: { type: boolean }
                      message: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/keys:
    get:
      tags: [Keys]
      operationId: listKeys
      summary: List API keys (never the key itself)
      description: An admin key limited to some accounts lists only keys limited to those same accounts.
      x-module: auth
      x-scope: admin
      x-loopback-only: true
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/KeyRecord" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Keys]
      operationId: createKey
      summary: Create an API key
      description: The key is in the response once and cannot be shown again; only a scrypt hash is stored.
      x-module: auth
      x-scope: admin
      x-loopback-only: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCreateRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/KeyCreated" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/keys/{keyId}:
    parameters:
      - name: keyId
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9]{10}$" }
    delete:
      tags: [Keys]
      operationId: revokeKey
      summary: Revoke a key (takes effect immediately)
      description: An admin key limited to some accounts can revoke only keys limited to those accounts; any other key answers 404, as an unknown id does.
      x-module: auth
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: The revoked key.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/KeyRecord" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/stream/token:
    post:
      tags: [Streaming]
      operationId: createStreamToken
      summary: Short-lived token for WebSocket and SSE URLs
      description: Use it as `?token=` on `/v1/stream` or `/v1/stream/sse` so your API key never appears in a URL or a log. Valid for 60 seconds to connect; the connection then lives on with the key's scopes.
      x-module: auth
      x-scope: read
      responses:
        "200":
          description: Token.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [token, expiresAt]
                    properties:
                      token: { type: string }
                      expiresAt: { type: string, format: date-time }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sign-in:
    post:
      tags: [Keys]
      operationId: signIn
      summary: Exchange a one-time sign-in code for a dashboard key
      description: |
        Used by the dashboard when it is opened from `mc-bridge start --open` or `mc-bridge open`, whose link carries a
        one-time code in the URL fragment (`/dashboard#signin=<code>`, never sent to the server in a URL). The code is
        valid for 10 minutes and works once; only its SHA-256 hash is stored. A valid code creates a new admin key
        (scopes admin and paper, all accounts, label "Dashboard sign-in") that expires in 30 days; audited `key.created`.
        A wrong, expired or used code gets one generic 401. After 20 failed attempts in a minute the route answers 429
        for the rest of that minute. No API key needed; this computer only.
      x-module: auth
      x-loopback-only: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: "The code from the sign-in link." }
      responses:
        "201":
          description: Signed in. The key is shown once.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/KeyCreated" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/limits:
    get:
      tags: [Limits]
      operationId: getLimits
      summary: Broker limits, safety limits and current budgets per account
      description: With `explain=1` the report also says why a request may have been slow or refused, in numbers instead of log lines (`pools`, `consumers`).
      x-module: ratelimit
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/AccountQueryOptional"
        - name: explain
          in: query
          description: "`1` or `true` adds `pools` (the shared bucket groups: spare budget, ceiling and back-off) and `consumers` (queued, in-flight and fair share per consumer) and `savedCalls` (broker calls not made today)."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Limits report.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/LimitsReport" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/usage:
    get:
      tags: [Limits]
      operationId: getUsage
      summary: How much of each budget is used, queued and saved by streaming, caching and coalescing
      description: |
        Per account and endpoint class: the binding window, every window (`windows`: this second, this minute, today) and
        today's counters. `series=1` adds each account's calls per second over the last two minutes (`series`).
        `view=budget` answers the dashboard's budget summary instead (the `budget` stream message). Admin keys also get
        `consumers`: today's broker calls and saved calls per dashboard page, API key label, MCP, compat and background job.
      x-module: ratelimit
      x-scope: read
      parameters:
        - name: series
          in: query
          schema: { type: boolean, default: false }
        - name: view
          in: query
          schema: { type: string, enum: [budget] }
      responses:
        "200":
          description: Usage report.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/UsageReport" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources:
    get:
      tags: [Sources]
      operationId: listSources
      summary: Data sources, what each one is, and whether it is on
      description: |
        Every place the Bridge can read market data from: your broker accounts (`kind: broker`, always first for
        real-time data), the built-in free providers, and plugins you granted. Each row says how current its data is
        (`class`, `delaySec`), whether it is `official`, what it may be asked (`capabilities`), the vendor's documented
        `limits`, how much of them the Bridge used (`usage`), its `health`, and the terms you accept by turning it on.
        API keys of sources that need one are never returned; `configured` only says whether one is stored.
      x-module: sources
      x-scope: read
      responses:
        "200":
          description: Sources.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DataSource" } }
                  meta:
                    allOf:
                      - { $ref: "#/components/schemas/Meta" }
                      - type: object
                        properties:
                          notice: { type: string, description: "What the Bridge says about sources other than your own broker accounts." }
                          autoFallback: { type: boolean, description: "True when a read no broker account can answer may go to an enabled source without being asked (the saved switch, else config `sources.autoFallback`). When false, a source is used only for a read that asks for `backup=true`." }
                          autoFallbackSource: { type: string, enum: [setting, config, default], description: "Where `autoFallback` comes from: `setting` (the switch in the dashboard or `PATCH /v1/sources/settings`), `config` (`sources.autoFallback` in the configuration file) or `default` (off)." }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources/trace:
    get:
      tags: [Sources]
      operationId: traceSources
      summary: Why a read would be served by one source and not another (dry run)
      description: |
        Runs the router's decision for a read and explains it: every candidate (your pooled broker accounts and the
        enabled sources), with the verdict (`chosen`, `fallback` or `skipped`), the reason, the score and the spare
        budget. Nothing is fetched and no upstream call is made, so it costs no quota. `class` is the data class the
        answer would carry.
      x-module: sources
      x-scope: read
      parameters:
        - name: capability
          in: query
          required: true
          description: What to explain. The four capabilities a source can have, plus `depth` (market depth is served by your own brokers only).
          schema: { type: string, enum: [quotes, history, expiries, optionChain, depth] }
        - name: symbols
          in: query
          required: true
          description: Comma-separated symbols (for expiries and option chains, the underlying).
          schema: { type: string, maxLength: 8000 }
        - $ref: "#/components/parameters/Purpose"
        - name: maxAgeMs
          in: query
          description: The oldest data the caller would accept, in ms. A delayed or end-of-day source whose delay is longer cannot answer.
          schema: { type: integer, minimum: 0, maximum: 3600000 }
      responses:
        "200":
          description: The routing decision.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/RoutingTrace" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources/settings:
    patch:
      tags: [Sources]
      operationId: updateSourcesSettings
      summary: Use free sources automatically when your brokers cannot answer
      description: |
        `autoFallback: true` lets a read that no broker account can answer go to a source you turned on, without the
        read asking for `backup=true`. It applies to display and analysis reads only; orders, risk checks, paper fills
        and alerts never use it, and every answer is labelled with its data class and delay. The choice is saved in the
        Bridge's data folder and wins over `sources.autoFallback` in the configuration file. Changes are audited
        (`sources.setting_changed`). Only from this computer. The answer also repeats the setting's fields at the top level of
        the body, as older clients read them there; read `data`, which is the documented place.
      x-module: sources
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourcesSettingsUpdate" }
      responses:
        "200":
          description: The setting as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SourcesSettings" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources/{id}:
    patch:
      tags: [Sources]
      operationId: updateSource
      summary: Turn a source on or off
      description: |
        `enabled: true` turns a source on. An `opt-in` source (unofficial or terms-sensitive) also needs `acknowledge`
        equal to its `noticeVersion`, which records that you read the notice; a `byok` source needs its key stored
        first (`PUT /v1/sources/{id}/config`). A stale or missing acknowledgement is refused. `enabled: false`
        turns it off at once. Your broker accounts (`builtin`) cannot be switched off here. The answer also repeats the
        source's fields at the top level of the body, as older clients read them there; read `data`.
      x-module: sources
      x-scope: admin
      x-loopback-only: true
      parameters:
        - $ref: "#/components/parameters/SourceIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceUpdate" }
      responses:
        "200":
          description: The source as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DataSource" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources/{id}/config:
    put:
      tags: [Sources]
      operationId: configureSource
      summary: Store the API key of a source that needs one
      description: |
        The key goes into the encrypted secrets store under `source:<id>` and is never returned, logged or put in the
        configuration file. Only from this computer.
      x-module: sources
      x-scope: admin
      x-loopback-only: true
      parameters:
        - $ref: "#/components/parameters/SourceIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceConfigRequest" }
      responses:
        "200":
          description: Stored. The answer never contains the key.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [configured]
                    properties:
                      configured: { type: boolean, const: true }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources/{id}/test:
    post:
      tags: [Sources]
      operationId: testSource
      summary: Check that a source answers
      description: Makes one small call through the source's own `test` (a status or sample request) and reports the result. It counts against the source's quota.
      x-module: sources
      x-scope: admin
      x-loopback-only: true
      parameters:
        - $ref: "#/components/parameters/SourceIdPath"
      responses:
        "200":
          description: "The result. A failing source is still a 200 with `ok: false`."
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SourceTestResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/pooling:
    get:
      tags: [Pooling]
      operationId: getPooling
      summary: Whether market-data reads may be spread over your own accounts
      description: |
        Pooling is off until you accept the notice. Accounts are grouped by holder; only accounts of one holder are
        ever pooled, only read-only market data is pooled, and orders always go through the account they belong to. An
        account whose broker's policy is `not-allowed` is never pooled.
      x-module: sources
      x-scope: read
      responses:
        "200":
          description: Pooling state.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/PoolingState" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/pooling/consent:
    put:
      tags: [Pooling]
      operationId: acceptPooling
      summary: Accept the pooling notice for chosen accounts
      description: |
        `acknowledge` must equal the current `notice.version`. Only accounts of one holder with a policy other than
        `not-allowed` are accepted. Only from this computer.
      x-module: sources
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolingConsentRequest" }
      responses:
        "200":
          description: Pooling state after the change.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/PoolingState" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Pooling]
      operationId: revokePooling
      summary: Withdraw the pooling consent
      description: Each account serves only its own reads again.
      x-module: sources
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: Pooling state after the change.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/PoolingState" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/quotas:
    get:
      tags: [Quotas]
      operationId: getQuotas
      summary: Each API key's share of the Bridge
      description: |
        Every key has a request quota (a token bucket) and a weight in the fair queue, so one runaway spreadsheet cannot
        starve an AI assistant. `kinds` are the default weights by client kind (`ui`, `mcp`, `excel`, `script`, `other`);
        `keys[].source` says whether a key's figures are the default, from the configuration, or an override set with
        `PUT /v1/quotas/{keyId}`. `usage` counts requests and how often the key was throttled.
      x-module: ratelimit
      x-scope: read
      responses:
        "200":
          description: Quotas.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/QuotasReport" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/quotas/{keyId}:
    put:
      tags: [Quotas]
      operationId: setQuota
      summary: Override one key's quota or weight
      description: "Only the fields you send change. `perDay: null` removes the daily cap. The override survives a restart."
      x-module: ratelimit
      x-scope: admin
      x-loopback-only: true
      parameters:
        - $ref: "#/components/parameters/KeyIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaOverride" }
      responses:
        "200":
          description: The key's quota as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/QuotaKey" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Quotas]
      operationId: clearQuota
      summary: Remove a key's override
      description: The key goes back to the quota from the configuration, or the default for its client kind.
      x-module: ratelimit
      x-scope: admin
      x-loopback-only: true
      parameters:
        - $ref: "#/components/parameters/KeyIdPath"
      responses:
        "200":
          description: The key's quota as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/QuotaKey" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/instruments/search:
    get:
      tags: [Instruments]
      operationId: searchInstruments
      summary: Search instruments across connected brokers' masters
      x-module: symbols
      x-scope: read
      parameters:
        - name: q
          in: query
          required: true
          description: Free text (RELIANCE, nifty 25000 ce, banknifty fut).
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: exchange
          in: query
          schema: { $ref: "#/components/schemas/Exchange" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/InstrumentKind" }
        - name: underlying
          in: query
          schema: { type: string, maxLength: 30 }
        - name: expiry
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Matching instruments.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Instrument" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/instruments/{symbol}:
    parameters:
      - name: symbol
        in: path
        required: true
        description: Any accepted symbol form; URL-encode it.
        schema: { type: string, maxLength: 64 }
      - name: include
        in: query
        description: "`refs` adds each broker's native token and trading symbol."
        schema: { type: string, enum: [refs] }
    get:
      tags: [Instruments]
      operationId: getInstrument
      summary: Resolve one instrument (lot size, tick size, freeze quantity)
      x-module: symbols
      x-scope: read
      responses:
        "200":
          description: The instrument.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Instrument" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/instruments/export:
    get:
      tags: [Data downloads]
      operationId: exportInstruments
      summary: The instrument master as a CSV or JSONL file
      description: >-
        Streams every instrument the connected brokers' masters hold (symbol, exchange, kind, underlying, name, expiry, strike,
        right, lot size, tick size, freeze quantity, ISIN), optionally for one exchange or kind. It reads the master the Bridge
        already loaded; it makes no broker call.
      x-module: downloads
      x-scope: read
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [NSE, BSE, NFO, BFO, MCX, CDS] }
        - name: kind
          in: query
          schema: { type: string, enum: [INDEX, EQ, FUT, OPT] }
        - name: format
          in: query
          schema: { type: string, enum: [csv, jsonl], default: csv }
      responses:
        "200":
          description: The file, streamed.
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/x-ndjson:
              schema: { type: string, format: binary }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/symbols/convert:
    get:
      tags: [Instruments]
      operationId: convertSymbolGet
      summary: Convert one symbol between formats
      x-module: symbols
      x-scope: read
      parameters:
        - name: input
          in: query
          required: true
          schema: { type: string, maxLength: 64 }
        - name: from
          in: query
          schema: { $ref: "#/components/schemas/SymbolFormatName" }
        - name: exchange
          in: query
          description: Needed for compact and broker trading symbols.
          schema: { type: string, maxLength: 12 }
        - name: broker
          in: query
          description: Needed when `from` is `broker`, and to include that broker's native alias.
          schema: { type: string }
      responses:
        "200":
          description: Canonical form and aliases.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/ConvertResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Instruments]
      operationId: convertSymbols
      summary: Convert up to 200 symbols in one call
      x-module: symbols
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/ConvertRequest" }
      responses:
        "200":
          description: One result or error per item, in order.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/ConvertResult"
                        - $ref: "#/components/schemas/ItemError"
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/symbols/resolve:
    get:
      tags: [Instruments]
      operationId: resolveSymbol
      summary: Resolve a name to one instrument, with the reason
      description: |
        Reads what chart tools, spreadsheets and alerts write (`NSE:M_M`, `NSE_INDEX:NIFTY 50`, `NSE:RELIANCE-EQ`, `Reliance`)
        and answers the one instrument it means, how it got there (`rule`, `rules`) and the ranked candidates. It never
        guesses: a bare name carried by two instruments (RELIANCE on NSE and on BSE) is `AMBIGUOUS_SYMBOL` (409) with the
        candidates in `candidates`; send `exchange` or the full symbol. A name that matches nothing exactly is
        `SYMBOL_NOT_FOUND` (404) with the closest names in `candidates`. A bare name resolves to the cash or index
        instrument; a future or option needs its full symbol.
      x-module: symbols
      x-scope: read
      parameters:
        - name: q
          in: query
          required: true
          description: The symbol or name. `input` is accepted as the same parameter.
          schema: { type: string, maxLength: 64 }
        - name: exchange
          in: query
          description: Narrows a bare name to one exchange.
          schema: { $ref: "#/components/schemas/Exchange" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/InstrumentKind" }
        - name: explain
          in: query
          description: "`1` or `true` adds `steps`, the reading in plain sentences."
          schema: { type: string, enum: ["0", "1", "true", "false"] }
        - name: limit
          in: query
          description: Candidates to return (default 10).
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: One instrument.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SymbolResolution" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/symbols/validate:
    get:
      tags: [Instruments]
      operationId: validateSymbolGet
      summary: Check one symbol (canonical form, lot size, tradable)
      description: |
        For a spreadsheet or an alert author: type a symbol, see the exact canonical form the Bridge will use and its lot
        size. A symbol the Bridge cannot use is `valid: false` with the reason in `code` and `message`, not an error
        response. Only a malformed request is a 4XX.
      x-module: symbols
      x-scope: read
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, maxLength: 64 }
        - name: exchange
          in: query
          schema: { $ref: "#/components/schemas/Exchange" }
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SymbolValidation" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Instruments]
      operationId: validateSymbols
      summary: Check up to 200 symbols in one call
      x-module: symbols
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [symbol]
                    additionalProperties: false
                    properties:
                      symbol: { type: string, maxLength: 64 }
                      exchange: { $ref: "#/components/schemas/Exchange" }
      responses:
        "200":
          description: One check per item, in order.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SymbolValidation" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/collections:
    get:
      tags: [Collections]
      operationId: listCollections
      summary: List collections (static lists and option universes)
      description: Summaries without symbol lists, ordered by name. `tag` may repeat or be comma separated; a collection must have every tag asked for.
      x-module: library
      x-scope: read
      parameters:
        - { name: tag, in: query, description: "Tags to match, all of them (comma separated, or repeat the parameter).", schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [static, option-universe] } }
        - { name: q, in: query, description: "Text found in the name, description or a tag.", schema: { type: string, maxLength: 64 } }
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Collections.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Collection" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Collections]
      operationId: createCollection
      summary: Create a collection
      description: |
        A static collection holds a list of symbols. An option universe holds a rule that is worked out each time it is used
        (`GET /v1/collections/{name}/resolve`). Names are letters, digits and `_ . -`, unique without regard to case.
        Writing needs the `paper` scope.
      x-module: library
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            example: {"name":"large-caps","description":"My core list","tags":["core"],"symbols":["NSE:RELIANCE","NSE:INFY","NSE:TCS"]}
            schema: { $ref: "#/components/schemas/CollectionCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              example: {"data":{"id":"col_geh4as5cz7","name":"large-caps","description":"My core list","tags":["core"],"kind":"static","createdAt":"2026-11-10T04:05:33.784Z","updatedAt":"2026-11-10T04:05:33.784Z","previousNames":[],"symbolCount":3,"symbols":["NSE:RELIANCE","NSE:INFY","NSE:TCS"]},"meta":{"requestId":"req_2f8e1a0c4b7d9e3a5c61"}}
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Collection" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/collections/import:
    post:
      tags: [Collections]
      operationId: importCollections
      summary: Make collections from CSV or JSON
      description: |
        JSON: a collection (`{ name, kind, symbols | universe }`), a plain list of symbols (with `name` in the query), a file
        that `GET /v1/collections/{name}/export` wrote, or `{ collections: [...] }`. CSV: send the text as `text/plain` with
        `name` in the query (or as JSON `{ format: "csv", csv, name }`); the symbols are in a column named `symbol`, or the
        first column when there is no header. Everything is checked first: one bad entry imports nothing, unless `skipInvalid`
        is true for a CSV. `replace=true` (replace collections that already exist) needs an admin key, from this computer.
      x-module: library
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: name, in: query, description: "Name of the new collection (required for CSV and for a plain list).", schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [csv, json] } }
        - { name: tags, in: query, description: "Comma separated tags for a single collection.", schema: { type: string } }
        - { name: description, in: query, schema: { type: string, maxLength: 500 } }
        - { name: replace, in: query, description: "Replace a collection of the same name instead of answering 409.", schema: { type: boolean, default: false } }
        - { name: skipInvalid, in: query, description: "CSV only: skip lines that are not symbols and import the rest.", schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            example: {"name":"from-a-file","symbols":["NSE:RELIANCE","NSE:INFY"]}
            schema: { type: object }
          text/plain:
            schema: { type: string }
      responses:
        "201":
          description: Imported.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [created, replaced, warnings]
                    properties:
                      created: { type: array, items: { $ref: "#/components/schemas/Collection" } }
                      replaced: { type: array, items: { $ref: "#/components/schemas/Collection" } }
                      warnings: { type: array, items: { type: string } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/collections/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: "The collection's name or id. A name it had before a rename also finds it (the answer says `viaOldName`)."
        schema: { type: string, maxLength: 64 }
    get:
      tags: [Collections]
      operationId: getCollection
      summary: One collection with its symbols or universe
      x-module: library
      x-scope: read
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Collection" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Collections]
      operationId: updateCollection
      summary: Change a collection, or rename it (send `name`)
      description: A rename keeps the collection's id and its old name keeps working. The kind cannot change.
      x-module: library
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            example: {"tags":["core","daily"]}
            schema: { $ref: "#/components/schemas/CollectionPatch" }
      responses:
        "200":
          description: The changed collection.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Collection" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Collections]
      operationId: deleteCollection
      summary: Delete a collection
      description: Refused with 409 while a download, recording or rule that is running uses it, unless `force=true`. Needs an admin key, from this computer.
      x-module: library
      x-scope: admin
      x-loopback-only: true
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "204":
          description: Deleted.
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/collections/{name}/resolve:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    get:
      tags: [Collections]
      operationId: resolveCollection
      summary: The concrete symbols of a collection right now
      description: |
        A static collection answers its list. An option universe is worked out now: the expiry rule rolls on by itself, and
        the at-the-money strike comes from the live price of the underlying. The answer says which price it used
        (`atmSource`). A price that is delayed, end-of-day or stale is refused with an error (422 or 503) unless
        `allowStale=true`, and then it is labelled and warned about. With the market closed the price is the last close and
        `atmSource` is `last-close`.
      x-module: library
      x-scope: read
      parameters:
        - { name: allowStale, in: query, description: "Accept a stale, delayed or end-of-day price for the ATM (it is labelled).", schema: { type: boolean } }
        - { name: requireLive, in: query, description: "Refuse any price that is not live (for a caller that records or downloads at once).", schema: { type: boolean, default: false } }
        - { name: spot, in: query, description: "Work out the ATM from this price instead of reading one.", schema: { type: number } }
        - { name: priority, in: query, schema: { type: string, enum: [interactive, background], default: interactive } }
        - { $ref: "#/components/parameters/AccountQueryOptional" }
      responses:
        "200":
          description: The symbols for now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/CollectionResolution" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/collections/{name}/duplicate:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    post:
      tags: [Collections]
      operationId: duplicateCollection
      summary: Copy a collection under a new name
      description: Without a name the copy is called `<name>-copy` (then `-copy2` ...).
      x-module: library
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            example: {"name":"large-caps-copy"}
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
      responses:
        "201":
          description: The copy.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Collection" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/collections/{name}/export:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    get:
      tags: [Collections]
      operationId: exportCollection
      summary: A collection as a CSV or JSON file
      description: |
        JSON is the definition (a universe stays a universe) and imports back with `POST /v1/collections/import`. CSV is the
        symbols; for an option universe it is the symbols as they resolve now (`X-Resolved-At`).
      x-module: library
      x-scope: read
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: resolved, in: query, description: "JSON only: write a universe as the static list of this moment.", schema: { type: boolean, default: false } }
      responses:
        "200":
          description: The file.
          headers:
            X-Resolved-At: { description: "Only when a universe was resolved for the file.", schema: { type: string } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object }
            text/csv:
              schema: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/collections/{name}/usage:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    get:
      tags: [Collections]
      operationId: getCollectionUsage
      summary: What is made from this collection
      description: The downloads, recordings, auto-record rules and datasets that use it. A kind marked `not-available` in `sources` is kept by a part of the Bridge that is off, so it is not counted.
      x-module: library
      x-scope: read
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/CollectionUsage" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/collections/{name}/estimate:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    get:
      tags: [Collections]
      operationId: estimateCollection
      summary: Size of downloading a collection (symbols x intervals x days)
      description: |
        Rows, bytes and broker calls before you start. An option universe is resolved first (a stale price is accepted for a
        count and is labelled in `atmSource`). An estimate: a recently listed contract has fewer days than asked, and a broker
        may keep less intraday history than you ask for.
      x-module: library
      x-scope: read
      parameters:
        - { name: intervals, in: query, required: true, description: "Comma separated, for example 5m,1d.", schema: { type: string } }
        - { name: days, in: query, required: true, description: "Calendar days back from today (1 to 3650).", schema: { type: integer, minimum: 1, maximum: 3650 } }
        - { name: allowStale, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/CollectionEstimate" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/collections/resolve:
    post:
      tags: [Collections]
      operationId: resolveCollectionDraft
      summary: The concrete symbols of an option universe that is not saved yet
      description: |
        The preview behind the collection builder: the same work as `GET /v1/collections/{name}/resolve`, for a universe you
        are still editing. Nothing is saved. The price rules are the same: a delayed, end-of-day or stale price for the
        at-the-money strike is refused (422 or 503) unless `allowStale=true`, and then the answer says so in `atmSource` and
        `warnings`.
      x-module: library
      x-scope: read
      parameters:
        - { name: allowStale, in: query, description: "Accept a stale, delayed or end-of-day price for the ATM (it is labelled).", schema: { type: boolean } }
        - { name: spot, in: query, description: "Work out the ATM from this price instead of reading one.", schema: { type: number } }
        - $ref: "#/components/parameters/AccountQueryOptional"
      requestBody:
        required: true
        content:
          application/json:
            example: {"kind":"option-universe","universe":{"underlying":"NIFTY","expiries":"current-weekly","strikes":{"around":"atm","count":10},"sides":["CE","PE"]}}
            schema: { $ref: "#/components/schemas/CollectionResolveDraft" }
      responses:
        "200":
          description: The symbols for now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/CollectionDraftResolution" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/ltp:
    get:
      tags: [Market data]
      operationId: getLtp
      summary: Last traded price for up to 200 symbols
      x-module: market
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/Symbols"
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
        - $ref: "#/components/parameters/Swr"
        - $ref: "#/components/parameters/ReadPriority"
        - $ref: "#/components/parameters/Strict"
      responses:
        "200":
          description: Prices; symbols that failed are listed in `errors`.
          content:
            application/json:
              example: {"data":[{"symbol":"NSE:RELIANCE","ltp":1458.8,"freshness":{"source":"broker","asOf":"2026-11-10T09:46:00.381+05:30","ageMs":1,"stale":false,"accountId":"my-zerodha","broker":"zerodha","class":"realtime","delaySec":0,"official":true,"confidence":"high","flags":[]}},{"symbol":"NSE:NIFTY","ltp":24552.25,"freshness":{"source":"broker","asOf":"2026-11-10T09:46:00.381+05:30","ageMs":1,"stale":false,"accountId":"my-zerodha","broker":"zerodha","class":"realtime","delaySec":0,"official":true,"confidence":"high","flags":[]}}],"errors":[],"meta":{"requestId":"req_2f8e1a0c4b7d9e3a5c61"}}
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LtpItem" } }
                  errors: { type: array, items: { $ref: "#/components/schemas/ItemError" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/quotes:
    get:
      tags: [Market data]
      operationId: getQuotes
      summary: Full quotes for up to 200 symbols
      x-module: market
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/Symbols"
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
        - $ref: "#/components/parameters/Swr"
