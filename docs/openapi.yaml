            properties:
              symbol: { $ref: "#/components/schemas/Symbol" }
              qty: { type: integer, description: "Signed units: + long, − short." }
              bid: { type: number, minimum: 0 }
              ask: { type: number, minimum: 0 }
    ExpiryCostsLeg:
      type: object
      properties:
        symbol: { type: string }
        qty: { type: integer }
        moneyness: { type: [string, "null"], enum: [ITM, CTM, OTM, null], description: "CTM is the Bridge's display band (closeToMoneyStrikes steps), not an exchange definition." }
        intrinsic: { type: [number, "null"] }
        obligation: { type: [object, "null"], properties: { kind: { type: string, enum: [receive-shares, deliver-shares] }, shares: { type: integer }, cash: { type: number }, text: { type: string } } }
        deliveryMargin: { type: [object, "null"], properties: { pct: { type: [number, "null"] }, indicative: { type: [number, "null"] }, basis: { type: [string, "null"] }, inWindow: { type: boolean } } }
        settle: { type: [object, "null"], properties: { total: { type: number }, lines: { type: array, items: { type: object, properties: { key: { type: string }, value: { type: number } } } }, excluded: { type: array, items: { type: string } } } }
        squareOff: { type: [object, "null"], properties: { price: { type: [number, "null"] }, side: { type: string, enum: [BUY, SELL] }, total: { type: [number, "null"] }, premium: { type: [number, "null"] }, lines: { type: array, items: { type: object } } } }
        difference: { type: [number, "null"] }
        covered: { type: [boolean, "null"] }
        underlying: { type: string }
    ExpiryCostsResult:
      type: object
      required: [asOf, legs, notes]
      properties:
        asOf: { type: string, format: date }
        day: { type: [string, "null"], description: "E-n (trading days to the expiry) or E." }
        inWindow: { type: boolean }
        settlement: { type: string, enum: [cash, physical] }
        spot: { type: [number, "null"] }
        strikeStep: { type: [number, "null"] }
        rates: { type: object, properties: { asOf: { type: [string, "null"] }, verified: { type: boolean }, source: { type: string } } }
        legs: { type: array, items: { $ref: "#/components/schemas/ExpiryCostsLeg" } }
        notes: { type: array, items: { type: string } }
    SweepRequest:
      type: object
      additionalProperties: false
      properties:
        underlyings:
          oneOf:
            - { type: string, enum: [indices, stocks, indices+stocks] }
            - { type: array, maxItems: 500, items: { type: string, maxLength: 30 } }
        stocks:
          oneOf:
            - { type: string, enum: [all, optIn] }
            - { type: array, maxItems: 1000, items: { type: string, maxLength: 30 } }
        force: { type: boolean }
        method: { type: string, enum: [auto, chain, quotes] }
    SweepPlan:
      type: object
      properties:
        account: { type: object, properties: { id: { type: string }, broker: { type: string } } }
        fits: { type: boolean }
        limited: { type: boolean }
        groups:
          type: array
          items: { type: object, properties: { kind: { type: string, enum: [index, stock] }, method: { type: string, enum: [chain, quotes] }, keys: { type: integer }, stocks: { type: integer }, calls: { type: integer }, class: { type: string }, ratePerMin: { type: number }, minutes: { type: number } } }
        minutes: { type: number }
        hv: { type: object, properties: { calls: { type: integer }, source: { type: string }, minutes: { type: number } } }
        autoIntervalSec: { type: integer }
        maxStocksThatFit: { type: integer }
        message: { type: string }
        quotesVerified: { type: boolean }
        basis: { type: string }
    SweepJob:
      type: object
      required: [id, status, progress]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, done, partial, cancelled, failed, interrupted] }
        requestedBy: { type: string }
        startedAt: { type: string }
        finishedAt: { type: [string, "null"] }
        plan: { $ref: "#/components/schemas/SweepPlan" }
        progress:
          type: object
          properties:
            total: { type: integer }
            done: { type: integer }
            failed: { type: integer }
            phase: { type: [string, "null"], enum: [queued, spots, index-chains, stock-chains, hv, null] }
            current: { type: [string, "null"] }
            etaSeconds: { type: [integer, "null"] }
            calls: { type: object, additionalProperties: { type: integer } }
            hv: { type: object, properties: { done: { type: integer }, total: { type: integer } } }
        cursor: { type: integer }
        durationMs: { type: [integer, "null"] }
        joined: { type: boolean }
        reused: { type: boolean }
        lease: { type: object, properties: { until: { type: [string, "null"] } } }
    SweepChainsPage:
      type: object
      required: [items, nextCursor, done]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              seq: { type: integer }
              at: { type: string }
              method: { type: string, enum: [chain, quotes] }
              chain: { $ref: "#/components/schemas/OptionChain" }
        nextCursor: { type: integer }
        done: { type: boolean }
        hv: { type: object, additionalProperties: { type: number }, description: "HV20 (percent) per underlying; on the last page only." }
    SweepSettings:
      type: object
      properties:
        optIn: { type: array, items: { type: string } }
        setAt: { type: [string, "null"] }
        setBy: { type: [string, "null"] }
        background: { type: boolean }
        leaseSeconds: { type: integer }
        persisted: { type: boolean }
    OptionChain:
      type: object
      required: [underlying, expiry, rows, freshness]
      properties:
        underlying: { type: string }
        expiry: { type: string, format: date }
        underlyingLtp: { type: [number, "null"] }
        atmStrike: { type: [number, "null"] }
        lotSize: { type: [integer, "null"] }
        underlyingKind: { type: [string, "null"], enum: [index, stock, null], description: "From the master (OPTSTK vs OPTIDX: the spot row's kind)." }
        settlement: { type: [string, "null"], enum: [cash, physical, null], description: "physical for stock derivatives, cash for index derivatives." }
        strikeStep: { type: [number, "null"], description: "Most common gap between listed strikes of this expiry (inferred); null with fewer than 3 strikes." }
        tickSize: { type: [number, "null"], description: "Largest option tick size of this expiry in the master." }
        rows:
          type: array
          items:
            type: object
            required: [strike]
            properties:
              strike: { type: number }
              ce: { oneOf: [{ $ref: "#/components/schemas/ChainLeg" }, { type: "null" }] }
              pe: { oneOf: [{ $ref: "#/components/schemas/ChainLeg" }, { type: "null" }] }
        freshness: { $ref: "#/components/schemas/Freshness" }
        pricing: { $ref: "#/components/schemas/ChainPricing" }
    VolUnavailable:
      type: object
      required: [available, reason]
      properties:
        underlying: { type: string }
        available: { type: boolean, const: false }
        reason: { type: string, description: "Open enum: NOT_TRACKED, NO_HISTORY, COLLECTING, SOURCE_OFF, NO_CHAIN, NO_DATA_ACCOUNT, NOT_LISTED_IN_DEMO." }
    VolData:
      type: object
      description: Shapes in docs/spec/p1-03-pricing-vol.md §3.4–3.8; the full schemas land with the handlers (P1-3b/P1-3c).
      additionalProperties: true
    VolClockPart:
      type: object
      properties:
        date: { type: string, format: date }
        kind: { type: string, enum: [gap, session] }
        units: { type: number }
    VolClockResult:
      type: object
      properties:
        expiry: { type: string, format: date }
        T: { type: [number, "null"], description: "Years on the configured clock." }
        units: { type: [number, "null"], description: "Trading-day units (calendar days in calendar mode)." }
        Tcal: { type: [number, "null"], description: "Calendar years (ACT/365) to the expiry close." }
        Ttd: { type: [number, "null"], description: "Trading-day years (/252)." }
        parts: { type: array, items: { $ref: "#/components/schemas/VolClockPart" } }
    VolClock:
      type: object
      properties:
        underlying: { type: string }
        exchange: { type: string }
        at: { type: string, format: date-time }
        settings: { type: object, additionalProperties: true }
        rate: { type: object, additionalProperties: true }
        holidays:
          type: array
          description: Holidays in [at, at + 400 days] for the underlying's exchange; the dashboard builds its client clock from them.
          items:
            type: object
            required: [date, label, verified]
            properties:
              date: { type: string, format: date }
              label: { type: [string, "null"] }
              verified: { type: boolean }
        expiries: { type: array, items: { $ref: "#/components/schemas/VolClockResult" } }
    VolCaptureRequest:
      type: object
      additionalProperties: false
      properties:
        underlyings: { type: array, maxItems: 50, items: { type: string, maxLength: 30 } }
        replace: { type: boolean, default: false }
    VolBackfillRequest:
      type: object
      additionalProperties: false
      properties:
        sources: { type: array, items: { type: string, enum: [nse, bse, vix] } }
        from: { type: string, format: date }
        to: { type: string, format: date }
        underlyings: { type: array, maxItems: 50, items: { type: string, maxLength: 30 } }
    ChainPricing:
      type: object
      description: How every leg's IV and Greeks were computed (present with ivModel=b76-forward).
      properties:
        model: { type: string, const: black76-parity-forward }
        ivModel: { type: string, const: b76-forward }
        priceBasis: { type: string, const: mid }
        forward: { type: [number, "null"] }
        forwardSource: { type: [string, "null"], enum: [parity, spot, null] }
        forwardStrikes: { type: integer }
        rate:
          type: object
          properties:
            value: { type: number }
            quality: { type: [string, "null"] }
        clock:
          type: object
          properties:
            version: { type: string }
            mode: { type: string, enum: [weighted, trading, calendar] }
            T: { type: number, description: "Years on the vol-time clock (used inside sigma times root T)." }
            units: { type: number }
            Tcal: { type: number, description: "Calendar years (interest and discounting)." }
            yearBasis: { type: number, description: "Clock units a year; theta is per one unit." }
    StreamStats:
      type: object
      properties:
        clients: { type: integer }
        symbols: { type: integer }
        upstreams:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              broker: { type: string }
              connected: { type: boolean }
              subscriptions: { type: integer }
              limit: { type: [integer, "null"] }
              state: { type: string, enum: [up, stale, down] }
              detail: { type: [string, "null"] }
              reason: { type: [string, "null"] }
              modes: { type: object, additionalProperties: { type: integer } }
              reconnects: { type: integer }
              ticks: { type: integer }
              lastTickAt: { type: [string, "null"], format: date-time }
        downstream:
          type: object
          properties:
            connections: { type: integer }
            maxConnections: { type: integer }
            ws: { type: integer }
            sse: { type: integer }
            queued: { type: integer }
            conflatedTicks: { type: integer }
            slowDisconnects: { type: integer }
            opened: { type: integer }

    Position:
      type: object
      required: [symbol, product, netQty, avgPrice, pnl]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF, CO, BO] }
        netQty: { type: number }
        avgPrice: { type: number }
        ltp: { type: [number, "null"] }
        pnl: { type: number }
        realisedPnl: { type: [number, "null"] }
        unrealisedPnl: { type: [number, "null"] }
        charges: { type: [number, "null"], description: Paper accounts only; estimated brokerage and taxes. }
    Holding:
      type: object
      required: [symbol, qty, avgPrice]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        isin: { type: [string, "null"] }
        qty: { type: number }
        avgPrice: { type: number }
        ltp: { type: [number, "null"] }
        pnl: { type: [number, "null"] }
    Funds:
      type: object
      required: [availableCash, usedMargin]
      properties:
        availableCash: { type: number }
        usedMargin: { type: number }
        totalBalance: { type: [number, "null"] }
        collateral: { type: [number, "null"] }
        withdrawable: { type: [number, "null"] }
        realisedPnl: { type: [number, "null"] }
        unrealisedPnl: { type: [number, "null"] }

    OrderStatus:
      type: string
      enum: [pending, open, trigger_pending, partially_filled, filled, cancelled, rejected, expired, outcome_unknown]
    OrderRequest:
      type: object
      required: [account, symbol, side, product, orderType]
      additionalProperties: false
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer, minimum: 1, description: "Units; must be a multiple of the lot size. Send this or lots." }
        lots: { type: integer, minimum: 1 }
        lotSizeConfirmed: { type: integer, minimum: 1, description: "The lot size (units per lot) the caller has checked; used only when reference lot data is stale or conflicts with the master (preview check LOT_SIZE_STALE)." }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF], description: "No default." }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M], description: "No default." }
        price: { type: number, exclusiveMinimum: 0, description: "Required for LIMIT and SL." }
        triggerPrice: { type: number, exclusiveMinimum: 0, description: "Required for SL and SL-M." }
        validity: { type: string, enum: [DAY, IOC], default: DAY }
        marketProtectionPct: { type: number, exclusiveMinimum: 0, maximum: 10, description: "For MARKET and SL-M; defaults to the configured value." }
        disclosedQuantity: { type: integer, minimum: 0 }
        mode: { type: string, enum: [paper, live], default: paper }
        clientOrderId: { $ref: "#/components/schemas/ClientOrderId" }
        tag: { type: string, pattern: "^[A-Za-z0-9_-]{1,20}$", description: "Strategy label, kept in the audit log and sent to the broker where supported." }
        algoId: { type: string, maxLength: 32, description: "Exchange algo id for a registered strategy, where the broker accepts one." }
        confirmToken: { type: string, description: "From a human confirmation (required for orders prepared by AI assistants)." }
      oneOf:
        - required: [quantity]
          not: { required: [lots] }
        - required: [lots]
          not: { required: [quantity] }
    OrderChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        quantity: { type: integer, minimum: 1 }
        price: { type: number, exclusiveMinimum: 0 }
        triggerPrice: { type: number, exclusiveMinimum: 0 }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
        validity: { type: string, enum: [DAY, IOC] }
    OrderLeg:
      type: object
      required: [quantity, status]
      properties:
        brokerOrderId: { type: [string, "null"] }
        quantity: { type: integer }
        status: { $ref: "#/components/schemas/OrderStatus" }
        error:
          oneOf:
            - type: "null"
            - type: object
              properties:
                code: { type: string }
                message: { type: string }
    OrderResult:
      type: object
      required: [orderId, accountId, broker, mode, symbol, side, quantity, filledQuantity, orderType, product, status, legs, placedAt, updatedAt]
      properties:
        orderId: { type: string, description: "Bridge id: ord_... for live, PAPER-... for paper." }
        clientOrderId: { type: [string, "null"] }
        accountId: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        mode: { type: string, enum: [paper, live] }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer }
        filledQuantity: { type: integer }
        avgPrice: { type: [number, "null"] }
        price: { type: [number, "null"] }
        triggerPrice: { type: [number, "null"] }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF] }
        validity: { type: string, enum: [DAY, IOC] }
        status: { $ref: "#/components/schemas/OrderStatus" }
        brokerStatus: { type: [string, "null"], description: "The broker's own status text." }
        statusMessage: { type: [string, "null"] }
        legs:
          type: array
          description: One leg per broker order (orders above the freeze quantity are sliced).
          items: { $ref: "#/components/schemas/OrderLeg" }
        source: { type: string, enum: [rest, webhook, mcp, cli, system], description: '"system" is used for automatic intraday square-off of paper positions.' }
        tag: { type: [string, "null"] }
        placedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Check:
      type: object
      required: [code, message, severity]
      properties:
        code:
          type: string
          description: >-
            An open set. Codes include the error codes, SAFETY_WARNING, LOT_SIZE_STALE, and (p1-06) FNO_BAN (block: an
            opening order in a stock derivative in the F&O ban period; closing orders pass), FNO_BAN_UNCONFIRMED (warn:
            positions could not be read, the broker decides), BAN_DATA_UNAVAILABLE (warn: no ban list loaded) and
            PHYSICAL_SETTLEMENT (warn: from E-4, an opening order in an ITM or close-to-money stock option).
        message: { type: string }
        severity: { type: string, enum: [block, warn] }
    PreviewResult:
      type: object
      required: [ok, mode, checks, requiresHumanConfirmation]
      properties:
        ok: { type: boolean }
        mode: { type: string, enum: [paper, live] }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        margin:
          description: >-
            The margin this order would block. Paper orders (a paper account, or any account in paper mode): the paper
            engine's own model on the exposure the order adds (a quantity that closes a held position blocks nothing),
            the same figure its fill will use. Live orders: null (the broker decides). Each leg of a basket is sized
            alone, with no hedge benefit.
          oneOf:
            - type: object
              required: [required, source]
              properties:
                required: { type: [number, "null"], description: "Rupees." }
                source: { type: [string, "null"], enum: [paper-model, null] }
            - type: "null"
        resolved: { oneOf: [{ $ref: "#/components/schemas/Instrument" }, { type: "null" }] }
        quantity: { type: [integer, "null"] }
        estimatedValue: { type: [number, "null"] }
        ltp: { type: [number, "null"] }
        confirmToken: { type: [string, "null"] }
        confirmExpiresAt: { type: [string, "null"], format: date-time }
        requiresHumanConfirmation: { type: boolean }
        ticketId: { type: [string, "null"], description: "Set when a human must confirm; the ticket appears in GET /v1/tickets (the dashboard's Pending confirmations panel)." }
    Ticket:
      type: object
      required: [ticketId, order, source, checks, createdAt, expiresAt]
      properties:
        ticketId: { type: string }
        order: { $ref: "#/components/schemas/OrderRequest" }
        source: { type: string, enum: [mcp, webhook, rest] }
        client: { type: string, description: "Key label or hook label that prepared it." }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        estimatedValue: { type: [number, "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Trade:
      type: object
      required: [tradeId, orderId, symbol, side, qty, price]
      properties:
        tradeId: { type: string }
        orderId: { type: string }
        accountId: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live] }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        qty: { type: number }
        price: { type: number }
        product: { type: [string, "null"] }
        charges: { type: [number, "null"] }
        tradedAt: { type: [string, "null"], format: date-time }
    PaperAccount:
      type: object
      required: [accountId, startingCapital, funds]
      properties:
        accountId: { $ref: "#/components/schemas/AccountId" }
        startingCapital: { type: number }
        createdAt: { type: string, format: date-time }
        resetAt: { type: [string, "null"], format: date-time }
        ordersToday: { type: integer }
        funds: { $ref: "#/components/schemas/Funds" }
        fillModel: { type: string, description: "Short description of how paper fills are simulated." }

    LimitsReport:
      type: object
      properties:
        safety:
          type: object
          description: Effective safety limits per account (the stricter of global and account values).
          additionalProperties:
            type: object
            properties:
              dailyMaxOrders: { type: integer }
              dailyMaxLoss: { type: number }
              maxOrderValue: { type: number }
              maxLotsPerOrder: { type: integer }
              orderRatePerSecond: { type: number }
        brokers:
          type: object
          additionalProperties: { $ref: "#/components/schemas/BrokerPolicy" }
        client:
          type: object
          description: This key's own request budget.
          properties:
            perSecond: { type: number }
            remaining: { type: number }
    UsageReport:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              broker: { type: string }
              classes:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    used: { type: number }
                    limit: { type: number }
                    queued: { type: integer }
                    resetMs: { type: integer }
        savings:
          type: object
          description: Broker calls avoided today.
          properties:
            servedFromStream: { type: integer }
            servedFromCache: { type: integer }
            coalesced: { type: integer }
            batched: { type: integer }
    KillSwitchState:
      type: object
      required: [engaged]
      properties:
        engaged: { type: boolean }
        reason: { type: [string, "null"] }
        by: { type: [string, "null"] }
        at: { type: [string, "null"], format: date-time }
    SafetyStatus:
      type: object
      required: [killSwitch, liveTrading]
      properties:
        killSwitch: { $ref: "#/components/schemas/KillSwitchState" }
        liveTrading: { type: boolean, description: "Global config switch." }
        accounts:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              liveAllowedByConfig: { type: boolean }
              ordersToday: { type: integer }
              realisedPnlToday: { type: number }
              limits: { type: object }
    ReadinessState:
      type: string
      description: "Account trading readiness. Open enum: new values may be added."
      enum: [ready, warn, cannot_trade, paper_only, unknown]
    ReadinessReason:
      type: object
      required: [check, code, severity, message]
      properties:
        check: { type: string, examples: [session, egress, orderRate, dailyOrders, dailyLoss, killSwitch, live, readiness] }
        code:
          type: string
          description: >-
            Open list: LIVE_OFF, SESSION_EXPIRED, SESSION_MISSING, SESSION_ERROR, SESSION_REJECTED, SESSION_EXPIRES_SOON,
            PROBE_FAILED, IP_MISMATCH, IP_NOT_REGISTERED, IP_INVALID_CONFIG, IP_FAMILY_DIFFERS, IP_UNCHECKED,
            IP_LOOKUP_FAILED, CLOCK_SKEW, RATE_CAP_REACHED, BROKER_ORDER_BACKOFF, DAILY_ORDERS_LOW, DAILY_ORDERS_EXHAUSTED,
            DAILY_LOSS_NEAR, DAILY_LOSS_REACHED, KILL_SWITCH, STALE.
        severity: { type: string, enum: [warn, fail] }
        message: { type: string }
    ReadinessCheck:
      type: object
      required: [status]
      additionalProperties: true
      properties:
        status: { type: string, enum: [pass, warn, fail, unknown, n/a] }
    ReadinessAutomation:
      type: object
      required: [id, kind, label, mode, state]
      properties:
        id: { type: string }
        kind: { type: string, examples: [webhook, guard, alert, sample] }
        label: { type: string }
        mode: { type: string, enum: [paper, live] }
        state: { $ref: "#/components/schemas/ReadinessState" }
    AccountReadiness:
      type: object
      required: [accountId, broker, state, reasons, checks, live, simulated, stale]
      properties:
        accountId: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        brokerName: { type: string }
        label: { type: [string, "null"] }
        simulated: { type: boolean, description: "Demo mode: a simulated live account (no real broker)." }
        live:
          type: object
          properties:
            globalLiveTrading: { type: [boolean, string] }
            accountLiveEnabled: { type: [boolean, string] }
            allowedByConfig: { type: boolean }
        state: { $ref: "#/components/schemas/ReadinessState" }
        since: { type: [string, "null"], format: date-time }
        checkedAt: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        reasons: { type: array, items: { $ref: "#/components/schemas/ReadinessReason" } }
        checks:
          type: object
          properties:
            session: { $ref: "#/components/schemas/ReadinessCheck" }
            egress: { $ref: "#/components/schemas/ReadinessCheck" }
            orderRate: { $ref: "#/components/schemas/ReadinessCheck" }
            dailyOrders: { $ref: "#/components/schemas/ReadinessCheck" }
            dailyLoss: { $ref: "#/components/schemas/ReadinessCheck" }
            killSwitch: { $ref: "#/components/schemas/ReadinessCheck" }
        automations: { type: array, items: { $ref: "#/components/schemas/ReadinessAutomation" } }
    HolderTag:
      type: object
      additionalProperties: false
      required: [relationship]
      properties:
        relationship: { type: string, enum: [self, spouse, dependent-child, dependent-parent, huf, other], description: "Closed in this version; read it as open (new values may be added)." }
        label: { type: string, maxLength: 40 }
    BookHolder:
      type: object
      required: [holder, label, relationship, inFamily, accounts]
      properties:
        holder: { type: string }
        label: { type: string }
        relationship: { type: [string, "null"], description: "null: no tag (outside the family until tagged)" }
        inFamily: { type: boolean }
        source: { type: [string, "null"], enum: [config, file, default, null] }
        locked: { type: boolean, description: "Set in bridge.config.json (book.holders); read-only here." }
        accounts: { type: array, items: { type: string }, description: "Account ids this key may see." }
        accountCount: { type: integer }
    BookHolders:
      type: object
      required: [family, relationships, holders]
      properties:
        family: { type: object, properties: { name: { type: string }, relationships: { type: array, items: { type: string } } } }
        relationships: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string }, inFamily: { type: boolean } } } }
        untaggedHolder: { type: string }
        holders: { type: array, items: { $ref: "#/components/schemas/BookHolder" } }
        note: { type: string }
    BookLeg:
      type: object
      required: [account, symbol, q]
      properties:
        account: { type: string, description: "The leg's own account; every exit goes here." }
        symbol: { type: string }
        kind: { type: string, enum: [OPT, FUT] }
        q: { type: number, description: "Signed units (negative = short)." }
        avg: { type: [number, "null"] }
        mark: { type: [number, "null"] }
        markSource: { type: [string, "null"], description: "mid | ltp | position" }
        pnl: { type: [number, "null"] }
        iv: { type: [number, "null"], description: "Percent, solved from the mark on the forward." }
        greeks: { type: [object, "null"], description: "Per unit: delta, gamma, theta (₹ per day), vega (₹ per vol point)." }
        guarded: { type: array, items: { type: string }, description: "Guard ids watching this leg." }
    Book:
      type: object
      required: [view, asOf, holders, outsideFamily, method, disclaimer]
      description: >-
        docs/spec/p1-12-guard-participants.md §4.3.1. holders[]: { holder, label, relationship, inFamily, priceSource,
        accounts[] (account, broker, label, mode, tags, positions, pnl, margin { used, available, asOf, source }, error),
        underlyings[] (underlying, spot, lot, greeks { delta, deltaLots, rupeeDelta, gamma, theta, vega, missing } | null,
        legs[] BookLeg), totals { pnl, theta, vega, rupeeDelta, marginUsed, marginAvailable } }. family (view=family):
        { name, relationships, holders, totals { pnl, realised, unrealised, theta, vega, rupeeDelta, marginUsed,
        marginAvailable, accounts, partial }, notes }.
      properties:
        view: { type: string, enum: [holders, family] }
        asOf: { type: string, format: date-time }
        family: { type: [object, "null"] }
        holders: { type: array, items: { type: object } }
        outsideFamily: { type: array, items: { type: object, properties: { holder: { type: string }, label: { type: string }, relationship: { type: [string, "null"] }, accounts: { type: integer }, note: { type: string } } } }
        partial: { type: boolean }
        method: { type: string }
        disclaimer: { type: string }
    Readiness:
      type: object
      required: [overall, summary, accounts, paperOnly, method]
      properties:
        overall: { $ref: "#/components/schemas/ReadinessState" }
        summary: { type: string, examples: ["1 of 2 live accounts cannot trade"] }
        checkedAt: { type: [string, "null"], format: date-time }
        disabled: { type: boolean, description: "readiness.enabled is false." }
        accounts: { type: array, items: { $ref: "#/components/schemas/AccountReadiness" } }
        paperOnly: { type: boolean }
        egress:
          type: object
          description: ip and seenBy only for callers on this computer or with the admin scope.
          properties:
            mode: { type: string, enum: [off, lookup, manual] }
            checkedAt: { type: [string, "null"], format: date-time }
            family: { type: [string, "null"], enum: [ipv4, ipv6, null] }
            seenBy: { type: [string, "null"] }
            ip: { type: [string, "null"] }
            clockSkewMs: { type: [integer, "null"] }
            lastError: { type: [string, "null"] }
        schedule: { type: object, additionalProperties: true }
        automations:
          type: object
          properties:
            total: { type: integer }
            live: { type: integer }
            cannotTrade: { type: integer }
        notifications:
          type: object
          properties:
            targetsListening: { type: array, items: { type: string } }
            warning: { type: [string, "null"] }
            demoOff: { type: boolean }
        method: { type: string }
    ReadinessTransition:
      type: object
      required: [at, accountId, from, to, codes]
      properties:
        at: { type: string, format: date-time }
        accountId: { $ref: "#/components/schemas/AccountId" }
        from: { $ref: "#/components/schemas/ReadinessState" }
        to: { $ref: "#/components/schemas/ReadinessState" }
        codes: { type: array, items: { type: string } }
    AuditRecord:
      type: object
      required: [seq, at, type, actor, source, hash, prevHash]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        type: { type: string, examples: [order.placed, order.refused, key.created, kill_switch.engaged, account.connected] }
        actor:
          type: object
          properties:
            kind: { type: string }
            id: { type: string }
        source: { type: string }
        accountId: { type: [string, "null"] }
        requestId: { type: [string, "null"] }
        data: { type: object }
        prevHash: { type: string }
        hash: { type: string }

    Hook:
      type: object
      required: [id, source, label, account, mode, createdAt]
      properties:
        id: { type: string }
        source: { type: string, enum: [generic, chartink, gocharting] }
        label: { type: string }
        account: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live] }
        requireConfirmation: { type: boolean }
        allowedSymbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        maxLotsPerSignal: { type: integer }
        side: { type: [string, "null"], enum: [BUY, SELL, null] }
        product: { type: [string, "null"], enum: [CNC, INTRADAY, MARGIN, null] }
        orderType: { type: string, enum: [LIMIT, MARKET] }
        allowSourceIps: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        lastSignalAt: { type: [string, "null"], format: date-time }
        readiness:
          description: "Live hooks: the readiness state of the hook's account (orders are refused with CANNOT_TRADE while it is cannot_trade). null for paper hooks."
          oneOf:
            - { $ref: "#/components/schemas/ReadinessState" }
            - { type: "null" }
    HookCreate:
      type: object
      required: [source, label, account]
      additionalProperties: false
      properties:
        source: { type: string, enum: [generic, chartink, gocharting] }
        label: { type: string, minLength: 1, maxLength: 60 }
        account: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live], default: paper }
        requireConfirmation: { type: boolean, default: false }
        allowedSymbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        maxLotsPerSignal: { type: integer, minimum: 1, default: 1 }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN] }
        orderType: { type: string, enum: [LIMIT, MARKET], default: LIMIT }
        side: { type: string, enum: [BUY, SELL], description: "Fix the side for every signal (needed for ChartInk, whose alerts carry no side)." }
        allowSourceIps: { type: array, items: { type: string }, description: "Optional allowlist of sender IP addresses or IPv4 CIDR blocks." }
        acknowledgeUnsignedLive: { type: boolean, default: false, description: "Live mode on an unsigned source (chartink, gocharting) needs allowSourceIps, requireConfirmation or this acknowledgement." }
    RefMeta:
      type: object
      properties:
        source: { type: [string, "null"] }
        asOf: { type: [string, "null"] }
        quality: { type: string, enum: [exchange, master, curated, user, config, default, inferred, demo] }
        verified: { type: boolean }
        stale: { type: boolean }
        staleTradingDays: { type: [integer, "null"] }
    RefUnavailable:
      type: object
      description: A dataset that is unavailable is not an error. reason is open-ended (SOURCE_OFF, NEVER_FETCHED, NOT_RECORDED, PARSE_FAILED, NO_MASTER, INDEX_CASH_SETTLED).
      properties:
        available: { type: boolean, enum: [false] }
        reason: { type: string }
    RefSession:
      type: object
      properties:
        date: { type: string, format: date }
        exchange: { type: string }
        state: { type: string, enum: [CLOSED, PRE_OPEN, OPEN, SPECIAL, HOLIDAY] }
        label: { type: string }
        preOpen: { type: string, description: "HH:MM IST" }
        open: { type: string }
        close: { type: string }
        holiday: { type: [object, "null"], properties: { label: { type: string }, verified: { type: boolean } } }
        special: { type: [object, "null"], properties: { label: { type: string }, open: { type: [string, "null"] }, close: { type: [string, "null"] }, verified: { type: boolean } } }
        tradingDay: { type: boolean }
        source: { type: string }
        asOf: { type: string }
    RefHoliday:
      type: object
      properties:
        date: { type: string, format: date }
        label: { type: string }
        exchanges: { type: array, items: { type: string, enum: [NSE, BSE] } }
        verified: { type: boolean }
        origin: { type: string, enum: [shipped, config] }
    RefHolidays:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RefHoliday" } }
        specialSessions:
          type: array
          description: Special sessions (for example Muhurat trading) in the same range; open/close are null when not announced.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              label: { type: string }
              open: { type: [string, "null"] }
              close: { type: [string, "null"] }
              verified: { type: boolean }
              origin: { type: string }
        source: { type: string }
        asOf: { type: string }
    RefExpiry:
      type: object
      properties:
        date: { type: string, format: date }
        kind: { type: string, enum: [weekly, monthly] }
        lot: { type: [integer, "null"], description: "Units per lot (the master's contract lot)." }
        shifted: { type: boolean }
        ruleDate: { type: string, format: date }
        reason: { type: string }
        source: { type: string }
    RefExpiries:
      type: object
      properties:
        underlying: { type: string }
        exchange: { type: string }
        kind: { type: [string, "null"], enum: [index, stock, null] }
        expiries: { type: array, items: { $ref: "#/components/schemas/RefExpiry" } }
        source: { type: string }
        asOf: { type: [string, "null"] }
    RefLotRow:
      type: object
      properties:
        expiryMonth: { type: string, description: "YYYY-MM" }
        lot: { type: integer }
        effectiveFrom: { type: [string, "null"], format: date }
        lastOldExpiry: { type: [string, "null"], format: date }
        source: { type: string }
    RefFreeze:
      type: object
      properties:
        freezeQty: { type: [integer, "null"], description: "Units; null means unknown (slicing is not checked)." }
        source: { type: [string, "null"], enum: [master, exchange-list, config, null] }
        verified: { type: boolean }
    RefLots:
      type: object
      properties:
        underlying: { type: string }
        exchange: { type: string }
        history: { type: array, items: { $ref: "#/components/schemas/RefLotRow" } }
        current: { type: [integer, "null"] }
        next: { type: object, properties: { lot: { type: [integer, "null"] }, from: { type: [string, "null"] } } }
        freeze: { $ref: "#/components/schemas/RefFreeze" }
        source: { type: [string, "null"] }
        asOf: { type: [string, "null"] }
        stale: { type: boolean }
        staleTradingDays: { type: [integer, "null"] }
        conflict: { type: [object, "null"], properties: { master: { type: integer }, reference: { type: integer } } }
    RefBanItem:
      type: object
      properties:
        symbol: { type: string }
        mwplPct: { type: [number, "null"] }
    RefBan:
      type: object
      properties:
        forDate: { type: string, format: date }
        items: { type: array, items: { $ref: "#/components/schemas/RefBanItem" } }
        available: { type: boolean }
        reason: { type: string }
        asOf: { type: [string, "null"] }
        source: { type: [string, "null"] }
    RefMwplItem:
      type: object
      properties:
        symbol: { type: string }
        mwpl: { type: number, description: "Shares." }
        oi: { type: number, description: "Combined open interest, shares." }
        mwplPct: { type: [number, "null"] }
        band: { type: [string, "null"], enum: [ban, high, normal, null], description: "ban: on the ban list (the authority); high: 80 % or more (a display band, not an exchange status)." }
        limitNextDay: { type: [number, "null"] }
    RefMwpl:
      type: object
      properties:
        forDate: { type: string, format: date }
        items: { type: array, items: { $ref: "#/components/schemas/RefMwplItem" } }
        available: { type: boolean }
        reason: { type: string }
        asOf: { type: [string, "null"] }
        source: { type: [string, "null"] }
    RefUniverseItem:
      type: object
      properties:
        symbol: { type: string }
        kind: { type: string, enum: [index, stock] }
        exchange: { type: string }
        since: { type: string, format: date }
        sinceIsFirstFetch: { type: boolean, description: "A member on the first fetch: the true entry date is earlier and unknown." }
    RefUniverse:
      type: object
      properties:
        date: { type: string, format: date }
        coverage: { type: string, enum: [recorded, not-recorded] }
        knownSince: { type: [string, "null"], format: date }
        items: { type: array, items: { $ref: "#/components/schemas/RefUniverseItem" } }
        count: { type: integer }
        changes: { type: array, items: { type: object, properties: { date: { type: string }, symbol: { type: string }, change: { type: string, enum: [added, removed] } } } }
        source: { type: string }
        available: { type: boolean }
        reason: { type: string }
    CorporateAction:
      type: object
      properties:
        id: { type: string }
        symbol: { type: string }
        exchange: { type: string, enum: [NSE, BSE] }
        type: { type: string, enum: [bonus, split, consolidation, rights, dividend, other] }
        ratio: { type: [object, "null"], properties: { new: { type: integer }, held: { type: integer } } }
        exDate: { type: [string, "null"], format: date }
        subscriptionPrice: { type: [number, "null"] }
        cumPrice: { type: [number, "null"] }
        dividend: { type: [number, "null"] }
        fv: { type: [object, "null"], properties: { from: { type: number }, to: { type: number } } }
        factor: { type: [number, "null"], description: "Computed by the Bridge (never taken from input)." }
        lotRule: { type: string }
        strikeTick: { type: number }
        source: { type: string }
        verified: { type: boolean }
        illustrative: { type: boolean }
        origin: { type: string, enum: [shipped, user, inferred] }
        quality: { type: string }
        nonStandard: { type: boolean }
        text: { type: string }
        contract: { type: object }
        adjusted: { type: object, properties: { exampleStrikes: { type: array, items: { type: object } }, lotBefore: { type: [integer, "null"] }, lotAfter: { type: [integer, "null"] } } }
        exampleStrikes: { type: array, items: { type: number }, description: "Pre-action example strikes stored with a user entry (the ones its preview showed)." }
        addedAt: { type: string }
    CorporateActionInput:
      type: object
      required: [symbol, type, exDate]
      additionalProperties: false
      properties:
        symbol: { type: string, maxLength: 30 }
        exchange: { type: string, enum: [NSE, BSE] }
        type: { type: string, enum: [bonus, split, consolidation, rights, dividend, other] }
        ratio: { type: object, properties: { new: { type: integer, minimum: 1 }, held: { type: integer, minimum: 1 } } }
        exDate: { type: string, format: date }
        subscriptionPrice: { type: number, exclusiveMinimum: 0 }
        cumPrice: { type: number, exclusiveMinimum: 0 }
        dividend: { type: number, exclusiveMinimum: 0 }
        fv: { type: object, properties: { from: { type: number, exclusiveMinimum: 0 }, to: { type: number, exclusiveMinimum: 0 } } }
        strikeTick: { type: number, exclusiveMinimum: 0 }
        source: { type: string, maxLength: 200 }
        lotRule: { type: string, enum: [round] }
        exampleStrikes: { type: array, maxItems: 9, items: { type: number, exclusiveMinimum: 0 }, description: "Pre-action strikes the add form previewed; the stored row's adjusted.exampleStrikes uses the same ones." }
    RefCorporateActions:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CorporateAction" } }
    CorporateActionPreviewRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [bonus, split, consolidation, rights, dividend] }
        ratio: { type: object, properties: { new: { type: integer, minimum: 1 }, held: { type: integer, minimum: 1 } } }
        fv: { type: object, properties: { from: { type: number }, to: { type: number } } }
        subscriptionPrice: { type: number }
        cumPrice: { type: number }
        dividend: { type: number }
        lot: { type: integer, minimum: 1 }
        strikes: { type: array, maxItems: 50, items: { type: number } }
        strikeTick: { type: number, default: 0.05 }
    CorporateActionPreview:
      type: object
      properties:
        factor: { type: [number, "null"] }
        terp: { type: [number, "null"] }
        lotAfter: { type: [integer, "null"] }
        lotExact: { type: [number, "null"] }
        nonStandardLot: { type: boolean }
        strikes: { type: array, items: { type: object, properties: { before: { type: number }, after: { type: number } } } }
        method: { type: string }
        adjusted: { type: boolean }
        dividendPct: { type: number }
    RefRate:
      type: object
      properties:
        value: { type: number, description: "Decimal, e.g. 0.065." }
        asOf: { type: [string, "null"], format: date }
        source: { type: string }
        quality: { type: string, enum: [user, config, default, demo] }
        stale: { type: boolean }
        setBy: { type: string, enum: [dashboard, config, default, demo] }
    RefRateInput:
      type: object
      required: [value, source]
      additionalProperties: false
      properties:
        value: { type: number, minimum: 0, maximum: 0.25 }
        asOf: { type: string, format: date }
        source: { type: string, minLength: 3, maxLength: 120 }
    RefCharges:
      type: object
      properties:
        asOf: { type: string }
        source: { type: string }
        verified: { type: boolean }
        opt: { type: object }
        fut: { type: object }
        sebiPerCrore: { type: number }
        ipftPerCrore: { type: number }
        gst: { type: number }
        notes: { type: object }
        brokerage: { type: object, properties: { kind: { type: string }, perOrder: { type: number }, source: { type: string } } }
    RefDeliveryMarginItem:
      type: object
      properties:
        day: { type: string, description: "E-n: the n-th trading day before the expiry." }
        date: { type: string, format: date }
        pct: { type: number }
    RefDeliveryMargin:
      type: object
      properties:
        expiry: { type: string, format: date }
        items: { type: array, items: { $ref: "#/components/schemas/RefDeliveryMarginItem" } }
        verified: { type: boolean }
        source: { type: [string, "null"] }
        asOf: { type: string }
        appliesTo: { type: string }
        available: { type: boolean }
        reason: { type: string }
    RefEvent:
      type: object
      properties:
        kind: { type: string, enum: [lot-revision, corporate-action, holiday-expiry-shift] }
        underlying: { type: string }
        effectiveOn: { type: string, format: date }
        daysAway: { type: integer }
        text: { type: string }
        ref: { type: object }
    RefDatasetStatus:
      type: object
      properties:
        available: { type: boolean }
        reason: { type: string }
        asOf: { type: [string, "null"] }
        source: { type: [string, "null"] }
        quality: { type: string }
        lastSuccessAt: { type: [string, "null"] }
        lastAttemptAt: { type: [string, "null"] }
