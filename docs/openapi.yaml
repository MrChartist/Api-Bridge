        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiries, in: query, description: Number of upcoming expiries (default 3)., schema: { type: integer, minimum: 1, maximum: 6 } }
        - { name: strikes, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/oi-explorer:
    get:
      tags: [Analytics]
      operationId: getAnalyticsOiExplorer
      summary: Call and put open interest by strike and expiry with totals and the highest cells
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiries, in: query, description: Number of upcoming expiries (default 4)., schema: { type: integer, minimum: 1, maximum: 8 } }
        - { name: strikes, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/vol-stats:
    get:
      tags: [Analytics]
      operationId: getAnalyticsVolStats
      summary: Volatility stats (HV 10/20/30/60, Parkinson, ATM IV, IV vs HV, IV rank, expected move)
      description: HV is annualised with sqrt(252) from daily candles, in percent, with the rank and percentile of the current HV20 over the lookback. ATM IV comes from the nearest expiry with at least 3 days left. The IV minus HV20 spread and ratio carry a label, rich above 1.15, cheap below 0.85, otherwise fair. The Bridge stores one ATM-IV point per underlying per IST day (newest 400 days); until 20 days exist, ivRank and ivPercentile are null, ivHistoryDays says how many there are and ivRankFallback holds the HV20 rank. expectedMove is the 1-sigma move to that expiry, spot x iv x sqrt(dte/365).
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 }, example: NIFTY }
        - { name: days, in: query, description: Daily-candle lookback for HV and its rank (default 250)., schema: { type: integer, minimum: 30, maximum: 1000, default: 250 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /v1/analytics/vol-stats/term:
    get:
      tags: [Analytics]
      operationId: getAnalyticsVolStatsTerm
      summary: ATM IV for the next 4 expiries (volatility term structure)
      description: Percent IV at the ATM strike of each of the next four expiries whose 15:30 IST cutoff has not passed, with termStructure contango, backwardation or flat (nearest against furthest).
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 }, example: NIFTY }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/deals:
    get:
      tags: [Analytics]
      operationId: getAnalyticsDeals
      summary: NSE block or bulk deals (symbol, client, buy/sell, quantity, price, value in INR crore) with top buyers and sellers
      description: From the NSE public site (meta.source is "nse", meta.fetchedAt is the fetch time, meta.stale is true when a refresh failed and an older copy is served). Cached for five minutes per query. India analogue of dark-pool prints.
