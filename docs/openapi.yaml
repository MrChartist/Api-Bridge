                properties:
                  data: { type: object, additionalProperties: true }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/alerts/{alertId}:
    parameters:
      - name: alertId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Alerts]
      operationId: updateAlert
      summary: Change an alert, or switch it on or off
      x-stream: S24
      x-scope: paper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                account: { type: string }
                underlying: { type: string }
                symbols: { type: [array, "null"], items: { type: string }, maxItems: 24 }
                conditions:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: object
                    required: [kind, value]
                    properties:
                      kind: { type: string, enum: [pnl_above, pnl_below, spot_above, spot_below, delta_outside, expiry_within, premium_multiple] }
                      value: { type: number }
                      value2: { type: number, description: "delta_outside: the upper bound (value is the lower)." }
                match: { type: string, enum: [all, any] }
                repeat: { type: string, enum: [once, every] }
                cooldownMin: { type: number, minimum: 1, maximum: 1440 }
                notify: { type: boolean, description: "Also send through the notify targets that listen to option.alert." }
                enabled: { type: boolean }
      responses:
        "200":
          description: The changed alert.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object, additionalProperties: true }
                  meta: { $ref: "#/components/schemas/Meta" }
