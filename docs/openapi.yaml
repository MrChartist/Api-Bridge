  /hooks/{source}/{token}:
    parameters:
      - name: source
        in: path
        required: true
        schema: { type: string, enum: [generic, chartink, gocharting, tradingview] }
      - name: token
        in: path
        required: true
        description: The hook's secret token (shown once when the hook is created). It is the credential ChartInk and GoCharting can carry, since they cannot sign requests; TradingView adds a `passphrase` inside the alert message.
        schema: { type: string, minLength: 32, maxLength: 128 }
    post:
      tags: [Webhooks]
      operationId: receiveHook
      summary: Inbound alert (TradingView, signed generic, ChartInk or GoCharting)
      description: |
        Answers within milliseconds (alert services give up after a few seconds) and processes the signal in the background,
        through the same preview and safety checks as any order. The hook decides what an alert may do (account,
        symbols, quantity caps, paper or live, whether a human must confirm). `generic` hooks must send
        `X-MCB-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>">`; requests older than 5 minutes or
        replayed are refused. Served on the public ingress listener when it is enabled.

        `tradingview` hooks cannot sign (TradingView cannot add headers): the credential is the secret URL plus a
        `passphrase` field inside the alert message (a JSON field, or `passphrase=...` in a plain-text alert), checked in
        constant time before anything else is read. Wrong or missing: 401. The message is JSON (when TradingView sends
        `application/json`) or one line of text (`text/plain`); see the `TradingViewAlert` schema. An alert older than
        the hook's `maxAgeSec` (from its `time`) is refused with 400; a repeat of the same id + time + symbol + side is
        acknowledged as `duplicate: true`. A rejected order after the 202 is shown in
        `GET /v1/hooks/{hookId}/signals` and announced on the event bus as `hook.rejected`.
      x-module: hooks
      x-public: true
      security: []
      parameters:
        - name: X-MCB-Signature
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
          text/plain:
            schema: { type: string }
      responses:
        "202":
          description: Accepted for processing.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, signalId]
                properties:
                  accepted: { type: boolean }
                  signalId: { type: string }
                  duplicate: { type: boolean, description: The same alert was already received (same id and time for TradingView); nothing new was queued. }
                  dropped: { type: integer, description: Orders in the alert that were dropped before queueing (for example over the per-alert cap). }
                  heldSeconds: { type: integer, description: "Present when the hook is over `hooks.maxSignalsPerMinute`: the alert is held about this long and then handled (up to `hooks.rateWaitSec`; beyond that the answer is 429)." }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

