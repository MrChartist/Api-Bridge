  /v1/analytics/basis-history:
    get:
      tags: [Analytics]
      operationId: getAnalyticsBasisHistory
      summary: Futures basis history against spot, with mean, min, max and z-score
      description: Joins the future's and the spot's candles on time. Returns basis and basis percent per candle plus statistics, including the z-score of the latest value. A failed leg is reported in `errors` with an empty series.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
