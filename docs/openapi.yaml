openapi: 3.1.0
info:
  title: Mr. Chartist API Bridge
  version: 2.0.0
  summary: One local API for all your Indian broker accounts.
  description: |
    The Bridge runs on your own computer (default `http://127.0.0.1:4300`) and holds your connections to several
    brokers and accounts at once. Web apps, webhook alerts (ChartInk, GoCharting, signed scripts), Python and Node scripts, Excel,
    Google Sheets and AI assistants all share those connections through this API, so the broker sees one well-behaved
    client instead of many.

    ## Authentication
    Every route except `/v1/health`, `/openapi.yaml`, inbound webhooks and the streaming endpoints needs a Bridge API
    key: `Authorization: Bearer mcb_<keyId>_<secret>` (or `X-API-Key`). Keys are created with `mc-bridge keys create`
    and carry scopes:

    | Scope | Allows |
    |---|---|
    | `read` | market data, instruments, accounts, portfolio, orders list, limits |
    | `paper` | `read` + paper orders |
    | `live` | `paper` + live orders, only on accounts enabled for live trading in `bridge.config.json`, and only when the request says `"mode": "live"` |
    | `admin` | `read` + keys, audit log, kill-switch release, broker sessions; from this computer only |

    Keys may also be limited to some accounts. `?key=` in the URL is accepted only on `/xl/*`, and only for
    read-only keys created with `--allow-query` (Excel `WEBSERVICE` and AmiBroker cannot send headers).
    Streaming endpoints take a short-lived `?token=` from `POST /v1/stream/token`, or an Authorization header.

    ## Symbols
    One canonical, reversible format for every broker:

    | Instrument | Example |
    |---|---|
    | Equity | `NSE:RELIANCE`, `NSE:BAJAJ-AUTO`, `NSE:M&M` |
    | Index | `NSE:NIFTY`, `BSE:SENSEX` |
    | Future | `NFO:NIFTY-2026-10-27-FUT`, `MCX:CRUDEOIL-2026-11-19-FUT` |
    | Option | `NFO:NIFTY-2026-10-27-25000-CE`, `BFO:SENSEX-2026-10-30-82500-PE`, `NFO:VEDL-2026-10-27-292.5-CE` |

    `EXCHANGE:UNDERLYING[-YYYY-MM-DD(-FUT | -STRIKE-CE | -STRIKE-PE)]`. Exchange codes are NSE and BSE (cash and
    indices), NFO and BFO (equity derivatives), MCX and CDS. The ISO expiry removes the ambiguity of exchange trading
    symbols (weekly codes, DDMMMYY vs YYMDD), the suffix is parsed from the right so hyphens in names are safe, and no
    lookup is needed to read it. Inputs are lenient (case, `NSE:` for derivatives, chart tickers such as
    `NSE:NIFTY1!`, compact symbols with an exchange); responses always use the canonical form. Convert with
    `/v1/symbols/convert`. The dates in the table are examples of the format: a contract that has expired is
    `SYMBOL_NOT_FOUND`, so use a live expiry from `GET /v1/expiries` in anything you run.

    ## Responses, freshness and errors
    JSON responses under `/v1` are `{ "data": ..., "meta": { "requestId": ..., ... } }`, except `GET /v1/meta` and `GET /v1/health`, which are plain objects. Every market-data item carries
    `freshness` (`source`: stream, cache, broker, paper, backup or plugin; `asOf`; `ageMs`; `stale`; which account served
    it; and how current the data is: `class` realtime, delayed or eod, `delaySec`, `official`, `confidence`, `flags`), so you
    always know how old a number is and where it came from. Errors are RFC 9457 `application/problem+json` with a stable `code` and a
    `retryable` flag. Times are ISO-8601 with the IST offset (`+05:30`) unless an endpoint says otherwise; candle times
    are epoch seconds. List endpoints take `limit` and an opaque `cursor`; the answer's `meta.nextCursor` is the cursor of the next
    page and is null on the last one (without `limit` the whole list comes back). The routes that page: instruments search, orders,
    trades, audit, downloads, datasets, collections, recordings and their rules, subscriptions and their dead letters, keys,
    accounts and hooks; `GET /v1/events` pages with `since` and also gives `meta.nextCursor`. Market reads (prices, quotes,
    depth, history, expiries, option chain) tell you about a query parameter they do not know with `X-MCB-Ignored-Params`
    (`strict=true` refuses it instead).

    ## Data sources
    Real-time data and option chains come from your own broker accounts. Optional free sources and plugins (see
    `/v1/sources`) add history, cross-checks and graceful fallback; their answers are labelled `delayed` or `eod`, never
    blended into a real-time answer, and orders, risk checks, paper fills and alerts (`purpose` = `order`, `risk`, `paper`,
    `alert`) accept only real-time data. Guide: docs/guides/sources.md. Developers: docs/source-contract.md.

    ## Rate limits
    The Bridge never exceeds a broker's documented limit. It serves from live streams first, then a short freshness
    cache, then batches and coalesces broker calls, with orders always ahead of reads. Your own per-key limit is shown in
    `RateLimit` and `RateLimit-Policy` headers (IETF draft; syntax may change). On 429, wait `Retry-After` seconds. A
    refusal also says which limit tripped: `scope` (`client`, `upstream`, `queue`, `consumer-cap`), `retryAfterMs` and
    `limit` in the problem body; clients should read those, not `detail`. Each key has its own quota and fair-queue
    weight (`/v1/quotas`), and `GET /v1/limits?explain=1` shows the shared pools and each consumer's share.

    ## Orders and safety
    Paper mode is the default. A live order needs: `safety.liveTrading` and the account's `live.enabled` in the config
    file, a `live` key, the request source allowed for that account, `"mode": "live"` in the request, and every safety
    check (kill switch, order-rate cap default 5/s per account, daily order and loss limits, value and lot caps, price
    band, market-order protection). Send an `Idempotency-Key` with every order write; a retry with the same key returns
    the first result (the create routes for keys, downloads, collections, recordings and subscriptions honour it too). A write that times out returns `OUTCOME_UNKNOWN`: check the order book before sending it again.

    ## Demo mode
    `mc-bridge start --demo` serves generated sample data from a demo adapter with no broker connected and live
    trading off. Operations marked `x-demo-only: true` (under `/v1/demo/`) exist only in demo mode; a Bridge with real
    accounts answers them with 404.

    Personal use only: broker data terms generally forbid passing market data to other people.
  contact:
    name: Investology (Mr. Chartist)
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:4300
    description: Local Bridge (default)
security:
  - bearerAuth: []
  - apiKeyHeader: []
tags:
  - name: System
    description: Health, versions and this document.
  - name: Accounts
    description: Your broker accounts, sessions and broker capabilities.
  - name: Keys
    description: Bridge API keys and their scopes.
  - name: Instruments
    description: Instrument search, resolution and symbol conversion.
  - name: Collections
    description: Named, tagged lists of instruments and option universes (rolling expiries, at-the-money strikes) that downloads, recordings and sheets use instead of pasted symbols.
  - name: Market data
    description: Quotes, LTP, depth, history, expiries and option chains, served streaming-first within broker limits.
  - name: Streaming
    description: WebSocket and SSE live data.
  - name: Events
    description: Bridge events out, without polling. An SSE or WebSocket stream with cursor replay, and signed webhooks with retries and a dead-letter list. Events are read-only notifications; none can approve an order and none carries a secret.
  - name: Portfolio
    description: Positions, holdings and funds per account.
  - name: Orders
    description: Paper and live orders with idempotency and safety checks.
  - name: Paper
    description: The paper-trading engine.
  - name: Limits
    description: Broker limits, budgets and usage.
  - name: Sources
    description: Where market data comes from besides your broker accounts (free providers, plugins), with honest labels, terms, health and a routing trace.
  - name: Pooling
    description: Spreading read-only market data over your own accounts of one holder. Off until you accept a notice; orders never pool.
  - name: Quotas
    description: Per-key request quotas and fair-queue weights.
  - name: Notifications
    description: Events to Telegram and a few read-only Telegram commands. Setup is on this computer only; nothing here returns a bot token or a chat id.
  - name: Recordings
    description: "Saves this Bridge's own real-time data going forward (quotes, option chains) to files on this computer, by hand or by rules every trading day. Real-time class only."
  - name: Safety
    description: Kill switch, safety counters and the audit log.
  - name: Readiness
    description: "Whether each live account can trade now: session, static IP, order headroom, kill switch."
  - name: Data downloads
    description: History downloads that run in the background and save files on this computer, datasets that grow by incremental updates, and the instrument master as a file. Every file says its data class, source and delay.
  - name: Backup
    description: Copies of your data folder (keys store, accounts, state, paper books, audit log), made on this computer only. The archive is never served over HTTP.
  - name: Spreadsheets
    description: Plain-text and CSV endpoints for Excel, Google Sheets and AmiBroker.
  - name: Webhooks
    description: Inbound alerts from ChartInk, GoCharting and signed senders.
  - name: AI (MCP)
    description: Model Context Protocol endpoint for AI assistants.
  - name: Compat REST
    description: >-
      Endpoints in the common apikey-in-body style (POST JSON, `apikey` in the body, { status, ... } replies) so SDKs and add-ins written for that style work
      against the Bridge. Same services, limits and safety as /v1; orders are paper while analyzer mode is on.
paths:
  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness check
      description: No key needed. Callers on this computer also see which services are built.
      x-module: core
      security: []
      responses:
        "200":
          description: The Bridge is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/ready:
    get:
      tags: [System]
      operationId: getReady
      summary: Ready to take work (503 while starting or when the disk is full)
      description: No key needed. 200 when the Bridge has finished starting and can save; 503 otherwise. Callers on this computer also see the reasons. For a Docker health check, a load balancer or a script that waits for the Bridge.
      x-module: core
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: Not ready yet, or the disk is too full to save changes safely.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }

  /v1/metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: The Bridge's own numbers (Prometheus text)
      description: >-
        This computer only, admin key. Counters and gauges as plain Prometheus text: uptime, memory, open file handles,
        event-loop delay, requests by status class, free disk space, failed writes, damaged files set aside, the age of the
        last backup, webhook queue sizes, download and recording figures. No symbol, key, account id or file name appears in it.
      x-module: core
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }

  /:
    get:
      tags: [System]
      operationId: getRoot
      summary: Redirect to the local dashboard
      x-module: core
      x-loopback-only: true
      security: []
      responses:
        "302":
          description: Redirect to /dashboard.

  /dashboard:
    get:
      tags: [System]
      operationId: getDashboard
      summary: Local dashboard (HTML; this computer only)
      description: Welcome checklist, accounts and the broker directory, a test console, live rate-limit usage, orders and pending confirmations, the kill switch, API keys, integration snippets and the request and audit logs. The page asks for an API key and keeps it in the browser tab only.
      x-module: core
      x-loopback-only: true
      security: []
      responses:
        "200":
          description: The dashboard page.
          content:
            text/html:
              schema: { type: string }

  /dashboard/{file}:
    get:
      tags: [System]
      operationId: getDashboardAsset
      summary: Dashboard scripts, stylesheet and logo
      x-module: core
      x-loopback-only: true
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string, enum: [index.html, app.js, views.js, snippets.js, app.css, logo.svg] }
      responses:
        "200":
          description: The file.
        "404": { $ref: "#/components/responses/Problem" }

  /v1/meta:
    get:
      tags: [System]
      operationId: getMeta
      summary: Versions, brokers, modules and routes
      x-module: core
      x-scope: read
      responses:
        "200":
          description: Meta information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetaInfo" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/requests:
    get:
      tags: [System]
      operationId: listRecentRequests
      summary: Recent requests to this Bridge (newest first)
      description: The last 200 requests, kept in memory only (method, path without the query string, status, time taken, key id). Requests the dashboard makes for itself carry client "dashboard". Webhook paths are shown as their pattern, never with their token. A market-data read that returned something also carries `route`, a short record of what answered it.
      x-module: core
      x-scope: admin
      x-loopback-only: true
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Recent requests.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        at: { type: string, format: date-time }
                        method: { type: string }
                        path: { type: string }
                        status: { type: integer }
                        ms: { type: integer }
                        keyId: { type: [string, "null"] }
                        client: { type: [string, "null"] }
                        requestId: { type: string }
                        route: { $ref: "#/components/schemas/RequestRoute" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/errors:
    get:
      tags: [System]
      operationId: listErrorCodes
      summary: Every error code, what it means and how to fix it
      description: The catalogue of every problem `code` the Bridge can return, with its HTTP status, whether sending the same request again is safe, a plain explanation and the fix. Generated from the Bridge's own error definitions, so it always matches the version you run.
      x-module: core
      x-scope: read
      responses:
        "200":
          description: The error catalogue, by HTTP status then code.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ErrorCatalogueEntry" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/expose:
    get:
      tags: [System]
      operationId: getExposure
      summary: What is set up to be reached from outside this computer
      description: |
        Plain-words state of the two optional public listeners (`server.publicIngress` for webhook alerts, `server.sheetsIngress`
        for Google Sheets), the address patterns to use, and the exposure checks that `mc-bridge doctor` also runs, each with
        a one-line fix. It reads the settings the Bridge started with; it changes nothing and calls nothing outside this
        computer. Setting up is the terminal command `mc-bridge expose`.
      x-module: core
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: The exposure state.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [state, exposed, headline, tone, alerts, sheets, checks]
                    properties:
                      state: { type: string, enum: ["off", "on"] }
                      exposed: { type: array, items: { type: string, enum: [alerts, sheets] } }
                      headline: { type: string }
                      tone: { type: string, enum: [ok, warn, bad] }
                      alerts: { $ref: "#/components/schemas/ExposeListener" }
                      sheets: { $ref: "#/components/schemas/ExposeListener" }
                      checks:
                        type: array
                        items:
                          type: object
                          required: [level, check, message]
                          properties:
                            level: { type: string, enum: [ok, warn] }
                            check: { type: string }
                            message: { type: string }
                            fix: { type: string, description: One line saying what to change. }
                            blocking: { type: boolean, description: True when the mistake leaves the Bridge open to the internet or voids a safety rule; `doctor --strict` then exits 1. }
                      restartNote: { type: string }
                      guide: { type: string, format: uri }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/expose/check:
    post:
      tags: [System]
      operationId: checkExposure
      summary: Check that only the intended routes answer on the public listeners
      description: |
        Sends a few probe requests from this computer to each enabled public listener on 127.0.0.1 and reports whether the
        dashboard and the API stay hidden, foreign host names and web pages are refused and the body cap holds. With
        `publicUrl` it also looks up that host name and calls the public address from this computer, but only when
        `allowOutbound` is true; otherwise no name lookup and no outbound request is made.
      x-module: core
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kinds: { type: array, items: { type: string, enum: [alerts, sheets] } }
                publicUrl: { type: string, description: Your public address, for example https://hooks.example.com. }
                allowOutbound: { type: boolean, description: Must be true to test publicUrl. }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [verdict, headline, items]
                    properties:
                      verdict: { type: string, enum: [good, notes, not_working, unsafe, not_exposed] }
                      headline: { type: string }
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, title, status, detail]
                          properties:
                            id: { type: string }
                            title: { type: string }
                            status: { type: string, enum: [pass, warn, fail, skipped] }
                            severity: { type: string, enum: [blocking, setup, note] }
                            detail: { type: string }
                            fix: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenApi
      summary: This document
      x-module: core
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 YAML.
          content:
            application/yaml:
              schema: { type: string }

  /v1/brokers:
    get:
      tags: [Accounts]
      operationId: listBrokers
      summary: Supported brokers and what each can do
      description: Capabilities come from each adapter's declared contract; limits from the Bridge's broker policy table (each number marked verified or not).
      x-module: accounts
      x-scope: read
      responses:
        "200":
          description: All broker adapters.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/BrokerInfo" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Your configured accounts and their session state
      description: Only accounts this key may use are listed. Never includes credentials.
      x-module: accounts
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AccountSummary" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Accounts]
      operationId: addAccount
      summary: Add a broker or paper account (saved to the config file, usable at once)
      description: |
        Adds the account to the config file the Bridge loaded (or creates the per-user bridge.config.json when it started
        without one), keeping the file's other content, and starts using it without a restart. New accounts are always
        paper only: live trading is turned on only by editing the config file. Without `id` the Bridge picks
        `<broker>-main`, then `<broker>-2` ... (`paper`, `paper-2` ... for paper accounts). Log in afterwards with
        POST /v1/accounts/{accountId}/session. Admin scope with an admin key that may use every account, this computer
        only. Audited as `account.added`.

        Demo mode saves a real broker's account for the next normal start instead (`savedForLater: true`,
        `account: null`): the same paper-only entry is written to the file, nothing is loaded and no broker is
        contacted. `leaveDemo: true` also removes `"demo": true` from the file. Paper accounts are refused in demo mode
        (it has its own), and so is everything when the demo dashboard is served to other computers.
      x-module: accounts
      x-scope: admin
      x-loopback-only: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreateRequest" }
      responses:
        "201":
          description: The account was saved. `restartNeeded` is true only when it could not be loaded into the running Bridge.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [account, restartNeeded, configFile]
                    properties:
                      account:
                        oneOf:
                          - $ref: "#/components/schemas/AccountSummary"
                          - type: "null"
                      restartNeeded: { type: boolean }
                      configFile: { type: string, description: "The config file the account was saved to." }
                      savedForLater: { type: boolean, description: "Demo mode: saved to the file only, loaded on the next normal start." }
                      savedId: { type: string, description: "Demo mode: the id the saved account will have." }
                      demoWasInFile: { type: boolean, description: "Demo mode: the file itself turns demo mode on." }
                      demoTurnedOff: { type: boolean, description: "Demo mode: `demo` was removed from the file (leaveDemo)." }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountIdPath"
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: One account
      x-module: accounts
      x-scope: read
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/AccountSummary" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Accounts]
      operationId: removeAccount
      summary: Remove an account (from the config file and the running Bridge)
      description: |
        For an account added by mistake. Removes it from the config file and the running Bridge and deletes its saved
        keys and session from the encrypted store; its paper-trading history stays in the data folder. Refuses an
        account with live trading set up in the config file (remove those in the file, on purpose) and the last paper
        account. Admin scope with an admin key that may use every account, this computer only. Refused in demo mode.
        Audited as `account.removed`.
      x-module: accounts
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: The account was removed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [id, removed, savedKeysDeleted, restartNeeded]
                    properties:
                      id: { type: string }
                      removed: { type: boolean }
                      savedKeysDeleted: { type: boolean }
                      restartNeeded: { type: boolean }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/accounts/{accountId}/session:
    parameters:
      - $ref: "#/components/parameters/AccountIdPath"
    post:
      tags: [Accounts]
      operationId: connectAccount
      summary: Connect or log in to the broker
      description: |
        Saves the non-secret values (API key, client id, access token) encrypted at rest, then logs in where the broker
        needs it. For session-login brokers send the password/PIN and the current 6-digit TOTP code in `secrets`: they
        are used once for the broker login and never stored, cached or logged. Admin scope, this computer only.
      x-module: accounts
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionConnectRequest" }
      responses:
        "200":
          description: New session state.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SessionState" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Accounts]
      operationId: disconnectAccount
      summary: Forget the broker session (saved keys stay)
      x-module: accounts
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: Session state after logout.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SessionState" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/accounts/{accountId}/test:
    parameters:
      - $ref: "#/components/parameters/AccountIdPath"
