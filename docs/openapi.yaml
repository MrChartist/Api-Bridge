      x-stream: S26
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { date: { type: string, format: date }, backfill: { type: boolean } } }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/ParticipantSyncResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "202":
          description: Back-fill started; progress is on /v1/participants/status.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/ParticipantSyncResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/underlyings:
    get:
      tags: [Options desk]
      operationId: listOptionUnderlyings
      summary: Indices and F&O stocks with contract facts, ban band and sweep coverage
      description: >-
        The underlying list behind the picker: the point-in-time F&O universe (reference store) merged with the
        instrument masters (masters only when NSE downloads are off; `source` says which). Memory only and no broker
        call unless withQuotes=1, which adds one batched quote read (interactive priority, cached 60 s, skipped with
        quotes.loaded false and reason NO_HEADROOM when the quote class has fewer than 2 tokens). strikeStep is
        inferred from listed strikes (null with fewer than 3). ban is null for indices and { available false, reason }
        when no ban data is recorded.
      x-stream: S19
      x-scope: read
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [all, index, stock], default: all }
        - name: q
          in: query
          description: Search with the picker's ranking (symbol, name, fuzzy prefix).
          schema: { type: string, maxLength: 40 }
        - name: withQuotes
          in: query
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/FnoUnderlyingList" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/underlyings/{underlying}:
    get:
      tags: [Options desk]
      operationId: getOptionUnderlying
      summary: One underlying with expiries, delivery-margin schedule, adjusted contracts and rules
      x-stream: S19
      x-scope: read
      parameters:
        - name: underlying
          in: path
          required: true
          schema: { type: string, maxLength: 30 }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/FnoUnderlyingDetail" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/expiry-costs:
    post:
      tags: [Options desk]
      operationId: getExpiryCosts
      summary: Settle vs square-off charges, delivery obligation and delivery margin for option legs (pure maths)
      description: >-
        Stores nothing. Rates come from the reference charge table (physical delivery and margin rows are unverified).
        Missing spot, bid and ask come from cached quotes only (no new broker call; null when nothing is cached).
        `account` is used only to read holdings, to say whether a delivering leg is covered (cached 60 s). asOf defaults
        to today; a later trading day gives a labelled what-if. The indicative delivery margin in rupees appears only
        when varElmPct (your broker's VaR + ELM rate) is given.
      x-stream: S19
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpiryCostsRequest" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/ExpiryCostsResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/sweeps/plan:
    post:
      tags: [Options desk]
      operationId: planOptionSweep
      summary: Dry run of the option sweep (method per group, calls, minutes, what fits)
      x-stream: S19
      x-scope: read
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SweepRequest" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SweepPlan" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/sweeps:
    post:
      tags: [Options desk]
      operationId: startOptionSweep
      summary: Start the option sweep, or join the one already running
      description: >-
        One sweep runs at a time for the whole Bridge. It uses at most fno.sweep.budgetShare (50 %) of the data account's
        rate budget at background priority, so your own chain and order calls always go first. Returns 202 for a new
        sweep, or 200 with joined or reused set.
      x-stream: S19
      x-scope: read
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SweepRequest" }
      responses:
        "200":
          description: The running sweep (joined) or a recent finished one (reused).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SweepJob" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "202":
          description: A new sweep was started.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SweepJob" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/sweeps/current:
    get:
      tags: [Options desk]
      operationId: getOptionSweep
      summary: Status, progress and plan of today's sweep
      description: >-
        404 NOT_FOUND when no sweep has run today. lease=1 keeps the auto-repeat alive for fno.sweep.leaseSeconds (the
        screener renews it while open); auto sweeps run only while leased or with the background switch on.
      x-stream: S19
      x-scope: read
      parameters:
        - name: lease
          in: query
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SweepJob" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Options desk]
      operationId: cancelOptionSweep
      summary: Cancel the running sweep (finished chains are kept)
      description: Any key with read scope can cancel the current sweep; the next lease restarts it.
      x-stream: S19
      x-scope: read
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SweepJob" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/sweeps/current/chains:
    get:
      tags: [Options desk]
      operationId: getOptionSweepChains
      summary: Finished chains of today's sweep after a cursor (oldest first, at most 40 per page)
      x-stream: S19
      x-scope: read
      parameters:
        - name: since
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 40, default: 40 }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SweepChainsPage" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/sweeps/settings:
    get:
      tags: [Options desk]
      operationId: getOptionSweepSettings
      summary: The opted-in stock list and the background auto-repeat switch
      x-stream: S19
      x-scope: read
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SweepSettings" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    put:
      tags: [Options desk]
      operationId: setOptionSweepSettings
      summary: Save the opted-in stock list and the background switch (audited)
      description: In demo mode the settings apply in memory only (persisted false).
      x-stream: S19
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                optIn: { type: array, maxItems: 1000, items: { type: string, maxLength: 30 } }
                background: { type: boolean }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SweepSettings" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/demo/fno:
    post:
      tags: [Options desk]
      operationId: setDemoFnoBan
      summary: "Demo only: force a ban list for testing the F&O ban gate"
      description: >-
        Exists only when the Bridge runs in demo mode. Puts the listed stocks into the F&O ban period for `minutes`
        (default 30) on top of the demo's own daily list, in memory only; an empty list clears it. They show in
        /v1/options/underlyings with ban.source "demo-override" and the order preview refuses opening orders in them.
      x-stream: S19
      x-scope: admin
      x-loopback-only: true
      x-demo-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ban]
              additionalProperties: false
              properties:
                ban: { type: array, maxItems: 20, items: { type: string, maxLength: 30 } }
                minutes: { type: integer, minimum: 1, maximum: 600 }
      responses:
        "200":
          description: The override now in force.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object, properties: { ban: { type: array, items: { type: string } }, until: { type: [string, "null"] }, source: { type: string } } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Bridge API key: `mcb_<keyId>_<secret>`."
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Only on /xl/*, only for read-only keys created with --allow-query.

  headers:
    IdempotencyReplayed:
      description: "`true` when this response is the stored result of an earlier request with the same Idempotency-Key."
      schema: { type: string, enum: ["true"] }
    RateLimit:
      description: Remaining client budget (IETF RateLimit header draft).
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  parameters:
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AccountId" }
    AccountQuery:
      name: account
      in: query
      required: true
      schema: { $ref: "#/components/schemas/AccountId" }
    AccountQueryOptional:
      name: account
      in: query
      description: Pin the request to this account. Without it, market data may be served from any of your accounts that allow pooling.
      schema: { $ref: "#/components/schemas/AccountId" }
    ModeQuery:
      name: mode
      in: query
      description: "`paper` reads the account's paper book; `live` the broker's (default for portfolio reads)."
      schema: { type: string, enum: [paper, live], default: live }
    Symbols:
      name: symbols
      in: query
      required: true
      description: Comma-separated symbols (up to 200).
      schema: { type: string, maxLength: 8000 }
    SymbolQuery:
      name: symbol
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Symbol" }
    Backup:
      name: backup
      in: query
      description: >-
        Unpinned reads only. true lets a read that no broker account can answer fall back to the free backup sources
        (Yahoo Finance, NSE website; freshness.source "backup", delayed); false never does. Default from config
        (backup.enabled and backup.autoFallback).
      schema: { type: boolean }
    MaxAge:
      name: maxAgeMs
      in: query
      description: Oldest data you accept, in ms. 0 forces a live read (still within rate limits). Default depends on the endpoint (LTP 1000, quotes 2000, chain 3000).
      schema: { type: integer, minimum: 0, maximum: 3600000 }
    Swr:
      name: swr
      in: query
      description: Stale-while-revalidate. When only an older cached value exists (inside market.stale.maxStaleMs), answer with it at once, labelled `freshness.stale` and `freshness.revalidating`, and refresh it in the background (one refresh however many readers ask).
      schema: { type: boolean, default: false }
    ReadPriority:
      name: priority
      in: query
      description: "`background` for a prefetch: it waits behind every interactive read, and a read for the same thing joins it and raises its priority. Reads never run at order priority."
      schema: { type: string, enum: [interactive, background], default: interactive }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `meta.nextCursor`.
      schema: { type: string, maxLength: 512 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Your unique id for this write (UUID recommended). A retry with the same key and the same body returns the first
        result with `Idempotency-Replayed: true`; a different body is refused with 409 IDEMPOTENCY_KEY_REUSED; a retry
        while the first is still running gets 409 IDEMPOTENCY_IN_PROGRESS. Keys are kept until the end of the IST
        trading day and at least 24 hours. For POST /v1/orders, `clientOrderId` in the body works the same way when the
        header is absent.
      schema: { type: string, minLength: 8, maxLength: 255, pattern: "^[A-Za-z0-9_.:-]+$" }

  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit: { $ref: "#/components/headers/RateLimit" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    PaperDailyPnl:
      type: object
      required: [day, at, source, equity, pnl]
      properties:
        day: { type: string, format: date }
        at: { type: string, description: When the row was taken (IST, +05:30). }
        source: { type: string, enum: [eod, manual] }
        equity: { type: number }
        realised: { type: number }
        unrealised: { type: number }
        charges: { type: number }
        pnl: { type: number, description: The day's change in equity (from the previous row, or the starting capital after a reset). }
        usedMargin: { type: [number, "null"] }
        openPositions: { type: integer }
    SnapshotUnits:
      type: object
      properties:
        oi: { type: string, const: units }
        volume: { type: string, const: units }
        iv: { type: string, const: percent }
        price: { type: string, const: INR }
        age: { type: string, const: ms }
    SnapshotSide:
      type: object
      description: Arrays aligned to `strikes`; only the requested fields are present; null = no value.
      additionalProperties:
        type: array
        items: { type: [number, "null"] }
    OptionSnapshot:
      type: object
      required: [slot, ts, source, quality, partial, strikes, ce, pe]
      properties:
        slot: { type: string, format: date-time }
        ts: { type: string, format: date-time }
        source: { type: string, enum: [stream, rest, nse-backup, backfill], description: "Open enum." }
        accountId: { type: [string, "null"] }
        broker: { type: [string, "null"] }
        accounts: { type: [object, "null"], additionalProperties: { type: integer } }
        quality: { type: string, enum: [live, demo, demo-backfill, suspect-holiday], description: "Open enum." }
        partial: { type: boolean }
        missingLegs: { type: integer }
        oiUnitVerified: { type: boolean }
        lotSize: { type: [integer, "null"] }
        spot: { type: [number, "null"] }
        forward: { type: [number, "null"] }
        atm: { type: [number, "null"] }
        straddle: { type: [number, "null"] }
        rate: { type: [number, "null"], description: "Decimal." }
        t: { type: [number, "null"], description: "Years." }
        model: { type: string }
        strikes: { type: array, items: { type: number } }
        ce: { $ref: "#/components/schemas/SnapshotSide" }
        pe: { $ref: "#/components/schemas/SnapshotSide" }
    SnapshotGap:
      type: object
      required: [from, to, slots, reason]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        slots: { type: integer }
        minutes: { type: integer, description: "Minutes the gap stands for (slots times each slot's cadence)." }
        reason: { type: string, enum: [stream-down, budget, broker-error, session-expired, not-subscribed-yet, bridge-down, disk-full, paused], description: "Open enum." }
        detail: { type: [string, "null"] }
    OptionSnapshotPage:
      type: object
      required: [underlying, expiry, units, fields, snapshots, gaps, coverage]
      properties:
        underlying: { type: string }
        expiry: { type: string, format: date }
        exchange: { type: [string, "null"] }
        units: { $ref: "#/components/schemas/SnapshotUnits" }
        fields: { type: array, items: { type: string } }
        snapshots: { type: array, items: { $ref: "#/components/schemas/OptionSnapshot" } }
        gaps: { type: array, items: { $ref: "#/components/schemas/SnapshotGap" } }
        coverage:
          type: object
          properties:
            expectedSlots: { type: integer }
            recordedSlots: { type: integer }
            gapSlots: { type: integer }
            partialSlots: { type: integer }
            firstSlot: { type: [string, "null"], format: date-time }
            lastSlot: { type: [string, "null"], format: date-time }
        unavailable:
          type: [object, "null"]
          properties:
            reason: { type: string, enum: [not-in-plan, not-recorded-yet, refused] }
            detail: { type: string }
        method: { type: object, additionalProperties: { type: string } }
        nextCursor: { type: [string, "null"] }
    OptionDailyRow:
      type: object
      required: [date, underlying, expiry, quality]
      properties:
        date: { type: string, format: date }
        underlying: { type: string }
        expiry: { type: string, format: date }
        asOf: { type: string, format: date-time }
        source: { type: string }
        quality: { type: string }
        spot: { type: [number, "null"] }
        forward: { type: [number, "null"] }
        atm: { type: [number, "null"] }
        straddle: { type: [number, "null"] }
        pcrOi: { type: [number, "null"] }
        pcrVolume: { type: [number, "null"] }
        maxPain: { type: [number, "null"] }
        strikesCovered: { type: integer }
        largestCallOi: { type: [object, "null"], description: "Strike with the largest call OI (not P1-8's gamma Call Wall).", properties: { strike: { type: number }, oi: { type: integer } } }
        largestPutOi: { type: [object, "null"], description: "Strike with the largest put OI (not P1-8's gamma Put Wall).", properties: { strike: { type: number }, oi: { type: integer } } }
        ceOi: { type: [integer, "null"] }
        peOi: { type: [integer, "null"] }
        topAdds: { type: array, items: { type: object, properties: { strike: { type: number }, right: { type: string, enum: [CE, PE] }, dOi: { type: integer } } } }
        topCuts: { type: array, items: { type: object, properties: { strike: { type: number }, right: { type: string, enum: [CE, PE] }, dOi: { type: integer } } } }
        dOiBasis: { type: string, enum: [prev-recorded, broker-prev-close, none] }
        future: { type: [object, "null"], properties: { expiry: { type: string, format: date }, ltp: { type: number }, oi: { type: [integer, "null"] }, basis: { type: number }, basisAnnPct: { type: [number, "null"] }, rolloverPct: { type: [number, "null"] } } }
        slots: { type: integer }
        gapSlots: { type: integer }
        partialSlots: { type: integer }
        gex: { type: "null", description: "Reserved for P1-8." }
        zeroGamma: { type: "null", description: "Reserved for P1-8." }
    RecorderConfig:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        account: { type: [string, "null"] }
        indices: { type: array, items: { type: string }, maxItems: 12 }
        indexExpiries: { type: integer, minimum: 1, maximum: 4 }
        indexStrikes: { type: integer, minimum: 1, maximum: 60 }
        stocks: { type: array, items: { type: string }, maxItems: 200 }
        stockExpiries: { type: integer, minimum: 1, maximum: 2 }
        stockStrikes: { type: integer, minimum: 1, maximum: 30 }
        stockEveryMinutes: { type: integer, enum: [5, 10, 15] }
        sources: { type: object, properties: { stream: { type: boolean }, rest: { type: boolean }, nseBackup: { type: boolean } } }
        budgetShare: { type: number, minimum: 0.05, maximum: 0.5 }
        streamShare: { type: number, minimum: 0.1, maximum: 0.9 }
        strikeBuffer: { type: integer, minimum: 0, maximum: 10 }
        allowSingleTokenRest: { type: boolean }
        retentionDays: { type: integer, minimum: 7, maximum: 3650 }
        maxDiskMb: { type: integer, minimum: 100 }
        recordSpecialSessions: { type: boolean }
        dailyAt: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        slotOffsetMs: { type: integer, minimum: 0, maximum: 30000 }
        restSpreadMs: { type: integer, minimum: 0, maximum: 55000 }
        demo: { type: object, properties: { alwaysOpen: { type: boolean }, backfillDays: { type: integer, minimum: 0, maximum: 5 } } }
    RecorderPlanResult:
      type: object
      required: [ok, message, plan]
      properties:
        ok: { type: boolean }
        message: { type: string }
        plan: { type: object }
        budget: { type: object }
        capacity: { type: object }
    RecorderStatus:
      type: object
      required: [state, demo, session, plan, today, disk, coverage, sources, warnings]
      properties:
        state: { type: string, enum: [recording, idle-closed, paused, not-configured, degraded, holiday-suspected, disk-full, error], description: "Open enum." }
        stateDetail: { type: string }
        demo: { type: boolean }
        account: { type: [object, "null"] }
        session: { type: object }
        plan: { type: object }
        budget: { type: object }
        today: { type: object }
        disk: { type: object }
        coverage:
          type: array
          description: "One row per planned chain today. *Slots counts records; *Minutes weighs each slot by its cadence (a 5-minute chain's slot is 5 minutes); everyMinutesNow is the cadence in force now (the demo's always-open clock uses 5 minutes outside 09:15-15:30)."
          items:
            type: object
            properties:
              underlying: { type: string }
              expiry: { type: string, format: date }
              everyMinutes: { type: integer }
              everyMinutesNow: { type: integer }
              firstSlot: { type: [string, "null"], format: date-time }
              expectedSlots: { type: integer }
              recordedSlots: { type: integer }
              gapSlots: { type: integer }
              expectedMinutes: { type: integer }
              recordedMinutes: { type: integer }
              gapMinutes: { type: integer }
              gaps: { type: array, items: { $ref: "#/components/schemas/SnapshotGap" } }
        sources: { type: object }
        oiUnits: { type: object }
        holidaySuspected: { type: [object, "null"], description: "Set when today looked like an unlisted holiday (flat first six minutes, no volume)." }
        backfill: { type: [object, "null"], description: "Demo mode only: the synthetic back-fill." }
        settings: { type: object, description: "The recorder settings in use (RecorderConfig shape)." }
        warnings: { type: array, items: { type: string } }
        feasibility:
          type: array
          description: "Only with ?feasibility=true: one row per broker (default settings), the same words as the table in docs/guides/recorder.md."
          items:
            type: object
            properties:
              broker: { type: string }
              label: { type: string }
              feed: { type: string }
              rest: { type: string }
              indices: { type: string }
              stocks: { type: string }
              restAllowed: { type: boolean }
              indexByStream: { type: integer }
              indexByRest: { type: integer }
              indexRefused: { type: integer }
              stocksTotal: { type: integer }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: "Human text. Do not parse it." }
        code: { $ref: "#/components/schemas/ErrorCode" }
        retryable: { type: boolean, description: "Safe to send exactly this request again (after Retry-After)." }
        requestId: { type: string }
        retryAfterMs: { type: integer }
        broker:
          type: object
          description: The broker's own error, when one caused this.
          properties:
            id: { type: string }
            code: { type: string }
            message: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
        canCarry:
          type: object
          description: "CAPACITY_EXCEEDED only (PUT /v1/options/recorder/config): the underlyings the data account can carry."
          properties:
            indices: { type: array, items: { type: string } }
            stocks: { type: array, items: { type: string } }
        refused:
          type: array
          description: "CAPACITY_EXCEEDED only: the chains refused for capacity, with the reason."
          items: { type: object }
    ErrorCode:
      type: string
      description: Stable codes; new ones may be added. Source of truth server/bridge/core/errors.mjs.
      enum:
        - VALIDATION_FAILED
        - INVALID_JSON
        - UNAUTHENTICATED
        - SCOPE_REQUIRED
        - ACCOUNT_FORBIDDEN
        - HOST_NOT_ALLOWED
        - ORIGIN_NOT_ALLOWED
        - LOOPBACK_ONLY
        - NOT_FOUND
        - ACCOUNT_NOT_FOUND
        - SYMBOL_NOT_FOUND
        - ORDER_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - DUPLICATE_CLIENT_ORDER_ID
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CAPABILITY_UNSUPPORTED
        - INVALID_ORDER
        - SESSION_EXPIRED
        - CONFIRMATION_REQUIRED
        - CAPACITY_EXCEEDED
        - ALERT_LIMIT
        - STATE_CONFLICT
        - PAPER_ONLY
        - ORDER_GATE_CLOSED
        - DAILY_LIMIT_REACHED
        - MARKET_CLOSED
        - KILL_SWITCH_ACTIVE
        - CANNOT_TRADE
        - AUTOMATION_NOT_ALLOWED
        - RATE_LIMITED
        - ORDER_RATE_LIMITED
        - UPSTREAM_RATE_LIMITED
        - SUBSCRIPTION_LIMIT
        - INTERNAL
        - NOT_IMPLEMENTED
        - UPSTREAM_ERROR
        - BROKER_UNAVAILABLE
        - UPSTREAM_TIMEOUT
        - OUTCOME_UNKNOWN
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
        nextCursor: { type: [string, "null"], description: "Present on list endpoints; null on the last page." }
        accountId: { type: [string, "null"] }
        mode: { type: string, enum: [paper, live] }
        freshness: { $ref: "#/components/schemas/Freshness" }
        demo: { type: boolean, description: "Demo mode only: true. The data is generated sample data, not live market data (every response also carries the header X-MCB-Data: demo)." }
        dataNotice: { type: string, description: "Demo mode only: a plain sentence saying so." }
    ItemError:
      type: object
      required: [code, message]
      properties:
        symbol: { type: string }
        orderId: { type: string }
        input: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
    Health:
      type: object
      required: [status, version, apiVersion]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        apiVersion: { type: string }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer }
        demo: { type: boolean, description: "Present and true only in demo mode (sample data, no real broker)." }
        dataNotice: { type: string, description: "In demo mode: a plain sentence saying the data is sample data." }
        services:
          type: object
          additionalProperties: { type: string, enum: [ready, not_built] }
    MetaInfo:
      type: object
      required: [bridgeVersion, apiVersion, brokers, modules, routes]
      properties:
        bridgeVersion: { type: string }
        apiVersion: { type: string }
        brokerContractVersion: { type: integer }
        brokers: { type: array, items: { type: string } }
        modules:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              stream: { type: string }
        routes:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              path: { type: string }
              scope: { type: [string, "null"] }
              auth: { type: string }

    Symbol:
      type: string
      maxLength: 64
      description: Canonical Bridge symbol (see the introduction). Inputs may use accepted aliases.
      examples: ["NSE:RELIANCE", "NSE:NIFTY", "NFO:NIFTY-2026-10-27-FUT", "NFO:NIFTY-2026-10-27-25000-CE"]
    SymbolFormatName:
      type: string
      enum: [auto, canonical, chart, compact, broker]
      default: auto
    Exchange:
      type: string
      enum: [NSE, BSE, NFO, BFO, MCX, CDS]
    InstrumentKind:
      type: string
      enum: [INDEX, EQ, FUT, OPT]
    Interval:
      type: string
      enum: ["1m", "3m", "5m", "10m", "15m", "30m", "60m", "1d", "1w", "1M"]
    StreamMode:
      type: string
      enum: [ltp, quote, depth]
      default: ltp
    AccountId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,31}$"
    ClientOrderId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
      description: Your own id for an order, unique per account per IST day. The Bridge maps it to the broker's shorter tag field itself.
    CompatReply:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [success, error] }
        message: { type: string }
        mode: { type: string, enum: [analyze], description: "Present while analyzer (paper) mode is on." }
        data: {}
        orderid: { type: [string, "null"] }
      additionalProperties: true
    ScanRequest:
      type: object
      required: [condition]
      description: Give universe or symbols (not both).
      properties:
        name: { type: string, maxLength: 80 }
        universe: { type: string, description: "FNO, NIFTY50, INDICES or a name from scanner.universes" }
        symbols: { type: array, items: { type: string }, maxItems: 5000 }
        interval: { type: string, enum: ["1m", "3m", "5m", "10m", "15m", "30m", "60m", "1d", "1w", "1M", "live"], default: "1d", description: "live: daily bars with today's bar live at the end, plus the facts (OI change, PCR, IV rank, MWPL ...; GET /v1/scanner/library lists them)." }
        lookback: { type: integer, minimum: 2, maximum: 5000, description: "Bars per symbol; default from the condition" }
        condition: { type: string, maxLength: 1000, example: "rsi(14) > 60 and close crosses above ema(20)" }
        columns: { type: array, maxItems: 12, items: { type: string }, example: ["rsi(14)", "close / sma(200) - 1"] }
        sort:
          type: object
          properties:
            by: { type: string }
            order: { type: string, enum: [asc, desc], default: desc }
        limit: { type: integer, minimum: 1, maximum: 5000 }
        source: { type: string, enum: [auto, broker, backup], default: auto }
    SavedScanRequest:
      type: object
      required: [name, request]
      properties:
        name: { type: string, maxLength: 80 }
        request: { $ref: "#/components/schemas/ScanRequest" }
        everyMinutes: { type: integer, minimum: 1, maximum: 1440, nullable: true }
        marketHoursOnly: { type: boolean, default: true }
        atClose: { type: boolean, default: false, description: "Run once after the close (15:31 IST) on trading days." }
        notify: { type: boolean, default: true, description: "Send scan.alert to the notification targets." }
        builder: { type: object, nullable: true, description: "The builder model, so the scan reopens in the builder." }
        libraryId: { type: string, nullable: true }
        columns: { type: array, maxItems: 20, items: { type: string } }
    SavedScanPatch:
      type: object
      description: Any of the SavedScanRequest fields.
      properties:
        name: { type: string, maxLength: 80 }
        request: { $ref: "#/components/schemas/ScanRequest" }
        everyMinutes: { type: integer, minimum: 1, maximum: 1440, nullable: true }
        marketHoursOnly: { type: boolean }
        atClose: { type: boolean }
        notify: { type: boolean }
        builder: { type: object, nullable: true }
        libraryId: { type: string, nullable: true }
        columns: { type: array, maxItems: 20, items: { type: string } }

    Freshness:
      type: object
      required: [source, asOf, ageMs, stale]
      properties:
        source:
          type: string
          enum: [stream, cache, broker, paper, backup]
          description: backup = a free public source (named in provider) used because no broker account could answer; may be delayed.
        asOf: { type: string, format: date-time }
        ageMs: { type: integer, minimum: 0 }
        stale: { type: boolean }
        accountId: { type: [string, "null"], description: "Account whose connection supplied the data." }
        broker: { type: [string, "null"] }
        provider: { type: string, enum: [yahoo, nse], description: "Only for source backup: which public source supplied it." }
        revalidating: { type: boolean, description: "Only with ?swr=true: this older value was answered at once and a refresh is running behind it." }

    BrokerInfo:
      type: object
      required: [id, name, authKind, capabilities, verified]
      properties:
        id: { type: string }
        name: { type: string }
        authKind: { type: string, enum: [apiKeyToken, oauthRedirect, requestTokenExchange, sessionLogin] }
        capabilities: { type: array, items: { type: string } }
        verified: { type: boolean, description: "Checked end to end against a live account." }
        credentialFields: { type: array, items: { type: string }, description: "Keys to send in SessionConnectRequest.values." }
        loginFields:
          type: array
          description: "sessionLogin brokers only: keys to send in SessionConnectRequest.secrets (used once, never stored)."
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              kind: { type: string, enum: [secret, totp] }
        tokenExpiry: { type: [string, "null"], description: "When the broker's session usually ends, as the broker documents it." }
        loginUrl:
          type: string
          description: "The broker's own login page, with {field} placeholders that are all credentialFields (e.g. {apiKey}). Only for brokers that declare one."
        policy: { $ref: "#/components/schemas/BrokerPolicy" }
    BrokerPolicy:
      type: object
      properties:
        limits:
          type: object
          additionalProperties:
            type: object
            properties:
              perSecond: { type: number }
              perMinute: { type: number }
              perDay: { type: number }
              verified: { type: boolean }
              source: { type: string, format: uri }
        maxQuoteBatch: { type: integer }
        feed:
          type: object
          properties:
            maxConnections: { type: [integer, "null"] }
            maxSubscriptions: { type: [integer, "null"] }
        pooling: { type: string, enum: [allowed, not-allowed, unknown] }
        maxModificationsPerOrder: { type: [integer, "null"] }
    SessionState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [connected, expired, missing, error, checking] }
        expiresAt: { type: [string, "null"], format: date-time }
        checkedAt: { type: [string, "null"], format: date-time }
        message: { type: [string, "null"] }
    AccountSummary:
      type: object
      required: [id, broker, label, enabled, session, liveAllowedByConfig, pooling, capabilities]
      properties:
        id: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        session: { $ref: "#/components/schemas/SessionState" }
        liveAllowedByConfig: { type: boolean }
        pooling: { type: boolean, description: "This account's market-data budget may serve requests that did not name an account." }
        capabilities: { type: array, items: { type: string } }
        authKind: { type: [string, "null"] }
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [broker]
      properties:
        broker: { type: string, description: "An adapter id from GET /v1/brokers, or paper." }
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,31}$", description: "Optional; the Bridge picks one when it is left out." }
        label: { type: string, maxLength: 60, description: "A name you will recognise. Optional." }
        leaveDemo: { type: boolean, description: "Demo mode only: also remove `\"demo\": true` from the config file, so the next start is normal." }

    SessionConnectRequest:
      type: object
      additionalProperties: false
      properties:
        values:
          type: object
          description: Non-secret fields the broker needs (apiKey, clientId, accessToken ...). Stored encrypted.
          additionalProperties: { type: string, maxLength: 4096 }
        secrets:
          type: object
          description: Password/PIN and the current TOTP code for session-login brokers. Used once, never stored.
          additionalProperties: { type: string, maxLength: 256 }

    KeyRecord:
      type: object
      required: [id, label, scopes, accounts, createdAt]
      properties:
        id: { type: string }
        label: { type: string }
        scopes: { type: array, items: { type: string, enum: [read, paper, live, admin] } }
        accounts:
          oneOf:
            - { type: string, const: "*" }
            - { type: array, items: { $ref: "#/components/schemas/AccountId" } }
        allowQuery: { type: boolean }
        clientKind: { type: string, enum: [script, excel, mcp, ui, other] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    KeyCreateRequest:
      type: object
      required: [label, scopes]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        scopes: { type: array, minItems: 1, items: { type: string, enum: [read, paper, live, admin] } }
        accounts:
          oneOf:
            - { type: string, const: "*" }
            - { type: array, minItems: 1, items: { $ref: "#/components/schemas/AccountId" } }
        expiresAt: { type: [string, "null"], format: date-time }
        allowQuery: { type: boolean, default: false, description: "Allow ?key= use. Only for keys whose only scope is read." }
        clientKind: { type: string, enum: [script, excel, mcp, ui, other] }
    KeyCreated:
      type: object
      required: [key, record]
      properties:
        key: { type: string, description: "Shown once." }
        record: { $ref: "#/components/schemas/KeyRecord" }

    Instrument:
      type: object
      required: [symbol, exchange, kind, underlying, lotSize, tickSize]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        exchange: { $ref: "#/components/schemas/Exchange" }
        kind: { $ref: "#/components/schemas/InstrumentKind" }
        underlying: { type: string }
        name: { type: [string, "null"] }
        expiry: { type: [string, "null"], format: date }
        strike: { type: [number, "null"] }
        right: { type: [string, "null"], enum: [CE, PE, null] }
        lotSize: { type: integer, minimum: 1 }
        tickSize: { type: number, exclusiveMinimum: 0 }
        freezeQty: { type: [integer, "null"] }
        freezeQtySource:
          type: [string, "null"]
          enum: [master, exchange-list, null]
          description: Where freezeQty came from. "exchange-list" is the Bridge's dated list and is marked needs-verification.
        isin: { type: [string, "null"] }
        refs:
          type: object
          description: Present with include=refs. Keyed by broker id.
          additionalProperties:
            type: object
            properties:
              token: { type: string }
              exchange: { type: string }
              tradingSymbol: { type: [string, "null"] }
    ConvertRequest:
      type: object
      required: [input]
      additionalProperties: false
      properties:
        input: { type: string, maxLength: 64 }
        from: { $ref: "#/components/schemas/SymbolFormatName" }
        exchange: { type: string, maxLength: 12 }
        broker: { type: string }
    ConvertResult:
      type: object
      required: [input, canonical, aliases]
      properties:
        input: { type: string }
        canonical: { $ref: "#/components/schemas/Symbol" }
        aliases:
          type: object
          description: "chart (chart ticker such as NSE:NIFTY1!), compact (symbol and exchange) and, when a broker is given or connected, broker:<id>."
          additionalProperties: { type: [string, "null"] }

    LtpItem:
      type: object
      required: [symbol, ltp, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: number }
        freshness: { $ref: "#/components/schemas/Freshness" }
    QuoteItem:
      type: object
      required: [symbol, ltp, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: number }
        open: { type: [number, "null"] }
        high: { type: [number, "null"] }
        low: { type: [number, "null"] }
        close: { type: [number, "null"], description: "Previous close." }
        change: { type: [number, "null"] }
        changePct: { type: [number, "null"] }
        volume: { type: [number, "null"] }
        oi: { type: [number, "null"] }
        bid: { type: [number, "null"] }
        ask: { type: [number, "null"] }
        bidQty: { type: [number, "null"] }
        askQty: { type: [number, "null"] }
        freshness: { $ref: "#/components/schemas/Freshness" }
    DepthLevel:
      type: object
      required: [price, qty]
      properties:
        price: { type: number }
        qty: { type: number }
        orders: { type: [integer, "null"] }
    DepthItem:
      type: object
      required: [symbol, bids, asks, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        bids: { type: array, items: { $ref: "#/components/schemas/DepthLevel" } }
        asks: { type: array, items: { $ref: "#/components/schemas/DepthLevel" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Candle:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time: { type: integer, description: "Bar open time, epoch seconds." }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
        oi: { type: number }
    HistoryResult:
      type: object
      required: [symbol, interval, candles, freshness, partial]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        interval: { $ref: "#/components/schemas/Interval" }
        candles: { type: array, items: { $ref: "#/components/schemas/Candle" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
        partial: { type: boolean, description: "True when the broker could not supply the whole range (history depth limits)." }
    ChainLeg:
      type: object
      required: [symbol]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: [number, "null"] }
        bid: { type: [number, "null"] }
        ask: { type: [number, "null"] }
        oi: { type: [number, "null"] }
        oiChange: { type: [number, "null"] }
        volume: { type: [number, "null"] }
        iv: { type: [number, "null"], description: "Percent." }
        close: { type: [number, "null"], description: "Previous session's close, when the broker sends it." }
        change: { type: [number, "null"], description: "ltp - close; null without a close." }
        delta: { type: [number, "null"] }
        gamma: { type: [number, "null"] }
        theta: { type: [number, "null"] }
        vega: { type: [number, "null"] }
        greeksSource: { type: [string, "null"], enum: [broker, computed, null] }
        oiChangeBasis:
          type: [string, "null"]
          enum: [broker, recorder, day-baseline, null]
          description: >-
            Option sweep chains only: where oiChange came from. broker = the broker chain's own change; recorder = OI now
            minus the last OI recorded on the previous trading day; day-baseline = OI now minus the first OI seen today
            (oiChangeSince says when); null = unknown.
        oiChangeSince: { type: string, description: "day-baseline only: IST HH:MM of the baseline." }
        brokerIv: { type: [number, "null"], description: "The broker's own IV (percent), when it sent one and ivModel=b76-forward recomputed iv." }
        ivReason:
          type: [string, "null"]
          enum: [SETTLING, NOQUOTE, TICK, INTRINSIC, RANGE, SETTLED, NOFORWARD, null]
          description: >-
            ivModel=b76-forward only: why iv is null. SETTLING = expiry day inside the settlement window and the price within
            2 ticks of intrinsic on the forward; NOQUOTE = no usable price; TICK = price at or below one tick; INTRINSIC = at
            or below discounted intrinsic; RANGE = solved IV outside 1-300 %; SETTLED = past the settlement; NOFORWARD = no
            forward. Null when the IV solved.
    FnoBan:
      description: Ban band of a stock (null for indices).
      oneOf:
        - type: object
          required: [inBan]
          properties:
            inBan: { type: boolean }
            mwplPct: { type: [number, "null"] }
            band: { type: [string, "null"], enum: [ban, high, normal, null] }
            forDate: { type: [string, "null"], format: date }
            asOf: { type: [string, "null"] }
            source: { type: string, enum: [demo-override] }
        - type: object
          required: [available, reason]
          properties:
            available: { type: boolean, const: false }
            reason: { type: string }
    FnoUnderlying:
      type: object
      required: [underlying, kind, exchange, spot, settlement]
      properties:
        underlying: { type: string }
        name: { type: string }
        kind: { type: string, enum: [index, stock] }
        exchange: { type: string, enum: [NFO, BFO] }
        spot: { type: string, description: "The cash or index symbol that prices it." }
        settlement: { type: string, enum: [cash, physical] }
        lot: { type: [integer, "null"] }
        nextLot: { type: [object, "null"], properties: { lot: { type: [integer, "null"] }, from: { type: [string, "null"] } } }
        tickSize: { type: [number, "null"] }
        strikeStep: { type: [number, "null"], description: "Inferred from listed strikes." }
        freezeQty: { type: [integer, "null"] }
        weekly: { type: boolean }
        ban: { oneOf: [{ $ref: "#/components/schemas/FnoBan" }, { type: "null" }] }
        events: { type: integer }
        nonStandard: { type: boolean }
        sweep: { type: object, properties: { covered: { type: boolean }, method: { type: [string, "null"] }, limitedReason: { type: [string, "null"] } } }
        quote: { type: [object, "null"], properties: { ltp: { type: [number, "null"] }, changePct: { type: [number, "null"] } } }
    FnoUnderlyingList:
