        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /mcp:
    post:
      tags: [AI (MCP)]
      operationId: mcp
      summary: MCP Streamable HTTP endpoint for AI assistants
      description: |
        JSON-RPC 2.0 per the Model Context Protocol. The key's scopes decide which tools exist: market-data and account
        tools for `read`; order tools only when enabled in config, and every order still needs your confirmation in the
        Bridge. Desktop assistants should prefer `mc-bridge mcp` over stdio.
      x-module: mcp
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: JSON-RPC response, or an SSE stream for long calls.
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

