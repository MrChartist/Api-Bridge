        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/alerts/{alertId}:
    parameters:
      - name: alertId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Alerts]
      operationId: updateAlert
      summary: Change an alert, or switch it on or off
      x-stream: S24
      x-scope: paper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                account: { type: string }
                underlying: { type: string }
                symbols: { type: [array, "null"], items: { type: string }, maxItems: 24 }
                conditions:
                  type: array
                  minItems: 1
