  /v1/book:
    get:
      tags: [Book]
      operationId: getBook
      summary: One book per holder, or the family view (never pooled for orders; each leg keeps its account)
      x-stream: S27
      x-scope: read
      description: >-
        Positions and funds of every account this key may see (or the named ones), grouped by holder. Each holder is
        priced only from that holder's own sources (a connected account of the holder with quotes; the paper engine's
        source for paper-only holders; otherwise broker-reported P&L and no Greeks, with the reason). view=family keeps
        the holders whose relationship is inside book.family.relationships and lists the others under outsideFamily.
