  /v1/optionchain:
    get:
      tags: [Market data]
      operationId: getOptionChain
      summary: Option chain with IV and Greeks
      description: Works for every F&O stock and index the broker lists; `GET /v1/expiries?underlying=` lists the expiries it can answer for.
      x-module: market
      x-scope: read
      parameters:
        - name: underlying
          in: query
          required: true
          schema: { type: string, maxLength: 30 }
        - name: expiry
          in: query
          required: true
          schema: { type: string, format: date }
        - name: strikes
          in: query
          description: Strikes on each side of ATM (default all).
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: greeks
          in: query
          schema: { type: boolean, default: true }
        - name: ivModel
          in: query
          description: >-
            b76-forward: every leg's IV and Greeks from Black-76 on the 5-strike parity forward, mid prices and the
            vol-time clock (theta per trading-day unit), the broker's own IV kept as brokerIv, and a chain-level
            pricing object. legacy-bs-spot: Black-Scholes on spot with calendar days (theta per calendar day). Default:
            market.chain.ivModelDefault (legacy-bs-spot until 2027-05-01); a response that used the legacy default
            carries Deprecation and Link headers.
          schema: { type: string, enum: [b76-forward, legacy-bs-spot] }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
        - $ref: "#/components/parameters/Swr"
        - $ref: "#/components/parameters/ReadPriority"
        - $ref: "#/components/parameters/Strict"
      responses:
        "200":
          description: Chain.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/OptionChain" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/calendar/holidays:
    get:
      tags: [Market data]
      operationId: getCalendarHolidays
      summary: Trading holidays of a year for an exchange
      description: |
        From the holiday list shipped with the Bridge (the NSE and BSE circulars; the list's date and source are in
        `calendar`). Every row keeps its own `verified` flag. A year the list does not cover gives an empty list with
        `calendar.covered: false`: that is "no data", not "no holidays". Weekends are not listed. NFO follows NSE and BFO
        follows BSE. MCX and CDS have their own hours that this list does not hold (422).
      x-module: market
      x-scope: read
      parameters:
        - name: exchange
          in: query
          description: NSE (default), BSE, NFO or BFO.
          schema: { type: string, enum: [NSE, BSE, NFO, BFO], default: NSE }
        - name: year
          in: query
          description: Four-digit year (default this year, IST).
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        "200":
          description: The holidays.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/CalendarHolidays" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/calendar/sessions:
    get:
      tags: [Market data]
      operationId: getCalendarSessions
      summary: The session of one date (trading day or not, and the times)
      description: |
        Whether the date is a trading day and why not when it is not (weekend, holiday), the pre-open, open and close
        times (IST), a special session such as Muhurat trading, and the neighbouring trading days. The hours come from
        dated rules in the data shipped with the Bridge (derivatives close at 15:40 from 3 Aug 2026 and 15:45 from 7 Dec
        2026); `sessionTimes.rule` names the rule, its circular and its source, and `sessionTimes.verified: false` says the
        hours were not confirmed from a circular. A special session carries its own `verified` flag: while it is false the
        timing is unconfirmed, and live orders are refused in it.
      x-module: market
      x-scope: read
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [NSE, BSE, NFO, BFO], default: NSE }
        - name: date
          in: query
          description: A real date, YYYY-MM-DD (default today, IST).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/CalendarSession" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/calendar/status:
    get:
      tags: [Market data]
      operationId: getCalendarStatus
      summary: Is the exchange open now, and when does it next open
      description: |
        `open`, `pre-open` or `closed`, by the Bridge's clock in IST, with the reason (a holiday is named), when it closes
        or opens and the next regular or special open. This is the calendar's answer, not the exchange's live state: a
        halt or an unlisted closure is not in it. Read `calendar.verified` and `calendar.note`.
      x-module: market
      x-scope: read
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [NSE, BSE, NFO, BFO], default: NSE }
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/CalendarStatus" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/downloads:
    post:
      tags: [Data downloads]
      operationId: createDownload
      summary: Start a history download, or only estimate it with dryRun=1
      description: >-
        Saves candles to files on this computer as a background job. Give `symbols` (canonical, at most 500) or the name of a
        `collection`, one or more `intervals`, and `from`. Every broker call goes through the rate-limit scheduler at the
        lowest priority and within `downloads.maxBudgetShare` of the account's budget (default 0.3), so live reads, order checks
        and other keys always go first. The job is saved after every window and continues after a pause, a restart, the kill
        switch or a lost login. With `dataset`, the job continues from the last stored bar of that dataset. Ranges already
        stored in a dataset of this Bridge are copied from disk instead of fetched again. With `dryRun=1` nothing starts and the
        answer is the estimate (broker calls, rows, bytes, time at your share). The bar still forming is never stored.
      x-module: downloads
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: dryRun
          in: query
          description: "`1` or `true` returns the estimate and starts nothing."
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            example: {"symbols":["NSE:RELIANCE","NSE:INFY"],"intervals":["1d"],"from":"2026-10-01","dataset":"large-caps-1d"}
            schema: { $ref: "#/components/schemas/DownloadRequest" }
      responses:
        "200":
          description: The estimate (dryRun only).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DownloadEstimate" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "202":
          description: The job was accepted and is queued.
          headers:
            Location: { description: "The job's address.", schema: { type: string } }
          content:
            application/json:
              example: {"data":{"id":"dl_435e6691d280","name":"large-caps-1d","status":"queued","reason":null,"message":null,"progress":{"total":2,"done":0,"failed":0,"rows":0,"bytes":0,"etaSec":null,"current":null,"waiting":null},"request":{"symbols":["NSE:RELIANCE","NSE:INFY"],"intervals":["1d"],"from":"2026-10-01","to":null,"format":"csv","layout":"per-symbol","dataset":"large-caps-1d","account":null,"backup":false,"afterHoursOnly":false},"dataset":"large-caps-1d","tags":[],"dataClass":"realtime","source":null,"official":null,"delaySec":null,"callsSaved":0,"notes":[],"createdAt":"2026-11-10T04:05:25.794Z","startedAt":null,"finishedAt":null,"manifestUrl":"/v1/downloads/dl_435e6691d280/files/manifest.json","items":[{"symbol":"NSE:RELIANCE","interval":"1d","status":"pending","rows":0},{"symbol":"NSE:INFY","interval":"1d","status":"pending","rows":0}]},"meta":{"requestId":"req_2f8e1a0c4b7d9e3a5c61"}}
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DownloadJob" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    get:
      tags: [Data downloads]
      operationId: listDownloads
      summary: Download jobs, newest first
      description: The list leaves out each job's `items` unless `include=items`.
      x-module: downloads
      x-scope: read
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DownloadStatus" }
        - name: tag
          in: query
          schema: { type: string, maxLength: 32 }
        - name: include
          in: query
          schema: { type: string, enum: [items] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DownloadJob" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/downloads/settings:
    get:
      tags: [Data downloads]
      operationId: getDownloadSettings
      summary: The budget share and the after-hours switch downloads use now
      description: The values in force (the config values unless changed here), the config defaults and the allowed range.
      x-module: downloads
      x-scope: read
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DownloadSettings" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Data downloads]
      operationId: patchDownloadSettings
      summary: Change the budget share or the after-hours switch while the Bridge runs
      description: |
        Applies at once to running and waiting jobs (the next broker call reads it), is kept in a small file in the data folder
