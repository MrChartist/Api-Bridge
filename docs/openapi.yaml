  /hooks/{source}/{token}:
    parameters:
      - name: source
        in: path
        required: true
        schema: { type: string, enum: [generic, chartink, gocharting] }
      - name: token
        in: path
        required: true
        description: The hook's secret token (shown once when the hook is created). It is the only credential ChartInk and GoCharting can carry, since they cannot sign requests.
        schema: { type: string, minLength: 32, maxLength: 128 }
    post:
      tags: [Webhooks]
      operationId: receiveHook
      summary: Inbound alert (signed generic, ChartInk or GoCharting)
      description: |
        Answers within milliseconds (alert services give up after a few seconds) and processes the signal in the background,
        through the same preview and safety checks as any order. The hook decides what an alert may do (account,
        symbols, quantity caps, paper or live, whether a human must confirm). `generic` hooks must send
        `X-MCB-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>">`; requests older than 5 minutes or
        replayed are refused. Served on the public ingress listener when it is enabled.
      x-stream: S11
      x-public: true
      security: []
      parameters:
        - name: X-MCB-Signature
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
          text/plain:
            schema: { type: string }
      responses:
        "202":
          description: Accepted for processing.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, signalId]
                properties:
                  accepted: { type: boolean }
                  signalId: { type: string }
                  duplicate: { type: boolean }
                  dropped: { type: integer, description: Orders in the alert that were dropped before queueing (for example over the per-alert cap). }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/hooks:
    get:
      tags: [Webhooks]
