  /v1/history:
    get:
      tags: [Market data]
      operationId: getHistory
      summary: Historical candles, automatically split across broker limits
      description: Give `from`+`to`, or `to`+`countback`. Ranges longer than the broker allows in one call are fetched in chunks within the rate limits. `format=csv` returns `time,open,high,low,close,volume,oi` with IST timestamps.
      x-module: market
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - name: interval
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Interval" }
        - name: from
          in: query
          description: ISO date or date-time (IST if no offset), or epoch seconds.
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: countback
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000 }
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
        - name: dataset
          in: query
          description: "Read from this dataset on this computer (needs `from`). Only the part it does not cover is fetched from the broker. `meta.source` says `local`, `mixed` or absent. The config `market.history.localFirst` does the same for any dataset that covers the range."
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/Strict"
        - { name: localFirst, in: query, description: "`true` serves the range from a dataset on this computer that covers it, and fetches only the rest from the broker (the answer says so in `meta.source`). `dataset` picks one dataset; the config `market.history.localFirst` turns it on for every read. Not with `countback`.", schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Candles, ascending.
          content:
            application/json:
              example: {"data":{"symbol":"NSE:RELIANCE","interval":"1d","candles":[{"time":1794162600,"open":1453.2,"high":1468.7,"low":1450.2,"close":1460.4,"volume":215004},{"time":1794249000,"open":1460.4,"high":1463.9,"low":1455.9,"close":1460.8,"volume":38459}],"partial":false,"freshness":{"source":"broker","asOf":"2026-11-10T09:46:00.381+05:30","ageMs":1,"stale":false,"accountId":"my-zerodha","broker":"zerodha","class":"realtime","delaySec":0,"official":true,"confidence":"high","flags":[]}},"meta":{"requestId":"req_2f8e1a0c4b7d9e3a5c61","accountId":null,"freshness":{"source":"broker","asOf":"2026-11-10T09:46:00.381+05:30","ageMs":1,"stale":false,"accountId":"my-zerodha","broker":"zerodha","class":"realtime","delaySec":0,"official":true,"confidence":"high","flags":[]}}}
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/HistoryResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
            text/csv:
              schema: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

