      summary: List configured hooks (never the token)
      description: An admin key limited to some accounts lists only the hooks of those accounts.
      x-stream: S11
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: Hooks.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Hook" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Webhooks]
      operationId: createHook
      summary: Create a hook; the URL with its token is shown once
      x-stream: S11
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HookCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Hook"
                      - type: object
                        required: [url]
                        properties:
                          url: { type: string, description: "Full hook URL including the secret token. Shown once." }
                          path: { type: string, description: "The URL path alone (for tunnels and public ingress). Shown once." }
                          signingSecret: { type: string, description: "For generic hooks only. Shown once." }
                          templates: { type: object, additionalProperties: true, description: Ready-to-paste alert message templates for this source. }
                          warnings: { type: array, items: { type: string } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

