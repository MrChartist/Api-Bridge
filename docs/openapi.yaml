  /v1/paper/accounts/{accountId}/daily:
    parameters:
      - $ref: "#/components/parameters/AccountIdPath"
    get:
      tags: [Paper]
      operationId: paperDailyPnl
      summary: Daily P&L snapshots of a paper account, oldest first
      description: >-
        One row per IST day: equity, realised, unrealised, charges, the day's change in equity (`pnl`), used margin and
        open positions. Taken at the end of each session (the first maintenance pass after the session end, or the day
        roll) and on demand. Kept through a paper reset. The trade journal's P&L calendar reads these.
      x-stream: S8
      x-scope: read
      responses:
        "200":
          description: The snapshots.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/PaperDailyPnl" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Paper]
      operationId: paperDailySnapshot
      summary: Take today's P&L snapshot now
      description: Marks the book to the latest prices and stores today's row. It never replaces today's end-of-day row, which it returns instead.
      x-stream: S8
      x-scope: paper
      responses:
        "200":
          description: Today's row.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/PaperDailyPnl" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/paper/accounts/{accountId}/margin:
    parameters:
      - $ref: "#/components/parameters/AccountIdPath"
    post:
      tags: [Paper]
      operationId: paperBasketMargin
      summary: Margin of a basket against the paper book (approximate, nothing is placed)
      description: >-
        Portfolio model (server/bridge/dashboard/span-margin.js): approximate, not the exchange's SPAN. Per underlying, a
        16-scenario price and volatility scan, plus exposure margin, a calendar charge across expiries and expiry-day ELM.
        Without an underlying price the legs fall back to the simple per-leg model and are listed in `fallback`.
      x-stream: S8
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legs]
              properties:
                legs:
                  type: array
                  minItems: 1
                  maxItems: 24
                  items:
                    type: object
                    additionalProperties: false
                    required: [symbol, side]
                    properties:
                      symbol: { type: string }
                      side: { type: string, enum: [BUY, SELL] }
                      quantity: { type: integer, minimum: 1 }
                      lots: { type: integer, minimum: 1 }
                      price: { type: number, exclusiveMinimum: 0 }
                      product: { type: string, enum: [INTRADAY, MARGIN] }
      responses:
        "200":
          description: Margin before and after the basket, the basket alone and each leg on its own.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [model, before, after, change, alone, standalone, method]
                    properties:
                      model: { type: string, enum: [portfolio, simple] }
                      before: { type: number }
                      after: { type: number }
                      change: { type: number }
                      alone: { type: number }
                      standalone: { type: number, description: Each leg margined on its own, with no hedge benefit. }
                      breakdown:
                        type: object
                        properties:
                          premium: { type: number }
                          span: { type: number }
                          exposure: { type: number }
                          calendar: { type: number }
                          elm: { type: number }
                      forwards: { type: object, additionalProperties: { type: number } }
                      fallback: { type: array, items: { type: string } }
                      available: { type: number }
                      method: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

