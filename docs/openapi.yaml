      parameters:
        - { name: account, in: query, required: false, schema: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/AccountId" } }, style: form, explode: true }
      responses:
        "200":
          description: Readiness snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Readiness" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/readiness/check:
    post:
      tags: [Readiness]
      operationId: checkReadiness
      summary: Re-check now (probe and egress lookup, each with a 30 s cooldown)
      x-stream: S20
      x-scope: read
      description: >-
        Runs the checks at once for one account (or every account this key may see). The broker read call and the
        egress lookup each have a 30 s cooldown; skipped parts are listed in meta.skipped. Waits at most 12 s, then
        answers with what it has.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { account: { $ref: "#/components/schemas/AccountId" } } }
      responses:
        "200":
          description: Readiness snapshot after the check.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Readiness" }
                  meta:
                    allOf:
                      - { $ref: "#/components/schemas/Meta" }
                      - { type: object, properties: { skipped: { type: array, items: { type: string }, examples: [["probe:zerodha-main:cooldown", "egress:cooldown"]] } } }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

