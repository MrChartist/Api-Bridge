components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Bridge API key: `mcb_<keyId>_<secret>`."
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Only on /xl/*, only for read-only keys created with --allow-query.

  headers:
    IdempotencyReplayed:
      description: "`true` when this response is the stored result of an earlier request with the same Idempotency-Key."
      schema: { type: string, enum: ["true"] }
    RateLimit:
      description: Remaining client budget (IETF RateLimit header draft).
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  parameters:
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AccountId" }
    AccountQuery:
      name: account
      in: query
      required: true
      schema: { $ref: "#/components/schemas/AccountId" }
    AccountQueryOptional:
      name: account
      in: query
      description: Pin the request to this account. Without it, market data may be served from any of your accounts that allow pooling.
      schema: { $ref: "#/components/schemas/AccountId" }
    ModeQuery:
      name: mode
      in: query
      description: "`paper` reads the account's paper book; `live` the broker's (default for portfolio reads)."
      schema: { type: string, enum: [paper, live], default: live }
    Symbols:
      name: symbols
      in: query
      required: true
      description: Comma-separated symbols (up to 200).
      schema: { type: string, maxLength: 8000 }
    SymbolQuery:
      name: symbol
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Symbol" }
    Backup:
      name: backup
      in: query
      description: >-
        Unpinned reads only. true lets a read that no broker account can answer fall back to the free backup sources
        (Yahoo Finance, NSE website; freshness.source "backup", delayed); false never does. Default from config
        (`sources.autoFallback`). Never available for order, risk, paper or alert purposes, and not accepted on `/xl/*`
        (a bare value cannot say how current it is) or the compat API (it never uses backup sources).
      schema: { type: boolean }
    MaxAge:
      name: maxAgeMs
      in: query
      description: Oldest data you accept, in ms. 0 forces a live read (still within rate limits). Default depends on the endpoint (LTP 1000, quotes 2000, chain 3000).
      schema: { type: integer, minimum: 0, maximum: 3600000 }
    Swr:
      name: swr
      in: query
      description: Stale-while-revalidate. When only an older cached value exists (inside market.stale.maxStaleMs), answer with it at once, labelled `freshness.stale` and `freshness.revalidating`, and refresh it in the background (one refresh however many readers ask).
      schema: { type: boolean, default: false }
    ReadPriority:
      name: priority
      in: query
      description: "`background` for a prefetch: it waits behind every interactive read, and a read for the same thing joins it and raises its priority. Reads never run at order priority."
      schema: { type: string, enum: [interactive, background], default: interactive }
    Purpose:
      name: purpose
      in: query
      description: |
        What the read is for. `alert`, `paper`, `risk` and `order` accept only real-time data from your own broker; a
        delayed or end-of-day source is never used for them. `display` (default) and `analysis` accept any labelled
        source. A caller's `maxAgeMs` also filters: a source whose delay exceeds it cannot answer.
      schema: { $ref: "#/components/schemas/Purpose" }
    SourceIdPath:
      name: id
      in: path
      required: true
      description: A source id from `GET /v1/sources`.
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,30}$" }
    KeyIdPath:
      name: keyId
      in: path
      required: true
      description: The key id (not the secret) from `GET /v1/keys`.
      schema: { type: string, maxLength: 64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `meta.nextCursor`.
      schema: { type: string, maxLength: 512 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Your unique id for this write (UUID recommended). A retry with the same key and the same body returns the first
        result with `Idempotency-Replayed: true`; a different body is refused with 409 IDEMPOTENCY_KEY_REUSED; a retry
        while the first is still running gets 409 IDEMPOTENCY_IN_PROGRESS. Keys are kept until the end of the IST
        trading day and at least 24 hours. For POST /v1/orders, `clientOrderId` in the body works the same way when the
        header is absent.
      schema: { type: string, minLength: 8, maxLength: 255, pattern: "^[A-Za-z0-9_.:-]+$" }

  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit: { $ref: "#/components/headers/RateLimit" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    PaperDailyPnl:
      type: object
      required: [day, at, source, equity, pnl]
      properties:
        day: { type: string, format: date }
        at: { type: string, description: When the row was taken (IST, +05:30). }
        source: { type: string, enum: [eod, manual] }
        equity: { type: number }
        realised: { type: number }
        unrealised: { type: number }
        charges: { type: number }
        pnl: { type: number, description: The day's change in equity (from the previous row, or the starting capital after a reset). }
        usedMargin: { type: [number, "null"] }
        openPositions: { type: integer }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: "Human text. Do not parse it." }
        code: { $ref: "#/components/schemas/ErrorCode" }
        retryable: { type: boolean, description: "Safe to send exactly this request again (after Retry-After)." }
        requestId: { type: string }
        retryAfterMs: { type: integer, description: "Throttling refusals: when to try again, in ms. Same time as Retry-After, finer." }
        scope:
          type: string
          enum: [client, upstream, queue, consumer-cap]
          description: |
            Throttling refusals only: which limit tripped. `client`: this API key's own quota. `upstream`: the broker's
            (or source's) limit, shared by everyone. `queue`: the Bridge's queue for that account is full or could not
            start the request before its deadline. `consumer-cap`: this consumer already has its share of the queue.
            Read this and `limit`, not `detail`.
        limit:
          type: object
          description: "Throttling refusals only: the limit that tripped."
          required: [name, remaining, resetMs]
          properties:
            name: { type: string, description: "For example `key-per-second`, `dhan-quote-per-second`, `queue-depth`." }
            remaining: { type: number, description: "What is left of it now (0 when it tripped)." }
            resetMs: { type: integer, minimum: 0, description: "Time until it has room again." }
        broker:
          type: object
          description: The broker's own error, when one caused this.
          properties:
            id: { type: string }
            code: { type: string }
            message: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
        candidates:
          type: array
          description: "AMBIGUOUS_SYMBOL (the instruments the name could mean) and SYMBOL_NOT_FOUND on /v1/symbols/resolve (the closest names)."
          items: { $ref: "#/components/schemas/SymbolCandidate" }
        rule: { type: string, description: "With candidates: why nothing was picked." }
        ticketId: { type: string, description: "STATE_CONFLICT on a ticket route only: the ticket." }
        state:
          type: string
          enum: [rejected, confirmed, consumed, expired]
          description: "STATE_CONFLICT on a ticket route only: why it cannot be confirmed or declined. Read this, not `detail`."
    ErrorCode:
      type: string
      description: Stable codes; new ones may be added. Source of truth server/bridge/core/errors.mjs.
      enum:
        - VALIDATION_FAILED
        - INVALID_JSON
        - UNAUTHENTICATED
        - SCOPE_REQUIRED
        - ACCOUNT_FORBIDDEN
        - HOST_NOT_ALLOWED
        - ORIGIN_NOT_ALLOWED
        - LOOPBACK_ONLY
        - NOT_FOUND
        - ACCOUNT_NOT_FOUND
        - SYMBOL_NOT_FOUND
        - AMBIGUOUS_SYMBOL
        - ORDER_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - DUPLICATE_CLIENT_ORDER_ID
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CAPABILITY_UNSUPPORTED
        - INVALID_ORDER
        - SESSION_EXPIRED
        - POSITION_UNKNOWN
        - CONFIRMATION_REQUIRED
        - STATE_CONFLICT
        - PAPER_ONLY
        - ORDER_GATE_CLOSED
        - DAILY_LIMIT_REACHED
        - MARKET_CLOSED
        - KILL_SWITCH_ACTIVE
        - CANNOT_TRADE
        - RATE_LIMITED
        - ORDER_RATE_LIMITED
        - UPSTREAM_RATE_LIMITED
        - SUBSCRIPTION_LIMIT
        - INTERNAL
        - NOT_IMPLEMENTED
        - UPSTREAM_ERROR
        - BROKER_UNAVAILABLE
        - UPSTREAM_TIMEOUT
        - OUTCOME_UNKNOWN
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
        nextCursor: { type: [string, "null"], description: "Present on list endpoints; null on the last page." }
        accountId: { type: [string, "null"] }
        mode: { type: string, enum: [paper, live] }
        freshness: { $ref: "#/components/schemas/Freshness" }
        normalised:
          type: array
          description: "Orders and margin: each word of the request that was read in its canonical form (MIS as INTRADAY). Absent when nothing was changed."
          items:
            type: object
            required: [field, from, to]
            properties:
              field: { type: string }
              from: { type: string }
              to: { type: string }
        demo: { type: boolean, description: "Demo mode only: true. The data is generated sample data, not live market data (every response also carries the header X-MCB-Data: demo)." }
        dataNotice: { type: string, description: "Demo mode only: a plain sentence saying so." }
    ItemError:
      type: object
      required: [code, message]
      properties:
        symbol: { type: string }
        orderId: { type: string }
        input: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
    Health:
      type: object
      required: [status, version, apiVersion]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        apiVersion: { type: string }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer }
        demo: { type: boolean, description: "Present and true only in demo mode (sample data, no real broker)." }
        dataNotice: { type: string, description: "In demo mode: a plain sentence saying the data is sample data." }
        services:
          type: object
          additionalProperties: { type: string, enum: [ready, not_built] }
        startup:
          type: object
          description: >-
            Present only while the Bridge is starting and holds positions, funds, orders, trades and the book (at most
            20 s) until its start-up jobs finish (in demo mode, the demo book seed), so no client reads a partial book.
            Each job's progress lets a page show it instead of a silent wait. Absent once those reads answer.
          required: [ready, jobs]
          properties:
            ready: { type: boolean, enum: [false] }
            jobs:
              type: array
              items:
                type: object
                required: [name, done, total]
                properties:
                  name: { type: string, description: 'For example "demo book seed".' }
                  done: { type: [integer, "null"], description: "Steps done (seeded legs), null until the job reports." }
                  total: { type: [integer, "null"], description: "Steps in all, null until known." }
    MetaInfo:
      type: object
      required: [bridgeVersion, apiVersion, brokers, modules, routes]
      properties:
        bridgeVersion: { type: string }
        apiVersion: { type: string }
        brokerContractVersion: { type: integer }
        brokers: { type: array, items: { type: string } }
        modules:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              stream: { type: string }
        routes:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              path: { type: string }
              scope: { type: [string, "null"] }
              auth: { type: string }

    Symbol:
      type: string
      maxLength: 64
      description: Canonical Bridge symbol (see the introduction). Inputs may use accepted aliases.
      examples: ["NSE:RELIANCE", "NSE:NIFTY", "NFO:NIFTY-2026-10-27-FUT", "NFO:NIFTY-2026-10-27-25000-CE"]
    SymbolFormatName:
      type: string
      enum: [auto, canonical, chart, compact, broker]
      default: auto
    Exchange:
      type: string
      enum: [NSE, BSE, NFO, BFO, MCX, CDS]
    CalendarInfo:
      type: object
      required: [asOf, source, coveredYears, covered, verified]
      description: What the answer rests on. `verified` is false when the date is outside the covered years or a row used is not verified.
      properties:
        asOf: { type: [string, "null"], format: date, description: The date of the shipped holiday list. }
        source: { type: [string, "null"] }
        coveredYears: { type: array, items: { type: integer } }
        covered: { type: boolean, description: "False: the date is outside the list, so a weekday is assumed to trade and the answer is not verified." }
        verified: { type: boolean }
        note: { type: [string, "null"], description: Said plainly whenever the answer is not fully verified. }
    CalendarSessionTimes:
      type: object
      required: [preOpen, open, close, verified]
      properties:
        preOpen: { type: string, description: "IST, HH:MM." }
        open: { type: string }
        close: { type: string }
        timezone: { type: string, enum: [IST] }
        verified: { type: boolean, description: "False: the standard hours, not confirmed against a current circular." }
        source: { type: string }
    CalendarHolidays:
      type: object
      required: [exchange, year, holidays, specialSessions, calendar]
      properties:
        exchange: { type: string, enum: [NSE, BSE, NFO, BFO] }
        year: { type: integer }
        holidays:
          type: array
          items:
            type: object
            required: [date, weekday, label, exchanges, verified]
            properties:
              date: { type: string, format: date }
              weekday: { type: string }
              label: { type: string }
              exchanges: { type: array, items: { type: string } }
              verified: { type: boolean }
        specialSessions:
          type: array
          description: Sessions on a day that is otherwise closed or has its own hours (Muhurat trading).
          items:
            type: object
            properties:
              date: { type: string, format: date }
              weekday: { type: string }
              label: { type: string }
              open: { type: [string, "null"] }
              close: { type: [string, "null"] }
              verified: { type: boolean }
        calendar: { $ref: "#/components/schemas/CalendarInfo" }
    CalendarSession:
      type: object
      required: [exchange, date, weekday, isTradingDay, reason, sessionTimes, calendar]
      properties:
        exchange: { type: string, enum: [NSE, BSE, NFO, BFO] }
        date: { type: string, format: date }
        weekday: { type: string }
        isTradingDay: { type: boolean }
        reason: { type: string }
        preOpen:
          oneOf:
            - type: object
              properties:
                start: { type: string }
                end: { type: string }
            - type: "null"
        open: { type: [string, "null"], description: "IST HH:MM; null on a day that does not trade." }
        close: { type: [string, "null"] }
        holiday:
          oneOf:
            - type: object
              properties:
                label: { type: string }
                verified: { type: boolean }
            - type: "null"
        specialSession:
          oneOf:
            - type: object
              properties:
                label: { type: string }
                open: { type: [string, "null"] }
                close: { type: [string, "null"] }
                verified: { type: boolean }
            - type: "null"
        sessionTimes: { $ref: "#/components/schemas/CalendarSessionTimes" }
        previousTradingDay: { type: string, format: date }
        nextTradingDay: { type: string, format: date }
        calendar: { $ref: "#/components/schemas/CalendarInfo" }
    CalendarStatus:
      type: object
      required: [exchange, status, reason, asOf, date, time, sessionTimes, calendar]
      properties:
        exchange: { type: string, enum: [NSE, BSE, NFO, BFO] }
        status: { type: string, enum: [open, pre-open, closed] }
        reason: { type: string }
        closedBecause: { type: [string, "null"], enum: [weekend, holiday, before-open, after-close, null] }
        asOf: { type: string, format: date-time, description: "The Bridge's clock, IST." }
        date: { type: string, format: date }
        time: { type: string, description: "IST HH:MM." }
        opensAt: { type: [string, "null"], format: date-time, description: Pre-open only. Today's open. }
        closesAt: { type: [string, "null"], format: date-time, description: "Open and pre-open only." }
        nextOpen:
          oneOf:
            - type: object
              properties:
                date: { type: string, format: date }
                time: { type: string }
                at: { type: string, format: date-time }
                kind: { type: string, enum: [regular, special] }
                label: { type: [string, "null"] }
            - type: "null"
        sessionTimes: { $ref: "#/components/schemas/CalendarSessionTimes" }
        calendar: { $ref: "#/components/schemas/CalendarInfo" }
    InstrumentKind:
      type: string
      enum: [INDEX, EQ, FUT, OPT]
    Interval:
      type: string
      enum: ["1m", "3m", "5m", "10m", "15m", "30m", "60m", "1d", "1w", "1M"]
    StreamMode:
      type: string
      enum: [ltp, quote, depth]
      default: ltp
    AccountId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,31}$"
    ClientOrderId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
      description: Your own id for an order, unique per account per IST day. The Bridge maps it to the broker's shorter tag field itself.
    CompatReply:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [success, error] }
        message: { type: string }
        mode: { type: string, enum: [analyze], description: "Present while analyzer (paper) mode is on." }
        data: {}
        orderid: { type: [string, "null"] }
      additionalProperties: true
    Freshness:
      type: object
      required: [source, asOf, ageMs, stale, class, delaySec, official, confidence, flags]
      properties:
        source:
          type: string
          enum: [stream, cache, broker, paper, backup, plugin]
          description: "backup = a free provider (named in provider) used because no broker account could answer; it is delayed or end-of-day and unofficial unless its flags say otherwise. plugin = a plugin you granted."
        asOf: { type: string, format: date-time, description: "The source's own timestamp for this value. Never the time the Bridge received it for a delayed or end-of-day source." }
        ageMs: { type: integer, minimum: 0 }
        stale: { type: boolean, description: "Older than the freshness target for this read. Not the same as `class`: a 15-minute delayed quote is `class: delayed` and not stale when you accept data that old." }
        accountId: { type: [string, "null"], description: "Account whose connection supplied the data." }
        broker: { type: [string, "null"] }
        provider: { type: string, description: "Only for sources other than your brokers: the source id that supplied it (for example yahoo, alphavantage, twelvedata, or a plugin's id)." }
        class: { $ref: "#/components/schemas/DataClass" }
        delaySec: { type: integer, minimum: 0, description: "Nominal delay: 0 for real-time, about 900 for 15-minute delayed data; for end-of-day data, how old the close is expected to be." }
        official: { type: boolean, description: "True only for your own broker's data or a documented API from the data's owner." }
        confidence: { $ref: "#/components/schemas/Confidence" }
        flags:
          type: array
          description: "Labels on this value. Open list. Known: `stale`, `unofficial`, `delayed`, `eod`, `plugin`, `last-bar-provisional`."
          items: { type: string }
        revalidating: { type: boolean, description: "Only with ?swr=true: this older value was answered at once and a refresh is running behind it." }
        quiet:
          type: object
          description: "Stream-first option chains only: legs whose last tick is older than the freshness target, used because nothing traded (live subscription, feed ticking now, tick from the current connection, at most market.quietLegMaxAgeMs old). Each such leg carries tickAgeMs. asOf and ageMs describe the live legs and the spot."
          properties:
            legs: { type: integer, minimum: 1 }
            oldestTickAgeMs: { type: integer, minimum: 0 }
            maxAgeMs: { type: integer, minimum: 0 }

    BrokerInfo:
      type: object
      required: [id, name, authKind, capabilities, verified]
      properties:
        id: { type: string }
        name: { type: string }
        authKind: { type: string, enum: [apiKeyToken, oauthRedirect, requestTokenExchange, sessionLogin] }
        capabilities: { type: array, items: { type: string } }
        verified: { type: boolean, description: "Checked end to end against a live account." }
        credentialFields: { type: array, items: { type: string }, description: "Keys to send in SessionConnectRequest.values." }
        loginFields:
          type: array
          description: "sessionLogin brokers only: keys to send in SessionConnectRequest.secrets (used once, never stored)."
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              kind: { type: string, enum: [secret, totp] }
        tokenExpiry: { type: [string, "null"], description: "When the broker's session usually ends, as the broker documents it." }
        loginUrl:
          type: string
          description: "The broker's own login page, with {field} placeholders that are all credentialFields (e.g. {apiKey}). Only for brokers that declare one."
        policy: { $ref: "#/components/schemas/BrokerPolicy" }
    BrokerPolicy:
      type: object
      properties:
        limits:
          type: object
          additionalProperties:
            type: object
            properties:
              perSecond: { type: number }
              perMinute: { type: number }
              perDay: { type: number }
              verified: { type: boolean }
              source: { type: string, format: uri }
        maxQuoteBatch: { type: integer }
        feed:
          type: object
          properties:
            maxConnections: { type: [integer, "null"] }
            maxSubscriptions: { type: [integer, "null"] }
        pooling: { type: string, enum: [allowed, not-allowed, unknown] }
        maxModificationsPerOrder: { type: [integer, "null"] }
    SessionState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [connected, expired, missing, error, checking] }
        expiresAt: { type: [string, "null"], format: date-time }
        checkedAt: { type: [string, "null"], format: date-time }
        message: { type: [string, "null"] }
    AccountSummary:
      type: object
      required: [id, broker, label, enabled, session, liveAllowedByConfig, pooling, capabilities]
      properties:
        id: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        session: { $ref: "#/components/schemas/SessionState" }
        liveAllowedByConfig: { type: boolean }
        liveSources: { type: array, items: { type: string, enum: [rest, webhook, mcp, cli, guard, alert] }, description: "accounts[].live.allowedSources: the tools that may send this account live orders (live still needs liveAllowedByConfig)." }
        pooling: { type: boolean, description: "This account's market-data budget may serve requests that did not name an account." }
        capabilities: { type: array, items: { type: string } }
        authKind: { type: [string, "null"] }
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [broker]
      properties:
        broker: { type: string, description: "An adapter id from GET /v1/brokers, or paper." }
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,31}$", description: "Optional; the Bridge picks one when it is left out." }
        label: { type: string, maxLength: 60, description: "A name you will recognise. Optional." }
        leaveDemo: { type: boolean, description: "Demo mode only: also remove `\"demo\": true` from the config file, so the next start is normal." }

    SessionConnectRequest:
      type: object
      additionalProperties: false
      properties:
        values:
          type: object
          description: Non-secret fields the broker needs (apiKey, clientId, accessToken ...). Stored encrypted.
          additionalProperties: { type: string, maxLength: 4096 }
        secrets:
          type: object
          description: Password/PIN and the current TOTP code for session-login brokers. Used once, never stored.
          additionalProperties: { type: string, maxLength: 256 }

    KeyRecord:
      type: object
      required: [id, label, scopes, accounts, createdAt]
      properties:
        id: { type: string }
        label: { type: string }
        scopes: { type: array, items: { type: string, enum: [read, paper, live, admin] } }
        accounts:
          oneOf:
            - { type: string, const: "*" }
            - { type: array, items: { $ref: "#/components/schemas/AccountId" } }
        allowQuery: { type: boolean }
        clientKind: { type: string, enum: [script, excel, mcp, ui, other] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    CancelAllOpenOrder:
      type: object
      required: [orderId, accountId, mode, external]
      properties:
        orderId: { type: string, description: "The Bridge order id, or the broker's order id for one placed outside the Bridge." }
        accountId: { type: string }
        mode: { type: string, enum: [paper, live] }
        symbol: { type: string }
        side: { type: [string, "null"] }
        quantity: { type: [integer, "null"] }
        status: { type: string }
        external: { type: boolean }
    KeyCreateRequest:
      type: object
      required: [label, scopes]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        scopes: { type: array, minItems: 1, items: { type: string, enum: [read, paper, live, admin] } }
        accounts:
          oneOf:
            - { type: string, const: "*" }
            - { type: array, minItems: 1, items: { $ref: "#/components/schemas/AccountId" } }
        expiresAt: { type: [string, "null"], format: date-time }
        allowQuery: { type: boolean, default: false, description: "Allow ?key= use. Only for keys whose only scope is read." }
        clientKind: { type: string, enum: [script, excel, mcp, ui, other] }
    KeyCreated:
      type: object
      required: [key, record]
      properties:
        key: { type: string, description: "Shown once." }
        record: { $ref: "#/components/schemas/KeyRecord" }

    Instrument:
      type: object
      required: [symbol, exchange, kind, underlying, lotSize, tickSize]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        exchange: { $ref: "#/components/schemas/Exchange" }
        kind: { $ref: "#/components/schemas/InstrumentKind" }
        underlying: { type: string }
        name: { type: [string, "null"] }
        expiry: { type: [string, "null"], format: date }
        strike: { type: [number, "null"] }
        right: { type: [string, "null"], enum: [CE, PE, null] }
        lotSize: { type: integer, minimum: 1 }
        tickSize: { type: number, exclusiveMinimum: 0 }
        freezeQty: { type: [integer, "null"] }
        freezeQtySource:
          type: [string, "null"]
          enum: [master, exchange-list, null]
          description: Where freezeQty came from. "exchange-list" is the Bridge's dated list and is marked needs-verification.
        isin: { type: [string, "null"] }
        refs:
          type: object
          description: Present with include=refs. Keyed by broker id.
          additionalProperties:
            type: object
            properties:
              token: { type: string }
              exchange: { type: string }
              tradingSymbol: { type: [string, "null"] }
    ConvertRequest:
      type: object
      required: [input]
      additionalProperties: false
      properties:
        input: { type: string, maxLength: 64 }
        from: { $ref: "#/components/schemas/SymbolFormatName" }
        exchange: { type: string, maxLength: 12 }
        broker: { type: string }
    ConvertResult:
      type: object
      required: [input, canonical, aliases]
      properties:
        input: { type: string }
        canonical: { $ref: "#/components/schemas/Symbol" }
        aliases:
          type: object
          description: "chart (chart ticker such as NSE:NIFTY1!), compact (symbol and exchange) and, when a broker is given or connected, broker:<id>."
          additionalProperties: { type: [string, "null"] }

    SymbolCandidate:
      type: object
      required: [symbol, exchange, kind, reason]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        exchange: { $ref: "#/components/schemas/Exchange" }
        kind: { $ref: "#/components/schemas/InstrumentKind" }
        name: { type: [string, "null"] }
        expiry: { type: [string, "null"], format: date }
        strike: { type: [number, "null"] }
        right: { type: [string, "null"], enum: [CE, PE, null] }
        lotSize: { type: [integer, "null"] }
        tickSize: { type: [number, "null"] }
        reason: { type: string, description: "Why this instrument matched, in words." }
    SymbolResolution:
      type: object
      required: [input, symbol, instrument, confidence, rule, rules, candidates]
      properties:
        input: { type: string }
        symbol: { $ref: "#/components/schemas/Symbol" }
        instrument: { $ref: "#/components/schemas/Instrument" }
        confidence:
          type: string
          enum: [exact, unique-name]
          description: "`exact`: a symbol form the Bridge reads. `unique-name`: exactly one instrument carries the name."
        rule: { type: string, description: How the answer was reached, in a sentence. }
        rules: { type: array, items: { type: string }, description: "Each spelling that was rewritten (an exchange word, a chart name, a series suffix)." }
        candidates: { type: array, items: { $ref: "#/components/schemas/SymbolCandidate" } }
        steps: { type: array, items: { type: string }, description: "With explain=1: the reading, step by step." }
    SymbolValidation:
      type: object
      required: [input, valid]
      properties:
        input: { type: string }
        valid: { type: boolean }
        symbol: { $ref: "#/components/schemas/Symbol" }
        exchange: { $ref: "#/components/schemas/Exchange" }
        kind: { $ref: "#/components/schemas/InstrumentKind" }
        underlying: { type: string }
        expiry: { type: [string, "null"], format: date }
        strike: { type: [number, "null"] }
        right: { type: [string, "null"], enum: [CE, PE, null] }
        name: { type: [string, "null"] }
        lotSize: { type: integer, minimum: 1 }
        tickSize: { type: number }
        freezeQty: { type: [integer, "null"] }
        tradable: { type: boolean, description: "False for an index: it can be read but not traded." }
        tradableNote: { type: [string, "null"] }
        normalised: { type: boolean, description: "True when the input was written in an alternative spelling that was rewritten." }
        rule: { type: string }
        rules: { type: array, items: { type: string } }
        confidence: { type: string, enum: [exact, unique-name] }
        code: { type: string, enum: [SYMBOL_NOT_FOUND, AMBIGUOUS_SYMBOL, VALIDATION_FAILED], description: "Only when valid is false." }
        message: { type: string, description: "Only when valid is false." }
        candidates: { type: array, items: { $ref: "#/components/schemas/SymbolCandidate" }, description: "Only when valid is false: the closest or the ambiguous matches." }

    LtpItem:
      type: object
      required: [symbol, ltp, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: number }
        freshness: { $ref: "#/components/schemas/Freshness" }
    QuoteItem:
      type: object
      required: [symbol, ltp, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: number }
        open: { type: [number, "null"] }
        high: { type: [number, "null"] }
        low: { type: [number, "null"] }
        close: { type: [number, "null"], description: "Previous close." }
        change: { type: [number, "null"] }
        changePct: { type: [number, "null"] }
        volume: { type: [number, "null"] }
        oi: { type: [number, "null"] }
        bid: { type: [number, "null"] }
        ask: { type: [number, "null"] }
        bidQty: { type: [number, "null"] }
        askQty: { type: [number, "null"] }
        freshness: { $ref: "#/components/schemas/Freshness" }
    DepthLevel:
      type: object
      required: [price, qty]
      properties:
        price: { type: number }
        qty: { type: number }
        orders: { type: [integer, "null"] }
    DepthItem:
      type: object
      required: [symbol, bids, asks, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        bids: { type: array, items: { $ref: "#/components/schemas/DepthLevel" } }
        asks: { type: array, items: { $ref: "#/components/schemas/DepthLevel" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Candle:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time: { type: integer, description: "Bar open time, epoch seconds." }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
        oi: { type: number }
    HistoryResult:
      type: object
      required: [symbol, interval, candles, freshness, partial]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        interval: { $ref: "#/components/schemas/Interval" }
        candles: { type: array, items: { $ref: "#/components/schemas/Candle" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
        partial: { type: boolean, description: "True when the broker could not supply the whole range (history depth limits)." }
    ChainLeg:
      type: object
      required: [symbol]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: [number, "null"] }
        bid: { type: [number, "null"] }
        ask: { type: [number, "null"] }
        oi: { type: [number, "null"] }
        oiChange: { type: [number, "null"] }
        volume: { type: [number, "null"] }
        iv: { type: [number, "null"], description: "Percent." }
        close: { type: [number, "null"], description: "Previous session's close, when the broker sends it." }
        change: { type: [number, "null"], description: "ltp - close; null without a close." }
        delta: { type: [number, "null"] }
        gamma: { type: [number, "null"] }
        theta: { type: [number, "null"] }
        vega: { type: [number, "null"] }
        greeksSource: { type: [string, "null"], enum: [broker, computed, null] }
        brokerIv: { type: [number, "null"], description: "The broker's own IV (percent), when it sent one and ivModel=b76-forward recomputed iv." }
        tickAgeMs: { type: integer, minimum: 0, description: "Stream-first chains only, on a quiet leg (freshness.quiet): how old its last tick is. The figures are its last trade; no tick on a live subscription means no trade since." }
        ivReason:
          type: [string, "null"]
          enum: [SETTLING, NOQUOTE, TICK, INTRINSIC, RANGE, SETTLED, NOFORWARD, null]
          description: >-
            ivModel=b76-forward only: why iv is null. SETTLING = expiry day inside the settlement window and the price within
            2 ticks of intrinsic on the forward; NOQUOTE = no usable price; TICK = price at or below one tick; INTRINSIC = at
            or below discounted intrinsic; RANGE = solved IV outside 1-300 %; SETTLED = past the settlement; NOFORWARD = no
            forward. Null when the IV solved.
    OptionChain:
      type: object
      required: [underlying, expiry, rows, freshness]
      properties:
        underlying: { type: string }
        expiry: { type: string, format: date }
        underlyingLtp: { type: [number, "null"] }
        atmStrike: { type: [number, "null"] }
        lotSize: { type: [integer, "null"] }
        underlyingKind: { type: [string, "null"], enum: [index, stock, null], description: "From the master (OPTSTK vs OPTIDX: the spot row's kind)." }
        settlement: { type: [string, "null"], enum: [cash, physical, null], description: "physical for stock derivatives, cash for index derivatives." }
        strikeStep: { type: [number, "null"], description: "Most common gap between listed strikes of this expiry (inferred); null with fewer than 3 strikes." }
        tickSize: { type: [number, "null"], description: "Largest option tick size of this expiry in the master." }
        rows:
          type: array
          items:
            type: object
            required: [strike]
            properties:
              strike: { type: number }
              ce: { oneOf: [{ $ref: "#/components/schemas/ChainLeg" }, { type: "null" }] }
              pe: { oneOf: [{ $ref: "#/components/schemas/ChainLeg" }, { type: "null" }] }
        freshness: { $ref: "#/components/schemas/Freshness" }
        pricing: { $ref: "#/components/schemas/ChainPricing" }
    ChainPricing:
      type: object
      description: How every leg's IV and Greeks were computed (present with ivModel=b76-forward).
      properties:
        model: { type: string, const: black76-parity-forward }
        ivModel: { type: string, const: b76-forward }
        priceBasis: { type: string, const: mid }
        forward: { type: [number, "null"] }
        forwardSource: { type: [string, "null"], enum: [parity, spot, null] }
        forwardStrikes: { type: integer }
        rate:
          type: object
          properties:
            value: { type: number }
            quality: { type: [string, "null"] }
        clock:
          type: object
          properties:
            version: { type: string }
            mode: { type: string, enum: [weighted, trading, calendar] }
            T: { type: number, description: "Years on the vol-time clock (used inside sigma times root T)." }
            units: { type: number }
            Tcal: { type: number, description: "Calendar years (interest and discounting)." }
            yearBasis: { type: number, description: "Clock units a year; theta is per one unit." }
    StreamStats:
      type: object
      properties:
        clients: { type: integer }
        symbols: { type: integer }
        upstreams:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              broker: { type: string }
              connected: { type: boolean }
              subscriptions: { type: integer }
              limit: { type: [integer, "null"] }
              state: { type: string, enum: [up, stale, down] }
              detail: { type: [string, "null"] }
              reason: { type: [string, "null"] }
              modes: { type: object, additionalProperties: { type: integer } }
              reconnects: { type: integer }
              ticks: { type: integer }
              lastTickAt: { type: [string, "null"], format: date-time }
        downstream:
          type: object
          properties:
            connections: { type: integer }
            maxConnections: { type: integer }
            ws: { type: integer }
            sse: { type: integer }
            queued: { type: integer }
            conflatedTicks: { type: integer }
            slowDisconnects: { type: integer }
            opened: { type: integer }

    Position:
      type: object
      required: [symbol, product, netQty, avgPrice, pnl]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF, CO, BO] }
        netQty: { type: number }
        avgPrice: { type: number }
        ltp: { type: [number, "null"] }
        pnl: { type: number }
        realisedPnl: { type: [number, "null"] }
        unrealisedPnl: { type: [number, "null"] }
        charges: { type: [number, "null"], description: Paper accounts only; estimated brokerage and taxes. }
    Holding:
      type: object
      required: [symbol, qty, avgPrice]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        isin: { type: [string, "null"] }
        qty: { type: number }
        avgPrice: { type: number }
        ltp: { type: [number, "null"] }
        pnl: { type: [number, "null"] }
    Funds:
      type: object
      required: [availableCash, usedMargin]
      properties:
        availableCash: { type: number }
        usedMargin: { type: number }
        totalBalance: { type: [number, "null"] }
        collateral: { type: [number, "null"] }
        withdrawable: { type: [number, "null"] }
        realisedPnl: { type: [number, "null"] }
        unrealisedPnl: { type: [number, "null"] }

    OrderStatus:
      type: string
      enum: [pending, open, trigger_pending, partially_filled, filled, cancelled, rejected, expired, outcome_unknown]
    OrderRequest:
      type: object
      required: [account, symbol, side, product, orderType]
      additionalProperties: false
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer, minimum: 1, description: "Units; must be a multiple of the lot size. Send this or lots." }
        lots: { type: integer, minimum: 1 }
        lotSizeConfirmed: { type: integer, minimum: 1, description: "The lot size (units per lot) the caller has checked; used only when reference lot data is stale or conflicts with the master (preview check LOT_SIZE_STALE)." }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF], description: "No default. `MIS` is read as INTRADAY and `NRML` as MARGIN (case does not matter); the canonical value is in the order and in `meta.normalised`." }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M], description: "No default. `MKT`, `SLM` and `SL_M` are read too." }
        price: { type: number, exclusiveMinimum: 0, description: "Required for LIMIT and SL." }
        triggerPrice: { type: number, exclusiveMinimum: 0, description: "Required for SL and SL-M." }
        validity: { type: string, enum: [DAY, IOC], default: DAY }
        marketProtectionPct: { type: number, exclusiveMinimum: 0, maximum: 10, description: "For MARKET and SL-M; defaults to the configured value." }
        disclosedQuantity: { type: integer, minimum: 0 }
        mode: { type: string, enum: [paper, live], default: paper }
        clientOrderId: { $ref: "#/components/schemas/ClientOrderId" }
        tag: { type: string, pattern: "^[A-Za-z0-9_-]{1,20}$", description: "Strategy label, kept in the audit log and sent to the broker where supported." }
        algoId: { type: string, maxLength: 32, description: "Exchange algo id for a registered strategy, where the broker accepts one." }
        confirmToken: { type: string, description: "From a human confirmation (required for orders prepared by AI assistants)." }
      oneOf:
        - required: [quantity]
          not: { required: [lots] }
        - required: [lots]
          not: { required: [quantity] }
    OrderChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        quantity: { type: integer, minimum: 1 }
        price: { type: number, exclusiveMinimum: 0 }
        triggerPrice: { type: number, exclusiveMinimum: 0 }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
        validity: { type: string, enum: [DAY, IOC] }
    OrderLeg:
      type: object
      required: [quantity, status]
      properties:
        brokerOrderId: { type: [string, "null"] }
        quantity: { type: integer }
        status: { $ref: "#/components/schemas/OrderStatus" }
        error:
          oneOf:
            - type: "null"
            - type: object
              properties:
                code: { type: string }
                message: { type: string }
    OrderResult:
      type: object
      required: [orderId, accountId, broker, mode, symbol, side, quantity, filledQuantity, orderType, product, status, legs, placedAt, updatedAt]
      properties:
        orderId: { type: string, description: "Bridge id: ord_... for live, PAPER-... for paper." }
        clientOrderId: { type: [string, "null"] }
        accountId: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        mode: { type: string, enum: [paper, live] }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer }
        filledQuantity: { type: integer }
        avgPrice: { type: [number, "null"] }
        price: { type: [number, "null"] }
        triggerPrice: { type: [number, "null"] }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF] }
        validity: { type: string, enum: [DAY, IOC] }
        status: { $ref: "#/components/schemas/OrderStatus" }
        brokerStatus: { type: [string, "null"], description: "The broker's own status text." }
        statusMessage: { type: [string, "null"] }
        legs:
          type: array
          description: One leg per broker order (orders above the freeze quantity are sliced).
          items: { $ref: "#/components/schemas/OrderLeg" }
        source: { type: string, enum: [rest, webhook, mcp, cli, system], description: '"system" is used for automatic intraday square-off of paper positions.' }
        tag: { type: [string, "null"] }
        placedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Check:
      type: object
      required: [code, message, severity]
      properties:
        code:
          type: string
          description: >-
            An open set. Codes include the error codes, SAFETY_WARNING, LOT_SIZE_STALE, and (stock derivatives) FNO_BAN (block: an
            opening order in a stock derivative in the F&O ban period; closing orders pass), FNO_BAN_UNCONFIRMED (warn:
            positions could not be read, the broker decides), BAN_DATA_UNAVAILABLE (warn: no ban list loaded) and
            PHYSICAL_SETTLEMENT (warn: from E-4, an opening order in an ITM or close-to-money stock option).
        message: { type: string }
        severity: { type: string, enum: [block, warn] }
    PreviewResult:
      type: object
      required: [ok, mode, checks, requiresHumanConfirmation]
      properties:
        ok: { type: boolean }
        mode: { type: string, enum: [paper, live] }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        margin:
          description: >-
            The margin this order would block. Paper orders (a paper account, or any account in paper mode): the paper
            engine's own model on the exposure the order adds (a quantity that closes a held position blocks nothing),
            the same figure its fill will use. Live orders: null (the broker decides). Each leg of a basket is sized
            alone, with no hedge benefit.
          oneOf:
            - type: object
              required: [required, source]
              properties:
                required: { type: [number, "null"], description: "Rupees." }
                source: { type: [string, "null"], enum: [paper-model, null] }
            - type: "null"
        resolved: { oneOf: [{ $ref: "#/components/schemas/Instrument" }, { type: "null" }] }
        quantity: { type: [integer, "null"] }
        estimatedValue: { type: [number, "null"] }
        ltp: { type: [number, "null"] }
        confirmToken: { type: [string, "null"] }
        confirmExpiresAt: { type: [string, "null"], format: date-time }
        requiresHumanConfirmation: { type: boolean }
        ticketId: { type: [string, "null"], description: "Set when a human must confirm; the ticket appears in GET /v1/tickets (the dashboard's Pending confirmations panel)." }
    TargetOrderRequest:
      type: object
      required: [account, symbol, product, orderType]
      additionalProperties: false
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        symbol: { $ref: "#/components/schemas/Symbol" }
        targetQuantity: { type: integer, minimum: -100000000, maximum: 100000000, description: "Signed units: 100 long, 0 flat, -50 short. Send this or targetLots." }
        targetLots: { type: integer, minimum: -100000, maximum: 100000, description: Signed lots. }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF], description: "MIS and NRML are read as INTRADAY and MARGIN. The position is read for this product." }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
        price: { type: number, exclusiveMinimum: 0 }
        triggerPrice: { type: number, exclusiveMinimum: 0 }
        validity: { type: string, enum: [DAY, IOC] }
        marketProtectionPct: { type: number, exclusiveMinimum: 0, maximum: 10 }
        mode: { type: string, enum: [paper, live], default: paper }
        clientOrderId: { $ref: "#/components/schemas/ClientOrderId" }
        tag: { type: string, pattern: "^[A-Za-z0-9_-]{1,20}$" }
        algoId: { type: string, maxLength: 32 }
        confirmToken: { type: string }
        dryRun: { type: boolean, default: false, description: Work everything out and run the checks; place nothing. }
        openOrders:
          type: string
          enum: [refuse, ignore]
          default: refuse
          description: "refuse: an open order of the Bridge in this symbol and product that can change the position is STATE_CONFLICT (a resting SL or SL-M order does not count). ignore: size against the position only."
      oneOf:
        - required: [targetQuantity]
          not: { required: [targetLots] }
        - required: [targetLots]
          not: { required: [targetQuantity] }
    TargetOrderResult:
      type: object
      required: [account, symbol, product, mode, currentQuantity, targetQuantity, delta, action, dryRun, placed, order]
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        symbol: { $ref: "#/components/schemas/Symbol" }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF] }
        mode: { type: string, enum: [paper, live] }
        lotSize: { type: integer }
        currentQuantity: { type: integer, description: "Signed units held now in this symbol and product." }
        targetQuantity: { type: integer }
        delta: { type: integer, description: "targetQuantity minus currentQuantity." }
        action: { type: string, enum: [BUY, SELL, NONE] }
        dryRun: { type: boolean }
        placed: { type: boolean }
        order: { oneOf: [{ $ref: "#/components/schemas/OrderResult" }, { type: "null" }] }
        preview: { oneOf: [{ $ref: "#/components/schemas/PreviewResult" }, { type: "null" }], description: "With dryRun when an order would be needed." }
        otherProducts:
          type: array
          description: Positions in this symbol in other products. Reported, never added to currentQuantity.
          items:
            type: object
            properties:
              product: { type: string }
              netQty: { type: number }
        openOrders:
          type: array
          description: Open orders of the Bridge in this symbol and product.
          items:
            type: object
            properties:
              orderId: { type: string }
              side: { type: string }
              quantity: { type: integer }
              filledQuantity: { type: integer }
              orderType: { type: string }
              status: { type: string }
        positionFreshness: { oneOf: [{ $ref: "#/components/schemas/Freshness" }, { type: "null" }] }
        replayed: { type: boolean, description: True when this is the first answer returned again for the same idempotency key. }
    OrderBatchRequest:
      type: object
      required: [account, orders]
      additionalProperties: false
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        orders:
          type: array
          minItems: 1
          maxItems: 20
          description: "Orders as for POST /v1/orders, without `account` (a leg may repeat the batch account, no other)."
          items: { type: object }
        stopOnError: { type: boolean, default: false }
        legOrder: { type: string, enum: [as-sent, buys-first], default: as-sent, description: "Order of sending. Results stay in the order sent." }
        mode: { type: string, enum: [paper, live], description: "Applies to every leg that does not set its own." }
    OrderBatchLeg:
      type: object
      required: [index, ok, status]
      properties:
        index: { type: integer }
        ok: { type: boolean }
        status: { type: string, enum: [placed, rejected, outcome_unknown, skipped] }
        orderId: { type: string }
        order: { $ref: "#/components/schemas/OrderResult" }
        replayed: { type: boolean }
        idempotencyKey: { type: string, description: The request key plus the leg index. }
        error:
          type: object
          required: [code, message, status, retryable]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            status: { type: integer }
            retryable: { type: boolean }
            errors: { type: array, items: { type: object } }
            retryAfterMs: { type: integer }
        reason: { type: string, description: "Skipped legs only." }
    OrderBatchResult:
      type: object
      required: [account, ok, summary, results]
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        ok: { type: boolean, description: True only when every leg was placed. }
        summary:
          type: object
          required: [total, placed, rejected, outcomeUnknown, skipped]
          properties:
            total: { type: integer }
            placed: { type: integer }
            rejected: { type: integer }
            outcomeUnknown: { type: integer, description: "Legs whose outcome is not known: check the order book before sending again." }
            skipped: { type: integer }
        stopOnError: { type: boolean }
        legOrder: { type: string }
        results: { type: array, items: { $ref: "#/components/schemas/OrderBatchLeg" } }
        replayed: { type: boolean }
    MarginBasketRequest:
      type: object
      required: [positions]
      additionalProperties: false
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        positions:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [symbol, side]
            additionalProperties: false
            properties:
              symbol: { $ref: "#/components/schemas/Symbol" }
              side: { type: string, enum: [BUY, SELL] }
              quantity: { type: integer, minimum: 1 }
              lots: { type: integer, minimum: 1 }
              product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF], description: "MIS and NRML are read. Default: INTRADAY for shares, MARGIN for futures and options." }
              orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
              price: { type: number, exclusiveMinimum: 0, description: "Default: the last price." }
      description: "`account` is optional: the account whose broker should answer; without it a paper account the key may use is taken."
    MarginBasket:
      type: object
      required: [total, source, account, legs, asOf]
      properties:
        total: { type: number, description: "Rupees, for the basket on its own with hedges between its legs counted." }
        span: { type: [number, "null"] }
        exposure: { type: [number, "null"] }
        hedgeBenefit: { type: [number, "null"], description: "What the legs would need alone, minus total." }
        source: { type: string, enum: [broker, paper-model] }
        account: { $ref: "#/components/schemas/AccountId" }
        legs: { type: integer }
        asOf: { type: string, format: date-time }
        note: { type: [string, "null"], description: "Says plainly when the figure is the approximate paper model, and why." }
        model: { type: [string, "null"] }
        method: { type: [string, "null"] }
        breakdown: { type: [object, "null"], description: "paper-model only: premium, span, exposure, calendar, elm." }
        fallback: { type: array, items: { type: string }, description: "paper-model only: underlyings margined by the simple per-leg rule because no price was available." }
    Ticket:
      type: object
      required: [ticketId, order, source, checks, createdAt, expiresAt]
      properties:
        ticketId: { type: string }
        order: { $ref: "#/components/schemas/OrderRequest" }
        source: { type: string, enum: [mcp, webhook, rest] }
        client: { type: string, description: "Key label or hook label that prepared it." }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        estimatedValue: { type: [number, "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [open, rejected], description: "`open` while it waits for a person; `rejected` once a person declined it." }
        rejectedAt: { type: string, format: date-time, description: "Declined tickets only." }
        reason: { type: [string, "null"], maxLength: 200, description: "Declined tickets only: the person's reason, when they gave one." }
    Trade:
      type: object
      required: [tradeId, orderId, symbol, side, qty, price]
      properties:
        tradeId: { type: string }
        orderId: { type: string }
        accountId: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live] }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        qty: { type: number }
        price: { type: number }
        product: { type: [string, "null"] }
        charges: { type: [number, "null"] }
        tradedAt: { type: [string, "null"], format: date-time }
    PaperAccount:
      type: object
      required: [accountId, startingCapital, funds]
      properties:
        accountId: { $ref: "#/components/schemas/AccountId" }
        startingCapital: { type: number }
        createdAt: { type: string, format: date-time }
        resetAt: { type: [string, "null"], format: date-time }
        ordersToday: { type: integer }
        funds: { $ref: "#/components/schemas/Funds" }
        fillModel: { type: string, description: "Short description of how paper fills are simulated." }

    LimitsReport:
      type: object
      properties:
        safety:
          type: object
          description: Effective safety limits per account (the stricter of global and account values).
          additionalProperties:
            type: object
            properties:
              dailyMaxOrders: { type: integer }
              dailyMaxLoss: { type: number }
              maxOrderValue: { type: number }
              maxLotsPerOrder: { type: integer }
              orderRatePerSecond: { type: number }
        brokers:
          type: object
          additionalProperties: { $ref: "#/components/schemas/BrokerPolicy" }
        client:
          type: object
          description: This key's own request budget.
          properties:
            perSecond: { type: number }
            remaining: { type: number }
        pools:
          type: array
          description: Only with `explain=1`. The shared bucket groups behind the broker accounts.
          items: { $ref: "#/components/schemas/LimitsPool" }
        consumers:
          type: array
          description: Only with `explain=1`. Who is waiting in the fair queue and each one's share.
          items: { $ref: "#/components/schemas/LimitsConsumer" }
    UsageReport:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              broker: { type: string }
              classes:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    used: { type: number }
                    limit: { type: number }
                    queued: { type: integer }
                    resetMs: { type: integer }
        savings:
          type: object
          description: Broker calls avoided today.
          properties:
            servedFromStream: { type: integer }
            servedFromCache: { type: integer }
            coalesced: { type: integer }
            batched: { type: integer }
    DataClass:
      type: string
      enum: [realtime, delayed, eod]
      description: |
        How current an answer is. `realtime`: from your own broker account (or its live stream). `delayed`: the source is
        slow by nature (usually about 15 minutes). `eod`: end-of-day values only. A composite answer (an option chain, a
        many-symbol quote) takes the least current class of its parts. `delayed` is not the same as `freshness.stale`:
        stale means older than the freshness target for that source.
    Confidence:
      type: string
      enum: [high, medium, low]
      description: "How far to trust one value: `high` for a broker or stream value, lower for a delayed or unofficial source or a value carrying flags."
    SourceCapability:
      type: string
      enum: [quotes, history, expiries, optionChain]
      description: What a source can be asked. All four are read-only; no source places orders.
    RequestRoute:
      type: object
      description: |
        What answered a market-data read (`/v1/ltp`, `/v1/quotes`, `/v1/depth`, `/v1/history`, `/v1/expiries`, `/v1/optionchain`), on its entry in `GET /v1/requests`. It is built from the freshness labels the read already returned, so it costs no extra upstream call, and it is one record per request, never a list per symbol. A read of several symbols is summed up: `from` is the least current verdict and `class` the least current data class. Absent for other routes and for a read that answered nothing.
      required: [from, class, delaySec]
      properties:
        from:
          type: string
          enum: [stream, cache, shared, live, stale]
          description: "`stream` = a live subscription answered. `cache` = a value inside its freshness target. `shared` = the read joined a call another caller already had in flight. `live` = a call was made for this read (a broker account or a data source). `stale` = at least one value came from the cache past its freshness target. For several symbols the order is stale, live, shared, cache, stream."
        source: { type: string, description: "Id of the broker or data source that answered; a data source is named before a broker, else the one that answered most items." }
        sourceName: { type: string, description: "A name to show for `source`." }
        class: { type: string, enum: [realtime, delayed, eod], description: "The least current data class among the answers." }
        delaySec: { type: integer, description: "The largest delay among the answers, 0 for real-time." }
    SourceHealth:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [ok, degraded, open, disabled]
          description: "`open` = ejected for now after repeated failures (see nextTryAt); `disabled` = switched off by the Bridge, with the reason in lastError (for example a plugin that crashed four times in ten minutes)."
        errorRate: { type: [number, "null"], description: "Recent share of failed calls, 0 to 1." }
        p50Ms: { type: [number, "null"], description: "Median latency of recent calls." }
        lastError: { type: [string, "null"] }
        lastErrorKind:
          type: string
          enum: [none, auth, rate-limit, not-found, hard]
          description: "What kind of trouble `lastError` was: `auth` the key or login was refused, `rate-limit` the vendor is limiting requests, `not-found` it does not know the symbol, `hard` a timeout, network or server error. `none` when there is no error, or a call has answered since."
        nextTryAt: { type: [string, "null"], format: date-time }
    DataSource:
      type: object
      required: [id, name, kind, tier, enabled, configured, class, delaySec, official, capabilities, limits, usage, health, needsKey]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{1,30}$" }
        name: { type: string }
        kind: { type: string, enum: [broker, free, plugin] }
        tier:
          type: string
          enum: [builtin, byok, opt-in, plugin]
          description: "`builtin` your own broker accounts (on); `byok` you hold the vendor account and a key; `opt-in` unofficial or terms-sensitive, off until you acknowledge a notice; `plugin` third-party code you granted."
        enabled: { type: boolean }
        configured: { type: boolean, description: "Ready to use: it has its key when it needs one." }
        class: { $ref: "#/components/schemas/DataClass" }
        delaySec: { type: [integer, "null"], description: "Typical delay of a delayed source; 0 for real-time; null where it does not apply." }
        official: { type: boolean, description: "True only for a documented API from the data's owner or your own broker. Plugins are never official." }
        capabilities: { type: array, items: { $ref: "#/components/schemas/SourceCapability" } }
        limits:
          type: object
          description: The vendor's documented limits. The Bridge never goes above them.
          properties:
            perSecond: { type: number }
            perMinute: { type: number }
            perDay: { type: number }
        usage:
          type: object
          required: [lastMinute, today]
          properties:
            lastMinute: { type: integer, minimum: 0 }
            today: { type: integer, minimum: 0 }
        health: { $ref: "#/components/schemas/SourceHealth" }
        terms:
          type: object
          description: The vendor's terms. Not present for your own broker accounts.
          properties:
            url: { type: string, format: uri }
            note: { type: string, description: "One plain sentence about what you accept by turning it on." }
        noticeVersion: { type: string, description: "Opt-in sources: the notice version `acknowledge` must equal to turn it on." }
        needsKey: { type: boolean }
        consent:
          type: [object, "null"]
          description: When you acknowledged the notice, or null.
          properties:
            acceptedAt: { type: string, format: date-time }
            noticeVersion: { type: string }
        version: { type: string, description: "Plugins only: the plugin's own version." }
        flags:
          type: array
          items: { type: string }
          description: "Labels every answer from this source carries, for example `plugin`, `unofficial`, `delayed`."
    SourceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: { type: boolean }
        acknowledge: { type: string, maxLength: 64, description: "The source's `noticeVersion`, to turn on an opt-in source." }
    SourcesSettingsUpdate:
      type: object
      additionalProperties: false
      required: [autoFallback]
      properties:
        autoFallback: { type: boolean, description: "Use free sources automatically when your brokers cannot answer a display or analysis read." }
    SourcesSettings:
      type: object
      required: [autoFallback, autoFallbackSource]
      properties:
        autoFallback: { type: boolean }
        autoFallbackSource: { type: string, enum: [setting, config, default] }
        persisted: { type: boolean, description: "False when the choice holds for this run but could not be written to the data folder." }
    SourceConfigRequest:
      type: object
      additionalProperties: false
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 4, maxLength: 500, description: "Never echoed back, logged or written to the configuration file." }
    SourceTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        latencyMs: { type: number }
        detail: { type: string, maxLength: 200 }
    RoutingTrace:
      type: object
      required: [request, considered, class]
      properties:
        request:
          type: object
          properties:
            capability: { $ref: "#/components/schemas/SourceCapability" }
            symbols: { type: array, items: { type: string } }
            purpose: { $ref: "#/components/schemas/Purpose" }
            maxAgeMs: { type: [integer, "null"] }
        considered:
          type: array
          items:
            type: object
            required: [id, kind, verdict, reason]
            properties:
              id: { type: string, description: "A broker account id or a source id." }
              kind: { type: string, enum: [broker, source] }
              verdict: { type: string, enum: [chosen, fallback, skipped] }
              reason: { type: string, description: "Plain words. Do not parse them." }
              score: { type: number }
              spareBudget: { type: number, description: "Share of the candidate's budget that is free right now, 0 to 1." }
              health: { $ref: "#/components/schemas/SourceHealth" }
        class:
          oneOf:
            - { $ref: "#/components/schemas/DataClass" }
            - { type: "null" }
          description: The data class the answer would carry; null when nothing can serve the read.
        note: { type: string }
    Purpose:
      type: string
      enum: [display, analysis, alert, paper, risk, order]
      description: What a read is for. `alert`, `paper`, `risk` and `order` accept only real-time data from your own broker.
    PoolingState:
      type: object
      required: [consent, groups, notice]
      properties:
        consent:
          type: [object, "null"]
          description: Null while pooling is off.
          properties:
            acceptedAt: { type: string, format: date-time }
            version: { type: string }
            accounts: { type: array, items: { type: string } }
        groups:
          type: array
          description: Accounts grouped by holder. Only accounts of one holder are ever pooled.
          items:
            type: object
            required: [holder, accounts]
            properties:
              holder: { type: string }
              accounts:
                type: array
                items:
                  type: object
                  required: [id, label, broker, poolingPolicy, inPool]
                  properties:
                    id: { $ref: "#/components/schemas/AccountId" }
                    label: { type: string, description: "The name you gave the account (its broker's name when you gave none), so a screen need not show the id." }
                    broker: { type: string }
                    poolingPolicy: { type: string, enum: [allowed, not-allowed, unknown], description: "What the broker's published terms say. `not-allowed` is never pooled." }
                    inPool: { type: boolean }
        notice:
          type: object
          required: [version, text]
          properties:
            version: { type: string }
            text: { type: string }
    PoolingConsentRequest:
      type: object
      additionalProperties: false
      required: [acknowledge, accounts]
      properties:
        acknowledge: { type: string, description: "The current `notice.version`." }
        accounts: { type: array, minItems: 1, items: { $ref: "#/components/schemas/AccountId" } }
    QuotaKey:
      type: object
      required: [keyId, label, clientKind, weight, perSecond, burst, perDay, usage, source]
      properties:
        keyId: { type: string }
        label: { type: string }
        clientKind: { type: string, enum: [ui, mcp, excel, script, other] }
        weight: { type: number, minimum: 0, description: "Share in the fair queue against other keys." }
        perSecond: { type: number }
        burst: { type: number }
        perDay: { type: [integer, "null"], description: "Daily request cap; null for none." }
        usage:
          type: object
          required: [lastMinute, today, throttledToday]
          properties:
            lastMinute: { type: integer, minimum: 0 }
            today: { type: integer, minimum: 0 }
            throttledToday: { type: integer, minimum: 0, description: "Requests refused or delayed by this key's own limits today." }
        source: { type: string, enum: [default, config, override] }
    QuotasReport:
      type: object
      required: [default, kinds, keys]
      properties:
        default:
          type: object
          required: [perSecond, burst]
          properties:
            perSecond: { type: number }
            burst: { type: number }
        kinds:
          type: object
          description: Default fair-queue weight by client kind.
          properties:
            ui: { type: number }
            mcp: { type: number }
            excel: { type: number }
            script: { type: number }
            other: { type: number }
        keys: { type: array, items: { $ref: "#/components/schemas/QuotaKey" } }
    QuotaOverride:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        perSecond: { type: number, exclusiveMinimum: 0 }
        burst: { type: number, minimum: 1 }
        weight: { type: number, exclusiveMinimum: 0 }
        perDay: { type: [integer, "null"], minimum: 1 }
    LimitsPool:
      type: object
      required: [group, accounts, spare, ceiling, backoffFactor]
      properties:
        group: { type: string, description: "A shared bucket group: the accounts whose reads draw on the same limit." }
        accounts: { type: array, items: { type: string } }
        spare: { type: number, description: "Free budget right now, in requests per second." }
        ceiling: { type: number, description: "The documented limit the Bridge stays below." }
        backoffFactor: { type: number, description: "1 when healthy; below 1 while the limiter is backing off after a 429." }
    LimitsConsumer:
      type: object
      required: [id, label, queued, inFlight, share]
      properties:
        id: { type: string }
        label: { type: string }
        queued: { type: integer, minimum: 0 }
        inFlight: { type: integer, minimum: 0 }
        share: { type: number, description: "This consumer's fair share of contended capacity, 0 to 1." }
    KillSwitchState:
      type: object
      required: [engaged]
      properties:
        engaged: { type: boolean }
        reason: { type: [string, "null"] }
        by: { type: [string, "null"] }
        at: { type: [string, "null"], format: date-time }
    SafetyStatus:
      type: object
      required: [killSwitch, liveTrading]
      properties:
        killSwitch: { $ref: "#/components/schemas/KillSwitchState" }
        liveTrading: { type: boolean, description: "Global config switch." }
        accounts:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              liveAllowedByConfig: { type: boolean }
              ordersToday: { type: integer }
              realisedPnlToday: { type: number }
              limits: { type: object }
    ReadinessState:
      type: string
      description: "Account trading readiness. Open enum: new values may be added."
      enum: [ready, warn, cannot_trade, paper_only, unknown]
    ReadinessReason:
      type: object
      required: [check, code, severity, message]
      properties:
        check: { type: string, examples: [session, egress, orderRate, dailyOrders, dailyLoss, killSwitch, live, readiness] }
        code:
          type: string
          description: >-
            Open list: LIVE_OFF, SESSION_EXPIRED, SESSION_MISSING, SESSION_ERROR, SESSION_REJECTED, SESSION_EXPIRES_SOON,
            PROBE_FAILED, IP_MISMATCH, IP_NOT_REGISTERED, IP_INVALID_CONFIG, IP_FAMILY_DIFFERS, IP_UNCHECKED,
            IP_LOOKUP_FAILED, CLOCK_SKEW, RATE_CAP_REACHED, BROKER_ORDER_BACKOFF, DAILY_ORDERS_LOW, DAILY_ORDERS_EXHAUSTED,
            DAILY_LOSS_NEAR, DAILY_LOSS_REACHED, KILL_SWITCH, STALE.
        severity: { type: string, enum: [warn, fail] }
        message: { type: string }
    ReadinessCheck:
      type: object
      required: [status]
      additionalProperties: true
      properties:
        status: { type: string, enum: [pass, warn, fail, unknown, n/a] }
    ReadinessAutomation:
      type: object
      required: [id, kind, label, mode, state]
      properties:
        id: { type: string }
        kind: { type: string, examples: [webhook, guard, alert, sample] }
        label: { type: string }
        mode: { type: string, enum: [paper, live] }
        state: { $ref: "#/components/schemas/ReadinessState" }
    AccountReadiness:
      type: object
      required: [accountId, broker, state, reasons, checks, live, simulated, stale]
      properties:
        accountId: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        brokerName: { type: string }
        label: { type: [string, "null"] }
        simulated: { type: boolean, description: "Demo mode: a simulated live account (no real broker)." }
        live:
          type: object
          properties:
            globalLiveTrading: { type: [boolean, string] }
            accountLiveEnabled: { type: [boolean, string] }
            allowedByConfig: { type: boolean }
        state: { $ref: "#/components/schemas/ReadinessState" }
        since: { type: [string, "null"], format: date-time }
        checkedAt: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        reasons: { type: array, items: { $ref: "#/components/schemas/ReadinessReason" } }
        checks:
          type: object
          properties:
            session: { $ref: "#/components/schemas/ReadinessCheck" }
            egress: { $ref: "#/components/schemas/ReadinessCheck" }
            orderRate: { $ref: "#/components/schemas/ReadinessCheck" }
            dailyOrders: { $ref: "#/components/schemas/ReadinessCheck" }
            dailyLoss: { $ref: "#/components/schemas/ReadinessCheck" }
            killSwitch: { $ref: "#/components/schemas/ReadinessCheck" }
        automations: { type: array, items: { $ref: "#/components/schemas/ReadinessAutomation" } }
    Readiness:
      type: object
      required: [overall, summary, accounts, paperOnly, method]
      properties:
        overall: { $ref: "#/components/schemas/ReadinessState" }
        summary: { type: string, examples: ["1 of 2 live accounts cannot trade"] }
        checkedAt: { type: [string, "null"], format: date-time }
        disabled: { type: boolean, description: "readiness.enabled is false." }
        accounts: { type: array, items: { $ref: "#/components/schemas/AccountReadiness" } }
        paperOnly: { type: boolean }
        egress:
          type: object
          description: ip and seenBy only for callers on this computer or with the admin scope.
          properties:
            mode: { type: string, enum: [off, lookup, manual] }
            checkedAt: { type: [string, "null"], format: date-time }
            family: { type: [string, "null"], enum: [ipv4, ipv6, null] }
            seenBy: { type: [string, "null"] }
            ip: { type: [string, "null"] }
            clockSkewMs: { type: [integer, "null"] }
            lastError: { type: [string, "null"] }
        schedule: { type: object, additionalProperties: true }
        automations:
          type: object
          properties:
            total: { type: integer }
            live: { type: integer }
            cannotTrade: { type: integer }
        notifications:
          type: object
          properties:
            targetsListening: { type: array, items: { type: string } }
            warning: { type: [string, "null"] }
            demoOff: { type: boolean }
        method: { type: string }
    ReadinessTransition:
      type: object
      required: [at, accountId, from, to, codes]
      properties:
        at: { type: string, format: date-time }
        accountId: { $ref: "#/components/schemas/AccountId" }
        from: { $ref: "#/components/schemas/ReadinessState" }
        to: { $ref: "#/components/schemas/ReadinessState" }
        codes: { type: array, items: { type: string } }
    AuditRecord:
      type: object
      required: [seq, at, type, actor, source, hash, prevHash]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        type: { type: string, examples: [order.placed, order.refused, key.created, kill_switch.engaged, account.connected] }
        actor:
          type: object
          properties:
            kind: { type: string }
            id: { type: string }
        source: { type: string }
        accountId: { type: [string, "null"] }
        requestId: { type: [string, "null"] }
        data: { type: object }
        prevHash: { type: string }
        hash: { type: string }

    Hook:
      type: object
      required: [id, source, label, account, mode, createdAt]
      properties:
        id: { type: string }
        source: { type: string, enum: [generic, chartink, gocharting] }
        label: { type: string }
        account: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live] }
        requireConfirmation: { type: boolean }
        allowedSymbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        maxLotsPerSignal: { type: integer }
        side: { type: [string, "null"], enum: [BUY, SELL, null] }
        product: { type: [string, "null"], enum: [CNC, INTRADAY, MARGIN, null] }
        orderType: { type: string, enum: [LIMIT, MARKET] }
        allowSourceIps: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        lastSignalAt: { type: [string, "null"], format: date-time }
        readiness:
          description: "Live hooks: the readiness state of the hook's account (orders are refused with CANNOT_TRADE while it is cannot_trade). null for paper hooks."
          oneOf:
            - { $ref: "#/components/schemas/ReadinessState" }
            - { type: "null" }
    HookCreate:
      type: object
      required: [source, label, account]
      additionalProperties: false
      properties:
        source: { type: string, enum: [generic, chartink, gocharting] }
        label: { type: string, minLength: 1, maxLength: 60 }
        account: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live], default: paper }
        requireConfirmation: { type: boolean, default: false }
        allowedSymbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        maxLotsPerSignal: { type: integer, minimum: 1, default: 1 }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN] }
        orderType: { type: string, enum: [LIMIT, MARKET], default: LIMIT }
        side: { type: string, enum: [BUY, SELL], description: "Fix the side for every signal (needed for ChartInk, whose alerts carry no side)." }
        allowSourceIps: { type: array, items: { type: string }, description: "Optional allowlist of sender IP addresses or IPv4 CIDR blocks." }
        acknowledgeUnsignedLive: { type: boolean, default: false, description: "Live mode on an unsigned source (chartink, gocharting) needs allowSourceIps, requireConfirmation or this acknowledgement." }