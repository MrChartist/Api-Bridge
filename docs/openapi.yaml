      operationId: getOrder
      summary: One order (refreshed from the broker for live orders)
      x-stream: S7
      x-scope: read
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/OrderResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Orders]
      operationId: modifyOrder
      summary: Modify an open order
      description: Counts towards the order-rate cap. Brokers limit modifications per order (for example 25); after that, cancel and place again.
      x-stream: S7
      x-scope: paper
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
