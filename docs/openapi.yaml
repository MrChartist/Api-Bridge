        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/hooks/{hookId}/test:
    parameters:
      - name: hookId
        in: path
        required: true
        schema: { type: string, maxLength: 40 }
    post:
      tags: [Webhooks]
      operationId: testHook
      summary: Send a test alert through the real pipeline, as a paper order
      description: |
        Builds a realistic alert for this hook (or reads the one you paste) and runs it through the same parsing, checks and
        order path as a real alert, always as a PAPER order, never needing a confirmation, even on a live hook. Answers 200
        with the outcome, because the test ran; a refusal (an unreadable or stale alert) is an outcome too. A test is not a
        duplicate of an earlier one, does not touch `lastSignalAt`, and is not announced on the event bus. It does not prove
        that TradingView can reach the hook.
      x-module: hooks
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                alert:
                  description: "An alert to run instead of the generated one: the message text, or its JSON object. A passphrase in it is not needed and is dropped."
                  oneOf: [{ type: string }, { type: object }]
                symbol: { type: string, description: "Symbol for the generated alert (default: the hook's first allowed symbol, else NSE:RELIANCE)." }
                side: { type: string, enum: [BUY, SELL, buy, sell] }
                price: { type: number, description: "Price for a LIMIT hook's generated alert (default: the current price)." }
      responses:
        "200":
          description: The outcome of the test.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/HookTestResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

