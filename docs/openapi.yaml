  /v1/analytics/greeks:
    get:
      tags: [Analytics]
      operationId: getAnalyticsGreeks
      summary: Black-Scholes IV and Greeks for one option
      description: Send exactly one of `iv` (percent) or `price` (premium). `rate` is in percent (default 6.5). Pure calculation, no broker call. A `price` below intrinsic value, or one no volatility under 500 % explains, is refused with 400.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: spot, in: query, required: true, schema: { type: number, minimum: 0.01, maximum: 1000000000 } }
        - { name: strike, in: query, required: true, schema: { type: number, minimum: 0.01, maximum: 1000000000 } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [CE, PE] } }
        - { name: days, in: query, required: true, description: Calendar days to expiry (at least 0.25 is used)., schema: { type: number, minimum: 0, maximum: 3650 } }
        - { name: iv, in: query, description: Implied volatility in percent., schema: { type: number, minimum: 0.01, maximum: 500 } }
        - { name: price, in: query, description: Option premium. Must be at least the intrinsic value and explainable by a volatility under 500 %., schema: { type: number, minimum: 0.01, maximum: 1000000000 } }
        - { name: rate, in: query, description: Risk-free rate in percent (default 6.5)., schema: { type: number, minimum: 0, maximum: 100 } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/payoff:
    post:
      tags: [Analytics]
      operationId: postAnalyticsPayoff
      summary: Expiry payoff curve, max profit and loss and break-evens for a multi-leg strategy
      description: Max profit and loss cover every price from 0 up, not just the plotted range, and are null when unbounded. A loss reached only at a price of 0 (long future, short put) is finite and flagged `lossAtZero`. Break-evens are exact. A range and step that give more than 5000 points are refused with 400.
      x-stream: S15
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legs]
              properties:
                legs:
                  type: array
                  minItems: 1
                  maxItems: 12
                  items:
                    type: object
                    required: [type, side, price]
                    properties:
                      type: { type: string, enum: [CE, PE, FUT] }
                      side: { type: string, enum: [buy, sell] }
                      strike: { type: number, exclusiveMinimum: 0, maximum: 1000000000, description: Required for CE and PE. }
                      price: { type: number, minimum: 0, maximum: 1000000000 }
                      lots: { type: integer, minimum: 1, maximum: 10000, default: 1 }
                      lotSize: { type: integer, minimum: 1, maximum: 100000, default: 1 }
                spot: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
                from: { type: number, minimum: 0, maximum: 1000000000 }
                to: { type: number, exclusiveMinimum: 0, maximum: 1000000000, description: Must be greater than `from`. }
                step: { type: number, exclusiveMinimum: 0, description: "The range divided by the step may give at most 5000 points." }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/position-size:
    post:
      tags: [Analytics]
      operationId: postAnalyticsPositionSize
      summary: Lots to trade for a risk budget
      x-stream: S15
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capital, riskPct, entry, stop]
              properties:
                capital: { type: number, exclusiveMinimum: 0, maximum: 1000000000000 }
                riskPct: { type: number, exclusiveMinimum: 0, maximum: 100, description: Percent of capital to risk. }
                entry: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
                stop: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
                lotSize: { type: integer, minimum: 1, maximum: 100000, default: 1 }
                maxLots: { type: integer, minimum: 0, maximum: 10000000 }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/oi-change:
    get:
      tags: [Analytics]
      operationId: getAnalyticsOiChange
      summary: OI change by strike over a window, with build-up classification
      description: >-
        Compares the newest in-memory chain snapshot with the one about `windowMin` minutes earlier (history builds up as this route
        and oi-spurts are called; it is lost on restart). Each strike and side is classed long build-up, short build-up, long unwinding or
        short covering from the option price change against the OI change.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: windowMin, in: query, description: Window in minutes (default 15)., schema: { type: number, minimum: 1, maximum: 1440 } }
        - { name: top, in: query, description: Keep only the biggest absolute OI changes., schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: strikes, in: query, description: Strikes on each side of ATM., schema: { type: integer, minimum: 1, maximum: 100 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/oi-spurts:
    get:
      tags: [Analytics]
      operationId: getAnalyticsOiSpurts
      summary: Strikes whose OI jumped most against a rolling baseline
      description: >-
        Needs at least two snapshots. `multiple` is the newest jump divided by the mean absolute jump of earlier intervals in the
        lookback (null while there is no baseline).
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: lookbackMin, in: query, description: Baseline lookback in minutes (default 60)., schema: { type: number, minimum: 1, maximum: 1440 } }
        - { name: minChangePct, in: query, description: Smallest percent OI jump that counts (default 5)., schema: { type: number, minimum: 0 } }
        - { name: top, in: query, description: Rows to return (default 10)., schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: strikes, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/greeks-grid:
    get:
      tags: [Analytics]
      operationId: getAnalyticsGreeksGrid
      summary: Per-strike delta, gamma, theta, vega and IV for calls and puts, with column totals and peak gamma and vega strikes
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: strikes, in: query, description: Strikes kept on each side of ATM., schema: { type: integer, minimum: 1, maximum: 100 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/synthetic:
    get:
      tags: [Analytics]
      operationId: getAnalyticsSynthetic
      summary: Synthetic future per strike from put-call parity (strike + CE - PE), against spot and futures, with the arbitrage gap
      description: The gap is the synthetic minus the futures price, or minus spot when no futures quote is available (`referenceSource` says which).
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: strikes, in: query, description: Strikes kept on each side of ATM., schema: { type: integer, minimum: 1, maximum: 100 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/straddle:
    get:
      tags: [Analytics]
      operationId: getAnalyticsStraddle
      summary: ATM straddle premium now and its history, with percent change and implied move
      description: History joins the ATM call and put candles on time. Percent change is against the first history point; implied move is straddle premium over spot.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: interval, in: query, schema: { type: string, enum: ["1m", "3m", "5m", "10m", "15m", "30m", "60m"], default: 5m } }
        - { name: countback, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 75 } }
        - { name: width, in: query, schema: { type: integer, minimum: 0, maximum: 10, default: 0 }, description: "0 is the ATM straddle; n is a strangle: the call n strikes above the ATM and the put n below (callStrike and putStrike in the answer)." }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/strategies:
    get:
      tags: [Analytics]
      operationId: getAnalyticsStrategies
      summary: Strategy templates and supported market views
      description: Lists the templates (straddles, strangles, vertical spreads, iron condor and butterfly, butterfly, covered call, protective put) with their default `offset` and `width` (in listed strikes). Pure, no broker call.
      x-stream: S15
      x-scope: read
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/strategies/build:
    get:
      tags: [Analytics]
      operationId: getAnalyticsStrategyBuild
      summary: Build one strategy from the live chain, with payoff and probability of profit
      description: Picks strikes by ATM and `offset`/`width` (counted in listed strikes), prices legs from leg ltp (bid/ask mid if missing), takes lot size from the chain, and returns the legs, max profit and loss, break-evens, net premium and a lognormal probability of profit from ATM IV. Never places an order.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: template, in: query, required: true, description: A template id from /v1/analytics/strategies., schema: { type: string } }
        - { name: offset, in: query, description: Strikes from ATM to the anchor strike (negative is below). Defaults per template., schema: { type: integer, minimum: -20, maximum: 20 } }
        - { name: width, in: query, description: Strikes between legs or to the wings. Defaults per template., schema: { type: integer, minimum: 1, maximum: 20 } }
        - { name: lots, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 1 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/strategies/find:
    get:
      tags: [Analytics]
      operationId: getAnalyticsStrategyFind
      summary: Rank strategies for a market view
      description: Instantiates the templates matching `view` over a small offset/width grid, runs the payoff on each and ranks them by a blend of risk-reward, probability of profit and net credit. Strategies with unbounded risk carry `unboundedRisk` true and are excluded when `maxLoss` is given, as is anything whose max loss exceeds it.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: view, in: query, required: true, schema: { type: string, enum: [bullish, bearish, neutral, volatile, rangebound] } }
        - { name: maxLoss, in: query, description: Maximum loss budget in rupees., schema: { type: number, exclusiveMinimum: 0 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/futures:
    get:
      tags: [Analytics]
      operationId: getAnalyticsFutures
      summary: Futures chain with basis, carry, calendar spreads and roll cost
      description: Each upcoming future (ltp, oi, volume, basis against spot, annualised carry), calendar spreads between consecutive expiries, and the roll cost percent of the nearest pair. Quotes that could not be read are listed in `errors`.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiries, in: query, description: How many upcoming expiries to include (default 3)., schema: { type: integer, minimum: 1, maximum: 6, default: 3 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
