  /hooks/{source}/{token}:
    parameters:
      - name: source
        in: path
        required: true
        schema: { type: string, enum: [generic, chartink, gocharting] }
      - name: token
        in: path
        required: true
        description: The hook's secret token (shown once when the hook is created). It is the only credential ChartInk and GoCharting can carry, since they cannot sign requests.
        schema: { type: string, minLength: 32, maxLength: 128 }
    post:
      tags: [Webhooks]
      operationId: receiveHook
      summary: Inbound alert (signed generic, ChartInk or GoCharting)
      description: |
        Answers within milliseconds (alert services give up after a few seconds) and processes the signal in the background,
        through the same preview and safety checks as any order. The hook decides what an alert may do (account,
        symbols, quantity caps, paper or live, whether a human must confirm). `generic` hooks must send
        `X-MCB-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>">`; requests older than 5 minutes or
        replayed are refused. Served on the public ingress listener when it is enabled.
      x-module: hooks
      x-public: true
      security: []
      parameters:
        - name: X-MCB-Signature
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
          text/plain:
            schema: { type: string }
      responses:
        "202":
          description: Accepted for processing.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, signalId]
                properties:
                  accepted: { type: boolean }
                  signalId: { type: string }
                  duplicate: { type: boolean }
                  dropped: { type: integer, description: Orders in the alert that were dropped before queueing (for example over the per-alert cap). }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/hooks:
    get:
      tags: [Webhooks]
      operationId: listHooks
      summary: List configured hooks (never the token)
      description: An admin key limited to some accounts lists only the hooks of those accounts.
      x-module: hooks
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: Hooks.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Hook" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Webhooks]
      operationId: createHook
      summary: Create a hook; the URL with its token is shown once
      x-module: hooks
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HookCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Hook"
                      - type: object
                        required: [url]
                        properties:
                          url: { type: string, description: "Full hook URL including the secret token. Shown once." }
                          path: { type: string, description: "The URL path alone (for tunnels and public ingress). Shown once." }
                          signingSecret: { type: string, description: "For generic hooks only. Shown once." }
                          templates: { type: object, additionalProperties: true, description: Ready-to-paste alert message templates for this source. }
                          warnings: { type: array, items: { type: string } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/hooks/{hookId}:
    parameters:
      - name: hookId
        in: path
        required: true
        schema: { type: string, maxLength: 40 }
    delete:
      tags: [Webhooks]
      operationId: deleteHook
      summary: Delete a hook (its URL stops working immediately)
      description: An admin key limited to some accounts can delete only the hooks of those accounts; any other hook answers 404.
      x-module: hooks
      x-scope: admin
      x-loopback-only: true
      responses:
        "204":
