  /v1/book:
    get:
      tags: [Book]
      operationId: getBook
      summary: One book per holder, or the family view (never pooled for orders; each leg keeps its account)
      x-stream: S27
      x-scope: read
      description: >-
        Positions and funds of every account this key may see (or the named ones), grouped by holder. Each holder is
        priced only from that holder's own sources (a connected account of the holder with quotes; the paper engine's
        source for paper-only holders; otherwise broker-reported P&L and no Greeks, with the reason). view=family keeps
        the holders whose relationship is inside book.family.relationships and lists the others under outsideFamily.
        Totals add separate accounts on this computer; margin is not shared between accounts. A key limited to some
        accounts gets partial: true. A per-account failure appears in accounts[].error and never fails the response.
        format=csv returns one row per leg.
      parameters:
        - { name: view, in: query, required: false, schema: { type: string, enum: [holders, family], default: holders } }
        - { name: underlying, in: query, required: false, schema: { type: string, examples: [NIFTY] } }
        - { name: account, in: query, required: false, schema: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/AccountId" } }, style: form, explode: true }
        - { name: mode, in: query, required: false, schema: { type: string, enum: [live, paper, all], default: all } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Book" }
                  meta: { $ref: "#/components/schemas/Meta" }
            text/csv:
              schema: { type: string, description: "holder, relationship, inFamily, account, underlying, symbol, qty, avg, mark, markSource, pnl, iv, delta, gamma, theta, vega" }
