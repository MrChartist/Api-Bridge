        - name: withQuotes
          in: query
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/FnoUnderlyingList" }
                  meta: { $ref: "#/components/schemas/Meta" }
