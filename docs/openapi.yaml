  /v1/recordings:
    get:
      tags: [Recordings]
      operationId: listRecordings
      summary: "List recordings (meta.status is a plain status line)"
      description: "A recording saves this Bridge's own real-time data going forward, because brokers give no history for option chains, open interest snapshots or ticks. Every item says dataClass realtime."
      x-module: recorder
      x-scope: read
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The recordings, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Recording" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Recordings]
      operationId: createRecording
      summary: "Start a recording of quotes or an option chain"
      description: "Real-time class only: a dataClass other than realtime is refused, and a delayed or end-of-day answer is never written. everySec is at least 1 for quotes from the live feed (5 or more to read symbols the feed does not carry) and at least 15 for a chain. With sessionOnly (the default) it records only inside market hours, from the market calendar. One file per symbol per IST trading day."
      x-module: recorder
      x-scope: admin
      x-loopback-only: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            example: {"kind":"quotes","symbols":["NSE:RELIANCE","NSE:INFY"],"everySec":5}
            schema: { $ref: "#/components/schemas/RecordingCreate" }
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Recording" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

