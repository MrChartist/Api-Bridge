        - { name: participants, in: query, description: "Comma list of CLIENT, DII, FII, PRO, TOTAL", schema: { type: string } }
        - { name: instruments, in: query, description: "Comma list of IDX_FUT, IDX_CE, IDX_PE, STK_FUT, STK_CE, STK_PE", schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
