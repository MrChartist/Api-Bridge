                          ipPreset: { $ref: "#/components/schemas/HookIpPreset" }
                          templates: { type: array, items: { $ref: "#/components/schemas/HookTemplate" }, description: Ready-to-paste alert message templates for this source (for tradingview a plain alert, a strategy alert and a plain-text alert, with the passphrase filled in). }
