    get:
      tags: [Backup]
      operationId: getBackup
      summary: The last backup, the schedule and the copies kept on this computer
      description: >-
        This computer only, admin key. Lists the archives in the backups folder inside the data folder (name, size, time,
        kind) and the last success or failure. The archives themselves are never served over HTTP.
      x-module: backup
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: Backup status.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/BackupStatus" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Backup]
      operationId: createBackup
      summary: Make a backup now
      description: >-
        This computer only, admin key. Writes one verified archive (tar.gz, mode 600) into the backups folder of the data
        folder and answers with its path on this computer. It holds the settings file, API key records, accounts, safety
        and quota state, source settings, pooling consent, paper books, order records and the audit log. It never holds the
        master key. `secrets.enc` (saved broker logins) is included only with `includeSecrets`, and is useful only with the
        original master key. Emits the bus events `backup.completed` or `backup.failed`.
        Downloads and recordings are left out by default (they are large and can be downloaded or recorded again); send
        `includeData: true` (or set `backup.includeData`) to add them, streamed.
      x-module: backup
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                includeSecrets: { type: boolean, default: false }
                includeData: { type: boolean, description: "Also put the downloads and recordings folders in the backup. Default: the `backup.includeData` setting (false)." }
      responses:
        "200":
          description: The backup was written.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/BackupCreated" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

