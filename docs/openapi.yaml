            example: { maxBudgetShare: 0.4 }
      responses:
        "200":
          description: Saved. The settings now in force.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DownloadSettings" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/downloads/{downloadId}:
    parameters:
      - name: downloadId
        in: path
        required: true
        schema: { type: string, pattern: "^dl_[0-9a-f]{12}$" }
    get:
      tags: [Data downloads]
      operationId: getDownload
      summary: One download job with its progress and items
      x-module: downloads
      x-scope: read
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DownloadJob" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Data downloads]
      operationId: updateDownload
