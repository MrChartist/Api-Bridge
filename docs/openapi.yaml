      responses:
        "200":
          description: Stored. The answer never contains the key.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [configured]
                    properties:
                      configured: { type: boolean, const: true }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/sources/{id}/test:
    post:
      tags: [Sources]
      operationId: testSource
      summary: Check that a source answers
      description: Makes one small call through the source's own `test` (a status or sample request) and reports the result. It counts against the source's quota.
