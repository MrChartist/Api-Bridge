    get:
      tags: [Reference data]
      operationId: getReferenceBundle
      summary: Everything one Options page needs for an underlying
      description: >-
        Session, next and previous trading day, holidays ahead, rate, listed expiries (kind, lot, holiday shift), lots, freeze quantity, ban/MWPL for stocks, events within the banner window, delivery margin for stocks, charges and warnings. Every value carries its source and asOf.
      x-stream: S16
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: exchange, in: query, schema: { type: string, enum: [NFO, BFO] } }
        - { name: demoStale, in: query, description: "Demo mode only: 1 reports lots as 2 trading days old, so the stale banner and ticket confirmation can be tried.", schema: { type: string, enum: ["0", "1"] } }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/RefBundle" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

