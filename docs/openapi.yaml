  /v1/tickets/{ticketId}/confirm:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    post:
      tags: [Orders]
      operationId: confirmTicket
      summary: Human confirmation of an order prepared by an AI assistant or webhook
      description: Used by the Bridge's own confirmation page on this computer. Returns the `confirmToken` that `POST /v1/orders` needs. Tickets expire after about 60 seconds. A ticket a person already declined answers 409 `STATE_CONFLICT` with `state: rejected` and never yields a token.
      x-module: orders
      x-scope: admin
      x-loopback-only: true
      responses:
        "200":
          description: Confirmation token.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [confirmToken, expiresAt]
                    properties:
                      confirmToken: { type: string }
                      expiresAt: { type: string, format: date-time }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/tickets/{ticketId}/reject:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    post:
      tags: [Orders]
      operationId: rejectTicket
      summary: A person declines an order prepared by an AI assistant or webhook
      description: >-
        The "no" that goes with confirm. Only an open ticket can be declined; it leaves the pending list at once and
        can never be confirmed afterwards. Declining a ticket that is already declined is a no-op that answers 200 with
        the same ticket. A ticket that was already confirmed, used to send its order, or has expired answers 409
        `STATE_CONFLICT` with `state` (`confirmed`, `consumed` or `expired`); one the Bridge does not know answers 404.
        The decline is audited (`ticket.rejected`) and announced on the event bus. The assistant that prepared the
        order sees `status: rejected` and the reason (MCP tool `check_order_ticket`). Admin scope, this computer only,
        and not from an AI assistant, a webhook or any other automation.
      x-module: orders
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 200, description: "Optional, in the person's own words. The assistant that prepared the order can read it." }
      responses:
        "200":
          description: The declined ticket (`status: rejected`).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Ticket" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "409":
          description: The ticket is not open any more. `state` says why (`confirmed`, `consumed`, `expired`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

