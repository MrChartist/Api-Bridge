                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/pooling:
    get:
      tags: [Pooling]
      operationId: getPooling
      summary: Whether market-data reads may be spread over your own accounts
      description: |
        Pooling is off until you accept the notice. Accounts are grouped by holder; only accounts of one holder are
        ever pooled, only read-only market data is pooled, and orders always go through the account they belong to. An
        account whose broker's policy is `not-allowed` is never pooled.
      x-module: sources
      x-scope: read
      responses:
        "200":
          description: Pooling state.
          content:
            application/json:
              schema:
                type: object
