    post:
      tags: [Orders]
      operationId: confirmTicket
      summary: Human confirmation of an order prepared by an AI assistant or webhook
      description: "Used by the Bridge's own confirmation page on this computer. Returns the `confirmToken` that `POST /v1/orders` needs. Tickets expire after about 60 seconds. A ticket a person already declined answers 409 `STATE_CONFLICT` with `state: rejected` and never yields a token."
      x-module: orders
