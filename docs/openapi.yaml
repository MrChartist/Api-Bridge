      operationId: getAnalyticsInsiders
      summary: NSE insider-trading (SEBI PIT) disclosures with a net insider buying summary
      description: From the NSE public site (meta.source is "nse"). Each row has person category, acquisition or disposal, securities, value in INR crore, mode and date. Cached for five minutes per query.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: symbol, in: query, description: NSE ticker., schema: { type: string, maxLength: 20 } }
        - { name: days, in: query, description: Calendar days back., schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
