                includeExternal: { type: boolean, default: false }
      responses:
        "200":
          description: Kill switch state.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/KillSwitchState" }
                  meta: { $ref: "#/components/schemas/Meta" }
