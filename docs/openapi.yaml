                properties:
                  data:
                    type: object
                    required: [underlying, expiries, freshness]
                    properties:
                      underlying: { type: string }
                      expiries: { type: array, items: { type: string, format: date } }
                      freshness: { $ref: "#/components/schemas/Freshness" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/optionchain:
    get:
      tags: [Market data]
      operationId: getOptionChain
      summary: Option chain with IV and Greeks
      description: Works for every F&O stock; see /v1/options/underlyings.
      x-stream: S5
      x-scope: read
      parameters:
        - name: underlying
          in: query
          required: true
          schema: { type: string, maxLength: 30 }
        - name: expiry
          in: query
          required: true
          schema: { type: string, format: date }
        - name: strikes
          in: query
          description: Strikes on each side of ATM (default all).
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: greeks
          in: query
          schema: { type: boolean, default: true }
        - name: ivModel
          in: query
          description: >-
            b76-forward: every leg's IV and Greeks from Black-76 on the 5-strike parity forward, mid prices and the
            vol-time clock (theta per trading-day unit), the broker's own IV kept as brokerIv, and a chain-level
            pricing object. legacy-bs-spot: Black-Scholes on spot with calendar days (theta per calendar day). Default:
            market.chain.ivModelDefault (legacy-bs-spot until 2027-05-01); a response that used the legacy default
            carries Deprecation and Link headers.
          schema: { type: string, enum: [b76-forward, legacy-bs-spot] }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
        - $ref: "#/components/parameters/Swr"
        - $ref: "#/components/parameters/ReadPriority"
      responses:
        "200":
          description: Chain.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/OptionChain" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/snapshots:
    get:
      tags: [Options data]
      operationId: getOptionSnapshots
      summary: Recorded option-chain snapshots for one expiry over a time range
      description: >-
        Snapshots recorded by the Bridge (every minute for indices, every 5 minutes for opted-in stocks), with gaps
        (never filled) and coverage. When nothing was ever recorded for the chain the answer is 200 with no snapshots
        and `unavailable` saying why. Account ids are null unless the key may use that account.
      x-stream: S17
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: from, in: query, schema: { type: string }, description: "IST date, IST date-time or epoch seconds. Default: today's session start." }
        - { name: to, in: query, schema: { type: string }, description: "Default: now. At most 31 days after from." }
        - name: fields
          in: query
          description: Comma-separated leg fields.
          schema: { type: string, default: "ltp,oi,volume,iv", pattern: "^(ltp|bid|ask|bidQty|askQty|oi|volume|iv|delta|gamma|age)(,(ltp|bid|ask|bidQty|askQty|oi|volume|iv|delta|gamma|age))*$" }
        - { name: strikes, in: query, schema: { type: integer, minimum: 1, maximum: 60 }, description: "Strikes each side of each snapshot's ATM. Default: all recorded." }
        - { name: every, in: query, schema: { type: integer, enum: [1, 3, 5, 15, 30, 60], default: 1 }, description: "Minutes; the last snapshot of each bucket." }
        - { name: includeSuspect, in: query, schema: { type: boolean, default: false } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 400 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Snapshots, gaps and coverage (CSV when format=csv, with X-MCB-Next-Cursor when more pages exist).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/OptionSnapshotPage" }
                  meta: { $ref: "#/components/schemas/Meta" }
            text/csv:
              schema: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/snapshots/latest:
    get:
      tags: [Options data]
      operationId: getLatestOptionSnapshot
      summary: The most recent recorded snapshot of one chain (today, from memory)
      x-stream: S17
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: fields, in: query, schema: { type: string, default: "ltp,oi,volume,iv" } }
        - { name: strikes, in: query, schema: { type: integer, minimum: 1, maximum: 60 } }
      responses:
        "200":
          description: Latest snapshot. 404 NOT_FOUND when none was recorded today.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [underlying, expiry, snapshot]
                    properties:
                      underlying: { type: string }
                      expiry: { type: string, format: date }
                      exchange: { type: [string, "null"] }
                      units: { $ref: "#/components/schemas/SnapshotUnits" }
                      fields: { type: array, items: { type: string } }
                      snapshot: { $ref: "#/components/schemas/OptionSnapshot" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/daily:
    get:
      tags: [Options data]
      operationId: getOptionDaily
      summary: Daily derived option statistics (PCR, max pain, largest OI, top OI changes, futures basis)
      x-stream: S17
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, schema: { type: string, format: date } }
        - { name: from, in: query, schema: { type: string, format: date }, description: "Default: 30 days before to." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Default: today. At most 3 years after from." }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        "200":
          description: Daily rows, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [underlying, rows]
                    properties:
                      underlying: { type: string }
                      rows: { type: array, items: { $ref: "#/components/schemas/OptionDailyRow" } }
                  meta: { $ref: "#/components/schemas/Meta" }
            text/csv:
              schema: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/recorder:
    get:
      tags: [Options data]
      operationId: getRecorderStatus
      summary: Recorder state, feeding account, plan, budget, coverage and disk use
      x-stream: S17
      x-scope: read
      parameters:
        - name: feasibility
          in: query
          required: false
          description: "true adds `feasibility`: which brokers can record what with the default settings (one row per broker, generated from the code)."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/RecorderStatus" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/recorder/plan:
    post:
      tags: [Options data]
      operationId: planRecorder
      summary: Check what a recorder configuration would record on its data account (no changes made)
      x-stream: S17
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecorderConfig" }
      responses:
        "200":
          description: The plan and a plain-language verdict.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/RecorderPlanResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/options/recorder/config:
    put:
      tags: [Options data]
      operationId: setRecorderConfig
      summary: Save the recorder configuration (refused when the data account cannot carry it)
      description: >-
        Merged over the current `recorder` section, validated and planned. 422 CAPACITY_EXCEEDED (with canCarry and
        refused) when the account cannot carry it, and nothing is saved; 422 CONFIRMATION_REQUIRED when the NSE website
        backup is turned on without acknowledgeNseTerms. Saved to bridge.config.json and applied at once; in demo mode
        the change applies in memory only (persisted false).
      x-stream: S17
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/RecorderConfig" }
                - type: object
                  properties:
                    acknowledgeNseTerms: { type: boolean, description: "Required true to turn on sources.nseBackup." }
      responses:
        "200":
          description: Saved and applied; the new status.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    properties:
                      persisted: { type: boolean }
                      status: { $ref: "#/components/schemas/RecorderStatus" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/stream:
    get:
      tags: [Streaming]
      operationId: openStream
      summary: WebSocket stream (upgrade)
      description: |
        Connect with `ws://127.0.0.1:4300/v1/stream?token=<stream token>` (or an `Authorization` header from scripts).
        Client messages: `{"op":"subscribe","symbols":[...],"mode":"ltp|quote|depth"}`, `{"op":"unsubscribe",...}`,
        `{"op":"subscribe_orders"}`, `{"op":"ping"}`. Server messages: `snapshot`, `tick` (with a per-connection `seq`),
        `order`, `status` (upstream connected or stale), `error`, `heartbeat` every 15 s and `go_away` before a restart.
        A gap in `seq` means re-subscribe for a fresh snapshot. Full message schemas: docs/asyncapi.yaml (stream S6).
      x-stream: S6
      x-websocket: true
      security: []
      parameters:
        - name: token
          in: query
          schema: { type: string }
      responses:
        "101":
          description: Switching to the WebSocket protocol.
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/stream/sse:
    get:
      tags: [Streaming]
      operationId: openSse
      summary: Server-Sent Events stream (same messages as the WebSocket)
      description: "`GET /v1/stream/sse?token=<stream token>&symbols=NSE:NIFTY,NSE:RELIANCE&mode=ltp`. Each event's `id` is its `seq`; a reconnect gets a fresh snapshot first."
      x-stream: S6
      security: []
      parameters:
        - name: token
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Symbols"
        - name: mode
          in: query
          schema: { $ref: "#/components/schemas/StreamMode" }
        - name: orders
          in: query
          description: "1 to also receive `order` messages for the accounts the key may use. The key may instead be sent in an Authorization header."
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/stream/stats:
    get:
      tags: [Streaming]
      operationId: getStreamStats
      summary: Upstream feeds, subscriptions and clients
      x-stream: S6
      x-scope: read
      responses:
        "200":
          description: Stats.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/StreamStats" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/positions:
