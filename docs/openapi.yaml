        needs "guard" in the account's live.allowedSources. Bracket and position triggers are reduce-only. AI
        assistant keys and a Python strategy's own per-run key cannot set triggers (SCOPE_REQUIRED). A trigger keeps
        firing after the key that set it is revoked or expires (protective stops stay on); cancel it to stop it.
      x-stream: S25
      x-scope: paper
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerInput" }
      responses:
        "200":
          description: The new trigger.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Trigger" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

