                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Safety]
      operationId: releaseKillSwitch
      summary: Release the kill switch (admin, this computer only)
      x-stream: S9
      x-scope: admin
      x-loopback-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              additionalProperties: false
              properties:
                confirm: { type: string, const: RELEASE }
      responses:
