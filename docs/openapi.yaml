components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Bridge API key: `mcb_<keyId>_<secret>`."
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Only on /xl/*, only for read-only keys created with --allow-query.

  headers:
    IdempotencyReplayed:
      description: "`true` when this response is the stored result of an earlier request with the same Idempotency-Key."
      schema: { type: string, enum: ["true"] }
    RateLimit:
      description: Remaining client budget (IETF RateLimit header draft).
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  parameters:
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AccountId" }
    AccountQuery:
      name: account
      in: query
      required: true
      description: "The account id from your config (`GET /v1/accounts` lists them). Always required here, even with one account: the Bridge never guesses whose positions, holdings or funds to show, and answers 400 VALIDATION_FAILED without it."
      schema: { $ref: "#/components/schemas/AccountId" }
    AccountQueryOptional:
      name: account
      in: query
      description: Pin the request to this account. Without it, market data may be served from any of your accounts that allow pooling.
      schema: { $ref: "#/components/schemas/AccountId" }
    ModeQuery:
      name: mode
      in: query
      description: "`paper` reads the account's paper book; `live` the broker's (default for portfolio reads)."
      schema: { type: string, enum: [paper, live], default: live }
    Symbols:
      name: symbols
      in: query
      required: true
      description: Comma-separated symbols (up to 200).
      schema: { type: string, maxLength: 8000 }
    SymbolQuery:
      name: symbol
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Symbol" }
    XlFormat:
      name: format
      in: query
      description: "csv (default, CRLF), tsv (tab separated, LF) or json (array of records)."
      schema: { type: string, enum: [csv, tsv, json], default: csv }
    XlCache:
      name: cache
      in: query
      description: "1 opts in to `Cache-Control: private, max-age=N` (N from `integrations.xl.cacheSeconds`, default 5) and an `ETag`. Default is `no-store`."
      schema: { type: boolean, default: false }
    XlErrors:
      name: errors
      in: query
      description: "`200` answers a refusal (wrong key, rate limit, bad request) with HTTP 200 and the same one-row table (`status,code,message,retry_after_s`), whose `status` column still holds the real status. For WEBSERVICE in Excel, which shows #VALUE! for any other HTTP status and so cannot show the reason. Leave it out everywhere else."
      schema: { type: string, enum: ["200"] }
    Backup:
      name: backup
      in: query
      description: >-
        Unpinned reads only. true lets a read that no broker account can answer fall back to the free backup sources
        (Yahoo Finance, NSE website; freshness.source "backup", delayed); false never does. Default from config
        (`sources.autoFallback`). Never available for order, risk, paper or alert purposes, and not accepted on `/xl/*`
        (a bare value cannot say how current it is) or the compat API (it never uses backup sources).
      schema: { type: boolean }
    MaxAge:
      name: maxAgeMs
      in: query
      description: Oldest data you accept, in ms. 0 forces a live read (still within rate limits). Default depends on the endpoint (LTP 1000, quotes 2000, chain 3000).
      schema: { type: integer, minimum: 0, maximum: 3600000 }
    Swr:
      name: swr
      in: query
      description: Stale-while-revalidate. When only an older cached value exists (inside market.stale.maxStaleMs), answer with it at once, labelled `freshness.stale` and `freshness.revalidating`, and refresh it in the background (one refresh however many readers ask).
      schema: { type: boolean, default: false }
    ReadPriority:
      name: priority
      in: query
      description: "`background` for a prefetch: it waits behind every interactive read, and a read for the same thing joins it and raises its priority. Reads never run at order priority."
      schema: { type: string, enum: [interactive, background], default: interactive }
    Purpose:
      name: purpose
      in: query
      description: |
        What the read is for. `alert`, `paper`, `risk` and `order` accept only real-time data from your own broker; a
        delayed or end-of-day source is never used for them. `display` (default) and `analysis` accept any labelled
        source. A caller's `maxAgeMs` also filters: a source whose delay exceeds it cannot answer.
      schema: { $ref: "#/components/schemas/Purpose" }
    SourceIdPath:
      name: id
      in: path
      required: true
      description: A source id from `GET /v1/sources`.
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,30}$" }
    KeyIdPath:
      name: keyId
      in: path
      required: true
      description: The key id (not the secret) from `GET /v1/keys`.
      schema: { type: string, maxLength: 64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `meta.nextCursor`.
      schema: { type: string, maxLength: 512 }
    ListLimit:
      name: limit
      in: query
      description: "Page size, 1 to 500. Without it the whole list comes back (`meta.nextCursor` is then null). With it, send `meta.nextCursor` as `cursor` for the next page."
      schema: { type: integer, minimum: 1, maximum: 500 }
    Strict:
      name: strict
      in: query
      description: "`true` refuses a query parameter this route does not know (400 VALIDATION_FAILED, with a \"did you mean\" hint) instead of ignoring it. Without it the read goes ahead and the answer has `X-MCB-Ignored-Params` (and `X-MCB-Param-Hint`) naming what was ignored."
      schema: { type: boolean, default: false }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Your unique id for this write (UUID recommended). A retry with the same key and the same body returns the first
        result with `Idempotency-Replayed: true`; a different body is refused with 409 IDEMPOTENCY_KEY_REUSED; a retry
        while the first is still running gets 409 IDEMPOTENCY_IN_PROGRESS. Keys are kept until the end of the IST
        trading day and at least 24 hours. For POST /v1/orders, `clientOrderId` in the body works the same way when the
        header is absent.

        The create routes that are not orders honour it too, with the same rules: keys, accounts, hooks, notify targets,
        collections (create, import, duplicate), downloads, dataset updates, subscriptions, recordings, recording rules and
        recording presets. For these the stored answer is kept in memory for 24 hours and is forgotten on restart, and a
        request that failed is forgotten at once so it can be retried. The compat order routes (`/api/v1/placeorder` and the
        other order writes) honour it too, and a client that cannot set headers may send `idempotency_key` in the body.
        Every other write route ignores the header, whatever its value, and says so with `Idempotency-Ignored: true` in the
        answer; a malformed key is a 400 only on a route that uses it.
      schema: { type: string, minLength: 8, maxLength: 255, pattern: "^[A-Za-z0-9_.:-]+$" }
    EventTopics:
      name: topics
      in: query
      description: 'Comma-separated topic filters: a topic, a prefix such as `order.*`, or `*` (default).'
      schema: { type: string, maxLength: 1000 }
    EventSince:
      name: since
      in: query
      description: "A cursor (an event `id`). Events after it are replayed first, then live ones. `0` = everything kept. Without it the stream is live only; SSE also reads `Last-Event-ID`."
      schema: { type: string, pattern: '^\d{1,15}$' }
    EventAccounts:
      name: accounts
      in: query
      description: Only events about these accounts (comma-separated). A key never sees more than its own accounts.
      schema: { type: string, maxLength: 3200 }
    SubscriptionIdPath:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, pattern: '^sub_[a-z2-7]{8}$' }

  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit: { $ref: "#/components/headers/RateLimit" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    PaperDailyPnl:
      type: object
      required: [day, at, source, equity, pnl]
      properties:
        day: { type: string, format: date }
        at: { type: string, description: When the row was taken (IST, +05:30). }
        source: { type: string, enum: [eod, manual] }
        equity: { type: number }
        realised: { type: number }
        unrealised: { type: number }
        charges: { type: number }
        pnl: { type: number, description: The day's change in equity (from the previous row, or the starting capital after a reset). }
        usedMargin: { type: [number, "null"] }
        openPositions: { type: integer }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string, format: uri, description: "A stable name for the problem, `https://bridge.mrchartist.local/errors/<code in lower case, words joined by dashes>` (VALIDATION_FAILED is `.../validation-failed`). It is an identifier, not a page: the explanation for each code is in docs/api/errors.md and `GET /v1/errors`. Switch on `code`." }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: "Human text. Do not parse it." }
        code: { $ref: "#/components/schemas/ErrorCode" }
        retryable: { type: boolean, description: "Safe to send exactly this request again (after Retry-After)." }
        requestId: { type: string }
        retryAfterMs: { type: integer, description: "Throttling refusals: when to try again, in ms. Same time as Retry-After, finer." }
        scope:
          type: string
          enum: [client, upstream, queue, consumer-cap]
          description: |
            Throttling refusals only: which limit tripped. `client`: this API key's own quota. `upstream`: the broker's
            (or source's) limit, shared by everyone. `queue`: the Bridge's queue for that account is full or could not
            start the request before its deadline. `consumer-cap`: this consumer already has its share of the queue.
            Read this and `limit`, not `detail`.
        limit:
          type: object
          description: "Throttling refusals only: the limit that tripped."
          required: [name, remaining, resetMs]
          properties:
            name: { type: string, description: "The budget that tripped. For a refusal of your own key (`scope: client`): `perSecond`, `perDay` or `concurrency`. Other scopes name their own budget; switch on `scope` and `retryAfterMs`, not on this text." }
            remaining: { type: number, description: "What is left of it now (0 when it tripped)." }
            resetMs: { type: integer, minimum: 0, description: "Time until it has room again." }
        broker:
          type: object
          description: The broker's own error, when one caused this.
          properties:
            id: { type: string }
            code: { type: string }
            message: { type: string }
        errors:
          type: array
          description: "VALIDATION_FAILED: one entry per problem field. Branch on `code`, show `message`."
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string, description: "The field, with dots for nesting (order.qty); (root) for the body as a whole and (request) for a request the broker refused." }
              code:
                type: string
                enum: [required, invalid_type, invalid_enum, invalid_value, too_small, too_big, invalid_format, unknown_field, invalid, broker_rejected]
                description: "What is wrong, for programs. New codes may be added. Not every route fills it yet: an entry without a code is read by its message."
              message: { type: string, description: "Plain words for a person." }
              allowed: { type: array, items: {}, description: "With invalid_enum: the values that are accepted." }
        unknownSymbols:
          type: array
          description: "VALIDATION_FAILED on POST /v1/downloads and POST /v1/recordings: each symbol the Bridge does not know, why, and the closest real symbols."
          items:
            type: object
            properties:
              symbol: { type: string }
              reason: { type: string }
              expired: { type: boolean, description: "True when the contract existed but has expired (downloads accept it with allowExpired: true)." }
              suggestions: { type: array, items: { type: string } }
        candidates:
          type: array
          description: "AMBIGUOUS_SYMBOL (the instruments the name could mean) and SYMBOL_NOT_FOUND on /v1/symbols/resolve (the closest names)."
          items: { $ref: "#/components/schemas/SymbolCandidate" }
        rule: { type: string, description: "With candidates: why nothing was picked." }
        ticketId: { type: string, description: "STATE_CONFLICT on a ticket route only: the ticket." }
        state:
          type: string
          enum: [rejected, confirmed, consumed, expired]
          description: "STATE_CONFLICT on a ticket route only: why it cannot be confirmed or declined. Read this, not `detail`."
    ErrorCode:
      type: string
      description: Stable codes; new ones may be added. Source of truth server/bridge/core/errors.mjs.
      enum:
        - VALIDATION_FAILED
        - INVALID_JSON
        - UNAUTHENTICATED
        - SCOPE_REQUIRED
        - ACCOUNT_FORBIDDEN
        - HOST_NOT_ALLOWED
        - ORIGIN_NOT_ALLOWED
        - LOOPBACK_ONLY
        - NOT_FOUND
        - ACCOUNT_NOT_FOUND
        - SYMBOL_NOT_FOUND
        - AMBIGUOUS_SYMBOL
        - ORDER_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - DUPLICATE_CLIENT_ORDER_ID
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CAPABILITY_UNSUPPORTED
        - INVALID_ORDER
        - SESSION_EXPIRED
        - POSITION_UNKNOWN
        - CONFIRMATION_REQUIRED
        - STATE_CONFLICT
        - PAPER_ONLY
        - ORDER_GATE_CLOSED
        - DAILY_LIMIT_REACHED
        - MARKET_CLOSED
        - KILL_SWITCH_ACTIVE
        - CANNOT_TRADE
        - RATE_LIMITED
        - ORDER_RATE_LIMITED
        - UPSTREAM_RATE_LIMITED
        - SUBSCRIPTION_LIMIT
        - DISK_FULL
        - ORDER_STATE_DAMAGED
        - INTERNAL
        - NOT_IMPLEMENTED
        - UPSTREAM_ERROR
        - BROKER_UNAVAILABLE
        - UPSTREAM_TIMEOUT
        - OUTCOME_UNKNOWN
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
        nextCursor: { type: [string, "null"], description: "Present on list endpoints; null on the last page." }
        accountId: { type: [string, "null"] }
        mode: { type: string, enum: [paper, live] }
        freshness: { $ref: "#/components/schemas/Freshness" }
        normalised:
          type: array
          description: "Orders and margin: each word of the request that was read in its canonical form (MIS as INTRADAY). Absent when nothing was changed."
          items:
            type: object
            required: [field, from, to]
            properties:
              field: { type: string }
              from: { type: string }
              to: { type: string }
        demo: { type: boolean, description: "Demo mode only: true. The data is generated sample data, not live market data (every response also carries the header X-MCB-Data: demo)." }
        dataNotice: { type: string, description: "Demo mode only: a plain sentence saying so." }
        count: { type: integer, description: "Lists that are not paged: how many items there are." }
        total: { type: integer, description: "Lists: how many items match, before paging." }
        kept: { type: integer, description: "GET /v1/requests: how many recent requests the Bridge keeps." }
        resolvedAt: { type: string, format: date-time, description: "Collection resolution: when the symbols were worked out." }
        manifestUrl: { type: string, description: "Download files: where the job's manifest is." }
        patterns: { type: string, description: "Event topics: how a topic filter may be written." }
        state: { type: string, description: "Tickets: which state the list was filtered to." }
        status: { type: string, description: "Recordings: the plain status sentence (\"Recording today: 3 rules, ...\")." }
        dataClass: { type: string, enum: [realtime, delayed, eod], description: "Recordings and their files: the data class of what was saved." }
        layout: { type: string, description: "Recording files: how the files are laid out (one file per trading day)." }
        auto: { type: boolean, description: "Recording rules: whether auto-record is switched on." }
    ItemError:
      type: object
      required: [code, message]
      properties:
        symbol: { type: string }
        orderId: { type: string }
        input: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
    Ready:
      type: object
      required: [ready]
      properties:
        ready: { type: boolean }
        reasons:
          type: array
          description: For callers on this computer.
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [starting, storage_critical] }
              message: { type: string }
              jobs: { type: array, items: { type: object } }
    Health:
      type: object
      required: [status, version, apiVersion]
      properties:
        status: { type: string, enum: [ok, degraded], description: "`degraded` when something needs attention: little free disk space, a file that could not be saved, a damaged file set aside, the order records damaged, or the kill switch on. The HTTP status stays 200; callers on this computer see `problems`." }
        version: { type: string }
        apiVersion: { type: string }
        problems:
          type: array
          description: For callers on this computer. What is wrong, in plain words. Empty when status is ok.
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [storage_low, storage_critical, write_errors, data_quarantined, order_state_damaged, kill_switch_on] }
              message: { type: string }
        storage:
          type: object
          description: For callers on this computer. Free space on the data folder's disk and how many files could not be saved.
          properties:
            level: { type: string, enum: [ok, low, critical] }
            freeMb: { type: [integer, "null"] }
            totalMb: { type: [integer, "null"] }
            minFreeMb: { type: integer }
            hardFreeMb: { type: integer }
            checkedAt: { type: [string, "null"], format: date-time }
            writeErrors:
              type: object
              properties:
                open: { type: integer, description: "Files that could not be written and have not been written since." }
                total: { type: integer, description: "Failed writes since the Bridge started." }
                last: { type: [object, "null"] }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer }
        sources:
          type: object
          description: How many data sources there are and how many are switched on.
          properties:
            enabled: { type: integer }
            total: { type: integer }
            autoFallback: { type: boolean }
        demo: { type: boolean, description: "Present and true only in demo mode (sample data, no real broker)." }
        dataNotice: { type: string, description: "In demo mode: a plain sentence saying the data is sample data." }
        services:
          type: object
          additionalProperties: { type: string, enum: [ready, not_built] }
        backup:
          type: object
          description: For callers on this computer. When the last backup was made, whether the last one failed, and whether the daily schedule is on.
          properties:
            lastBackupAt: { type: [string, "null"], format: date-time }
            lastBackupBytes: { type: [integer, "null"] }
            lastError:
              type: [object, "null"]
              properties:
                at: { type: string, format: date-time }
                kind: { type: string }
                message: { type: string }
            schedule:
              type: object
              properties:
                enabled: { type: boolean }
                time: { type: string }
        startup:
          type: object
          description: >-
            Present only while the Bridge is starting and holds positions, funds, orders, trades and the book (at most
            20 s) until its start-up jobs finish (in demo mode, the demo book seed), so no client reads a partial book.
            Each job's progress lets a page show it instead of a silent wait. Absent once those reads answer.
          required: [ready, jobs]
          properties:
            ready: { type: boolean, enum: [false] }
            jobs:
              type: array
              items:
                type: object
                required: [name, done, total]
                properties:
                  name: { type: string, description: 'For example "demo book seed".' }
                  done: { type: [integer, "null"], description: "Steps done (seeded legs), null until the job reports." }
                  total: { type: [integer, "null"], description: "Steps in all, null until known." }
    BackupFile:
      type: object
      required: [name, path, bytes, at, kind]
      properties:
        name: { type: string, examples: [mc-bridge-backup-20261109-021500-upgrade.tar.gz] }
        path: { type: string, description: "Where the file is on this computer." }
        bytes: { type: integer }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [manual, upgrade, scheduled, safety], description: "upgrade: before a new version ran; safety: before a restore." }
    BackupStatus:
      type: object
      required: [lastBackupAt, lastBackupBytes, lastBackupKind, lastError, schedule, keep, folder, items, restoreCommand]
      properties:
        lastBackupAt: { type: [string, "null"], format: date-time }
        lastBackupBytes: { type: [integer, "null"] }
        lastBackupKind: { type: [string, "null"] }
        lastError:
          type: [object, "null"]
          description: The last backup that failed, until a later backup of the same kind succeeds.
          properties:
            at: { type: string, format: date-time }
            kind: { type: string }
            message: { type: string }
        schedule:
          type: object
          required: [enabled, time, keep]
          properties:
            enabled: { type: boolean }
            time: { type: string, examples: ["02:30"], description: "This computer's clock, 24-hour." }
            keep: { type: integer }
        keep: { type: integer, description: "Snapshots kept per kind (before an upgrade, before a restore)." }
        folder: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/BackupFile" } }
        restoreCommand: { type: string }
    BackupCreated:
      type: object
      required: [path, name, bytes, files, createdAt, kind, includesSecrets, masterKeyIncluded, restoreCommand]
      properties:
        path: { type: string, description: "Where the archive is on this computer. Copy it to another disk." }
        name: { type: string }
        bytes: { type: integer }
        files: { type: integer }
        createdAt: { type: string, format: date-time }
        kind: { type: string, enum: [manual] }
        includesSecrets: { type: boolean }
        includesData: { type: boolean, description: "True when the downloads and recordings folders are in the archive (includeData)." }
        masterKeyIncluded: { type: boolean, enum: [false], description: "Always false: the master key is never part of a backup." }
        restoreCommand: { type: string }
    MetaInfo:
      type: object
      required: [bridgeVersion, apiVersion, brokers, modules, routes]
      properties:
        bridgeVersion: { type: string }
        apiVersion: { type: string }
        brokerContractVersion: { type: integer }
        installDir: { type: string, description: "For callers on this computer: the folder the Bridge runs from." }
        dataDir: { type: string, description: "For callers on this computer: the data folder." }
        cliCommand: { type: string, description: "For callers on this computer: how to run a Bridge command in this setup (`mc-bridge`, or `npm run bridge --` from a checkout)." }
        brokers: { type: array, items: { type: string } }
        modules:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              stream: { type: string }
        routes:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              path: { type: string }
              scope: { type: [string, "null"] }
              auth: { type: string }

    Symbol:
      type: string
      maxLength: 64
      description: Canonical Bridge symbol (see the introduction). Inputs may use accepted aliases.
      examples: ["NSE:RELIANCE", "NSE:NIFTY", "NFO:NIFTY-2026-10-27-FUT", "NFO:NIFTY-2026-10-27-25000-CE"]
    SymbolFormatName:
      type: string
      enum: [auto, canonical, chart, compact, broker]
      default: auto
    Exchange:
      type: string
      enum: [NSE, BSE, NFO, BFO, MCX, CDS]
    CalendarInfo:
      type: object
      required: [asOf, source, coveredYears, covered, verified]
      description: What the answer rests on. `verified` is false when the date is outside the covered years or a row used is not verified.
      properties:
        asOf: { type: [string, "null"], format: date, description: The date of the shipped holiday list. }
        source: { type: [string, "null"] }
        coveredYears: { type: array, items: { type: integer } }
        covered: { type: boolean, description: "False: the date is outside the list, so a weekday is assumed to trade and the answer is not verified." }
        verified: { type: boolean }
        note: { type: [string, "null"], description: Said plainly whenever the answer is not fully verified. }
    CalendarSessionTimes:
      type: object
      required: [preOpen, open, close, verified]
      properties:
        preOpen: { type: string, description: "IST, HH:MM." }
        open: { type: string }
        close: { type: string }
        timezone: { type: string, enum: [IST] }
        verified: { type: boolean, description: "False: the hours were not confirmed from an exchange or SEBI circular." }
        source: { type: string }
        expiringIndexClose: { type: string, description: "Present from 7 Dec 2026 (derivatives): an index contract expiring that day stops at this time instead of close." }
        cas: { type: object, description: "The closing auction session of the cash segment, when the rule has one.", properties: { start: { type: string }, end: { type: string }, appliesTo: { type: string } } }
        rule:
          type: object
          description: The dated rule that produced these hours.
          properties:
            id: { type: [string, "null"] }
            from: { type: [string, "null"], format: date }
            to: { type: [string, "null"], format: date }
            circular: { type: [string, "null"] }
            url: { type: [string, "null"] }
            readOn: { type: [string, "null"], format: date, description: The date the circular was read. }
            note: { type: [string, "null"] }
    CalendarHolidays:
      type: object
      required: [exchange, year, holidays, specialSessions, calendar]
      properties:
        exchange: { type: string, enum: [NSE, BSE, NFO, BFO] }
        year: { type: integer }
        holidays:
          type: array
          items:
            type: object
            required: [date, weekday, label, exchanges, verified]
            properties:
              date: { type: string, format: date }
              weekday: { type: string }
              label: { type: string }
              exchanges: { type: array, items: { type: string } }
              verified: { type: boolean }
        specialSessions:
          type: array
          description: Sessions on a day that is otherwise closed or has its own hours (Muhurat trading).
          items:
            type: object
            properties:
              date: { type: string, format: date }
              weekday: { type: string }
              label: { type: string }
              open: { type: [string, "null"] }
              close: { type: [string, "null"] }
              preOpen: { type: string }
              cas: { type: object }
              verified: { type: boolean, description: "False: the timing was not read in the exchange circular. Live orders are refused in the session until it is verified." }
              source: { type: [string, "null"] }
              readOn: { type: [string, "null"], format: date }
              note: { type: [string, "null"] }
        calendar: { $ref: "#/components/schemas/CalendarInfo" }
    CalendarSession:
      type: object
      required: [exchange, date, weekday, isTradingDay, reason, sessionTimes, calendar]
      properties:
        exchange: { type: string, enum: [NSE, BSE, NFO, BFO] }
        date: { type: string, format: date }
        weekday: { type: string }
        isTradingDay: { type: boolean }
        reason: { type: string }
        preOpen:
          oneOf:
            - type: object
              properties:
                start: { type: string }
                end: { type: string }
            - type: "null"
        open: { type: [string, "null"], description: "IST HH:MM; null on a day that does not trade." }
        close: { type: [string, "null"] }
        holiday:
          oneOf:
            - type: object
              properties:
                label: { type: string }
                verified: { type: boolean }
            - type: "null"
        specialSession:
          oneOf:
            - type: object
              properties:
                label: { type: string }
                open: { type: [string, "null"] }
                close: { type: [string, "null"] }
                preOpen: { type: string }
                cas: { type: object }
                verified: { type: boolean }
                source: { type: [string, "null"] }
                readOn: { type: [string, "null"], format: date }
                note: { type: [string, "null"] }
            - type: "null"
        sessionTimes: { $ref: "#/components/schemas/CalendarSessionTimes" }
        previousTradingDay: { type: string, format: date }
        nextTradingDay: { type: string, format: date }
        calendar: { $ref: "#/components/schemas/CalendarInfo" }
    CalendarStatus:
      type: object
      required: [exchange, status, reason, asOf, date, time, sessionTimes, calendar]
      properties:
        exchange: { type: string, enum: [NSE, BSE, NFO, BFO] }
        status: { type: string, enum: [open, pre-open, closed] }
        reason: { type: string }
        closedBecause: { type: [string, "null"], enum: [weekend, holiday, before-open, after-close, null] }
        asOf: { type: string, format: date-time, description: "The Bridge's clock, IST." }
        date: { type: string, format: date }
        time: { type: string, description: "IST HH:MM." }
        opensAt: { type: [string, "null"], format: date-time, description: Pre-open only. Today's open. }
        closesAt: { type: [string, "null"], format: date-time, description: "Open and pre-open only." }
        nextOpen:
          oneOf:
            - type: object
              properties:
                date: { type: string, format: date }
                time: { type: string }
                at: { type: string, format: date-time }
                kind: { type: string, enum: [regular, special] }
                label: { type: [string, "null"] }
            - type: "null"
        sessionTimes: { $ref: "#/components/schemas/CalendarSessionTimes" }
        calendar: { $ref: "#/components/schemas/CalendarInfo" }
    InstrumentKind:
      type: string
      enum: [INDEX, EQ, FUT, OPT]
    Interval:
      type: string
      enum: ["1m", "3m", "5m", "10m", "15m", "30m", "60m", "1d", "1w", "1M"]
    StreamMode:
      type: string
      enum: [ltp, quote, depth]
      default: ltp
    AccountId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,31}$"
    ClientOrderId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
      description: Your own id for an order, unique per account per IST day. The Bridge maps it to the broker's shorter tag field itself.
    CompatReply:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [success, error] }
        message: { type: string }
        mode: { type: string, enum: [analyze], description: "Present while analyzer (paper) mode is on." }
        data: {}
        orderid: { type: [string, "null"] }
      additionalProperties: true
    Freshness:
      type: object
      required: [source, asOf, ageMs, stale, class, delaySec, official, confidence, flags]
      properties:
        source:
          type: string
          enum: [stream, cache, broker, paper, backup, plugin]
          description: "backup = a free provider (named in provider) used because no broker account could answer; it is delayed or end-of-day and unofficial unless its flags say otherwise. plugin = a plugin you granted."
        asOf: { type: string, format: date-time, description: "The source's own timestamp for this value. Never the time the Bridge received it for a delayed or end-of-day source." }
        ageMs: { type: integer, minimum: 0 }
        stale: { type: boolean, description: "Older than the freshness target for this read. Not the same as `class`: a 15-minute delayed quote is `class: delayed` and not stale when you accept data that old." }
        accountId: { type: [string, "null"], description: "Account whose connection supplied the data." }
        broker: { type: [string, "null"] }
        provider: { type: string, description: "Only for sources other than your brokers: the source id that supplied it (for example yahoo, alphavantage, twelvedata, or a plugin's id)." }
        class: { $ref: "#/components/schemas/DataClass" }
        delaySec: { type: integer, minimum: 0, description: "Nominal delay: 0 for real-time, about 900 for 15-minute delayed data; for end-of-day data, how old the close is expected to be." }
        official: { type: boolean, description: "True only for your own broker's data or a documented API from the data's owner." }
        confidence: { $ref: "#/components/schemas/Confidence" }
        flags:
          type: array
          description: "Labels on this value. Open list. Known: `stale`, `unofficial`, `delayed`, `eod`, `plugin`, `last-bar-provisional`."
          items: { type: string }
        revalidating: { type: boolean, description: "Only with ?swr=true: this older value was answered at once and a refresh is running behind it." }
        quiet:
          type: object
          description: "Stream-first option chains only: legs whose last tick is older than the freshness target, used because nothing traded (live subscription, feed ticking now, tick from the current connection, at most market.quietLegMaxAgeMs old). Each such leg carries tickAgeMs. asOf and ageMs describe the live legs and the spot."
          properties:
            legs: { type: integer, minimum: 1 }
            oldestTickAgeMs: { type: integer, minimum: 0 }
            maxAgeMs: { type: integer, minimum: 0 }

    BrokerInfo:
      type: object
      required: [id, name, authKind, capabilities, verified]
      properties:
        id: { type: string }
        name: { type: string }
        authKind: { type: string, enum: [apiKeyToken, oauthRedirect, requestTokenExchange, sessionLogin] }
        capabilities: { type: array, items: { type: string } }
        verified: { type: boolean, description: "Checked end to end against a live account (verification.level is live-verified)." }
        verification:
          type: object
          description: "Where the broker sits on the verification ladder (server/brokers/verification.json): beta (recorded samples only), contract (every contract case passes), sandbox, live-verified."
          required: [level, label]
          properties:
            level: { type: string, enum: [beta, contract, sandbox, live-verified] }
            label: { type: string }
            verifiedOn: { type: [string, "null"], description: "Date of the real-account check (YYYY-MM-DD), or null when it was not recorded. Only for sandbox and live-verified." }
            verifiedBy: { type: string, description: "Who did the check. Only for sandbox and live-verified." }
        singleSession: { type: boolean, description: "Present and true when a second login for the same app ends the first session (the dashboard warns before login)." }
        credentialFields: { type: array, items: { type: string }, description: "Keys to send in SessionConnectRequest.values." }
        loginFields:
          type: array
          description: "sessionLogin brokers only: keys to send in SessionConnectRequest.secrets (used once, never stored)."
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              kind: { type: string, enum: [secret, totp] }
        tokenExpiry: { type: [string, "null"], description: "When the broker's session usually ends, as the broker documents it." }
        loginUrl:
          type: string
          description: "The broker's own login page, with {field} placeholders that are all credentialFields (e.g. {apiKey}). Only for brokers that declare one."
        policy: { $ref: "#/components/schemas/BrokerPolicy" }
        demo: { type: boolean, description: "Present and true for the built-in demo broker (sample data)." }
        available: { type: boolean, description: "Whether this build can talk to the broker." }
        note: { type: string, description: "A plain sentence about this broker, when there is one." }
    BrokerPolicy:
      type: object
      properties:
        limits:
          type: object
          additionalProperties:
            type: object
            properties:
              perSecond: { type: number }
              perMinute: { type: number }
              perDay: { type: number }
              verified: { type: boolean }
              source: { type: string, description: "Where the figure comes from: the broker documentation address, or a short note for the demo broker." }
        maxQuoteBatch: { type: integer }
        feed:
          type: object
          properties:
            maxConnections: { type: [integer, "null"] }
            maxSubscriptions: { type: [integer, "null"] }
        pooling: { type: string, enum: [allowed, not-allowed, unknown] }
        maxModificationsPerOrder: { type: [integer, "null"] }
        brokerId: { type: string }
        known: { type: boolean, description: "False for a broker the Bridge has no reviewed limits for (it then uses cautious defaults)." }
        groups: { type: object, additionalProperties: true, description: "Shared limit groups, when the broker counts several kinds of call together." }
        poolingNote: { type: string, description: "What the broker's published terms say about spreading reads over several accounts." }
        dataEntitlement:
          type: object
          description: Whether the broker's live data needs a paid plan.
          properties:
            value: { type: string }
            verified: { type: boolean }
            note: { type: string }
        notes: { type: string, description: "Anything else worth knowing about this broker's limits." }
    SessionState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [connected, expired, missing, error, checking] }
        expiresAt: { type: [string, "null"], format: date-time }
        checkedAt: { type: [string, "null"], format: date-time }
        message: { type: [string, "null"] }
    AccountSummary:
      type: object
      required: [id, broker, label, enabled, session, liveAllowedByConfig, pooling, capabilities]
      properties:
        id: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        session: { $ref: "#/components/schemas/SessionState" }
        liveAllowedByConfig: { type: boolean }
        liveSources: { type: array, items: { type: string, enum: [rest, webhook, mcp, cli, guard, alert] }, description: "accounts[].live.allowedSources: the tools that may send this account live orders (live still needs liveAllowedByConfig)." }
        pooling: { type: boolean, description: "This account's market-data budget may serve requests that did not name an account." }
        capabilities: { type: array, items: { type: string } }
        authKind: { type: [string, "null"] }
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [broker]
      properties:
        broker: { type: string, description: "An adapter id from GET /v1/brokers, or paper." }
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,31}$", description: "Optional; the Bridge picks one when it is left out." }
        label: { type: string, maxLength: 60, description: "A name you will recognise. Optional." }
        leaveDemo: { type: boolean, description: "Demo mode only: also remove `\"demo\": true` from the config file, so the next start is normal." }

    SessionConnectRequest:
      type: object
      additionalProperties: false
      properties:
        values:
          type: object
          description: Non-secret fields the broker needs (apiKey, clientId, accessToken ...). Stored encrypted.
          additionalProperties: { type: string, maxLength: 4096 }
        secrets:
          type: object
          description: Password/PIN and the current TOTP code for session-login brokers. Used once, never stored.
          additionalProperties: { type: string, maxLength: 256 }

    KeyRecord:
      type: object
      required: [id, label, scopes, accounts, createdAt]
      properties:
        id: { type: string }
        label: { type: string }
        scopes: { type: array, items: { type: string, enum: [read, paper, live, admin] } }
        accounts:
          oneOf:
            - { type: string, const: "*" }
            - { type: array, items: { $ref: "#/components/schemas/AccountId" } }
        allowQuery: { type: boolean }
        clientKind: { type: string, enum: [script, excel, mcp, ui, other] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    CancelAllOpenOrder:
      type: object
      required: [orderId, accountId, mode, external]
      properties:
        orderId: { type: string, description: "The Bridge order id, or the broker's order id for one placed outside the Bridge." }
        accountId: { type: string }
        mode: { type: string, enum: [paper, live] }
        symbol: { type: string }
        side: { type: [string, "null"] }
        quantity: { type: [integer, "null"] }
        status: { type: string }
        external: { type: boolean }
    KeyCreateRequest:
      type: object
      required: [label, scopes]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        scopes: { type: array, minItems: 1, items: { type: string, enum: [read, paper, live, admin] } }
        accounts:
          oneOf:
            - { type: string, const: "*" }
            - { type: array, minItems: 1, items: { $ref: "#/components/schemas/AccountId" } }
        expiresAt: { type: [string, "null"], format: date-time }
        allowQuery: { type: boolean, default: false, description: "Allow ?key= use. Only for keys whose only scope is read." }
        clientKind: { type: string, enum: [script, excel, mcp, ui, other] }
    KeyCreated:
      type: object
      required: [key, record]
      properties:
        key: { type: string, description: "Shown once." }
        record: { $ref: "#/components/schemas/KeyRecord" }

    Instrument:
      type: object
      required: [symbol, exchange, kind, underlying, lotSize, tickSize]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        exchange: { $ref: "#/components/schemas/Exchange" }
        kind: { $ref: "#/components/schemas/InstrumentKind" }
        underlying: { type: string }
        name: { type: [string, "null"] }
        expiry: { type: [string, "null"], format: date }
        strike: { type: [number, "null"] }
        right: { type: [string, "null"], enum: [CE, PE, null] }
        lotSize: { type: integer, minimum: 1 }
        tickSize: { type: number, exclusiveMinimum: 0 }
        freezeQty: { type: [integer, "null"] }
        freezeQtySource:
          type: [string, "null"]
          enum: [master, exchange-list, null]
          description: Where freezeQty came from. "exchange-list" is the Bridge's dated list and is marked needs-verification.
        isin: { type: [string, "null"] }
        refs:
          type: object
          description: Present with include=refs. Keyed by broker id.
          additionalProperties:
            type: object
            properties:
              token: { type: string }
              exchange: { type: string }
              tradingSymbol: { type: [string, "null"] }
    ConvertRequest:
      type: object
      required: [input]
      additionalProperties: false
      properties:
        input: { type: string, maxLength: 64 }
        from: { $ref: "#/components/schemas/SymbolFormatName" }
        exchange: { type: string, maxLength: 12 }
        broker: { type: string }
    ConvertResult:
      type: object
      required: [input, canonical, aliases]
      properties:
        input: { type: string }
        canonical: { $ref: "#/components/schemas/Symbol" }
        aliases:
          type: object
          description: "chart (chart ticker such as NSE:NIFTY1!), compact (symbol and exchange) and, when a broker is given or connected, broker:<id>."
          additionalProperties: { type: [string, "null"] }

    SymbolCandidate:
      type: object
      required: [symbol, exchange, kind, reason]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        exchange: { $ref: "#/components/schemas/Exchange" }
        kind: { $ref: "#/components/schemas/InstrumentKind" }
        name: { type: [string, "null"] }
        expiry: { type: [string, "null"], format: date }
        strike: { type: [number, "null"] }
        right: { type: [string, "null"], enum: [CE, PE, null] }
        lotSize: { type: [integer, "null"] }
        tickSize: { type: [number, "null"] }
        reason: { type: string, description: "Why this instrument matched, in words." }
    SymbolResolution:
      type: object
      required: [input, symbol, instrument, confidence, rule, rules, candidates]
      properties:
        input: { type: string }
        symbol: { $ref: "#/components/schemas/Symbol" }
        instrument: { $ref: "#/components/schemas/Instrument" }
        confidence:
          type: string
          enum: [exact, unique-name]
          description: "`exact`: a symbol form the Bridge reads. `unique-name`: exactly one instrument carries the name."
        rule: { type: string, description: How the answer was reached, in a sentence. }
        rules: { type: array, items: { type: string }, description: "Each spelling that was rewritten (an exchange word, a chart name, a series suffix)." }
        candidates: { type: array, items: { $ref: "#/components/schemas/SymbolCandidate" } }
        steps: { type: array, items: { type: string }, description: "With explain=1: the reading, step by step." }
    SymbolValidation:
      type: object
      required: [input, valid]
      properties:
        input: { type: string }
        valid: { type: boolean }
        symbol: { $ref: "#/components/schemas/Symbol" }
        exchange: { $ref: "#/components/schemas/Exchange" }
        kind: { $ref: "#/components/schemas/InstrumentKind" }
        underlying: { type: string }
        expiry: { type: [string, "null"], format: date }
        strike: { type: [number, "null"] }
        right: { type: [string, "null"], enum: [CE, PE, null] }
        name: { type: [string, "null"] }
        lotSize: { type: integer, minimum: 1 }
        tickSize: { type: number }
        freezeQty: { type: [integer, "null"] }
        tradable: { type: boolean, description: "False for an index: it can be read but not traded." }
        tradableNote: { type: [string, "null"] }
        normalised: { type: boolean, description: "True when the input was written in an alternative spelling that was rewritten." }
        rule: { type: string }
        rules: { type: array, items: { type: string } }
        confidence: { type: string, enum: [exact, unique-name] }
        code: { type: string, enum: [SYMBOL_NOT_FOUND, AMBIGUOUS_SYMBOL, VALIDATION_FAILED], description: "Only when valid is false." }
        message: { type: string, description: "Only when valid is false." }
        candidates: { type: array, items: { $ref: "#/components/schemas/SymbolCandidate" }, description: "Only when valid is false: the closest or the ambiguous matches." }

    CollectionUniverse:
      type: object
      description: "An option universe: which contracts of one underlying, worked out each time the collection is used."
      required: [underlying]
      additionalProperties: false
      properties:
        underlying: { type: string, example: NIFTY, description: "An index or stock name, without an exchange prefix." }
        expiries:
          description: |
            `current-weekly` the nearest expiry that has not closed (an underlying with weekly expiries); `next-weekly` the one
            after it; `current-monthly` the nearest expiry that is the last of its month; `all-weekly` the weekly run, up to
            `library.maxWeeklyExpiries`; or a list of dates. The dates come from the instrument list, so exchange holiday
            shifts are followed. An underlying with no weekly expiries answers a weekly rule with an error.
          oneOf:
            - { type: string, enum: [current-weekly, next-weekly, current-monthly, all-weekly] }
            - { type: array, minItems: 1, maxItems: 60, items: { type: string, format: date } }
          default: current-weekly
        strikes:
          description: "`around: atm` takes `count` listed strikes each side of the strike nearest the price; `from`/`to` takes the listed strikes between two prices and needs no price."
          oneOf:
            - type: object
              required: [around]
              additionalProperties: false
              properties:
                around: { type: string, enum: [atm] }
                count: { type: integer, minimum: 1, maximum: 200, default: 10 }
            - type: object
              required: [from, to]
              additionalProperties: false
              properties:
                from: { type: number }
                to: { type: number }
        sides: { type: array, items: { type: string, enum: [CE, PE] }, default: [CE, PE] }
        includeUnderlying: { type: boolean, default: true }
        includeFuture: { type: boolean, default: false, description: "Add the future that expires in the month of each chosen expiry (else the nearest)." }

    Collection:
      type: object
      required: [id, name, description, tags, kind, createdAt, updatedAt, previousNames]
      properties:
        id: { type: string, example: col_a1b2c3d4e5, description: "Stable; survives a rename." }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string }, description: "Lower case, sorted." }
        kind: { type: string, enum: [static, option-universe] }
        symbols: { type: array, items: { $ref: "#/components/schemas/Symbol" }, description: "Static collections, on a single read (not in the list)." }
        symbolCount: { type: [integer, "null"], description: "Static collections: how many symbols. Null for an option universe (it depends on the day)." }
        universe: { $ref: "#/components/schemas/CollectionUniverse" }
        previousNames: { type: array, items: { type: string } }
        viaOldName: { type: boolean, description: "Only when the request used a name the collection had before a rename." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CollectionCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$" }
        description: { type: string, maxLength: 500 }
        tags: { type: array, maxItems: 20, items: { type: string, pattern: "^[a-z0-9][a-z0-9_.:-]{0,31}$" } }
        kind: { type: string, enum: [static, option-universe], description: "Optional: a body with `universe` is an option universe, otherwise static." }
        symbols: { type: array, items: { type: string, maxLength: 80 }, description: "Static: canonical symbols (a lenient spelling is rewritten to canonical)." }
        universe: { $ref: "#/components/schemas/CollectionUniverse" }

    CollectionPatch:
      type: object
      additionalProperties: false
      description: At least one field. `symbols` only for a static collection, `universe` only for an option universe.
      properties:
        name: { type: string, description: "Rename. The old name keeps finding the collection." }
        description: { type: string, maxLength: 500 }
        tags: { type: array, items: { type: string } }
        symbols: { type: array, items: { type: string } }
        universe: { $ref: "#/components/schemas/CollectionUniverse" }

    CollectionResolution:
      type: object
      required: [id, name, kind, resolvedAt, rule, symbols, count, atmSource, warnings]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [static, option-universe] }
        resolvedAt: { type: string, format: date-time }
        rule: { type: string, description: "The rule that was used, in words (expiry rule, strikes, sides)." }
        symbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        count: { type: integer }
        atmSource:
          type: string
          enum: [not-needed, live, last-close, supplied, stale, delayed, eod]
          description: "Where the price behind the at-the-money strike came from. `live` is a realtime price with the market open; `last-close` the previous close (market closed or in pre-open); `supplied` the `spot` you passed; `stale`, `delayed` and `eod` only with `allowStale`."
        strikeSource: { type: string, enum: [listed, grid], description: "`grid`: no listed strikes were found, so the strikes are generated on the usual step (index underlyings only); some may not exist." }
        underlying:
          type: object
          properties:
            symbol: { type: string }
            price: { type: [number, "null"] }
            asOf: { type: [string, "null"] }
            ageMs: { type: [integer, "null"] }
            class: { type: [string, "null"], enum: [realtime, delayed, eod, null] }
            source: { type: [string, "null"] }
        expiries:
          type: array
          items:
            type: object
            properties:
              expiry: { type: string, format: date }
              kind: { type: string, enum: [weekly, monthly] }
              shifted: { type: boolean, description: "On an unusual weekday because the usual day is a holiday. The exchange's listed date is used." }
              ruleDate: { type: string, format: date }
              reason: { type: string }
              daysAway: { type: integer }
              atm: { type: [number, "null"] }
              step: { type: [number, "null"], description: "Strike step of this expiry." }
              strikeSource: { type: string, enum: [listed, grid] }
              first: { type: [number, "null"] }
              last: { type: [number, "null"] }
              strikes: { type: integer }
        viaOldName: { type: boolean }
        warnings: { type: array, items: { type: string }, description: "Plain sentences: a last-close or stale price, a shifted expiry, an expired contract, a skipped date." }

    CollectionResolveDraft:
      type: object
      required: [universe]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [option-universe] }
        universe: { $ref: "#/components/schemas/CollectionUniverse" }

    CollectionDraftResolution:
      type: object
      required: [draft, kind, resolvedAt, rule, symbols, count, atmSource, warnings]
      description: What `CollectionResolution` says, for a universe that is not saved (so it has no id or name).
      properties:
        draft: { type: boolean, enum: [true] }
        kind: { type: string, enum: [option-universe] }
        resolvedAt: { type: string, format: date-time }
        rule: { type: string, description: "The rule that was used, in words (expiry rule, strikes, sides)." }
        symbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        count: { type: integer }
        atmSource: { $ref: "#/components/schemas/CollectionResolution/properties/atmSource" }
        strikeSource: { $ref: "#/components/schemas/CollectionResolution/properties/strikeSource" }
        underlying: { $ref: "#/components/schemas/CollectionResolution/properties/underlying" }
        expiries: { $ref: "#/components/schemas/CollectionResolution/properties/expiries" }
        warnings: { type: array, items: { type: string } }

    CollectionUsage:
      type: object
      required: [id, name, downloads, recordings, rules, datasets, total, sources]
      properties:
        id: { type: string }
        name: { type: string }
        lastResolvedAt: { type: [string, "null"], description: "Since the Bridge started." }
        downloads: { type: array, items: { type: object } }
        recordings: { type: array, items: { type: object } }
        rules: { type: array, items: { type: object } }
        datasets: { type: array, items: { type: object } }
        total: { type: integer }
        sources: { type: object, additionalProperties: { type: string, enum: [available, not-available, error] } }
        note: { type: [string, "null"] }

    CollectionEstimate:
      type: object
      required: [name, symbols, intervals, days, tradingDays, rows, bytes, brokerCalls, notes]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        resolvedAt: { type: string, format: date-time }
        atmSource: { type: string }
        symbols: { type: integer }
        intervals: { type: array, items: { type: string } }
        days: { type: integer }
        tradingDays: { type: integer }
        rows: { type: integer }
        bytes: { type: integer, description: "As CSV, about 70 bytes a row." }
        brokerCalls: { type: integer, description: "One per history chunk per symbol per interval (an upper bound)." }
        perInterval: { type: array, items: { type: object, properties: { interval: { type: string }, barsPerSymbol: { type: integer }, rows: { type: integer }, bytes: { type: integer }, brokerCalls: { type: integer } } } }
        notes: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }

    LtpItem:
      type: object
      required: [symbol, ltp, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: number }
        freshness: { $ref: "#/components/schemas/Freshness" }
    QuoteItem:
      type: object
      required: [symbol, ltp, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: number }
        open: { type: [number, "null"] }
        high: { type: [number, "null"] }
        low: { type: [number, "null"] }
        close: { type: [number, "null"], description: "Previous close." }
        change: { type: [number, "null"] }
        changePct: { type: [number, "null"] }
        volume: { type: [number, "null"] }
        oi: { type: [number, "null"] }
        bid: { type: [number, "null"] }
        ask: { type: [number, "null"] }
        bidQty: { type: [number, "null"] }
        askQty: { type: [number, "null"] }
        freshness: { $ref: "#/components/schemas/Freshness" }
    DepthLevel:
      type: object
      required: [price, qty]
      properties:
        price: { type: number }
        qty: { type: number }
        orders: { type: [integer, "null"] }
    DepthItem:
      type: object
      required: [symbol, bids, asks, freshness]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        bids: { type: array, items: { $ref: "#/components/schemas/DepthLevel" } }
        asks: { type: array, items: { $ref: "#/components/schemas/DepthLevel" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Candle:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time: { type: integer, description: "Bar open time, epoch seconds." }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
        oi: { type: number }
    HistoryResult:
      type: object
      required: [symbol, interval, candles, freshness, partial]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        interval: { $ref: "#/components/schemas/Interval" }
        candles: { type: array, items: { $ref: "#/components/schemas/Candle" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
        partial: { type: boolean, description: "True when the broker could not supply the whole range (history depth limits)." }
    ChainLeg:
      type: object
      required: [symbol]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        ltp: { type: [number, "null"] }
        bid: { type: [number, "null"] }
        ask: { type: [number, "null"] }
        oi: { type: [number, "null"] }
        oiChange: { type: [number, "null"] }
        volume: { type: [number, "null"] }
        iv: { type: [number, "null"], description: "Percent." }
        close: { type: [number, "null"], description: "Previous session's close, when the broker sends it." }
        change: { type: [number, "null"], description: "ltp - close; null without a close." }
        delta: { type: [number, "null"] }
        gamma: { type: [number, "null"] }
        theta: { type: [number, "null"] }
        vega: { type: [number, "null"] }
        greeksSource: { type: [string, "null"], enum: [broker, computed, null] }
        brokerIv: { type: [number, "null"], description: "The broker's own IV (percent), when it sent one and ivModel=b76-forward recomputed iv." }
        tickAgeMs: { type: integer, minimum: 0, description: "Stream-first chains only, on a quiet leg (freshness.quiet): how old its last tick is. The figures are its last trade; no tick on a live subscription means no trade since." }
        ivReason:
          type: [string, "null"]
          enum: [SETTLING, NOQUOTE, TICK, INTRINSIC, RANGE, SETTLED, NOFORWARD, null]
          description: >-
            ivModel=b76-forward only: why iv is null. SETTLING = expiry day inside the settlement window and the price within
            2 ticks of intrinsic on the forward; NOQUOTE = no usable price; TICK = price at or below one tick; INTRINSIC = at
            or below discounted intrinsic; RANGE = solved IV outside 1-300 %; SETTLED = past the settlement; NOFORWARD = no
            forward. Null when the IV solved.
    OptionChain:
      type: object
      required: [underlying, expiry, rows, freshness]
      properties:
        underlying: { type: string }
        expiry: { type: string, format: date }
        underlyingLtp: { type: [number, "null"] }
        atmStrike: { type: [number, "null"] }
        lotSize: { type: [integer, "null"] }
        underlyingKind: { type: [string, "null"], enum: [index, stock, null], description: "From the master (OPTSTK vs OPTIDX: the spot row's kind)." }
        settlement: { type: [string, "null"], enum: [cash, physical, null], description: "physical for stock derivatives, cash for index derivatives." }
        strikeStep: { type: [number, "null"], description: "Most common gap between listed strikes of this expiry (inferred); null with fewer than 3 strikes." }
        tickSize: { type: [number, "null"], description: "Largest option tick size of this expiry in the master." }
        rows:
          type: array
          items:
            type: object
            required: [strike]
            properties:
              strike: { type: number }
              ce: { oneOf: [{ $ref: "#/components/schemas/ChainLeg" }, { type: "null" }] }
              pe: { oneOf: [{ $ref: "#/components/schemas/ChainLeg" }, { type: "null" }] }
        freshness: { $ref: "#/components/schemas/Freshness" }
        pricing: { $ref: "#/components/schemas/ChainPricing" }
    ChainPricing:
      type: object
      description: How every leg's IV and Greeks were computed (present with ivModel=b76-forward).
      properties:
        model: { type: string, const: black76-parity-forward }
        ivModel: { type: string, const: b76-forward }
        priceBasis: { type: string, const: mid }
        forward: { type: [number, "null"] }
        forwardSource: { type: [string, "null"], enum: [parity, spot, null] }
        forwardStrikes: { type: integer }
        rate:
          type: object
          properties:
            value: { type: number }
            quality: { type: [string, "null"] }
        clock:
          type: object
          properties:
            version: { type: string }
            mode: { type: string, enum: [weighted, trading, calendar] }
            T: { type: number, description: "Years on the vol-time clock (used inside sigma times root T)." }
            units: { type: number }
            Tcal: { type: number, description: "Calendar years (interest and discounting)." }
            yearBasis: { type: number, description: "Clock units a year; theta is per one unit." }
    StreamStats:
      type: object
      properties:
        clients: { type: integer }
        symbols: { type: integer }
        upstreams:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              broker: { type: string }
              connected: { type: boolean }
              subscriptions: { type: integer }
              limit: { type: [integer, "null"] }
              state: { type: string, enum: [up, stale, down] }
              detail: { type: [string, "null"] }
              reason: { type: [string, "null"] }
              modes: { type: object, additionalProperties: { type: integer } }
              reconnects: { type: integer }
              rebuilds: { type: integer, description: "Times the Bridge itself rebuilt this feed because it was silent during market hours (a half-open connection) or never connected." }
              ticks: { type: integer }
              lastTickAt: { type: [string, "null"], format: date-time }
        downstream:
          type: object
          properties:
            connections: { type: integer }
            maxConnections: { type: integer }
            ws: { type: integer }
            sse: { type: integer }
            queued: { type: integer }
            conflatedTicks: { type: integer }
            slowDisconnects: { type: integer }
            opened: { type: integer }

    EventTopic:
      type: object
      required: [topic, scope, accountScoped, description]
      properties:
        topic: { type: string, examples: [order.updated] }
        scope: { type: string, enum: [read, admin], description: "The lowest scope that receives it." }
        accountScoped: { type: boolean, description: "The data names an `accountId`; a key limited to some accounts only receives its own." }
        description: { type: string }
    EventEnvelope:
      type: object
      description: One event, as sent on the stream, in a webhook body and by `GET /v1/events`. Read-only; it never carries a secret, a key or an order-approval token.
      required: [id, topic, time, apiVersion, data]
      properties:
        id: { type: string, description: "The cursor. Opaque; give it back as `since` or `Last-Event-ID`. Also the id to de-duplicate webhook deliveries on.", examples: ["1042"] }
        topic: { type: string, examples: [order.updated] }
        time: { type: string, format: date-time, description: "When the Bridge saw the event (UTC)." }
        apiVersion: { type: string, enum: [v1] }
        data: { type: object, additionalProperties: true, description: "The event's fields (see docs/guides/events.md). Anything that looked like a secret was removed." }
    EventsMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          properties:
            cursor: { type: string, description: "Ask with this next time." }
            latest: { type: string, description: "The newest event the Bridge has." }
            oldest: { type: [string, "null"], description: "The oldest event still kept." }
            gap: { type: boolean, description: "Events between your cursor and `oldest` are gone, or your cursor is newer than anything known." }
            gapReason: { type: [string, "null"], enum: [retention, cursor_ahead, null] }
            hasMore: { type: boolean }
    EventsStatus:
      type: object
      properties:
        log:
          type: object
          properties:
            latest: { type: integer }
            oldest: { type: [integer, "null"] }
            kept: { type: integer }
            retain: { type: integer }
            recorded: { type: integer }
            throttled: { type: integer }
            writeErrors: { type: integer }
            listeners: { type: integer }
        clients:
          type: object
          properties:
            connections: { type: integer }
            sse: { type: integer }
            ws: { type: integer }
            maxConnections: { type: integer }
        webhooks:
          type: object
          properties:
            enabled: { type: boolean }
            subscriptions: { type: integer }
            active: { type: integer }
            pending: { type: integer }
            inflight: { type: integer }
            deadLetters: { type: integer }
            oldestPendingAt: { type: [string, "null"], format: date-time }
            allowPrivateTargets: { type: boolean }
            storageErrors: { type: integer }
        limits: { type: object, additionalProperties: { type: integer } }
    SubscriptionCreate:
      type: object
      additionalProperties: false
      required: [url, topics, secret]
      properties:
        url: { type: string, maxLength: 2048, description: "https:// on a public address. No user name or password. The config file can allow http and private addresses; cloud metadata addresses are always refused." }
        topics:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string }
          description: 'Topics, prefixes such as `order.*`, or `*`. See `GET /v1/events/topics`.'
        secret: { type: string, minLength: 16, maxLength: 256, writeOnly: true, description: "The signing secret. Write-only: stored encrypted, never returned." }
        active: { type: boolean, default: true }
        label: { type: string, maxLength: 60 }
        accounts:
          description: 'Only events about these accounts (default "*").'
          oneOf:
            - { type: string, enum: ["*"] }
            - { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/AccountId" } }
    SubscriptionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url: { type: string, maxLength: 2048 }
        topics: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
        secret: { type: string, minLength: 16, maxLength: 256, writeOnly: true }
        active: { type: boolean, description: "false pauses delivery; queued events wait." }
        label: { type: [string, "null"], maxLength: 60 }
        accounts:
          oneOf:
            - { type: string, enum: ["*"] }
            - { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/AccountId" } }
    Subscription:
      type: object
      required: [id, target, host, topics, accounts, active, signing, createdAt, updatedAt, health, pending, deadLetters]
      properties:
        id: { type: string, pattern: '^sub_[a-z2-7]{8}$' }
        label: { type: [string, "null"] }
        target: { type: string, description: "Scheme and host, with an ellipsis when the URL has a path or query (which may be a secret).", examples: ["https://hooks.example.com/…"] }
        host: { type: string }
        topics: { type: array, items: { type: string } }
        accounts: { oneOf: [{ type: string, enum: ["*"] }, { type: array, items: { type: string } }] }
        active: { type: boolean }
        signing:
          type: object
          properties:
            algorithm: { type: string, enum: [hmac-sha256] }
            version: { type: string, enum: [v1] }
            replayWindowSec: { type: integer, description: "Receivers should refuse a timestamp further than this from their own clock." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        health:
          type: object
          properties:
            state: { type: string, enum: [unverified, ok, failing, paused, needs-secret], description: "needs-secret: the stored signing secret is missing (set it again with PATCH)." }
            delivered: { type: integer }
            failed: { type: integer, description: "Failed attempts (a retried event counts each time)." }
            deadLettered: { type: integer }
            consecutiveFailures: { type: integer }
            lastDeliveredAt: { type: [string, "null"], format: date-time }
            lastFailureAt: { type: [string, "null"], format: date-time }
            lastFailure:
              type: [object, "null"]
              properties:
                code: { type: string }
                status: { type: [integer, "null"] }
                message: { type: string }
        pending: { type: integer, description: "Events waiting to be sent or retried." }
        deadLetters: { type: integer }
    SubscriptionTestResult:
      type: object
      properties:
        ok: { type: boolean }
        status: { type: [integer, "null"], description: "The receiver's HTTP status." }
        code: { type: [string, "null"], description: "A short failure code (http_4xx, http_5xx, timeout, connect_failed, tls_failed, blocked_address ...)." }
        message: { type: string }
        durationMs: { type: integer }
        deliveryId: { type: string }
        willRetry: { type: boolean, description: "Always false: a test is not queued." }
    DeliveryRecord:
      type: object
      properties:
        id: { type: string }
        deliveryId: { type: string }
        eventId: { type: string }
        topic: { type: string }
        attempt: { type: integer }
        at: { type: string, format: date-time }
        outcome: { type: string, enum: [delivered, retry, dead, failed] }
        ok: { type: boolean }
        status: { type: [integer, "null"] }
        code: { type: [string, "null"] }
        message: { type: [string, "null"] }
        durationMs: { type: [integer, "null"] }
        nextAttemptAt: { type: [string, "null"], format: date-time }
        test: { type: boolean }
    DeadLetter:
      type: object
      properties:
        id: { type: string, pattern: '^dlv_[0-9a-f]{12}$' }
        eventId: { type: string }
        topic: { type: string }
        attempts: { type: integer }
        createdAt: { type: string, format: date-time }
        deadAt: { type: string, format: date-time }
        reason: { type: string, description: "http_4xx, redirect_refused, blocked_address, overflow, expired, or the last retryable failure." }
        status: { type: [integer, "null"] }
        message: { type: string }
    Position:
      type: object
      required: [symbol, product, netQty, avgPrice, pnl]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF, CO, BO] }
        netQty: { type: number }
        avgPrice: { type: number }
        ltp: { type: [number, "null"] }
        pnl: { type: number }
        realisedPnl: { type: [number, "null"] }
        unrealisedPnl: { type: [number, "null"] }
        charges: { type: [number, "null"], description: Paper accounts only; estimated brokerage and taxes. }
    Holding:
      type: object
      required: [symbol, qty, avgPrice]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        isin: { type: [string, "null"] }
        qty: { type: number }
        avgPrice: { type: number }
        ltp: { type: [number, "null"] }
        pnl: { type: [number, "null"] }
    Funds:
      type: object
      required: [availableCash, usedMargin]
      properties:
        availableCash: { type: number }
        usedMargin: { type: number }
        totalBalance: { type: [number, "null"] }
        collateral: { type: [number, "null"] }
        withdrawable: { type: [number, "null"] }
        realisedPnl: { type: [number, "null"] }
        unrealisedPnl: { type: [number, "null"] }
        charges: { type: [number, "null"], description: "Paper accounts: the estimated charges taken so far." }

    OrderStatus:
      type: string
      enum: [pending, open, trigger_pending, partially_filled, filled, cancelled, rejected, expired, outcome_unknown]
    OrderRequest:
      type: object
      required: [account, symbol, side, product, orderType]
      additionalProperties: false
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer, minimum: 1, description: "Units; must be a multiple of the lot size. Send this or lots." }
        lots: { type: integer, minimum: 1 }
        lotSizeConfirmed: { type: integer, minimum: 1, description: "The lot size (units per lot) the caller has checked; used only when reference lot data is stale or conflicts with the master (preview check LOT_SIZE_STALE)." }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF], description: "No default. `MIS` is read as INTRADAY and `NRML` as MARGIN (case does not matter); the canonical value is in the order and in `meta.normalised`." }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M], description: "No default. `MKT`, `SLM` and `SL_M` are read too." }
        price: { type: number, exclusiveMinimum: 0, description: "Required for LIMIT and SL." }
        triggerPrice: { type: number, exclusiveMinimum: 0, description: "Required for SL and SL-M." }
        validity: { type: string, enum: [DAY, IOC], default: DAY }
        marketProtectionPct: { type: number, exclusiveMinimum: 0, maximum: 10, description: "For MARKET and SL-M; defaults to the configured value." }
        disclosedQuantity: { type: integer, minimum: 0 }
        mode: { type: string, enum: [paper, live], default: paper }
        clientOrderId: { $ref: "#/components/schemas/ClientOrderId" }
        tag: { type: string, pattern: "^[A-Za-z0-9_-]{1,20}$", description: "Strategy label, kept in the audit log and sent to the broker where supported." }
        algoId: { type: string, maxLength: 32, description: "Exchange algo id for a registered strategy, where the broker accepts one." }
        confirmToken: { type: string, description: "From a human confirmation (required for orders prepared by AI assistants)." }
      oneOf:
        - required: [quantity]
          not: { required: [lots] }
        - required: [lots]
          not: { required: [quantity] }
    OrderChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        quantity: { type: integer, minimum: 1 }
        price: { type: number, exclusiveMinimum: 0 }
        triggerPrice: { type: number, exclusiveMinimum: 0 }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
        validity: { type: string, enum: [DAY, IOC] }
    OrderLeg:
      type: object
      required: [quantity, status]
      properties:
        brokerOrderId: { type: [string, "null"] }
        quantity: { type: integer }
        status: { $ref: "#/components/schemas/OrderStatus" }
        error:
          oneOf:
            - type: "null"
            - type: object
              properties:
                code: { type: string }
                message: { type: string }
    OrderResult:
      type: object
      required: [orderId, accountId, broker, mode, symbol, side, quantity, filledQuantity, orderType, product, status, legs, placedAt, updatedAt]
      properties:
        orderId: { type: string, description: "Bridge id: ord_... for live, PAPER-... for paper." }
        clientOrderId: { type: [string, "null"] }
        accountId: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        mode: { type: string, enum: [paper, live] }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer }
        filledQuantity: { type: integer }
        avgPrice: { type: [number, "null"] }
        price: { type: [number, "null"] }
        triggerPrice: { type: [number, "null"] }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF] }
        validity: { type: string, enum: [DAY, IOC] }
        status: { $ref: "#/components/schemas/OrderStatus" }
        brokerStatus: { type: [string, "null"], description: "The broker's own status text." }
        statusMessage: { type: [string, "null"] }
        legs:
          type: array
          description: One leg per broker order (orders above the freeze quantity are sliced).
          items: { $ref: "#/components/schemas/OrderLeg" }
        source: { type: string, enum: [rest, webhook, mcp, cli, system], description: '"system" is used for automatic intraday square-off of paper positions.' }
        tag: { type: [string, "null"] }
        placedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Check:
      type: object
      required: [code, message, severity]
      properties:
        code:
          type: string
          description: >-
            An open set. Codes include the error codes, SAFETY_WARNING, LOT_SIZE_STALE, and (stock derivatives) FNO_BAN (block: an
            opening order in a stock derivative in the F&O ban period; closing orders pass), FNO_BAN_UNCONFIRMED (warn:
            positions could not be read, the broker decides), BAN_DATA_UNAVAILABLE (warn: no ban list loaded) and
            PHYSICAL_SETTLEMENT (warn: from E-4, an opening order in an ITM or close-to-money stock option).
        message: { type: string }
        severity: { type: string, enum: [block, warn] }
    PreviewResult:
      type: object
      required: [ok, mode, checks, requiresHumanConfirmation]
      properties:
        ok: { type: boolean }
        mode: { type: string, enum: [paper, live] }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        margin:
          description: >-
            The margin this order would block. Paper orders (a paper account, or any account in paper mode): the paper
            engine's own model on the exposure the order adds (a quantity that closes a held position blocks nothing),
            the same figure its fill will use. Live orders: null (the broker decides). Each leg of a basket is sized
            alone, with no hedge benefit.
          oneOf:
            - type: object
              required: [required, source]
              properties:
                required: { type: [number, "null"], description: "Rupees." }
                source: { type: [string, "null"], enum: [paper-model, null] }
            - type: "null"
        resolved: { oneOf: [{ $ref: "#/components/schemas/Instrument" }, { type: "null" }] }
        quantity: { type: [integer, "null"] }
        estimatedValue: { type: [number, "null"] }
        ltp: { type: [number, "null"] }
        confirmToken: { type: [string, "null"] }
        confirmExpiresAt: { type: [string, "null"], format: date-time }
        requiresHumanConfirmation: { type: boolean }
        ticketId: { type: [string, "null"], description: "Set when a human must confirm; the ticket appears in GET /v1/tickets (the dashboard's Pending confirmations panel)." }
    TargetOrderRequest:
      type: object
      required: [account, symbol, product, orderType]
      additionalProperties: false
      oneOf:
        - { required: [targetQuantity] }
        - { required: [targetLots] }
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        symbol: { $ref: "#/components/schemas/Symbol" }
        targetQuantity: { type: integer, minimum: -100000000, maximum: 100000000, description: "Signed units: 100 long, 0 flat, -50 short. Send this or targetLots." }
        targetLots: { type: integer, minimum: -100000, maximum: 100000, description: Signed lots. }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF], description: "MIS and NRML are read as INTRADAY and MARGIN. The position is read for this product." }
        orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
        price: { type: number, exclusiveMinimum: 0 }
        triggerPrice: { type: number, exclusiveMinimum: 0 }
        validity: { type: string, enum: [DAY, IOC] }
        marketProtectionPct: { type: number, exclusiveMinimum: 0, maximum: 10 }
        mode: { type: string, enum: [paper, live], default: paper }
        clientOrderId: { $ref: "#/components/schemas/ClientOrderId" }
        tag: { type: string, pattern: "^[A-Za-z0-9_-]{1,20}$" }
        algoId: { type: string, maxLength: 32 }
        confirmToken: { type: string }
        dryRun: { type: boolean, default: false, description: Work everything out and run the checks; place nothing. }
        openOrders:
          type: string
          enum: [refuse, ignore]
          default: refuse
          description: "refuse: an open order of the Bridge in this symbol and product that can change the position is STATE_CONFLICT (a resting SL or SL-M order does not count). ignore: size against the position only."
      oneOf:
        - required: [targetQuantity]
          not: { required: [targetLots] }
        - required: [targetLots]
          not: { required: [targetQuantity] }
    TargetOrderResult:
      type: object
      required: [account, symbol, product, mode, currentQuantity, targetQuantity, delta, action, dryRun, placed, order]
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        symbol: { $ref: "#/components/schemas/Symbol" }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF] }
        mode: { type: string, enum: [paper, live] }
        lotSize: { type: integer }
        currentQuantity: { type: integer, description: "Signed units held now in this symbol and product." }
        targetQuantity: { type: integer }
        delta: { type: integer, description: "targetQuantity minus currentQuantity." }
        action: { type: string, enum: [BUY, SELL, NONE] }
        dryRun: { type: boolean }
        placed: { type: boolean }
        order: { oneOf: [{ $ref: "#/components/schemas/OrderResult" }, { type: "null" }] }
        preview: { oneOf: [{ $ref: "#/components/schemas/PreviewResult" }, { type: "null" }], description: "With dryRun when an order would be needed." }
        otherProducts:
          type: array
          description: Positions in this symbol in other products. Reported, never added to currentQuantity.
          items:
            type: object
            properties:
              product: { type: string }
              netQty: { type: number }
        openOrders:
          type: array
          description: Open orders of the Bridge in this symbol and product.
          items:
            type: object
            properties:
              orderId: { type: string }
              side: { type: string }
              quantity: { type: integer }
              filledQuantity: { type: integer }
              orderType: { type: string }
              status: { type: string }
        positionFreshness: { oneOf: [{ $ref: "#/components/schemas/Freshness" }, { type: "null" }] }
        replayed: { type: boolean, description: True when this is the first answer returned again for the same idempotency key. }
    OrderBatchRequest:
      type: object
      required: [account, orders]
      additionalProperties: false
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        orders:
          type: array
          minItems: 1
          maxItems: 20
          description: "Orders as for POST /v1/orders, without `account` (a leg may repeat the batch account, no other)."
          items: { type: object }
        stopOnError: { type: boolean, default: false }
        legOrder: { type: string, enum: [as-sent, buys-first], default: as-sent, description: "Order of sending. Results stay in the order sent." }
        mode: { type: string, enum: [paper, live], description: "Applies to every leg that does not set its own." }
    OrderBatchLeg:
      type: object
      required: [index, ok, status]
      properties:
        index: { type: integer }
        ok: { type: boolean }
        status: { type: string, enum: [placed, rejected, outcome_unknown, skipped] }
        orderId: { type: string }
        order: { $ref: "#/components/schemas/OrderResult" }
        replayed: { type: boolean }
        idempotencyKey: { type: string, description: The request key plus the leg index. }
        error:
          type: object
          required: [code, message, status, retryable]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            status: { type: integer }
            retryable: { type: boolean }
            errors: { type: array, items: { type: object } }
            retryAfterMs: { type: integer }
        reason: { type: string, description: "Skipped legs only." }
    OrderBatchResult:
      type: object
      required: [account, ok, summary, results]
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        ok: { type: boolean, description: True only when every leg was placed. }
        summary:
          type: object
          required: [total, placed, rejected, outcomeUnknown, skipped]
          properties:
            total: { type: integer }
            placed: { type: integer }
            rejected: { type: integer }
            outcomeUnknown: { type: integer, description: "Legs whose outcome is not known: check the order book before sending again." }
            skipped: { type: integer }
        stopOnError: { type: boolean }
        legOrder: { type: string }
        results: { type: array, items: { $ref: "#/components/schemas/OrderBatchLeg" } }
        replayed: { type: boolean }
    MarginBasketRequest:
      type: object
      required: [positions]
      additionalProperties: false
      properties:
        account: { $ref: "#/components/schemas/AccountId" }
        positions:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [symbol, side]
            additionalProperties: false
            description: "Send exactly one of `quantity` (units) or `lots`."
            oneOf:
              - { required: [quantity] }
              - { required: [lots] }
            properties:
              symbol: { $ref: "#/components/schemas/Symbol" }
              side: { type: string, enum: [BUY, SELL] }
              quantity: { type: integer, minimum: 1 }
              lots: { type: integer, minimum: 1 }
              product: { type: string, enum: [CNC, INTRADAY, MARGIN, MTF], description: "MIS and NRML are read. Default: INTRADAY for shares, MARGIN for futures and options." }
              orderType: { type: string, enum: [LIMIT, MARKET, SL, SL-M] }
              price: { type: number, exclusiveMinimum: 0, description: "Default: the last price." }
      description: "`account` is optional: the account whose broker should answer; without it a paper account the key may use is taken."
    MarginBasket:
      type: object
      required: [total, source, account, legs, asOf]
      properties:
        total: { type: number, description: "Rupees, for the basket on its own with hedges between its legs counted." }
        span: { type: [number, "null"] }
        exposure: { type: [number, "null"] }
        hedgeBenefit: { type: [number, "null"], description: "What the legs would need alone, minus total." }
        source: { type: string, enum: [broker, paper-model] }
        account: { $ref: "#/components/schemas/AccountId" }
        legs: { type: integer }
        asOf: { type: string, format: date-time }
        note: { type: [string, "null"], description: "Says plainly when the figure is the approximate paper model, and why." }
        model: { type: [string, "null"] }
        method: { type: [string, "null"] }
        breakdown: { type: [object, "null"], description: "paper-model only: premium, span, exposure, calendar, elm." }
        fallback: { type: array, items: { type: string }, description: "paper-model only: underlyings margined by the simple per-leg rule because no price was available." }
    Ticket:
      type: object
      required: [ticketId, order, source, checks, createdAt, expiresAt]
      properties:
        ticketId: { type: string }
        order: { $ref: "#/components/schemas/OrderRequest" }
        source: { type: string, enum: [mcp, webhook, rest] }
        client: { type: string, description: "Key label or hook label that prepared it." }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        estimatedValue: { type: [number, "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [open, rejected], description: "`open` while it waits for a person; `rejected` once a person declined it." }
        rejectedAt: { type: string, format: date-time, description: "Declined tickets only." }
        reason: { type: [string, "null"], maxLength: 200, description: "Declined tickets only: the person's reason, when they gave one." }
    Trade:
      type: object
      required: [tradeId, orderId, symbol, side, qty, price]
      properties:
        tradeId: { type: string }
        orderId: { type: string }
        accountId: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live] }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        qty: { type: number }
        price: { type: number }
        product: { type: [string, "null"] }
        charges: { type: [number, "null"] }
        tradedAt: { type: [string, "null"], format: date-time }
    PaperAccount:
      type: object
      required: [accountId, startingCapital, funds]
      properties:
        accountId: { $ref: "#/components/schemas/AccountId" }
        startingCapital: { type: number }
        createdAt: { type: string, format: date-time }
        resetAt: { type: [string, "null"], format: date-time }
        ordersToday: { type: integer }
        funds: { $ref: "#/components/schemas/Funds" }
        fillModel: { type: string, description: "Short description of how paper fills are simulated." }

    LimitsReport:
      type: object
      properties:
        safety:
          type: object
          description: Effective safety limits per account (the stricter of global and account values).
          additionalProperties:
            type: object
            properties:
              dailyMaxOrders: { type: integer }
              dailyMaxLoss: { type: number }
              maxOrderValue: { type: number }
              maxLotsPerOrder: { type: integer }
              orderRatePerSecond: { type: number }
        brokers:
          type: object
          additionalProperties: { $ref: "#/components/schemas/BrokerPolicy" }
        client:
          type: object
          description: This key's own request budget.
          properties:
            perSecond: { type: number }
            burst: { type: number }
            remaining: { type: number }
        accounts:
          type: array
          description: Each broker account's remaining budget per kind of call.
          items:
            type: object
            properties:
              accountId: { type: string }
              broker: { type: string }
              classes:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    remaining: { type: number }
                    limit: { type: number }
                    resetMs: { type: integer }
        pools:
          type: array
          description: Only with `explain=1`. The shared bucket groups behind the broker accounts.
          items: { $ref: "#/components/schemas/LimitsPool" }
        consumers:
          type: array
          description: Only with `explain=1`. Who is waiting in the fair queue and each one's share.
          items: { $ref: "#/components/schemas/LimitsConsumer" }
        savedCalls:
          type: object
          description: Only with `explain=1`. Broker calls not made today because the data was already on this computer, in the stream or in the cache.
          properties:
            day: { type: string, description: "The IST day these counts are for." }
            total: { type: integer, minimum: 0, description: "Calls avoided by serving stored data (datasets, recordings)." }
            byReason: { type: object, additionalProperties: { type: integer }, description: "For example local-dataset and dataset-incremental." }
            scheduler:
              type: object
              description: What the rate-limit engine saved today.
              properties:
                servedFromStream: { type: integer }
                servedFromCache: { type: integer }
                coalesced: { type: integer }
                batched: { type: integer }
            totalToday: { type: integer, minimum: 0, description: "total plus everything the scheduler saved." }
    UsageReport:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              broker: { type: string }
              healthy: { type: boolean }
              inFlight: { type: integer }
              queued: { type: integer }
              classes:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: true
                  properties:
                    used: { type: number }
                    limit: { type: number }
                    queued: { type: integer }
                    resetMs: { type: integer }
        generatedAt: { type: string, format: date-time }
        consumers:
          type: array
          description: Who has used the budget (keys and tools), when any have.
          items: { type: object, additionalProperties: true }
        savings:
          type: object
          description: Broker calls avoided today.
          properties:
            since: { type: string, format: date-time, description: "When the count started (the start of today, IST)." }
            servedFromLocal: { type: integer, description: "Served from data already stored on this computer (datasets, recordings)." }
            servedFromStream: { type: integer }
            servedFromCache: { type: integer }
            coalesced: { type: integer }
            batched: { type: integer }
    DataClass:
      type: string
      enum: [realtime, delayed, eod]
      description: |
        How current an answer is. `realtime`: from your own broker account (or its live stream). `delayed`: the source is
        slow by nature (usually about 15 minutes). `eod`: end-of-day values only. A composite answer (an option chain, a
        many-symbol quote) takes the least current class of its parts. `delayed` is not the same as `freshness.stale`:
        stale means older than the freshness target for that source.
    DownloadStatus:
      type: string
      enum: [queued, running, paused, done, failed, cancelled]
    DownloadRequest:
      type: object
      additionalProperties: false
      required: [intervals, from]
      description: Give `symbols` or `collection`, not both.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        symbols: { type: array, minItems: 1, maxItems: 500, items: { type: string, maxLength: 64 }, description: "Canonical symbols such as NSE:NIFTY." }
        collection: { type: string, maxLength: 64, description: "The name of a collection; it is resolved when the job starts." }
        intervals: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/Interval" } }
        from: { type: string, description: "ISO date or date-time (IST when no offset), or epoch seconds. For an existing dataset the job continues from its last stored bar." }
        to: { type: string, description: "Default: now. The bar still forming is never stored." }
        format: { type: string, enum: [csv, jsonl, amibroker], default: csv }
        layout: { type: string, enum: [per-symbol, combined], default: per-symbol, description: "combined writes one file per interval with a symbol column. A dataset is always per-symbol." }
        dataset: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", description: "Continue (or create) this dataset instead of writing a one-off set of files." }
        account: { type: string, description: "Use only this broker account." }
        backup: { type: boolean, default: false, description: "Allow data sources other than your broker accounts. The files then carry the source's data class (delayed or eod)." }
        afterHoursOnly: { type: boolean, description: "Wait outside market hours. Default: follows the downloads setting when the job runs (downloads.afterHoursOnly, or GET /v1/downloads/settings)." }
        allowExpired: { type: boolean, default: false, description: "Accept symbols of contracts that have already expired (they are in no instrument master) to download their history. Without it an unknown or expired symbol is refused with 400 VALIDATION_FAILED, the unknown symbols are named in `unknownSymbols`, each with suggestions." }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 32 } }
    DownloadEstimate:
      type: object
      description: What a download will cost. Rows assume every trading minute has a bar, so a thin stock has fewer; the time assumes the broker's published limit is the only limit.
      properties:
        symbols: { type: integer }
        intervals: { type: integer }
        items: { type: integer }
        brokerCalls: { type: integer, description: "Calls the broker will see, after what is already stored on this computer." }
        callsSaved: { type: integer, description: "Calls not needed because that part is already stored." }
        rows: { type: integer }
        rowsToFetch: { type: integer }
        bytes: { type: integer }
        bytesPerRow: { type: integer }
        etaSec: { type: [integer, "null"], description: "Seconds at your budget share; null when no account is known." }
        callsPerSecond: { type: [number, "null"] }
        limitingWindow: { type: [string, "null"], description: "The broker window that sets the pace (1s, 1m, 1h or day)." }
        budgetShare: { type: number }
        account: { type: [string, "null"] }
        broker: { type: [string, "null"] }
        alreadyStored: { type: integer, description: "Items that need no broker call at all." }
        disk:
          type: object
          properties:
            usedBytes: { type: integer }
            queuedBytes: { type: integer, description: "What the jobs already waiting or running are still expected to write." }
            maxBytes: { type: integer }
            freeBytes: { type: [integer, "null"], description: "Free space on the disk that holds the data folder; null when the system cannot say." }
            minFreeBytes: { type: integer, description: "downloads.minFreeDiskMb in bytes: a job pauses rather than leave less than this free." }
            wouldExceed: { type: boolean, description: "True when the job would pass the disk limit or leave less than the free-disk floor." }
        notes: { type: array, items: { type: string } }
    DownloadJob:
      type: object
      required: [id, name, status, progress, request, dataClass, createdAt, manifestUrl]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/DownloadStatus" }
        reason: { type: [string, "null"], description: "Why a job is paused or failed: user, kill_switch, session_lost, market_hours, disk_low, key_revoked, disk_limit, items_failed, restart or internal." }
        message: { type: [string, "null"], description: "A plain sentence about the reason." }
        createdBy: { type: [string, "null"], description: "The key (key:<id>) or this computer (local) that started the job. Only that key, or an admin, may pause, resume, cancel or rename it. null for a job made before owners were recorded: admin only." }
        progress:
          type: object
          properties:
            total: { type: integer }
            done: { type: integer }
            failed: { type: integer }
            rows: { type: integer }
            bytes: { type: integer }
            etaSec: { type: [integer, "null"] }
            current: { type: [object, "null"], properties: { symbol: { type: string }, interval: { type: string } } }
            waiting: { type: [object, "null"], description: "Set while the job waits for budget, a retry or market close.", properties: { reason: { type: string }, waitMs: { type: integer } } }
        items:
          type: array
          description: Left out of the list answer unless include=items.
          items:
            type: object
            properties:
              symbol: { type: string }
              interval: { type: string }
              status: { type: string, enum: [pending, running, done, failed] }
              rows: { type: integer }
              error: { type: object, properties: { code: { type: string }, message: { type: string }, fix: { type: string, description: What to do about it. } } }
        failure: { oneOf: [{ $ref: "#/components/schemas/FailureReason" }, { type: "null" }], description: "Set when status is failed: the real reason (the code and text of the first failed item, or of the job) and the fix. null otherwise." }
        request: { type: object, description: "The request as the Bridge understood it." }
        dataset: { type: [string, "null"] }
        collection: { type: object, description: "Present when the symbols came from a collection.", properties: { name: { type: string }, resolvedAt: { type: string }, rule: {} } }
        tags: { type: array, items: { type: string } }
        dataClass: { $ref: "#/components/schemas/DataClass" }
        source: { type: [string, "null"], description: "Where the bars came from (broker id or data source)." }
        official: { type: [boolean, "null"] }
        delaySec: { type: [integer, "null"] }
        callsSaved: { type: integer, description: "Broker calls this job did not need because the data was already stored." }
        notes: { type: array, items: { type: string }, description: "Gaps found, bars served from a dataset, and the data-class warning." }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        manifestUrl: { type: string }
    FailureReason:
      type: object
      required: [code, message, fix]
      description: "Why a download or recording did not work, in plain words. code is an API problem code (see GET /v1/errors) or a reason of the job itself (disk_limit, disk_full, internal, LOGIN_MISSING, UNIVERSE_UNRESOLVED, feed-silent ...)."
      properties:
        code: { type: string }
        message: { type: string, description: What happened. The real text, not a generic one. }
        fix: { type: string, description: What to do next. }
        symbol: { type: string, description: "Downloads: the first failed item." }
        interval: { type: string }
        failedItems: { type: integer, description: "Downloads: how many items failed." }
        since: { type: [string, "null"], description: "Recordings: when the problem began." }
    DownloadFile:
      type: object
      required: [name, rows, bytes, sha256]
      properties:
        name: { type: string }
        symbol: { type: [string, "null"], description: "null for a combined file." }
        interval: { type: string }
        rows: { type: integer }
        bytes: { type: integer }
        firstBar: { type: [string, "null"], description: "IST bar-open time of the first bar." }
        lastBar: { type: [string, "null"] }
        sha256: { type: [string, "null"] }
    DownloadSettings:
      type: object
      required: [maxBudgetShare, afterHoursOnly, defaults, limits]
      properties:
        maxBudgetShare: { type: number, minimum: 0.05, maximum: 0.8, description: "The share of an account's spare API budget downloads may use now." }
        afterHoursOnly: { type: boolean, description: Jobs wait for the market to close (unless a job says otherwise). }
        defaults:
          type: object
          description: The values in bridge.config.json (or the built-in defaults).
          properties: { maxBudgetShare: { type: number }, afterHoursOnly: { type: boolean } }
        limits:
          type: object
          properties: { minBudgetShare: { type: number, example: 0.05 }, maxBudgetShare: { type: number, example: 0.8 } }
        changed: { type: array, items: { type: string }, description: The fields changed at run time. }
    DownloadSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        maxBudgetShare: { type: number, minimum: 0.05, maximum: 0.8 }
        afterHoursOnly: { type: boolean }
    Dataset:
      type: object
      required: [name, format, series, rows, bytes]
      properties:
        name: { type: string }
        title: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        format: { type: string, enum: [csv, jsonl, amibroker] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        request: { type: object }
        dataClass: { $ref: "#/components/schemas/DataClass" }
        source: { type: [string, "null"] }
        official: { type: [boolean, "null"] }
        delaySec: { type: [integer, "null"] }
        series: { type: integer, description: "Number of symbol and interval files." }
        rows: { type: integer }
        bytes: { type: integer }
        gaps: { type: integer, description: "Stretches with missing bars, over all files." }
        lastJobId: { type: [string, "null"] }
        createdBy: { type: [string, "null"], description: "The key that created the dataset. Only that key, or an admin, may write into it with a new job, rename it or tag it; any read key may ask for its update." }
        activeJobId: { type: [string, "null"], description: "A job that is queued, running or paused for this dataset." }
        files:
          type: array
          description: Only on GET /v1/datasets/{name}.
          items:
            type: object
            properties:
              symbol: { type: string }
              interval: { type: string }
              name: { type: string }
              url: { type: string, description: "Where to fetch this file: /v1/datasets/{name}/files/{file}." }
              rows: { type: integer }
              bytes: { type: integer }
              firstBar: { type: [string, "null"] }
              lastBar: { type: [string, "null"] }
              coverage: { type: [object, "null"], description: "The stretch fetched and stored, with no failed call inside it.", properties: { from: { type: string }, to: { type: string } } }
              sha256: { type: [string, "null"] }
              gapsTotal: { type: integer }
              gaps:
                type: array
                description: The first 50 stretches with missing bars.
                items:
                  type: object
                  properties:
                    from: { type: string }
                    to: { type: string }
                    missing: { type: integer }
                    kind: { type: string, enum: [missing-bars, missing-days] }
        notes: { type: array, items: { type: string } }
    Confidence:
      type: string
      enum: [high, medium, low]
      description: "How far to trust one value: `high` for a broker or stream value, lower for a delayed or unofficial source or a value carrying flags."
    SourceCapability:
      type: string
      enum: [quotes, history, expiries, optionChain]
      description: What a source can be asked. All four are read-only; no source places orders.
    ErrorCatalogueEntry:
      type: object
      required: [code, status, title, retryable, retry, means, fix]
      properties:
        code: { type: string, description: "The stable `code` in a problem answer." }
        status: { type: integer, description: "The HTTP status that goes with it." }
        title: { type: string }
        retryable: { type: boolean, description: "Whether sending exactly the same request again can succeed." }
        retry: { type: string, description: "One sentence on whether and when to retry." }
        means: { type: string, description: "What happened, in plain words." }
        fix: { type: string, description: "What to do about it." }
    RequestRoute:
      type: object
      description: |
        What answered a market-data read (`/v1/ltp`, `/v1/quotes`, `/v1/depth`, `/v1/history`, `/v1/expiries`, `/v1/optionchain`), on its entry in `GET /v1/requests`. It is built from the freshness labels the read already returned, so it costs no extra upstream call, and it is one record per request, never a list per symbol. A read of several symbols is summed up: `from` is the least current verdict and `class` the least current data class. Absent for other routes and for a read that answered nothing.
      required: [from, class, delaySec]
      properties:
        from:
          type: string
          enum: [stream, cache, shared, live, stale]
          description: "`stream` = a live subscription answered. `cache` = a value inside its freshness target. `shared` = the read joined a call another caller already had in flight. `live` = a call was made for this read (a broker account or a data source). `stale` = at least one value came from the cache past its freshness target. For several symbols the order is stale, live, shared, cache, stream."
        source: { type: string, description: "Id of the broker or data source that answered; a data source is named before a broker, else the one that answered most items." }
        sourceName: { type: string, description: "A name to show for `source`." }
        class: { type: string, enum: [realtime, delayed, eod], description: "The least current data class among the answers." }
        delaySec: { type: integer, description: "The largest delay among the answers, 0 for real-time." }
    SourceHealth:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [ok, degraded, open, disabled]
          description: "`open` = ejected for now after repeated failures (see nextTryAt); `disabled` = switched off by the Bridge, with the reason in lastError (for example a plugin that crashed four times in ten minutes)."
        errorRate: { type: [number, "null"], description: "Recent share of failed calls, 0 to 1." }
        p50Ms: { type: [number, "null"], description: "Median latency of recent calls." }
        lastError: { type: [string, "null"] }
        lastErrorKind:
          type: string
          enum: [none, auth, rate-limit, not-found, hard]
          description: "What kind of trouble `lastError` was: `auth` the key or login was refused, `rate-limit` the vendor is limiting requests, `not-found` it does not know the symbol, `hard` a timeout, network or server error. `none` when there is no error, or a call has answered since."
        nextTryAt: { type: [string, "null"], format: date-time }
    DataSource:
      type: object
      required: [id, name, kind, tier, enabled, configured, class, delaySec, official, capabilities, limits, usage, health, needsKey]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{1,30}$" }
        name: { type: string }
        kind: { type: string, enum: [broker, free, plugin] }
        tier:
          type: string
          enum: [builtin, byok, opt-in, plugin]
          description: "`builtin` your own broker accounts (on); `byok` you hold the vendor account and a key; `opt-in` unofficial or terms-sensitive, off until you acknowledge a notice; `plugin` third-party code you granted."
        enabled: { type: boolean }
        configured: { type: boolean, description: "Ready to use: it has its key when it needs one." }
        class: { $ref: "#/components/schemas/DataClass" }
        delaySec: { type: [integer, "null"], description: "Typical delay of a delayed source; 0 for real-time; null where it does not apply." }
        official: { type: boolean, description: "True only for a documented API from the data's owner or your own broker. Plugins are never official." }
        capabilities: { type: array, items: { $ref: "#/components/schemas/SourceCapability" } }
        limits:
          type: object
          description: The vendor's documented limits. The Bridge never goes above them.
          properties:
            perSecond: { type: number }
            perMinute: { type: number }
            perDay: { type: number }
        usage:
          type: object
          required: [lastMinute, today]
          properties:
            lastMinute: { type: integer, minimum: 0 }
            today: { type: integer, minimum: 0 }
        health: { $ref: "#/components/schemas/SourceHealth" }
        terms:
          type: [object, "null"]
          description: The vendor's terms. Null for your own broker accounts.
          properties:
            url: { type: string, format: uri }
            note: { type: string, description: "One plain sentence about what you accept by turning it on." }
        noticeVersion: { type: string, description: "Opt-in sources: the notice version `acknowledge` must equal to turn it on." }
        needsKey: { type: boolean }
        needsAcknowledgement: { type: boolean, description: "Opt-in sources: true until the notice has been accepted." }
        consent:
          type: [object, "null"]
          description: When you acknowledged the notice, or null.
          properties:
            acceptedAt: { type: string, format: date-time }
            noticeVersion: { type: string }
        version: { type: string, description: "Plugins only: the plugin's own version." }
        flags:
          type: array
          items: { type: string }
          description: "Labels every answer from this source carries, for example `plugin`, `unofficial`, `delayed`."
    SourceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: { type: boolean }
        acknowledge: { type: string, maxLength: 64, description: "The source's `noticeVersion`, to turn on an opt-in source." }
    SourcesSettingsUpdate:
      type: object
      additionalProperties: false
      required: [autoFallback]
      properties:
        autoFallback: { type: boolean, description: "Use free sources automatically when your brokers cannot answer a display or analysis read." }
    SourcesSettings:
      type: object
      required: [autoFallback, autoFallbackSource]
      properties:
        autoFallback: { type: boolean }
        autoFallbackSource: { type: string, enum: [setting, config, default] }
        persisted: { type: boolean, description: "False when the choice holds for this run but could not be written to the data folder." }
    SourceConfigRequest:
      type: object
      additionalProperties: false
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 4, maxLength: 500, description: "Never echoed back, logged or written to the configuration file." }
    SourceTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        latencyMs: { type: number }
        detail: { type: string, maxLength: 200 }
    RoutingTrace:
      type: object
      required: [request, considered, class]
      properties:
        request:
          type: object
          properties:
            capability: { $ref: "#/components/schemas/SourceCapability" }
            symbols: { type: array, items: { type: string } }
            purpose: { $ref: "#/components/schemas/Purpose" }
            maxAgeMs: { type: [integer, "null"] }
            allowBackup: { type: boolean, description: "Whether sources other than your broker accounts may serve the read." }
        considered:
          type: array
          items:
            type: object
            required: [id, kind, verdict, reason]
            properties:
              id: { type: string, description: "A broker account id or a source id." }
              kind: { type: string, enum: [broker, source] }
              verdict: { type: string, enum: [chosen, fallback, skipped] }
              reason: { type: string, description: "Plain words. Do not parse them." }
              score: { type: number }
              spareBudget: { type: number, description: "Share of the candidate's budget that is free right now, 0 to 1." }
              health: { $ref: "#/components/schemas/SourceHealth" }
        class:
          oneOf:
            - { $ref: "#/components/schemas/DataClass" }
            - { type: "null" }
          description: The data class the answer would carry; null when nothing can serve the read.
        note: { type: string }
    Purpose:
      type: string
      enum: [display, analysis, alert, paper, risk, order]
      description: What a read is for. `alert`, `paper`, `risk` and `order` accept only real-time data from your own broker.
    PoolingState:
      type: object
      required: [consent, groups, notice]
      properties:
        consent:
          type: [object, "null"]
          description: Null while pooling is off.
          properties:
            acceptedAt: { type: string, format: date-time }
            version: { type: string }
            accounts: { type: array, items: { type: string } }
        groups:
          type: array
          description: Accounts grouped by holder. Only accounts of one holder are ever pooled.
          items:
            type: object
            required: [holder, accounts]
            properties:
              holder: { type: string }
              accounts:
                type: array
                items:
                  type: object
                  required: [id, label, broker, poolingPolicy, inPool]
                  properties:
                    id: { $ref: "#/components/schemas/AccountId" }
                    label: { type: string, description: "The name you gave the account (its broker's name when you gave none), so a screen need not show the id." }
                    broker: { type: string }
                    poolingPolicy: { type: string, enum: [allowed, not-allowed, unknown], description: "What the broker's published terms say. `not-allowed` is never pooled." }
                    inPool: { type: boolean }
                    poolingNote: { type: string }
                    dataEntitlement: { type: object, additionalProperties: true }
                    optedIn: { type: boolean }
                    consented: { type: boolean }
        notice:
          type: object
          required: [version, text]
          properties:
            version: { type: string }
            text: { type: string }
    PoolingConsentRequest:
      type: object
      additionalProperties: false
      required: [acknowledge, accounts]
      properties:
        acknowledge: { type: string, description: "The current `notice.version`." }
        accounts: { type: array, minItems: 1, items: { $ref: "#/components/schemas/AccountId" } }
    QuotaKey:
      type: object
      required: [keyId, label, clientKind, weight, perSecond, burst, perDay, usage, source]
      properties:
        keyId: { type: string }
        label: { type: string }
        clientKind: { type: string, enum: [ui, mcp, excel, script, other] }
        weight: { type: number, minimum: 0, description: "Share in the fair queue against other keys." }
        perSecond: { type: number }
        burst: { type: number }
        perDay: { type: [integer, "null"], description: "Daily request cap; null for none." }
        usage:
          type: object
          required: [lastMinute, today, throttledToday]
          properties:
            lastMinute: { type: integer, minimum: 0 }
            today: { type: integer, minimum: 0 }
            throttledToday: { type: integer, minimum: 0, description: "Requests refused or delayed by this key's own limits today." }
        source: { type: string, enum: [default, config, override] }
    QuotasReport:
      type: object
      required: [default, kinds, keys]
      properties:
        default:
          type: object
          required: [perSecond, burst]
          properties:
            perSecond: { type: number }
            burst: { type: number }
            perDay: { type: [integer, "null"], description: "A daily cap per key; null means none." }
            maxConcurrent: { type: integer, description: "Requests in flight at once, per key." }
        kinds:
          type: object
          description: Default fair-queue weight by client kind.
          properties:
            ui: { type: number }
            mcp: { type: number }
            excel: { type: number }
            script: { type: number }
            other: { type: number }
        keys: { type: array, items: { $ref: "#/components/schemas/QuotaKey" } }
    QuotaOverride:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        perSecond: { type: number, exclusiveMinimum: 0 }
        burst: { type: number, minimum: 1 }
        weight: { type: number, exclusiveMinimum: 0 }
        perDay: { type: [integer, "null"], minimum: 1 }
    LimitsPool:
      type: object
      required: [group, accounts, spare, ceiling, backoffFactor]
      properties:
        group: { type: string, description: "A shared bucket group: the accounts whose reads draw on the same limit." }
        accounts: { type: array, items: { type: string } }
        spare: { type: number, description: "Free budget right now, in requests per second." }
        ceiling: { type: number, description: "The documented limit the Bridge stays below." }
        backoffFactor: { type: number, description: "1 when healthy; below 1 while the limiter is backing off after a 429." }
    LimitsConsumer:
      type: object
      required: [id, label, queued, inFlight, share]
      properties:
        id: { type: string }
        label: { type: string }
        queued: { type: integer, minimum: 0 }
        inFlight: { type: integer, minimum: 0 }
        share: { type: number, description: "This consumer's fair share of contended capacity, 0 to 1." }
    KillSwitchState:
      type: object
      required: [engaged]
      properties:
        engaged: { type: boolean }
        reason: { type: [string, "null"] }
        by: { type: [string, "null"] }
        at: { type: [string, "null"], format: date-time }
    SafetyStatus:
      type: object
      required: [killSwitch, liveTrading]
      properties:
        killSwitch: { $ref: "#/components/schemas/KillSwitchState" }
        liveTrading: { type: boolean, description: "Global config switch." }
        day: { type: string, description: "The IST day the counters are for (YYYY-MM-DD)." }
        accounts:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              liveAllowedByConfig: { type: boolean }
              ordersToday: { type: integer }
              realisedPnlToday: { type: number }
              paperOrdersToday: { type: integer, description: "Paper orders only; they do not count towards the live limits." }
              paperRealisedPnlToday: { type: number }
              ordersLastSecond: { type: integer }
              limits: { type: object }
    ReadinessState:
      type: string
      description: "Account trading readiness. Open enum: new values may be added."
      enum: [ready, warn, cannot_trade, paper_only, unknown]
    ReadinessReason:
      type: object
      required: [check, code, severity, message]
      properties:
        check: { type: string, examples: [session, egress, orderRate, dailyOrders, dailyLoss, killSwitch, live, readiness] }
        code:
          type: string
          description: >-
            Open list: LIVE_OFF, SESSION_EXPIRED, SESSION_MISSING, SESSION_ERROR, SESSION_REJECTED, SESSION_EXPIRES_SOON,
            PROBE_FAILED, IP_MISMATCH, IP_NOT_REGISTERED, IP_INVALID_CONFIG, IP_FAMILY_DIFFERS, IP_UNCHECKED,
            IP_LOOKUP_FAILED, CLOCK_SKEW, RATE_CAP_REACHED, BROKER_ORDER_BACKOFF, DAILY_ORDERS_LOW, DAILY_ORDERS_EXHAUSTED,
            DAILY_LOSS_NEAR, DAILY_LOSS_REACHED, KILL_SWITCH, STALE.
        severity: { type: string, enum: [warn, fail] }
        message: { type: string }
    ReadinessCheck:
      type: object
      required: [status]
      additionalProperties: true
      properties:
        status: { type: string, enum: [pass, warn, fail, unknown, n/a] }
    ReadinessAutomation:
      type: object
      required: [id, kind, label, mode, state]
      properties:
        id: { type: string }
        kind: { type: string, examples: [webhook, guard, alert, sample] }
        label: { type: string }
        mode: { type: string, enum: [paper, live] }
        state: { $ref: "#/components/schemas/ReadinessState" }
    AccountReadiness:
      type: object
      required: [accountId, broker, state, reasons, checks, live, simulated, stale]
      properties:
        accountId: { $ref: "#/components/schemas/AccountId" }
        broker: { type: string }
        brokerName: { type: string }
        label: { type: [string, "null"] }
        simulated: { type: boolean, description: "Demo mode: a simulated live account (no real broker)." }
        live:
          type: object
          properties:
            globalLiveTrading: { type: [boolean, string] }
            accountLiveEnabled: { type: [boolean, string] }
            allowedByConfig: { type: boolean }
        state: { $ref: "#/components/schemas/ReadinessState" }
        since: { type: [string, "null"], format: date-time }
        checkedAt: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        reasons: { type: array, items: { $ref: "#/components/schemas/ReadinessReason" } }
        checks:
          type: object
          properties:
            session: { $ref: "#/components/schemas/ReadinessCheck" }
            egress: { $ref: "#/components/schemas/ReadinessCheck" }
            orderRate: { $ref: "#/components/schemas/ReadinessCheck" }
            dailyOrders: { $ref: "#/components/schemas/ReadinessCheck" }
            dailyLoss: { $ref: "#/components/schemas/ReadinessCheck" }
            killSwitch: { $ref: "#/components/schemas/ReadinessCheck" }
        automations: { type: array, items: { $ref: "#/components/schemas/ReadinessAutomation" } }
    Readiness:
      type: object
      required: [overall, summary, accounts, paperOnly, method]
      properties:
        overall: { $ref: "#/components/schemas/ReadinessState" }
        summary: { type: string, examples: ["1 of 2 live accounts cannot trade"] }
        checkedAt: { type: [string, "null"], format: date-time }
        disabled: { type: boolean, description: "readiness.enabled is false." }
        accounts: { type: array, items: { $ref: "#/components/schemas/AccountReadiness" } }
        paperOnly: { type: boolean }
        egress:
          type: object
          description: ip and seenBy only for callers on this computer or with the admin scope.
          properties:
            mode: { type: string, enum: ["off", lookup, manual] }
            checkedAt: { type: [string, "null"], format: date-time }
            family: { type: [string, "null"], enum: [ipv4, ipv6, null] }
            seenBy: { type: [string, "null"] }
            ip: { type: [string, "null"] }
            clockSkewMs: { type: [integer, "null"] }
            lastError: { type: [string, "null"] }
            simulated: { type: boolean, description: "Demo mode: the address is a made-up one." }
        schedule: { type: object, additionalProperties: true }
        automations:
          type: object
          properties:
            total: { type: integer }
            live: { type: integer }
            cannotTrade: { type: integer }
        notifications:
          type: object
          properties:
            targetsListening: { type: array, items: { type: string } }
            warning: { type: [string, "null"] }
            demoOff: { type: boolean }
            wouldHaveSent: { type: array, items: { type: string }, description: "Demo mode: the messages that would have been sent." }
        method: { type: string }
        referenceData: { $ref: "#/components/schemas/ReferenceDataFreshness" }
    ReferenceDataFreshness:
      type: object
      required: [today, level, summary, items]
      description: >-
        How current the reference data shipped with the Bridge is (holidays, session hours, special sessions, freeze
        quantities, charges, delivery margin). It warns when the holiday calendar has no rows for next year or a dataset's
        asOf is older than six months. A warning never blocks an order.
      properties:
        today: { type: string, format: date }
        level: { type: string, enum: [ok, warn] }
        summary: { type: string, examples: ["3 reference-data items are out of date"] }
        items:
          type: array
          items:
            type: object
            required: [id, title, level, message]
            properties:
              id: { type: string }
              title: { type: string }
              level: { type: string, enum: [ok, warn] }
              asOf: { type: [string, "null"], format: date }
              message: { type: string, description: Plain words. }
              fix: { type: string }
    ReadinessTransition:
      type: object
      required: [at, accountId, from, to, codes]
      properties:
        at: { type: string, format: date-time }
        accountId: { $ref: "#/components/schemas/AccountId" }
        from: { $ref: "#/components/schemas/ReadinessState" }
        to: { $ref: "#/components/schemas/ReadinessState" }
        codes: { type: array, items: { type: string } }
    AuditRecord:
      type: object
      required: [seq, at, type, actor, source, hash, prevHash]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        type: { type: string, examples: [order.placed, order.refused, key.created, kill_switch.engaged, account.connected] }
        actor:
          type: object
          properties:
            kind: { type: string }
            id: { type: string }
        source: { type: string }
        accountId: { type: [string, "null"] }
        requestId: { type: [string, "null"] }
        data: { type: object }
        prevHash: { type: string }
        hash: { type: string }

    ExposeListener:
      type: object
      required: [enabled, listen, hosts]
      properties:
        enabled: { type: boolean }
        listen: { type: string, description: Address and port the listener is bound to. }
        hosts: { type: array, items: { type: string }, description: The host names it answers to (besides 127.0.0.1). }
        urlPattern: { type: string, description: The public address pattern, shown when a host is set. }
        clientIpHeader: { type: [string, "null"], description: Alerts only. The header trusted for the caller's address behind a local tunnel. }
        senderAllowlist: { type: integer, description: Alerts only. How many sender addresses are allowed. }
        requestsPerMinute: { type: integer, description: Sheets only. The request cap per caller address. }

    NotifyChat:
      type: object
      required: [key, name, type, idHint, commands]
      properties:
        key: { type: string, description: "Short stable key of the chat (a hash of its id). Used instead of the id." }
        name: { type: string }
        type: { type: string, enum: [private, group, supergroup, channel, unknown] }
        idHint: { type: string, description: "Only the last four digits of the chat id." }
        commands: { type: boolean, description: "On the allow-list for the read-only commands. Off by default for groups." }
        state: { type: object, additionalProperties: true, description: "Present when Telegram refused this chat: kind and a plain message." }
    NotifyTarget:
      type: object
      required: [id, kind, label, bot, chats, createdAt, health]
      properties:
        id: { type: string, pattern: '^tg_[a-z2-7]{8}$' }
        kind: { type: string, enum: [telegram] }
        label: { type: string }
        bot: { type: object, required: [username, tokenHint], properties: { username: { type: string }, tokenHint: { type: string, description: "Four characters, never the token." } } }
        chats: { type: array, items: { $ref: "#/components/schemas/NotifyChat" } }
        createdAt: { type: string, format: date-time }
        replaced: { type: boolean, description: "Only on POST: the same bot was already set up and its token was replaced." }
        health:
          type: object
          required: [state, message]
          properties:
            state: { type: string, description: "unverified, ok, or the kind of the last failure (token_invalid, blocked, chat_not_found, rate_limited, network, ...)." }
            message: { type: string, description: A plain sentence for a person. }
            lastOkAt: { type: [string, "null"], format: date-time }
            lastError: { type: [object, "null"], additionalProperties: true }
    NotifyTargetCreate:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [telegram], default: telegram }
        token: { type: string, minLength: 10, maxLength: 120, writeOnly: true, description: "From BotFather. Accepted only from this computer." }
        label: { type: string, maxLength: 40 }
    NotifyTestRequest:
      type: object
      additionalProperties: false
      properties:
        chat: { type: string, pattern: '^[0-9a-f]{10}$', description: "A chat key; omit to test every chat of the target." }
    NotifyTestResult:
      type: object
      required: [ok, delivered, results]
      properties:
        ok: { type: boolean }
        delivered: { type: integer }
        message: { type: string, description: What went wrong, in plain words. }
        results:
          type: array
          items:
            type: object
            required: [chat, ok]
            properties:
              chat: { type: object, properties: { key: { type: string }, name: { type: string }, idHint: { type: string } } }
              ok: { type: boolean }
              error: { type: object, properties: { kind: { type: string }, message: { type: string }, retryAfterSeconds: { type: integer } } }
    NotifyFoundChat:
      type: object
      required: [ref, name, type, idHint, seenAt]
      properties:
        ref: { type: string, pattern: '^[0-9a-f]{10}$', description: Pass this to POST .../chats to confirm the chat. }
        name: { type: string }
        type: { type: string }
        idHint: { type: string }
        seenAt: { type: string, format: date-time }
    NotifyChatAdd:
      type: object
      additionalProperties: false
      properties:
        ref: { type: string, pattern: '^[0-9a-f]{10}$', description: "From find-chat. Send either ref or chatId." }
        chatId: { type: string, description: "A chat id typed by hand (accepted only from this computer)." }
        name: { type: string, maxLength: 60 }
        commands: { type: boolean, description: "Allow the read-only commands from this chat. Default: on for a private chat, off for a group." }
    NotifyChatPatch:
      type: object
      required: [commands]
      additionalProperties: false
      properties:
        commands: { type: boolean }
    NotifyEvents:
      type: object
      required: [events, quietHours, morning]
      properties:
        events:
          type: array
          items:
            type: object
            required: [key, label, enabled, default, critical]
            properties:
              key: { type: string, example: order.rejected }
              label: { type: string }
              help: { type: string }
              enabled: { type: boolean }
              default: { type: boolean }
              critical: { type: boolean, description: Sent even during quiet hours. }
        quietHours: { type: object, properties: { enabled: { type: boolean }, start: { type: string, example: "22:00" }, end: { type: string, example: "07:00" } } }
        morning:
          type: object
          properties:
            enabled: { type: boolean }
            at: { type: string, example: "08:45" }
            secondAt: { type: string, example: "09:10" }
            endOfDay: { type: object, properties: { enabled: { type: boolean }, at: { type: string, example: "15:45" } } }
    NotifyEventsUpdate:
      type: object
      additionalProperties: false
      properties:
        events: { type: object, additionalProperties: { type: boolean }, description: "Event key to on/off. Unknown keys are refused." }
        quietHours: { type: object, additionalProperties: false, properties: { enabled: { type: boolean }, start: { type: string }, end: { type: string } } }
        morning: { type: object, additionalProperties: false, properties: { enabled: { type: boolean }, at: { type: string }, secondAt: { type: string }, endOfDay: { type: object, additionalProperties: false, properties: { enabled: { type: boolean }, at: { type: string } } } } }
    NotifyStatus:
      type: object
      required: [enabled, targets, queue, counters]
      properties:
        enabled: { type: boolean }
        targets: { type: array, items: { type: object, additionalProperties: true, description: "id, label, bot, chats, state, message, lastOkAt, lastError, inbound." } }
        queue: { type: object, properties: { depth: { type: integer }, held: { type: integer }, dropped: { type: integer }, oldestAt: { type: [string, "null"] } } }
        lastDeliveryAt: { type: [string, "null"], format: date-time }
        counters: { type: object, properties: { delivered: { type: integer }, failed: { type: integer }, suppressed: { type: integer }, ignoredMessages: { type: integer, description: "Messages from chats that are not on the list. Counted, never answered." }, commands: { type: integer } } }
        quietHours: { type: object, additionalProperties: true }
        reminders: { type: object, additionalProperties: true }
    RecordingUniverse:
      type: object
      additionalProperties: false
      properties:
        expiries:
          description: A rule or a list of dates.
          oneOf:
            - { type: string, enum: [current-weekly, next-weekly, current-monthly, all-weekly] }
            - { type: array, items: { type: string, format: date } }
        strikes:
          description: Around the ATM (from the real-time price) or between two strikes.
          oneOf:
            - { type: object, additionalProperties: false, properties: { around: { type: string, enum: [atm] }, count: { type: integer, minimum: 0, maximum: 100 } } }
            - { type: object, additionalProperties: false, required: [from, to], properties: { from: { type: number }, to: { type: number } } }
        sides: { type: array, items: { type: string, enum: [CE, PE] } }
        includeUnderlying: { type: boolean }
        includeFuture: { type: boolean }
    RecordingSchedule:
      description: "market-hours (the exchange session of each trading day, from the market calendar) or chosen days and hours (IST; trading days only for NSE, BSE, NFO and BFO)."
      oneOf:
        - { type: string, enum: [market-hours] }
        - { type: object, additionalProperties: false, required: [start, end], properties: { days: { type: array, items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] } }, start: { type: string, example: "09:15" }, end: { type: string, example: "15:30" } } }
    RecordingCreate:
      type: object
      additionalProperties: false
      required: [kind, everySec]
      description: "Give exactly one of symbols, collection or underlying."
      properties:
        name: { type: string, maxLength: 60 }
        kind: { type: string, enum: [quotes, chain] }
        symbols: { type: array, items: { $ref: "#/components/schemas/Symbol" }, maxItems: 2000 }
        collection: { type: string, description: A collection from the library; resolved again every day. }
        underlying:
          description: An index or stock name, or a list of them.
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        expiry: { type: string, format: date, description: "With underlying: one expiry date (else the current weekly)." }
        strikes: { type: integer, minimum: 0, maximum: 100, description: "With underlying: strikes each side of the ATM (default 10)." }
        universe: { $ref: "#/components/schemas/RecordingUniverse" }
        everySec: { type: integer, minimum: 1, maximum: 86400, description: Seconds between samples. At least 15 for a chain. }
        sessionOnly: { type: boolean, default: true, description: Record only inside market hours (the market calendar). False records all day and rolls at IST midnight. }
        format: { type: string, enum: [csv, jsonl], default: csv }
        keepDays: { type: [integer, "null"], description: Keep this many days of files (today included); older day files are deleted. }
        maxDiskMb: { type: [integer, "null"], description: This recording's own disk limit. Writing stops before it is passed. }
        compress: { type: boolean, description: Gzip the files of finished days. }
        dataClass: { type: string, enum: [realtime], description: Only realtime is accepted; anything else is refused with the reason. }
    Recording:
      type: object
      required: [id, name, kind, status, statusText, dataClass, everySec, rows, bytes]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [quotes, chain] }
        status: { type: string, enum: [recording, waiting, paused, stopped, blocked], description: "waiting: outside the session, or no login yet. blocked: a disk limit was reached; nothing is written until there is room." }
        statusText: { type: string, description: The state in a plain sentence. }
        auto: { type: boolean, description: True when a rule runs it. }
        ruleId: { type: [string, "null"] }
        target: { type: object, additionalProperties: true }
        everySec: { type: integer }
        sessionOnly: { type: boolean }
        schedule:
          description: always, market-hours, or chosen days and hours.
          oneOf:
            - { type: string }
            - { type: object, additionalProperties: true }
        format: { type: string, enum: [csv, jsonl] }
        createdAt: { type: string }
        dataClass: { type: string, enum: [realtime] }
        delaySec: { type: integer }
        source: { type: string }
        symbols:
          type: object
          properties:
            count: { type: integer }
            sample: { type: array, items: { type: string } }
            resolvedAt: { type: [string, "null"] }
            rule: { type: [string, "null"], description: "How the symbols were chosen, for example NIFTY 2026-11-12 ATM 24000 +/- 10 strikes (spot 24012)." }
            via: { type: [string, "null"], enum: [given, library, bridge, null] }
            notes: { type: array, items: { type: string } }
            stale: { type: boolean }
            problem: { type: [string, "null"] }
            onLiveFeed: { type: integer }
            notOnLiveFeed: { type: integer }
        rows: { type: integer }
        bytes: { type: integer }
        today: { type: object, properties: { date: { type: [string, "null"] }, rows: { type: integer }, bytes: { type: integer }, gaps: { type: integer } } }
        lastWriteAt: { type: [string, "null"] }
        gaps:
          type: object
          properties:
            total: { type: integer }
            today: { type: integer }
            open: { type: [object, "null"], additionalProperties: true }
            recent: { type: array, items: { $ref: "#/components/schemas/RecordingGap" } }
        refused: { type: object, description: Answers that were not real-time and so were not written., properties: { total: { type: integer }, last: { type: [object, "null"], additionalProperties: true } } }
        apiCalls: { type: object, properties: { madeToday: { type: integer }, savedToday: { type: integer, description: Broker calls avoided because the live feed or the cache answered. } } }
        disk: { type: object, additionalProperties: true }
        keepDays: { type: [integer, "null"] }
        nextStartAt: { type: [string, "null"] }
        issue: { type: [object, "null"], additionalProperties: true }
        problem: { oneOf: [{ $ref: "#/components/schemas/FailureReason" }, { type: "null" }], description: "What is wrong right now (a full disk, no login, symbols that could not be chosen, a silent feed): the real text, its code and the fix. null when all is well." }
        filesUrl: { type: string }
        files: { type: object, description: "On GET /v1/recordings/{recordingId} only.", properties: { count: { type: integer }, firstDate: { type: [string, "null"] }, lastDate: { type: [string, "null"] } } }
    RecordingGap:
      type: object
      properties:
        id: { type: string }
        state: { type: string, enum: [open, closed] }
        from: { type: string }
        to: { type: [string, "null"] }
        reason: { type: string, enum: [login-missing, feed-down, feed-silent, budget, delayed-source, universe-unresolved, bridge-stopped, computer-asleep, disk-full, error] }
        detail: { type: [string, "null"] }
        seconds: { type: [integer, "null"] }
    RecordingFile:
      type: object
      required: [name, date, symbol, format, bytes, rows]
      properties:
        name: { type: string, description: "YYYY-MM-DD__EXCHANGE_SYMBOL.csv or .jsonl, with .gz after compression." }
        date: { type: string, format: date }
        symbol: { $ref: "#/components/schemas/Symbol" }
        format: { type: string, enum: [csv, jsonl] }
        compressed: { type: boolean }
        bytes: { type: integer }
        rows: { type: integer }
        url: { type: string }
    RecordingStatus:
      type: object
      required: [line, today, recordings, disk]
      properties:
        line: { type: string, example: "Recording today: 3 rules, 41 symbols, 18 MB, last write 09:31:02." }
        enabled: { type: boolean }
        auto: { $ref: "#/components/schemas/RecordingAuto" }
        today: { type: object, additionalProperties: true }
        recordings: { type: object, additionalProperties: true }
        disk: { type: object, additionalProperties: true }
        apiCalls: { type: object, properties: { made: { type: integer }, saved: { type: integer } } }
        budgetShare: { type: number, description: The share of an account's spare API budget recordings may use now (recorder.maxBudgetShare, or the value set at run time). }
        dataClass: { type: string, enum: [realtime] }
    RecordingSettings:
      type: object
      required: [maxBudgetShare, defaults, limits]
      properties:
        maxBudgetShare: { type: number, minimum: 0.05, maximum: 0.8, description: "The share of an account's spare API budget recordings may use now." }
        defaults: { type: object, properties: { maxBudgetShare: { type: number } } }
        limits:
          type: object
          properties: { minBudgetShare: { type: number, example: 0.05 }, maxBudgetShare: { type: number, example: 0.8 } }
        changed: { type: array, items: { type: string } }
    RecordingSettingsUpdate:
      type: object
      additionalProperties: false
      required: [maxBudgetShare]
      properties:
        maxBudgetShare: { type: number, minimum: 0.05, maximum: 0.8 }
    RecordingAuto:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        setBy: { type: string, enum: [user, config] }
        rules: { type: integer }
        activeRules: { type: integer }
    RecordingAutoUpdate:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    RecordingRuleCreate:
      type: object
      additionalProperties: false
      required: [name, kind, everySec]
      description: "Give exactly one of symbols, collection or underlying (with universe)."
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,40}$' }
        name: { type: string, maxLength: 60 }
        enabled: { type: boolean, default: true }
        kind: { type: string, enum: [quotes, chain] }
        symbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        collection: { type: string }
        underlying:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        universe: { $ref: "#/components/schemas/RecordingUniverse" }
        everySec: { type: integer, minimum: 1 }
        schedule: { $ref: "#/components/schemas/RecordingSchedule" }
        keepDays: { type: [integer, "null"] }
        maxDiskMb: { type: [integer, "null"] }
        compress: { type: boolean }
        format: { type: string, enum: [csv, jsonl], default: csv }
    RecordingRulePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        enabled: { type: boolean }
        kind: { type: string, enum: [quotes, chain] }
        symbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        collection: { type: string }
        underlying:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        universe: { $ref: "#/components/schemas/RecordingUniverse" }
        everySec: { type: integer, minimum: 1 }
        schedule: { $ref: "#/components/schemas/RecordingSchedule" }
        keepDays: { type: [integer, "null"] }
        maxDiskMb: { type: [integer, "null"] }
        compress: { type: boolean }
        format: { type: string, enum: [csv, jsonl] }
    RecordingRule:
      type: object
      description: "A rule as stored: everything RecordingRuleCreate takes, plus what the Bridge adds. (Written out in full, not as allOf over the create schema, because that one refuses unknown fields.)"
      required: [id, name, kind, everySec]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 60 }
        enabled: { type: boolean, default: true }
        kind: { type: string, enum: [quotes, chain] }
        symbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        collection: { type: string }
        underlying:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        universe: { $ref: "#/components/schemas/RecordingUniverse" }
        everySec: { type: integer, minimum: 1 }
        schedule: { $ref: "#/components/schemas/RecordingSchedule" }
        keepDays: { type: [integer, "null"] }
        maxDiskMb: { type: [integer, "null"] }
        compress: { type: boolean }
        format: { type: string, enum: [csv, jsonl], default: csv }
        source: { type: string, enum: [user, config] }
        preset: { type: string }
        recordingId: { type: [string, "null"], description: The recording that carries this rule's files. }
        state: { type: string, enum: [recording, waiting, paused, stopped, blocked, "off"] }
        statusText: { type: string }
        blockedBy: { type: [string, "null"] }
        createdAt: { type: [string, "null"] }
        updatedAt: { type: [string, "null"] }
    RecordingPreset:
      type: object
      properties:
        id: { type: string, enum: [index-option-chains, my-watchlist] }
        title: { type: string }
        about: { type: string }
        needs: { type: string }
        rule: { $ref: "#/components/schemas/RecordingRuleCreate" }
    RecordingPresetApply:
      type: object
      additionalProperties: false
      properties:
        collection: { type: string, description: "my-watchlist only: the collection to record (default watchlist)." }
    RecordingPresetResult:
      type: object
      properties:
        preset: { type: string }
        created: { type: boolean }
        rule: { $ref: "#/components/schemas/RecordingRule" }
        auto: { $ref: "#/components/schemas/RecordingAuto" }
    Hook:
      type: object
      required: [id, source, label, account, mode, createdAt]
      properties:
        id: { type: string }
        source: { type: string, enum: [generic, chartink, gocharting, tradingview] }
        label: { type: string }
        account: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live] }
        requireConfirmation: { type: boolean }
        allowedSymbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        maxLotsPerSignal: { type: integer }
        side: { type: [string, "null"], enum: [BUY, SELL, null] }
        product: { type: [string, "null"], enum: [CNC, INTRADAY, MARGIN, null] }
        orderType: { type: string, enum: [LIMIT, MARKET] }
        allowSourceIps: { type: array, items: { type: string } }
        sourceIpPreset: { type: [string, "null"], enum: [tradingview, null], description: "Also accept alerts only from this published address list (see /v1/hooks/presets)." }
        maxAgeSec: { type: [integer, "null"], description: "An alert whose own time is older than this many seconds is refused as stale. TradingView hooks default to 120; null means no age check." }
        hasPassphrase: { type: boolean, description: "True for tradingview hooks: alerts must carry the passphrase shown when the hook was created." }
        acknowledgeUnsignedLive: { type: boolean, description: "A live hook on an unsigned source was acknowledged as such when it was made." }
        createdByKeyId: { type: [string, "null"], description: "The key that made the hook." }
        templates: { type: array, items: { $ref: "#/components/schemas/HookTemplate" }, description: "Alert messages to paste into the sender." }
        createdAt: { type: string, format: date-time }
        lastSignalAt: { type: [string, "null"], format: date-time }
        readiness:
          description: "Live hooks: the readiness state of the hook's account (orders are refused with CANNOT_TRADE while it is cannot_trade). null for paper hooks."
          oneOf:
            - { $ref: "#/components/schemas/ReadinessState" }
            - { type: "null" }
    HookCreate:
      type: object
      required: [source, label, account]
      additionalProperties: false
      properties:
        source: { type: string, enum: [generic, chartink, gocharting, tradingview] }
        label: { type: string, minLength: 1, maxLength: 60 }
        account: { $ref: "#/components/schemas/AccountId" }
        mode: { type: string, enum: [paper, live], default: paper }
        requireConfirmation: { type: boolean, default: false }
        allowedSymbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        maxLotsPerSignal: { type: integer, minimum: 1, default: 1 }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN] }
        orderType: { type: string, enum: [LIMIT, MARKET], default: LIMIT }
        side: { type: string, enum: [BUY, SELL], description: "Fix the side for every signal (needed for ChartInk, whose alerts carry no side)." }
        allowSourceIps: { type: array, items: { type: string }, description: "Optional allowlist of sender IP addresses or IPv4 CIDR blocks." }
        acknowledgeUnsignedLive: { type: boolean, default: false, description: "Live mode on an unsigned source (chartink, gocharting, tradingview) needs allowSourceIps, sourceIpPreset, requireConfirmation or this acknowledgement." }
        maxAgeSec: { type: [integer, "null"], minimum: 5, maximum: 3600, description: "Refuse alerts older than this many seconds (from the alert's `time`). Default 120 for tradingview; a live tradingview hook must have one." }
        sourceIpPreset: { type: [string, "null"], enum: [tradingview, null], description: "Accept alerts only from TradingView's published sender addresses (the editable list in /v1/hooks/presets), in addition to allowSourceIps. Behind a tunnel this needs hooks.clientIpHeader." }

    HookTemplate:
      type: object
      required: [name, contentType, message, notes]
      properties:
        name: { type: string }
        contentType: { type: string, enum: [application/json, text/plain] }
        message: { type: string, description: "Paste this into the alert's Message box." }
        notes: { type: array, items: { type: string } }

    HookIpPreset:
      type: object
      required: [name, ips, verifiedAt, source, edited]
      properties:
        name: { type: string, enum: [tradingview] }
        ips: { type: array, items: { type: string } }
        verifiedAt: { type: [string, "null"], description: "The date the list was last checked against its source." }
        source: { type: [string, "null"], description: "The sender's own page that publishes the list." }
        edited: { type: boolean, description: "True when the config file (hooks.presets) overrides the built-in list." }

    HookPresets:
      type: object
      required: [ipPresets, clientIpHeader, publicIngress]
      properties:
        ipPresets: { type: array, items: { $ref: "#/components/schemas/HookIpPreset" } }
        clientIpHeader: { type: [string, "null"], enum: [cf-connecting-ip, x-forwarded-for, x-real-ip, null], description: "hooks.clientIpHeader: trusted for the real client address only when the connection comes from this computer (a local tunnel)." }
        publicIngress:
          type: object
          properties:
            enabled: { type: boolean }
            port: { type: [integer, "null"] }
            allowedHosts: { type: array, items: { type: string } }
            urls: { type: array, items: { type: string }, description: "https://<host> for each allowed host, to put in front of the hook path." }
        tradingview:
          type: object
          properties:
            defaultMaxAgeSec: { type: integer }
            sourceIpPreset: { type: string }
        limits:
          type: object
          properties:
            maxSignalsPerMinute: { type: integer }
            rateWaitSec: { type: integer, description: "How long an alert over the per-minute limit is held before it is refused; 0 = refuse at once." }
            bodyLimitBytes: { type: integer }
            queueSize: { type: integer }
            burstWaitSec: { type: integer }

    HookSignalOutcome:
      type: string
      enum: [queued, processing, placed, awaiting_confirmation, duplicate, stale, rejected, refused, failed, outcome_unknown, dropped]
      description: |
        queued/processing: received, not finished. placed: an order was placed (paper or live). awaiting_confirmation: a
        person must confirm it in the Bridge. duplicate: seen before, not placed twice. stale: older than maxAgeSec.
        rejected: the hook's rules, the safety checks or the broker said no (see reason). refused: the alert could not be
        read, its time is ahead of this computer's clock, or it is against the hook's rules (a 400; see `cause`). failed / outcome_unknown / dropped: see reason.

    HookSignal:
      type: object
      required: [index, outcome, receivedAt, summary]
      properties:
        signalId: { type: [string, "null"], description: "null for an alert refused at the door." }
        index: { type: integer, description: "Position of the order within the alert." }
        receivedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        outcome: { $ref: "#/components/schemas/HookSignalOutcome" }
        code: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        summary: { type: string, description: "One plain sentence for people." }
        symbol: { type: [string, "null"] }
        side: { type: [string, "null"] }
        id: { type: [string, "null"], description: "The alert's own id." }
        time: { type: [string, "null"], description: "The alert's own time." }
        mode: { type: [string, "null"] }
        lots: { type: [number, "null"], description: "Lots the alert asked for, when it said so." }
        quantity: { type: [number, "null"], description: "Quantity the alert asked for, when it said so." }
        price: { type: [number, "null"], description: "Price the alert carried, when it had one." }
        cause: { type: string, enum: [future, policy], description: "Only on a refused alert: `future` = its time is ahead of this computer's clock, `policy` = against the hook's rules (mode or account). Absent = it could not be read." }
        orderId: { type: [string, "null"] }
        ticketId: { type: [string, "null"] }
        test: { type: boolean }

    HookSignals:
      type: object
      required: [hookId, counts, signals]
      properties:
        hookId: { type: string }
        label: { type: string }
        source: { type: string }
        mode: { type: string, enum: [paper, live] }
        lastSignalAt: { type: [string, "null"], format: date-time }
        serverTime: { type: string, format: date-time }
        countsSince: { type: string, format: date-time, description: "Counts start at this time (when the Bridge started or the hook was first used since)." }
        lastAuthFailureAt: { type: [string, "null"], format: date-time }
        counts:
          type: object
          additionalProperties: { type: integer }
          description: "received, accepted, duplicate, stale, badRequest, authFailed, addressRefused, rateLimited, queueFull, keyRevoked, placed, awaitingConfirmation, rejected, failed, outcomeUnknown, dropped (only those that happened)."
        queue:
          type: object
          properties:
            queued: { type: integer }
            waitingForSlot: { type: integer }
            active: { type: integer }
            capacity: { type: integer }
        signals: { type: array, items: { $ref: "#/components/schemas/HookSignal" } }

    HookTestResult:
      type: object
      required: [test, mode, accepted, outcome, summary]
      properties:
        test: { type: boolean, enum: [true] }
        mode: { type: string, enum: [paper] }
        hookId: { type: string }
        signalId: { type: [string, "null"] }
        accepted: { type: boolean, description: "False when the alert was refused before it was queued (unreadable or stale)." }
        outcome: { $ref: "#/components/schemas/HookSignalOutcome" }
        code: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        orderId: { type: [string, "null"] }
        summary: { type: string }
        message: { description: "The alert that was run (never with a passphrase).", oneOf: [{ type: string }, { type: object }] }
        note: { type: string }

    TradingViewAlert:
      type: object
      description: |
        The alert message of a `tradingview` hook, as JSON (or the same fields as `key=value` words in a one-line text alert:
        `BUY NSE:RELIANCE 1 @ 1402.5 MIS mode=paper id=a1 time=2026-11-09T09:56:00Z passphrase=...`). TradingView placeholders
        such as {{exchange}}:{{ticker}}, {{close}}, {{timenow}} and {{strategy.order.action}} are filled in by TradingView before it
        sends the message. Any other field refuses the alert.
      required: [symbol, passphrase]
      additionalProperties: false
      properties:
        symbol: { type: string, description: "Chart ticker with its exchange: NSE:RELIANCE, NSE:M_M, NSE:NIFTY1! (also a canonical contract such as NFO:NIFTY-2026-10-27-FUT). A bare ticker with no exchange is refused." }
        side: { type: string, enum: [buy, sell, BUY, SELL], description: "Needed unless the hook fixes the side. TradingView's {{strategy.order.action}} gives buy or sell." }
        quantity: { type: integer, description: "Shares or units. Not together with lots." }
        lots: { type: integer, description: "Lots (1 lot = 1 share for cash). For futures and options send {{strategy.order.contracts}} as lots." }
        orderType: { type: string, enum: [limit, market, LIMIT, MARKET], description: "Must match the hook's order type." }
        price: { type: number, description: "Needed on a LIMIT hook." }
        product: { type: string, enum: [CNC, INTRADAY, MARGIN, MIS, NRML, DELIVERY, CARRYFORWARD], description: "MIS = INTRADAY, NRML = MARGIN. Must match the hook's product when the hook fixes one." }
        account: { type: string, description: "Optional; must be the hook's own account." }
        mode: { type: string, enum: [paper, live], default: paper, description: "Must equal the hook's mode. An alert without it means paper, so a live hook refuses it." }
        marketPosition: { type: string, enum: [long, flat, short], description: "Strategy alerts: {{strategy.market_position}}. Recorded; the order is the buy or sell TradingView sent." }
        positionSize: { type: number, minimum: 0, description: "Strategy alerts: {{strategy.market_position_size}} (never negative)." }
        time: { type: string, description: "{{timenow}}, like 2026-11-09T09:56:00Z. Needed on a live hook. Together with id, symbol and side it identifies the alert." }
        id: { type: string, maxLength: 128, description: "Your alert's name or {{strategy.order.id}}; with time it identifies the alert." }
        passphrase: { type: string, description: "The passphrase shown once when the hook was created." }
