  /xl/quotes:
    get:
      tags: [Spreadsheets]
      operationId: xlQuotes
      summary: Prices for a whole sheet as one table (one request, one row per symbol)
      description: "`symbols` is a comma-separated list (at most `integrations.xl.maxSymbols`, default 100); one row per symbol in the order asked, duplicates included. A symbol that cannot be priced gets blank values and a text in `error`; it never fails the table. Every row carries `as_of` (IST), `age_s`, `class`, `source` and `stale`; in demo mode also `demo` = DEMO. Prices never come from a backup data source (`?backup=true` is refused)."
      x-module: integrations
      x-scope: read
      security:
        - bearerAuth: []
        - apiKeyQuery: []
      parameters:
        - { name: symbols, in: query, description: "Comma-separated Bridge symbols, for example NSE:RELIANCE,NSE:NIFTY. `symbol` is accepted too and may repeat. Give `symbols` or `collection`.", schema: { type: string } }
        - { name: collection, in: query, description: "A collection name from `GET /v1/collections` instead of `symbols`. An option universe is worked out at the time of the request from a live price; a price that is not live is refused. The collection must resolve to at most `integrations.xl.maxSymbols` symbols. Response headers `X-Collection-Resolved-At`, `X-Collection-Atm-Source`, `X-Collection-Rule` and (when there are any) `X-Collection-Warnings` say when and how.", schema: { type: string, maxLength: 64 } }
        - { name: fields, in: query, description: "Value columns in the order wanted (default ltp,chg,pct,volume). Freshness columns are always added.", schema: { type: string, example: "ltp,chg,pct,volume,as_of,class" } }
        - { $ref: "#/components/parameters/XlFormat" }
        - { $ref: "#/components/parameters/XlCache" }
        - { $ref: "#/components/parameters/XlErrors" }
      responses:
        "200":
          description: One row per requested symbol. Columns - symbol, then the requested fields (ltp open high low close chg pct volume oi bid ask), then as_of age_s class source stale, then error (and demo in demo mode).
          headers:
            Cache-Control: { description: "`no-store`, or `private, max-age=N` with `?cache=1`.", schema: { type: string } }
            ETag: { description: "Only with `?cache=1`.", schema: { type: string } }
          content:
            text/csv:
              schema: { type: string }
            text/tab-separated-values:
              schema: { type: string }
            application/json:
              schema: { type: array, items: { type: object } }
        "304": { description: "Only with `?cache=1` and a matching `If-None-Match`." }
        "4XX":
          description: A one-row table (`status,code,message,retry_after_s`) in the format asked for, with the real status, `Retry-After` and `X-Error-Code`.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { type: array, items: { type: object } }

  /xl/instrument:
    get:
