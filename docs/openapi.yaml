                  data: { type: object, properties: { exchange: { type: string }, unit: { type: string }, note: { type: string }, days: { type: array, items: { $ref: "#/components/schemas/ParticipantDay" } } } }
                  meta: { $ref: "#/components/schemas/Meta" }
