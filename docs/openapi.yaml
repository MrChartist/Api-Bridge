  /v1/analytics/alert-rules:
    get:
      tags: [Analytics]
      operationId: listAnalyticsAlertRules
      summary: Alias of /v1/alerts/market: saved alert rules over analytics metrics
      description: The caller's rules with their last check, last fire and armed state. Admin and local callers see every rule.
      x-stream: S24
      x-scope: read
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Analytics]
      operationId: createAnalyticsAlertRule
      summary: Alias of /v1/alerts/market: save an alert rule
      description: |
        Metrics: `pcr_oi`, `max_pain_distance` (percent of spot), `atm_iv`, `basis_pct` take `op` above/below and `value`;
        `gex_regime` fires when the net gamma regime changes (optionally only `to` one regime); `spot_cross` fires when spot
        crosses `value` (`op` above/below/either). Every metric except `spot_cross` needs `expiry`. A rule fires once per
        crossing and re-arms when the condition clears; with `everyMinutes` it is checked by itself. Delivery goes through
        the notify targets (event `scan.alert`).
        `unusual_count` counts unusual contracts with score at or above `minScore` (default 50), `op` above/below and `value`;
        `tide_sentiment` fires when option-flow sentiment changes (optionally only `to` bullish/bearish/neutral);
        `iv_rank` is the ATM IV rank 0-100 over stored IV history (no data until 20 days are stored), `op` above/below;
        `fii_net_streak` is the signed run of same-sign FII net days (+3 buying, -3 selling), `op` above/below;
        `volume_spike` is latest daily volume over the previous 20-day average (futures when `expiry` is given, else spot).
        `expiry` is required for every metric except `spot_cross`, `fii_net_streak` and `volume_spike`.
      x-stream: S24
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, underlying, metric]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                underlying: { type: string, maxLength: 30, example: NIFTY }
                expiry: { type: string, format: date }
                metric: { type: string, enum: [pcr_oi, max_pain_distance, gex_regime, atm_iv, basis_pct, spot_cross, unusual_count, tide_sentiment, iv_rank, fii_net_streak, volume_spike, strike_oi_change, strike_iv, atm_iv_change], description: "strike_oi_change (OI change % of the previous close) and strike_iv need strike and right; atm_iv_change is ATM IV in points against the day's first check." }
                strike: { type: number, description: "strike_oi_change and strike_iv only." }
                right: { type: string, enum: [CE, PE], description: "strike_oi_change and strike_iv only." }
                op: { type: string, enum: [above, below, either] }
                value: { type: number }
                to: { type: string, enum: [positive, negative, neutral, bullish, bearish], description: "gex_regime (positive/negative/neutral) or tide_sentiment (bullish/bearish/neutral) only" }
                minScore: { type: number, minimum: 0, maximum: 100, description: unusual_count only }
                everyMinutes: { type: integer, minimum: 1, maximum: 1440 }
                marketHoursOnly: { type: boolean, default: true }
                enabled: { type: boolean, default: true }
      responses:
        "201": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/alert-rules/{ruleId}:
    delete:
      tags: [Analytics]
      operationId: deleteAnalyticsAlertRule
      summary: Alias of /v1/alerts/market/{ruleId}: delete an alert rule
      x-stream: S24
      x-scope: read
      parameters:
        - { name: ruleId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/alert-rules/{ruleId}/check:
    post:
      tags: [Analytics]
      operationId: checkAnalyticsAlertRule
      summary: Alias of /v1/alerts/market/{ruleId}/check: evaluate an alert rule now
      description: Reads the metric and applies the edge trigger. With `dryRun=true` the rule's state is left alone and nothing is sent.
      x-stream: S24
      x-scope: read
      parameters:
        - { name: ruleId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - { name: dryRun, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/lot-split:
    post:
      tags: [Analytics]
      operationId: postAnalyticsLotSplit
      summary: Plan freeze-quantity slices (plan only)
      description: >-
        Splits a total quantity into child-order slices that are lot multiples and at most the exchange freeze quantity
        (built-in table; unverified snapshot, flagged in `warnings`). Optionally returns an iceberg schedule (slice size and
        delay). PLAN ONLY: nothing is placed. Send each child through `POST /v1/orders`, which keeps every safety gate.
        For contracts without a built-in freeze quantity (stock derivatives) `freezeQty` is required; where the table has
        one, the lower of the two is used.
      x-stream: S15
      x-scope: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [symbol, quantity, lotSize]
              properties:
                symbol: { type: string, description: Canonical Bridge symbol, example: "NFO:NIFTY-2026-11-24-FUT" }
                quantity: { type: integer, minimum: 1, maximum: 100000000, description: Total units; must be a multiple of lotSize. A plan needing more than 500 child orders is refused. }
                lotSize: { type: integer, minimum: 1, maximum: 100000 }
                freezeQty: { type: integer, minimum: 1, maximum: 100000000, description: Units. Required when the table has no entry; otherwise it can only lower the limit. }
                iceberg:
                  type: object
                  additionalProperties: false
                  properties:
                    sliceLots: { type: integer, minimum: 1, maximum: 100000, description: Lots per slice (never above the freeze limit). }
                    delayMs: { type: integer, minimum: 0, maximum: 3600000, default: 500 }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/position-greeks:
    get:
      tags: [Analytics]
      operationId: getAnalyticsPositionGreeks
      summary: Greeks and delta-adjusted exposure of open option positions
      description: >-
        Reads the account's open positions, fetches each option leg's Greeks from the chain (Black-Scholes from the leg's
        LTP when the chain has none) and returns per-position and net delta, gamma, theta, vega, delta-adjusted exposure
        and a per-underlying rollup. Non-option positions are listed under `skipped`; legs whose chain could not be read
        have `greeksAvailable: false` and the failure is in `errors`. `meta.freshness` is the chain's.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: account, in: query, required: true, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [paper, live] } }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/unusual:
    get:
      tags: [Analytics]
      operationId: analyticsUnusual
      summary: Unusual options activity scanner
      description: >-
        Scans the option chains of up to 10 underlyings for unusual activity. Per contract it returns volume/OI,
        traded premium in INR (volume x ltp x lot size), OTM distance, IV versus ATM IV, OI change, a bid/ask
        aggressor proxy (not trade-tape data) and a transparent 0-100 score whose formula is returned under
        data.method. Flags are VOLUME_SPIKE, BIG_PREMIUM, OTM_LOTTERY, IV_ANOMALY and OI_BUILDUP. Per-underlying
        failures are reported in errors instead of failing the request.
      x-stream: S15
      x-scope: read
      parameters:
        - name: underlyings
          in: query
          required: true
          description: Comma-separated underlyings, 1 to 10, for example NIFTY,BANKNIFTY.
          schema: { type: string }
        - name: expiry
          in: query
          description: Expiry as YYYY-MM-DD. Defaults to each underlying's nearest upcoming expiry.
          schema: { type: string, format: date }
        - name: minPremium
          in: query
          description: Minimum traded premium in INR.
          schema: { type: number, minimum: 0, default: 0 }
        - name: minVolOi
          in: query
          description: Minimum volume/OI ratio.
          schema: { type: number, minimum: 0, default: 0 }
        - name: side
          in: query
          schema: { type: string, enum: [call, put, both], default: both }
        - name: sort
          in: query
          schema: { type: string, enum: [score, premium, volOi], default: score }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          $ref: "#/components/responses/AnalyticsResult"
        default:
          $ref: "#/components/responses/Problem"

  /v1/analytics/tide:
    get:
      tags: [Analytics]
      operationId: getAnalyticsTide
      summary: Market Tide, net call versus put premium flow through the session
      description: Estimates premium traded per interval from consecutive chain snapshots (volume change x mid price x lot size), split into calls and puts and into buy and sell aggressive using where ltp sits inside the bid-ask spread (a proxy, not trade direction). Snapshots are taken when this route is called, so the series only has points from when it was polled. The session resets on a new IST trading day.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, description: Defaults to the nearest upcoming expiry. Changing it restarts the tracked session., schema: { type: string, format: date } }
        - { name: windowMin, in: query, description: Only return series points from the last N minutes, and a window total., schema: { type: integer, minimum: 1, maximum: 1440 } }
        - { name: strikes, in: query, description: Strikes on each side of ATM., schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: top, in: query, description: Number of top strikes by flow., schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/analytics/exposure:
    get:
      tags: [Analytics]
      operationId: getAnalyticsExposure
      summary: Delta, gamma, vanna and charm exposure by strike with walls and the zero-gamma level
      description: Dealers are assumed long calls and short puts. Delta INR per point, gamma INR per 1% move, vanna INR per point per vol point, charm INR per point per day. Legs without usable IV or gamma are counted in skippedLegs.
      x-stream: S15
      x-scope: read
      parameters:
        - { name: underlying, in: query, required: true, schema: { type: string, maxLength: 30 } }
        - { name: expiry, in: query, required: true, schema: { type: string, format: date } }
        - { name: strikes, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - $ref: "#/components/parameters/Backup"
        - $ref: "#/components/parameters/AccountQueryOptional"
        - $ref: "#/components/parameters/MaxAge"
      responses:
        "200": { $ref: "#/components/responses/AnalyticsResult" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

