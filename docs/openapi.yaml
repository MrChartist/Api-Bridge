        accounts gets partial: true. A per-account failure appears in accounts[].error and never fails the response.
        format=csv returns one row per leg.
      parameters:
        - { name: view, in: query, required: false, schema: { type: string, enum: [holders, family], default: holders } }
        - { name: underlying, in: query, required: false, schema: { type: string, examples: [NIFTY] } }
        - { name: account, in: query, required: false, schema: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/AccountId" } }, style: form, explode: true }
        - { name: mode, in: query, required: false, schema: { type: string, enum: [live, paper, all], default: all } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Book" }
                  meta: { $ref: "#/components/schemas/Meta" }
            text/csv:
              schema: { type: string, description: "holder, relationship, inFamily, account, underlying, symbol, qty, avg, mark, markSource, pnl, iv, delta, gamma, theta, vega" }
        "4XX": { $ref: "#/components/responses/Problem" }
