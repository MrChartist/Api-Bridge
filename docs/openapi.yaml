          in: path
          required: true
          schema: { type: string, pattern: "^dl_[0-9a-f]{12}$" }
      responses:
        "200":
          description: The job, now paused.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DownloadJob" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/downloads/{downloadId}/resume:
    post:
      tags: [Data downloads]
      operationId: resumeDownload
      summary: Resume a paused job, or retry the failed items of a failed job
      x-module: downloads
      x-scope: read
      parameters:
        - name: downloadId
          in: path
          required: true
          schema: { type: string, pattern: "^dl_[0-9a-f]{12}$" }
      responses:
        "200":
          description: The job, queued again.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DownloadJob" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

