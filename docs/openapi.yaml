  /v1/events/stream:
    get:
      tags: [Events]
      operationId: openEventStream
      summary: Server-Sent Events stream of Bridge events, with replay from a cursor
      description: |
        `GET /v1/events/stream?token=<stream token>&topics=order.*,download.*&since=<cursor>`. Credentials as for the price
        stream: a single-use token from `POST /v1/stream/token`, or an `Authorization` / `X-API-Key` header from scripts.
        The first event is `ready` (`cursor`, `oldest`, `replayed`, `gap`). Each later event has `id` = its cursor, `event` =
        its topic and `data` = the envelope `{ id, topic, time, apiVersion, data }`. After a drop, EventSource sends
        `Last-Event-ID` by itself and the stream replays what was missed. A read key never receives admin-only topics, and a
        key limited to some accounts only receives events about those accounts. Events are read-only notifications.
        Full message formats: docs/asyncapi.yaml.
      x-module: events
      security: []
      parameters:
        - name: token
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/EventTopics"
        - $ref: "#/components/parameters/EventSince"
        - $ref: "#/components/parameters/EventAccounts"
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }

  /v1/events/ws:
    get:
      tags: [Events]
      operationId: openEventSocket
      summary: WebSocket stream of Bridge events (upgrade), same events and cursor as the SSE stream
      description: |
        `ws://127.0.0.1:4300/v1/events/ws?token=<stream token>&topics=order.*&since=<cursor>`. Server frames:
        `ready`, `event` (the envelope plus `type: "event"`), `go_away`, `pong`, `error`. The only message a client may send
