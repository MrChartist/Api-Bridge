      operationId: engageKillSwitch
      summary: Stop all orders now (any key may do this)
      x-stream: S9
      x-scope: read
      description: >-
        Any key may stop trading; an empty body works (reason "manual"). cancelOpenOrders needs a live key (or admin
        from this computer) and cancels only orders the Bridge placed on the caller's accounts; includeExternal (admin
        from this computer) also cancels orders placed outside the Bridge. Without the needed scope the switch is still
